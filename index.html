html {
  overflow-x: hidden;
  overflow-y: hidden;
  width: 100%;
  height: 100%;
  position: fixed;
  -webkit-overflow-scrolling: touch;
}

body {
  overflow-x: hidden;
  overflow-y: hidden;
  width: 100%;
  height: 100%;
  position: fixed;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
  background: #f8fafc;
  /* タッチ操作の制御 */
  touch-action: pan-y pinch-zoom;
  -webkit-user-select: none;
  user-select: none;
}

/* メインコンテナ */
#app {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* 横スクロールを絶対に防ぐ */
  overflow-x: hidden;
  touch-action: manipulation;
}

/* CSS変数 */
:root {
  --bar: 56px;
  --barW: 60px;
  --hit: 44px;
}

/* トップバー */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--bar);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: saturate(180%) blur(8px);
  box-shadow: 0 8px 24px rgba(0,0,0,.08);
  z-index: 9999;
  width: 100%;
  max-width: 100%;
  overflow: hidden;
}

/* タブコンテナ */
.tabs {
  display: flex;
  gap: 6px;
  flex: 1;
  min-width: 0;
  /* 横スクロール防止 */
  overflow-x: hidden;
  overflow-y: hidden;
  /* フレックスアイテムの収縮を許可 */
  flex-shrink: 1;
}

/* 各タブ */
.tab {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: #fff;
  font-size: 14px;
  color: #111;
  cursor: pointer;
  user-select: none;
  /* タブの幅制約 */
  flex: 0 1 auto;
  min-width: 0;
  max-width: 150px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tab.active {
  border-color: #2563eb;
  color: #2563eb;
}

.tab.add {
  background: #f8fafc;
  border: 1px dashed #cbd5e1;
  flex: 0 0 auto;
  min-width: 44px;
}

.tab .label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tab .close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 10px;
  font-size: 12px;
  background: #f3f4f6;
  color: #374151;
  flex: 0 0 auto;
}

.tab .close:hover {
  background: #e5e7eb;
}

/* コンテンツエリア */
.content {
  position: fixed;
  top: var(--bar);
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  overflow: hidden;
}

/* iframe（地図など） */
.view {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
  overflow: hidden;
}

/* サイドバー配置の場合 */
#app.pos-left .topbar,
#app.pos-right .topbar {
  flex-direction: column;
  width: var(--barW);
  height: 100%;
  top: 0;
  bottom: 0;
}

#app.pos-left .topbar {
  left: 0;
  right: auto;
}

#app.pos-right .topbar {
  left: auto;
  right: 0;
}

#app.pos-left .content {
  left: var(--barW);
  right: 0;
}

#app.pos-right .content {
  left: 0;
  right: var(--barW);
}

/* 全要素に対する横スクロール防止 */
* {
  max-width: 100%;
}

/* スクロール可能な要素への対策 */
.scrollable {
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  max-width: 100%;
}

/* パネル要素がある場合の対策 */
.panel {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  box-sizing: border-box;
  padding: 16px;
  background: rgba(255,255,255,0.95);
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  touch-action: manipulation;
}

/* パネル内の要素 */
.panel * {
  max-width: 100%;
  box-sizing: border-box;
}

/* フォーム要素の幅制御 */
input, textarea, select, button {
  max-width: 100%;
  box-sizing: border-box;
}

/* 横幅がはみ出しやすい要素への対策 */
img, video, iframe, embed, object {
  max-width: 100%;
  height: auto;
}

/* テーブル要素への対策 */
table {
  table-layout: fixed;
  width: 100%;
  max-width: 100%;
}

/* 長い単語の折り返し */
p, div, span, a, li, td, th {
  word-wrap: break-word;
  overflow-wrap: break-word;
  hyphens: auto;
}

/* デバッグ用：はみ出し要素の可視化（開発時のみ使用） */

  </div>

  <script>
    // 横スクロール防止のJavaScript対策
    (function() {
      'use strict';
      
      // 1. ドキュメント全体のタッチムーブ制御
      let startX = 0;
      let startY = 0;
      
      document.addEventListener('touchstart', function(e) {
        startX = e.touches[0].pageX;
        startY = e.touches[0].pageY;
      }, { passive: true });
      
      document.addEventListener('touchmove', function(e) {
        if (!e.touches || !e.touches[0]) return;
        
        const deltaX = Math.abs(e.touches[0].pageX - startX);
        const deltaY = Math.abs(e.touches[0].pageY - startY);
        
        // 横方向の移動が大きい場合は防ぐ
        if (deltaX > deltaY) {
          e.preventDefault();
        }
      }, { passive: false });
      
      // 2. window リサイズ時の調整
      function adjustViewport() {
        const viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) {
          viewport.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no';
        }
        
        // body幅の強制リセット
        document.body.style.width = '100%';
        document.body.style.maxWidth = '100%';
        document.documentElement.style.width = '100%';
        document.documentElement.style.maxWidth = '100%';
      }
      
      // 初期化時と画面回転時に実行
      adjustViewport();
      window.addEventListener('orientationchange', adjustViewport);
      window.addEventListener('resize', adjustViewport);
      
      // 3. スクロール位置の強制リセット
      function resetScroll() {
        window.scrollTo(0, 0);
        document.body.scrollLeft = 0;
        document.documentElement.scrollLeft = 0;
      }
      
      // 定期的にスクロール位置をチェック
      setInterval(resetScroll, 500);
      
      // 4. オーバーフロー要素の検出と修正（開発用）
      function detectOverflow() {
        const all = document.querySelectorAll('*');
        const windowWidth = window.innerWidth;
        
        all.forEach(el => {
          const rect = el.getBoundingClientRect();
          if (rect.right > windowWidth || rect.width > windowWidth) {
            console.warn('Overflow detected:', el, {
              right: rect.right,
              width: rect.width,
              windowWidth: windowWidth
            });
            // 自動修正
            el.style.maxWidth = '100%';
            el.style.width = 'auto';
            el.style.boxSizing = 'border-box';
          }
        });
      }
      
      // ページロード完了後にチェック
      if (document.readyState === 'complete') {
        detectOverflow();
      } else {
        window.addEventListener('load', detectOverflow);
      }
      
      // 5. iOS特有の対策
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        // iOS Safari のバウンススクロール無効化
        document.body.addEventListener('touchmove', function(e) {
          e.preventDefault();
        }, { passive: false });
        
        // スクロール可能要素のみ許可
        const scrollables = document.querySelectorAll('.scrollable');
        scrollables.forEach(el => {
          el.addEventListener('touchmove', function(e) {
            e.stopPropagation();
          }, { passive: true });
        });
      }
      
      // 6. Android特有の対策  
      if (/Android/.test(navigator.userAgent)) {
        // Androidのオーバースクロール無効化
        document.body.style.overscrollBehavior = 'none';
        document.documentElement.style.overscrollBehavior = 'none';
      }
      
    })();
  </script>
