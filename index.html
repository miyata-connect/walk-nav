<!--L187--><!-- パネル操作（タブ切り替えだけ） -->
<!--L188--><script>
<!--L189-->  document.addEventListener('DOMContentLoaded', function () {
<!--L190-->    const tabButtons = document.querySelectorAll('[data-panel-tab]');
<!--L191-->    const posButtons = document.querySelectorAll('[data-pos]');
<!--L192-->
<!--L193-->    // タブ切り替え：app.js 内の switchPanelTab を呼ぶ
<!--L194-->    tabButtons.forEach(function (btn) {
<!--L195-->      btn.addEventListener('click', function () {
<!--L196-->        if (typeof switchPanelTab === 'function') {
<!--L197-->          switchPanelTab(btn.dataset.panelTab);
<!--L198-->        }
<!--L199-->      });
<!--L200-->      btn.addEventListener('keydown', function (e) {
<!--L201-->        if (e.key === 'Enter' || e.key === ' ') {
<!--L202-->          if (typeof switchPanelTab === 'function') {
<!--L203-->            switchPanelTab(btn.dataset.panelTab);
<!--L204-->          }
<!--L205-->        }
<!--L206-->      });
<!--L207-->    });
<!--L208-->
<!--L209-->    // 初期タブ
<!--L210-->    if (typeof switchPanelTab === 'function') {
<!--L211-->      switchPanelTab('search');
<!--L212-->    }
<!--L213-->
<!--L214-->    // タブ位置設定（埋め込み用）
<!--L215-->    posButtons.forEach(function (btn) {
<!--L216-->      btn.addEventListener('click', function () {
<!--L217-->        posButtons.forEach(function (b) { b.classList.remove('active'); });
<!--L218-->        btn.classList.add('active');
<!--L219-->        if (window.parent !== window) {
<!--L220-->          window.parent.postMessage({ type: 'WN_SET_TAB_POS', position: btn.dataset.pos }, '*');
<!--L221-->        }
<!--L222-->      });
<!--L223-->    });
<!--L224-->
<!--L225-->    window.addEventListener('message', function (e) {
<!--L226-->      if (e.data && e.data.type === 'WN_CURRENT_TAB_POS') {
<!--L227-->        const pos = e.data.position || 'right';
<!--L228-->        posButtons.forEach(function (b) {
<!--L229-->          b.classList.toggle('active', b.dataset.pos === pos);
<!--L230-->        });
<!--L231-->      }
<!--L232-->    });
<!--L233-->
<!--L234-->    if (window.parent !== window) {
<!--L235-->      window.parent.postMessage({ type: 'WN_REQUEST_TAB_POS' }, '*');
<!--L236-->    }
<!--L237-->  });
<!--L238--></script>
