<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — タブ内で地図／Gemini・ChatGPTはリンク</title> <!-- L006 -->
  <style> /* L007 */
    :root{ --bar:56px; --barW:72px; } /* L008 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L009 */
    body{background:#f8fafc;} /* L010 */
    #app{position:relative;width:100%;height:100dvh;overflow:hidden;} /* L011 */

    /* タブバー：最前面固定（どの配置でもクリックを奪われない） */ /* L012 */
    .topbar{position:absolute;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:9999;pointer-events:auto;} /* L013 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;} /* L014 */
    .tabs::-webkit-scrollbar{display:none;} /* L015 */
    .tab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;white-space:nowrap;cursor:pointer;user-select:none;} /* L016 */
    .tab .label{display:inline-flex;align-items:center;gap:6px;} /* L017 */
    .tab .close{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:12px;line-height:1;background:#f3f4f6;color:#374151} /* L018 */
    .tab .close:hover{background:#e5e7eb} /* L019 */
    .tab.active{border-color:#2563eb;color:#2563eb;} /* L020 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;} /* L021 */
    .tab.flash{transition:background-color .2s, box-shadow .2s;background:#eef2ff;box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L022 */

    /* ビュー：常に下層。配置切替で衝突しないよう調整 */ /* L023 */
    .view{position:absolute;top:var(--bar);left:0;right:0;bottom:0;display:none;z-index:0;} /* L024 */
    .view.active{display:block;} /* L025 */

    /* 地図埋め込み */ /* L026 */
    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L027 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;display:block;} /* L028 */

    /* 新規タブ／Aiタブ */ /* L029 */
    .start{position:absolute;inset:0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:flex-start;background:#f8fafc;} /* L030 */
    .card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:14px;background:#fff;min-height:120px;text-decoration:none;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.06);} /* L031 */
    .card .title{margin-top:6px;font-size:13px;color:#374151;} /* L032 */
    .card .url{margin-top:8px;font-size:12px;color:#6b7280;word-break:break-all;padding:0 10px;text-align:center;} /* L033 */
    .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;} /* L034 */
    .btn, .alink{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#111;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:12px;text-decoration:none;} /* L035 */
    .muted{color:#6b7280;font-size:12px;margin-top:8px;text-align:center;grid-column:1/-1;} /* L036 */
    .tabmap{position:absolute;inset:0;border:0;background:#e5e7eb;display:none;width:100%;height:100%;} /* L037 */
    .tabmap.active{display:block;} /* L038 */

    /* —— 位置切替：下 —— */ /* L039 */
    #app.pos-bottom .topbar{inset:auto 0 0 0;height:var(--bar);box-shadow:0 -8px 24px rgba(0,0,0,.08);} /* L040 */
    #app.pos-bottom .view{top:0;bottom:var(--bar);} /* L041 */
    #app.pos-bottom .tabs{flex-direction:row;overflow-x:auto;overflow-y:hidden;} /* L042 */
    /* —— 位置切替：左 —— */ /* L043 */
    #app.pos-left .topbar{inset:0 auto 0 0;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-start;box-shadow:8px 0 24px rgba(0,0,0,.08);} /* L044 */
    #app.pos-left .view{top:0;left:var(--barW);right:0;bottom:0;} /* L045 */
    #app.pos-left .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;} /* L046 */
    /* —— 位置切替：右 —— */ /* L047 */
    #app.pos-right .topbar{inset:0 0 0 auto;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-end;box-shadow:-8px 0 24px rgba(0,0,0,.08);} /* L048 */
    #app.pos-right .view{top:0;left:0;right:var(--barW);bottom:0;} /* L049 */
    #app.pos-right .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;} /* L050 */
  </style> <!-- L051 -->
</head> <!-- L052 -->
<body> <!-- L053 -->
<div id="app" class="pos-top"> <!-- L054 -->
  <div class="topbar"> <!-- L055 -->
    <div class="tabs" id="tabs"> <!-- L056 -->
      <div class="tab active" data-view="view-map" id="tab-map"><span class="label">🗺️ 地図</span></div> <!-- L057 -->
      <div class="tab" data-view="view-browser" id="tab-browser"><span class="label">🤖 Aiブラウザ</span></div> <!-- L058 -->
      <div class="tab" data-view="view-settings" id="tab-settings"><span class="label">⚙️ 設定</span></div> <!-- L059 -->
      <div class="tab add" id="tab-add" title="新しいタブを作成"><span class="label">＋</span></div> <!-- L060 -->
    </div> <!-- L061 -->
  </div> <!-- L062 -->

  <div class="view active" id="view-map"> <!-- L063 -->
    <div id="mapHost"> <!-- L064 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L065 -->
    </div> <!-- L066 -->
  </div> <!-- L067 -->

  <div class="view" id="view-browser"> <!-- L068 -->
    <div class="start" aria-label="スタート"> <!-- L069 -->
      <div class="card">
        <div style="font-size:24px">🗺️</div>
        <div class="title">このタブで地図を表示</div>
        <div class="row"><button class="btn" data-action="open-map-here" data-view="view-browser" type="button">地図を表示</button></div>
      </div> <!-- L070 -->
      <div class="card">
        <div style="font-size:24px">🧠</div>
        <div class="title">Gemini</div>
        <div class="row">
          <a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a>
        </div>
        <div class="url">https://gemini.google.com/</div>
      </div> <!-- L071 -->
      <div class="card">
        <div style="font-size:24px">💬</div>
        <div class="title">ChatGPT</div>
        <div class="row">
          <a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a>
        </div>
        <div class="url">https://chatgpt.com/</div>
      </div> <!-- L072 -->
      <div class="muted">※ リンクは新しいブラウザタブで開きます（本アプリは残ります）。『地図を表示』はこのタブ内だけに適用。</div> <!-- L073 -->
    </div> <!-- L074 -->
    <iframe class="tabmap" id="view-browser-map" title="Aiタブ内地図" src="" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L075 -->
  </div> <!-- L076 -->

  <div class="view" id="view-settings"> <!-- L077 -->
    <div class="start" aria-label="設定"> <!-- L078 -->
      <div class="card" style="grid-column:span 3">
        <div class="title">設定：タブの場所（上／下／右／左）</div>
        <div class="row" id="posControls" role="radiogroup" aria-label="タブの場所">
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="top" style="display:none">上</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="bottom" style="display:none">下</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="left" style="display:none">左</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="right" style="display:none">右</label>
        </div>
        <div class="muted">選択は自動保存され、次回起動時に復元されます。</div>
      </div>
      <div class="card" style="grid-column:span 3"><div class="title">状態：未ログイン／通知未設定／v=tab-local-map+links</div></div>
    </div>
  </div> <!-- L079 -->
</div> <!-- L080 -->

<script> /* L081 */
(function(){
  // 参照
  var appEl=document.getElementById('app');
  var tabsEl=document.getElementById('tabs');
  var SKEY_TABS='WN_TABS_LOCAL_V2';
  var SKEY_POS='WN_TAB_POS_V1';

  // 安全スクロール
  function snapIntoView(el){ if(!el) return; try{ el.scrollIntoView({block:'nearest',inline:'end'}); }catch(_){ /* noop */ } }

  // 位置切替
  function setTabPosition(pos){
    var p=(pos==='bottom'||pos==='left'||pos==='right')?pos:'top';
    appEl.classList.remove('pos-top','pos-bottom','pos-left','pos-right');
    appEl.classList.add('pos-'+p);
    try{ localStorage.setItem(SKEY_POS,p); }catch(_){}
    snapIntoView(document.getElementById('tab-add'));
  }

  // タブ活性化
  function activateTab(btn){
    if(!btn) return;
    var views=document.querySelectorAll('.view');
    for(var i=0;i<views.length;i++){ views[i].classList.remove('active'); }
    var tabs=document.querySelectorAll('.tab');
    for(var j=0;j<tabs.length;j++){ tabs[j].classList.remove('active'); }
    btn.classList.add('active');
    var vid=btn.getAttribute('data-view');
    if(vid){ var v=document.getElementById(vid); if(v) v.classList.add('active'); }
    snapIntoView(btn);
  }

  // ラベル採番
  function nextLabel(){
    var list=[].slice.call(document.querySelectorAll('.tab')).filter(function(n){
      return !n.classList.contains('add') && ['tab-map','tab-browser','tab-settings'].indexOf(n.id)===-1;
    });
    return '新規タブ '+(list.length+1);
  }

  // 新規タブ用HTML
  function startContentHTML(viewId){
    return ''+
    '<div class="start" aria-label="リンク集">'+
      '<div class="card">'+
        '<div style="font-size:24px">🗺️</div>'+
        '<div class="title">このタブで地図を表示</div>'+
        '<div class="row"><button class="btn" data-action="open-map-here" data-view="'+viewId+'" type="button">地図を表示</button></div>'+
      '</div>'+
      '<div class="card">'+
        '<div style="font-size:24px">🧠</div>'+
        '<div class="title">Gemini</div>'+
        '<div class="row">'+
          '<a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a>'+
        '</div>'+
        '<div class="url">https://gemini.google.com/</div>'+
      '</div>'+
      '<div class="card">'+
        '<div style="font-size:24px">💬</div>'+
        '<div class="title">ChatGPT</div>'+
        '<div class="row">'+
          '<a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a>'+
        '</div>'+
        '<div class="url">https://chatgpt.com/</div>'+
      '</div>'+
      '<div class="muted">※ リンクは新しいブラウザタブで開きます。本アプリは残ります。</div>'+
    '</div>'+
    '<iframe class="tabmap" id="'+viewId+'-map" title="タブ内地図" src="" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe>';
  }

  // ID発行
  var tabCounter=0;
  function makeIds(){
    tabCounter++;
    var id='user-'+Date.now()+'-'+tabCounter;
    return {tabId:'tab-'+id, viewId:'view-'+id};
  }

  // 状態保存
  function persistTabs(){
    var nodes=[].slice.call(document.querySelectorAll('.tab')).filter(function(n){
      return !n.classList.contains('add') && ['tab-map','tab-browser','tab-settings'].indexOf(n.id)===-1;
    });
    var data=nodes.map(function(n){
      var viewId=n.getAttribute('data-view');
      var mapEl=document.getElementById(viewId+'-map');
      var mapOpened=!!(mapEl && mapEl.classList.contains('active') && mapEl.src && mapEl.src.indexOf('embed.html')!==-1);
      var label=(n.querySelector('.label')?n.querySelector('.label').textContent:n.textContent)||'';
      return {tabId:n.id, viewId:viewId, label:label, mapOpened:mapOpened};
    });
    var aiMap=document.getElementById('view-browser-map');
    var aiOpened=!!(aiMap && aiMap.classList.contains('active') && aiMap.src && aiMap.src.indexOf('embed.html')!==-1);
    try{ sessionStorage.setItem(SKEY_TABS, JSON.stringify({tabs:data, aiOpened:aiOpened})); }catch(_){}
  }

  // 復元
  function addTabFromState(state){
    var addBtn=document.getElementById('tab-add'); if(!addBtn) return;
    var tab=document.createElement('div');
    tab.className='tab'; tab.id=state.tabId; tab.setAttribute('data-view',state.viewId);
    tab.innerHTML='<span class="label">'+state.label+'</span><span class="close" data-close="'+state.viewId+'" aria-label="閉じる">×</span>';
    addBtn.parentNode.insertBefore(tab, addBtn);

    var view=document.createElement('div');
    view.className='view'; view.id=state.viewId; view.innerHTML=startContentHTML(state.viewId);
    document.getElementById('app').appendChild(view);

    if(state.mapOpened){
      var m=document.getElementById(state.viewId+'-map'); if(m){ m.src='./embed.html'; m.classList.add('active'); }
      var s=view.querySelector('.start'); if(s) s.style.display='none';
    }
    snapIntoView(addBtn);
  }

  function restoreTabs(){
    try{
      var saved=JSON.parse(sessionStorage.getItem(SKEY_TABS)||'{"tabs":[]}');
      (saved.tabs||[]).forEach(addTabFromState);
      if(saved.aiOpened){
        var ai=document.getElementById('view-browser-map'); var s=document.querySelector('#view-browser .start');
        if(ai){ ai.src='./embed.html'; ai.classList.add('active'); } if(s) s.style.display='none';
      }
    }catch(_){}
  }

  // 作成／削除
  function addTab(label){
    var ids=makeIds(); var addBtn=document.getElementById('tab-add'); if(!addBtn) return;
    var tab=document.createElement('div');
    tab.className='tab'; tab.id=ids.tabId; tab.setAttribute('data-view',ids.viewId);
    tab.innerHTML='<span class="label">'+label+'</span><span class="close" data-close="'+ids.viewId+'" aria-label="閉じる">×</span>';
    addBtn.parentNode.insertBefore(tab, addBtn);
    tab.classList.add('flash'); setTimeout(function(){ tab.classList.remove('flash'); },200);

    var view=document.createElement('div');
    view.className='view'; view.id=ids.viewId; view.innerHTML=startContentHTML(ids.viewId);
    document.getElementById('app').appendChild(view);

    activateTab(tab);
    persistTabs();
    snapIntoView(addBtn);
  }

  function closeTab(viewId){
    var tabs=[].slice.call(document.querySelectorAll('.tab'));
    var tab=tabs.find(function(t){ return t.getAttribute('data-view')===viewId; });
    var view=document.getElementById(viewId);
    if(!tab||!view) return;
    var isActive=tab.classList.contains('active');
    tab.remove(); view.remove(); persistTabs();
    if(isActive){ var mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab); }
  }

  // 同タブ地図
  function openMapHere(viewId){
    var v=document.getElementById(viewId); if(!v) return;
    var map=v.querySelector('.tabmap'); var s=v.querySelector('.start');
    if(map){ if(!map.src) map.src='./embed.html'; map.classList.add('active'); }
    if(s) s.style.display='none';
    persistTabs();
  }

  // ボタン系（同一ハンドラで吸収）
  function handleOpenHere(target){
    var b=target && target.closest ? target.closest('.btn') : null;
    if(!b) return false;
    var act=b.getAttribute('data-action');
    if(act!=='open-map-here') return false;
    var vid=b.getAttribute('data-view'); if(!vid) return false;
    openMapHere(vid);
    return true;
  }

  // —— イベント登録（互換性重視：第三引数オプション未使用） ——
  function bindEvents(){
    if(!tabsEl) return;
    tabsEl.addEventListener('click', function(e){
      var btn=e.target && e.target.closest ? e.target.closest('.tab') : null;
      if(!btn) return;
      var close=e.target.closest ? e.target.closest('.close') : null;
      if(close){ closeTab(close.getAttribute('data-close')); return; }
      if(btn.id==='tab-add'){ addTab(nextLabel()); return; }
      var vid=btn.getAttribute('data-view'); if(vid){ activateTab(btn); }
    });

    document.addEventListener('click', function(e){
      if(handleOpenHere(e.target)){ /* handled */ }
    });

    document.addEventListener('pointerup', function(e){
      if(handleOpenHere(e.target)){ /* handled */ }
    });

    document.addEventListener('keydown', function(e){
      if((e.key==='Enter'||e.key===' '||e.code==='Space') && handleOpenHere(e.target)){ /* handled */ }
    });
  }

  // 設定UI
  function initPositionUI(){
    var saved='top'; try{ saved=localStorage.getItem(SKEY_POS)||'top'; }catch(_){}
    setTabPosition(saved);
    var posEl=document.getElementById('posControls'); if(!posEl) return;
    var radios=[].slice.call(posEl.querySelectorAll('input[name="tabpos"]'));
    radios.forEach(function(r){ r.checked=(r.value===saved); });
    posEl.addEventListener('click', function(e){
      var lab=e.target && e.target.closest ? e.target.closest('label') : null; if(!lab) return;
      var input=lab.querySelector('input[name="tabpos"]'); if(!input) return;
      setTabPosition(input.value);
      radios.forEach(function(r){ r.checked=(r===input); });
    });
  }

  // 初期化（安全弁つき）
  function init(){
    // 位置
    initPositionUI();
    // タブ復元
    restoreTabs();
    // 既定タブを活性化
    var initial=document.querySelector('.tab.active')||document.getElementById('tab-map');
    if(initial) activateTab(initial);
    // ＋視認
    snapIntoView(document.getElementById('tab-add'));
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', function(){
      try{ bindEvents(); init(); }catch(_){ setTimeout(function(){ try{ bindEvents(); init(); }catch(__){} }, 0); }
    });
  }else{
    try{ bindEvents(); init(); }catch(_){ setTimeout(function(){ try{ bindEvents(); init(); }catch(__){} }, 0); }
  }
})();
</script> <!-- L082 -->
</body> <!-- L083 -->
</html> <!-- L084 -->
