<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — 地図タブ（同一オリジンiframe）</title> <!-- L006 -->
  <style> /* L007 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L008 */
    #app{position:relative;width:100%;height:100%;overflow:hidden;background:#f8fafc;} /* L009 */
    .topbar{position:absolute;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:10;} /* L010 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;} /* L011 */
    .tabs::-webkit-scrollbar{display:none;} /* L012 */
    .tab{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;white-space:nowrap;cursor:pointer;} /* L013 */
    .tab.active{border-color:#2563eb;color:#2563eb;} /* L014 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;} /* L015 */
    /* 追加：＋を完全無効化（見た目はそのまま） */ /* L016 */
    .tab.add[aria-disabled="true"]{opacity:.6;cursor:default;pointer-events:none;} /* L017 */
    .view{position:absolute;top:52px;left:0;right:0;bottom:0;display:none;} /* L018 */
    .view.active{display:block;} /* L019 */
    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L020 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;} /* L021 */
  </style> <!-- L022 -->
</head> <!-- L023 -->
<body> <!-- L024 -->
<div id="app"> <!-- L025 -->
  <div class="topbar"> <!-- L026 -->
    <div class="tabs" id="tabs"> <!-- L027 -->
      <div class="tab active" data-view="view-map" id="tab-map">🗺️ 地図</div> <!-- L028 -->
      <div class="tab" data-view="view-browser" id="tab-browser">🤖 Aiブラウザ</div> <!-- L029 -->
      <div class="tab" data-view="view-settings" id="tab-settings">⚙️ 設定</div> <!-- L030 -->
      <!-- ここを無効化：aria-disabled + data-disabled 付与（見た目維持・操作殺し） --> <!-- L031 -->
      <div class="tab add" id="tab-add" aria-disabled="true" data-disabled="true">＋</div> <!-- L032 -->
    </div> <!-- L033 -->
  </div> <!-- L034 -->

  <div class="view active" id="view-map"> <!-- L035 -->
    <div id="mapHost"> <!-- L036 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L037 -->
    </div> <!-- L038 -->
  </div> <!-- L039 -->

  <div class="view" id="view-browser"> <!-- L040 -->
    <iframe id="webview" style="width:100%;height:100%;border:0" title="Aiブラウザ"></iframe> <!-- L041 -->
  </div> <!-- L042 -->

  <div class="view" id="view-settings"> <!-- L043 -->
    <div style="padding:16px;line-height:1.7"> <!-- L044 -->
      <div>アカウント：未ログイン</div> <!-- L045 -->
      <div>通知：未設定</div> <!-- L046 -->
      <div>バージョン：embed-iframe v1.1</div> <!-- L047 -->
    </div> <!-- L048 -->
  </div> <!-- L049 -->
</div> <!-- L050 -->

<script> /* L051 */
  // タブ切替（見た目不変） /* L052 */
  const tabsEl=document.getElementById('tabs'); /* L053 */
  function activateTab(btn){ /* L054 */
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); /* L055 */
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); /* L056 */
    btn.classList.add('active'); /* L057 */
    const vid=btn.dataset.view; if(vid) document.getElementById(vid).classList.add('active'); /* L058 */
  } /* L059 */

  tabsEl.addEventListener('click',(e)=>{ /* L060 */
    const b=e.target.closest('.tab'); if(!b) return; /* L061 */
    // 追加：＋は完全に殺す（伝播も既定動作も抑止） /* L062 */
    if(b.id==='tab-add' || b.dataset.disabled==='true'){ e.preventDefault(); e.stopPropagation(); return false; } /* L063 */
    activateTab(b); /* L064 */
  }); /* L065 */
</script> <!-- L066 -->
</body> <!-- L067 -->
</html> <!-- L068 -->
