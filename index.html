<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WalkNav v85.2</title>
  <meta name="description" content="WalkNav - 近くを検索 & ルート案内" />
  <!-- Faviconのリクエストによる404エラーを防止するためのダミー指定 -->
  <link rel="icon" href="data:,">
  <!-- 外部CSSファイルの読み込み (v85.2) -->
  <link rel="stylesheet" href="app.css?v=85.2">
</head>
<body id="appBody">
<div class="app">
  <div id="map" aria-label="地図"></div>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />

  <section class="panel" id="searchPanel" data-current-tab="search">
    <div class="panel-handle-area"><div class="panel-handle"></div></div>

    <div class="panel-tabs-header" id="panelTabHeader">
      <button class="tab-btn active" data-panel-tab="search" tabindex="0" type="button">操作</button>
      <button class="tab-btn" data-panel-tab="nav" tabindex="0" type="button">案内</button>
      <button class="tab-btn" data-panel-tab="settings" tabindex="0" type="button">設定</button>
    </div>

    <div class="panel-tabs-body" id="panelScrollContainer">
      <!-- 操作タブ -->
      <div class="tab-pane active" id="tabPaneSearch">
        <div class="point-search-wrapper" style="margin-bottom:8px;">
          <button class="chip point-select full-width" id="btnPointSearch" type="button">📍 ポイント選択</button>
        </div>
        
        <div class="search-header-row">
          <div class="section-title-inline">
            近くを検索 <span style="font-weight:normal; color:#9ca3af; font-size:12px;">(5件/<span id="radiusLabel">10km</span>)</span>
          </div>
          <div class="distance-chips-row">
            <button class="chip" id="r5" type="button">5km</button>
            <button class="chip active" id="r10" type="button">10km</button>
            <button class="chip" id="r20" type="button">20km</button>
          </div>
        </div>

        <div class="quick-actions-row">
          <button class="chip quick-chip" id="btnSearchStation">🚉 駅</button>
          <button class="chip quick-chip" id="btnSearchBus">🚏 バス停</button>
          <button class="chip quick-chip" id="btnSearchTaxi">🚕 タクシー</button>
          <button class="chip quick-chip" id="btnSearchToilet">🚻 トイレ</button>
          <button class="chip quick-chip" id="btnSearchConv">🏪 コンビニ</button>
          <button class="chip quick-chip" id="btnSearchWifi">📶 Wi-Fi</button>
        </div>

        <div class="address-card" id="pointAddressBlock" style="display:none;">
          <div class="address-title" id="pointAddress">ポイント：取得中...</div>
          <div class="address-coords" id="pointCoords"></div>
        </div>

        <div class="action-buttons-row">
          <button class="btn btn-outline" id="btnCamera" type="button" style="border-color:#25d07a; color:#25d07a; background:rgba(37, 208, 122, 0.1);">📸 写真メモ</button>
          <button class="btn btn-outline" id="btnSaveCurrent" type="button" style="border-color:#d97706; color:#d97706; background:rgba(254,243,199,0.1);">⭐ 場所保存</button>
          <button class="btn btn-outline" id="btnOpenEditModal" type="button">編集</button>
        </div>

        <div class="search-box-container">
          <div class="input-wrapper">
            <input id="q" class="input" placeholder="店舗名・電話番号・住所・座標など" autocomplete="off" />
            <span class="icon icon-search" id="btnSearchIcon">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            </span>
            <span class="icon icon-mic" id="btnVoiceInput" style="margin-left:8px; cursor:pointer;">
              <svg viewBox="0 0 24 24" style="fill:#f97316;"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"></path></svg>
            </span>
          </div>
        </div>

        <div id="results" class="results-list" style="display:none"></div>

        <div class="bottom-actions-row">
          <button id="btnReset" class="btn btn-danger" type="button">リセット</button>
          <button id="btnLocatePanel" class="btn btn-primary" type="button">現在地</button>
          <button id="btnClosePanel" class="btn btn-secondary" type="button">閉じる</button>
        </div>

        <div id="savedSectionContainer"></div>
      </div>

      <!-- 案内タブ -->
      <div class="tab-pane" id="tabPaneNav">
        <div class="nav-section">
          <div class="nav-section-title">📍 現在地情報</div>
          <div class="location-info">
            <div id="locCoords" class="loc-coords">現在地：取得中...</div>
            <div id="locAddress" class="loc-address"></div>
          </div>
        </div>
        <div id="weatherDisplayNav"></div>
        <div class="nav-section" id="routeInfoSection" style="display:none;">
          <div class="nav-section-title">🚶 ルート詳細</div>
          <div class="route-summary-card">
            <div class="route-dest"><span id="destinationName">目的地</span>へのルート</div>
            <div class="route-stats">
              <span id="routeDistance" class="stat-dist">--</span>
              <span id="routeTime" class="stat-time">徒歩 --分</span>
            </div>
            <div class="route-mode-toggle" id="aiRouteModeRow">
              <button id="btnRouteNormal" class="chip active small" type="button">標準</button>
              <button id="btnRouteAiShortest" class="chip small" type="button">最短Ai</button>
            </div>
          </div>
        </div>
        <div class="nav-section" id="incidentSection" style="display:none;">
          <div class="nav-section-title">⚠️ 交通情報・インシデント</div>
          <div id="incidentText" class="incident-alert"></div>
        </div>
        <div class="nav-section" id="instructionsSection" style="display:none;">
          <div class="nav-section-title">🧭 ステップバイステップ</div>
          <div id="navPanelInstructions" class="instructions-list"></div>
        </div>
      </div>

      <!-- 設定タブ -->
      <div class="tab-pane" id="tabPaneSettings">
        <h2 class="section-title">アプリケーション設定</h2>
        <div class="settings-group">
          <div class="nav-section-title">👤 ユーザープロファイル</div>
          <div class="row" style="display:flex; gap:8px; margin-bottom:8px;">
            <div style="flex:1;">
              <label class="setting-sub-label">手荷物</label>
              <select id="userLuggage" class="input setting-input">
                <option value="None">なし</option>
                <option value="Light_Pack">軽量</option>
                <option value="Suitcase">スーツケース</option>
              </select>
            </div>
            <div style="flex:1;">
              <label class="setting-sub-label">体調</label>
              <select id="userCondition" class="input setting-input">
                <option value="Excellent">良好</option>
                <option value="Normal" selected>普通</option>
                <option value="Poor">不調</option>
              </select>
            </div>
          </div>
          <div class="row" style="display:flex;">
            <div style="flex:1;">
              <label class="setting-sub-label">同行者</label>
              <select id="userCompanion" class="input setting-input">
                <option value="None">なし</option>
                <option value="Child">子供</option>
                <option value="Elderly">高齢者</option>
              </select>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-label">地図表示モード</div>
          <div class="map-mode-buttons">
            <button id="btnMapPhoto" class="map-mode-btn" data-mode="photo" type="button">写真</button>
            <button id="btnMapRoadmap" class="map-mode-btn active" data-mode="roadmap" type="button">地図</button>
            <button id="btnMap3D" class="map-mode-btn" data-mode="3d" type="button">3D</button>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-label">ボタン位置の調整 (画面上のボタン移動)</div>
          <div class="d-pad-container">
            <button class="d-pad-btn" id="btnFabUp" type="button">▲</button>
            <div class="d-pad-row">
              <button class="d-pad-btn" id="btnFabLeft" type="button">◀</button>
              <button class="d-pad-btn" id="btnFabDown" type="button">▼</button>
              <button class="d-pad-btn" id="btnFabRight" type="button">▶</button>
            </div>
          </div>
          <div style="text-align:center; font-size:11px; color:#999; margin-top:4px;">
            ◀ボタンで左利き対応（左側へ移動）
          </div>
        </div>

        <div id="routeControlSection" style="display:none;" class="settings-group">
          <div class="settings-label">ナビゲーション操作</div>
          <div class="nav-controls-stack">
            <button id="btnStopRoute" class="btn btn-danger-block" type="button">🛑 ルート終了</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="fab-container" id="fabStack" style="display:none;">
    <button class="fab-btn square" id="btnSearchFab" type="button" data-label="検索">
      <span class="fab-icon">🔍</span>
      <span class="fab-label">検索</span>
    </button>
    <button class="fab-btn square" id="btnLocateFab" type="button" data-label="現在地">
      <span class="fab-icon">📍</span>
      <span class="fab-label">現在地</span>
    </button>
    <button class="fab-btn square destination" id="btnDestFab" type="button" data-label="目的地" style="display:none">
      <span class="fab-icon">🏁</span>
      <span class="fab-label">目的地</span>
    </button>
    <button class="fab-btn square" id="btnSettingsFab" type="button" data-label="設定">
      <span class="fab-icon">⚙️</span>
      <span class="fab-label">設定</span>
    </button>
    <button class="fab-btn square" id="btnNavFab" type="button" data-label="案内">
      <span class="fab-icon">🧭</span>
      <span class="fab-label">案内</span>
    </button>
    <button class="fab-btn square" id="btnShareFab" type="button" data-label="共有">
      <span class="fab-icon">✉️</span>
      <span class="fab-label">共有</span>
    </button>
    <button class="fab-btn square stop-btn" id="btnStopFab" type="button" data-label="終了" style="display:none; background:#ef4444; color:#fff;">
      <span class="fab-icon">🛑</span>
      <span class="fab-label">終了</span>
    </button>
  </div>

  <div class="loading-overlay" id="loading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">📍 現在地取得中</div>
    </div>
  </div>

  <div id="editSavedModal" class="edit-modal-overlay" style="display:none;">
    <div class="edit-modal-content">
      <h3 class="edit-modal-title">登録地の編集</h3>
      <div class="edit-modal-body" id="editModalList"></div>
      <div class="edit-modal-actions">
        <button id="btnCancelEdit" class="btn btn-secondary" type="button">キャンセル</button>
        <button id="btnSaveEdits" class="btn btn-primary" type="button">変更を保存</button>
      </div>
    </div>
  </div>
</div>

<script src="RouteEvaluator.js"></script>
<script src="app.js?v=85.2"></script>
<script src="https://maps.googleapis.com/maps/api/js?language=ja&region=JP&key=AIzaSyBuX-4y1Cgl6jdKcHZWWlsoosDWK_RGqF0&v=weekly&libraries=places,marker,geometry&loading=async" async defer></script>
<script>
(function () {
  document.addEventListener('gesturestart', function(e) {
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('dblclick', function(e) {
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', function(e) {
    if (e.target.closest('.gm-style') || e.target.closest('#map')) return;
    var scrollable = e.target.closest('.panel-tabs-body') || e.target.closest('.edit-modal-body') || e.target.closest('.quick-actions-row');
    if (!scrollable) {
      if (e.cancelable) e.preventDefault();
      return;
    }
    if (scrollable.classList.contains('quick-actions-row')) return;
    if (scrollable.scrollHeight <= scrollable.clientHeight && e.target.tagName !== 'INPUT') {
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });
})();
</script>
</body>
</html>
