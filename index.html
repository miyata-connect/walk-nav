<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — タブ内で地図／Gemini・ChatGPTはリンク</title> <!-- L006 -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" /> <!-- L007 -->
  <style> /* L008 */
    :root{ --bar:56px; --barW:60px; --hit:44px; } /* L009 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L010 */
    body{background:#f8fafc;} /* L011 */
    #app{position:relative;width:100%;height:100dvh;overflow:hidden;} /* L012 */

    .topbar{position:absolute;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:9999;} /* L013 */
    .tabs-container{display:flex;gap:6px;flex:1 1 auto;align-items:center;overflow:hidden;} /* L014 */
    .tabs-scroll{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1 1 auto;} /* L015 */
    .tabs-scroll::-webkit-scrollbar{display:none;} /* L016 */

    .tab{display:flex;flex-direction:row;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;cursor:pointer;user-select:none;max-width:38vw;white-space:normal;overflow-wrap:anywhere;} /* L017 */
    #app.pos-left .tab,#app.pos-right .tab{max-width:calc(var(--barW) - 12px);flex-direction:column;align-items:center;} /* L018 */
    .tab .label{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;width:100%;gap:2px;} /* L019 */
    .tab .label > span{display:block;text-align:center;} /* L020 */
    .tab .label svg{display:block;margin:0 auto;} /* L021 */
    .tab .close{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:10px;font-size:14px;background:#f3f4f6;color:#374151;margin-left:auto;margin-top:4px;} /* L022 */
    .tab .close:hover{background:#e5e7eb} /* L023 */
    .tab.active{border-color:#2563eb;color:#fff;background:#2563eb;} /* L024 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;align-items:center;} /* L025 */
    .tab.flash{transition:background-color .2s, box-shadow .2s;background:#eef2ff;box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L026 */

    #app.pos-top .tab, #app.pos-bottom .tab{flex-direction:row;align-items:center;max-width:none;padding:6px 10px;} /* L027 */
    #app.pos-top .tab .label, #app.pos-bottom .tab .label{white-space:nowrap;} /* L028 */

    .view{position:absolute;top:var(--bar);left:0;right:0;bottom:0;display:none;z-index:0;} /* L029 */
    .view.active{display:block;} /* L030 */

    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L031 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;display:block;} /* L032 */

    .start{position:absolute;inset:0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:flex-start;background:#f8fafc;z-index:1;} /* L033 */
    .card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:14px;background:#fff;min-height:120px;text-decoration:none;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.06);} /* L034 */
    .card .title{margin-top:6px;font-size:13px;color:#374151;} /* L035 */
    .card .url{margin-top:8px;font-size:12px;color:#6b7280;word-break:break-all;padding:0 10px;text-align:center;} /* L036 */
    .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;} /* L037 */
    .btn,.alink{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#111;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:12px;text-decoration:none;} /* L038 */
    .muted{color:#6b7280;font-size:12px;margin-top:8px;text-align:center;grid-column:1/-1;} /* L039 */
    .tabmap{position:absolute;inset:0;border:0;background:#e5e7eb;display:none;width:100%;height:100%;z-index:2;} /* L040 */
    .tabmap.active{display:block;} /* L041 */

    #app.pos-bottom .topbar{inset:auto 0 0 0;height:var(--bar);box-shadow:0 -8px 24px rgba(0,0,0,.08);} /* L042 */
    #app.pos-bottom .view{top:0;bottom:var(--bar);} /* L043 */

    #app.pos-left .topbar{inset:0 auto 0 0;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-start;box-shadow:8px 0 24px rgba(0,0,0,.08);} /* L044 */
    #app.pos-left .view{top:0;left:var(--barW);right:0;bottom:0;} /* L045 */
    #app.pos-left .tabs-container{flex-direction:column;width:100%;} /* L046 */
    #app.pos-left .tabs-scroll{flex-direction:column;overflow-y:auto;overflow-x:hidden;width:100%;} /* L047 */

    #app.pos-right .topbar{inset:0 0 0 auto;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-end;box-shadow:-8px 0 24px rgba(0,0,0,.08);} /* L048 */
    #app.pos-right .view{top:0;left:0;right:var(--barW);bottom:0;} /* L049 */
    #app.pos-right .tabs-container{flex-direction:column;width:100%;} /* L050 */
    #app.pos-right .tabs-scroll{flex-direction:column;overflow-y:auto;overflow-x:hidden;width:100%;} /* L051 */

    .navtools{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:0 0 auto;} /* L052 */
    .navbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--hit);height:var(--hit);border-radius:12px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;user-select:none;transition:transform .06s ease;} /* L053 */
    .navbtn:active{transform:translateY(1px);} /* L054 */
    .navbtn svg{width:28px;height:28px;display:block;} /* L055 */
    .navbtn.home{background:#e0f2fe;border-color:#bae6fd;} .navbtn.home svg path{fill:#2563eb;} /* L056 */
    .navbtn.back{background:#fef3c7;border-color:#fde68a;} .navbtn.back svg path{fill:#b45309;} /* L057 */
    .navbtn.forward{background:#dcfce7;border-color:#bbf7d0;} .navbtn.forward svg path{fill:#16a34a;} /* L058 */

    #app.pos-left .navbtn, #app.pos-right .navbtn{width:52px;height:52px;border-radius:14px;margin-left:auto;margin-right:auto;} /* L059 */
    #app.pos-left .navtools,#app.pos-right .navtools{flex-direction:column;gap:10px;margin-top:auto;margin-bottom:6px;} /* L060 */
    #app.pos-left .topbar,#app.pos-right .topbar{padding-top:6px;padding-bottom:6px;} /* L061 */
  </style> <!-- L062 -->
</head> <!-- L063 -->
<body> <!-- L064 -->
<div id="app" class="pos-left"> <!-- L065 -->
  <div class="topbar"> <!-- L066 -->
    <div class="tabs-container"> <!-- L067 -->
      <!-- 固定：地図タブ --> <!-- L068 -->
      <div class="tab active" data-view="view-map" id="tab-map"> <!-- L069 -->
        <span class="label"> <!-- L070 -->
          <svg viewBox="0 0 24 24" width="24" height="24"> <!-- L071 -->
            <path fill="#62b5ff" d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/> <!-- L072 -->
          </svg> <!-- L073 -->
          地図 <!-- L074 -->
        </span> <!-- L075 -->
      </div> <!-- L076 -->

      <!-- スクロール可能：Aiタブ領域 --> <!-- L077 -->
      <div class="tabs-scroll" id="tabs"> <!-- L078 -->
        <div class="tab" data-view="view-browser" id="tab-browser"> <!-- L079 -->
          <span class="label"> <!-- L080 -->
            <svg viewBox="0 0 24 24" width="24" height="24"> <!-- L081 -->
              <circle cx="12" cy="12" r="10" fill="#25d07a"/> <!-- L082 -->
              <circle cx="9" cy="10" r="1.5" fill="#fff"/> <!-- L083 -->
              <circle cx="15" cy="10" r="1.5" fill="#fff"/> <!-- L084 -->
              <path d="M8 14c0 2.2 1.8 4 4 4s4-1.8 4-4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/> <!-- L085 -->
            </svg> <!-- L086 -->
            <span>Ai</span> <!-- L087 -->
          </span> <!-- L088 -->
        </div> <!-- L089 -->
        <div class="tab add" id="tab-add" title="新しいタブを作成"> <!-- L090 -->
          <span class="label"> <!-- L091 -->
            <svg viewBox="0 0 24 24" width="24" height="24"> <!-- L092 -->
              <path fill="#64748b" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/> <!-- L093 -->
            </svg> <!-- L094 -->
          </span> <!-- L095 -->
        </div> <!-- L096 -->
      </div> <!-- L097 -->
    </div> <!-- L098 -->

    <div class="navtools" aria-label="ナビゲーション操作"> <!-- L099 -->
      <button class="navbtn home" id="btn-home" aria-label="ホーム"> <!-- L100 -->
        <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v10h-5V15H11v6H6V11H3z"/></svg> <!-- L101 -->
      </button> <!-- L102 -->
      <button class="navbtn back" id="btn-back" aria-label="戻る"> <!-- L103 -->
        <svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5V7z"/></svg> <!-- L104 -->
      </button> <!-- L105 -->
      <button class="navbtn forward" id="btn-forward" aria-label="進む"> <!-- L106 -->
        <svg viewBox="0 0 24 24"><path d="M10 7l5 5-5 5V7z"/></svg> <!-- L107 -->
      </button> <!-- L108 -->
    </div> <!-- L109 -->
  </div> <!-- L110 -->

  <!-- 地図タブ --> <!-- L111 -->
  <div class="view active" id="view-map"> <!-- L112 -->
    <div id="mapHost"> <!-- L113 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L114 -->
    </div> <!-- L115 -->
  </div> <!-- L116 -->

  <!-- Aiブラウザ --> <!-- L117 -->
  <div class="view" id="view-browser"> <!-- L118 -->
    <div class="start" aria-label="スタート"> <!-- L119 -->
      <div class="card"> <!-- L120 -->
        <div style="font-size:24px">🗺️</div> <!-- L121 -->
        <div class="title">このタブで地図を表示</div> <!-- L122 -->
        <div class="row"><button class="btn" data-action="open-map-here" data-view="view-browser" type="button">地図を表示</button></div> <!-- L123 -->
      </div> <!-- L124 -->
      <div class="card"> <!-- L125 -->
        <div style="font-size:24px">🧠</div> <!-- L126 -->
        <div class="title">Gemini</div> <!-- L127 -->
        <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div> <!-- L128 -->
        <div class="url">https://gemini.google.com/</div> <!-- L129 -->
      </div> <!-- L130 -->
      <div class="card"> <!-- L131 -->
        <div style="font-size:24px">💬</div> <!-- L132 -->
        <div class="title">ChatGPT</div> <!-- L133 -->
        <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div> <!-- L134 -->
        <div class="url">https://chatgpt.com/</div> <!-- L135 -->
      </div> <!-- L136 -->
      <div class="muted">※ リンクは新しいブラウザタブで開きます（本アプリは残ります）。『地図を表示』はこのタブ内だけに適用。</div> <!-- L137 -->
    </div> <!-- L138 -->
    <iframe class="tabmap" id="view-browser-map" title="Aiタブ内地図" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L139 -->
  </div> <!-- L140 -->
</div> <!-- L141 -->

<script> /* L142 */
(function(){ /* L143 */
  const appEl=document.getElementById('app'); /* L144 */
  const tabsContainer=document.querySelector('.tabs-container'); /* L145 */
  const SKEY_TABS='WN_TABS_LOCAL_V2'; /* L146 */
  const SKEY_POS ='WN_TAB_POS_V1'; /* L147 */

  function snapIntoView(el){  /* L148 */
    if(!el) return; /* L149 */
    try{  /* L150 */
      const isVertical = appEl.classList.contains('pos-left') || appEl.classList.contains('pos-right'); /* L151 */
      el.scrollIntoView({ /* L152 */
        block: isVertical ? 'nearest' : 'nearest', /* L153 */
        inline: isVertical ? 'nearest' : 'end', /* L154 */
        behavior: 'smooth' /* L155 */
      });  /* L156 */
    }catch(_){ /* L157 */
      try{ /* L158 */
        el.scrollIntoView({block:'nearest',inline:'end'}); /* L159 */
      }catch(_){} /* L160 */
    }  /* L161 */
  } /* L162 */

  function enforceOrder(doc){ /* L163 */
    try{ /* L164 */
      const all = Array.from(doc.querySelectorAll('div,li,p,span')); /* L165 */
      const addr = all.find(function(n){ return /〒\s*\d{3}-?\d{4}/.test(n.textContent||''); }); /* L166 */
      const coord= all.find(function(n){ return /(緯度|経度)/.test(n.textContent||''); }); /* L167 */
      if(!addr || !coord) return; /* L168 */

      const t = (coord.textContent||'').trim(); /* L169 */
      if(!/^現在地：/.test(t)){ /* L170 */
        coord.textContent = '現在地：' + t.replace(/^(.*?：)?\s*/,''); /* L171 */
      } /* L172 */

      if (addr.compareDocumentPosition(coord) & Node.DOCUMENT_POSITION_FOLLOWING){ /* L173 */
      } else { /* L174 */
        coord.parentNode.insertBefore(addr, coord); /* L175 */
      } /* L176 */
    }catch(_){} /* L177 */
  } /* L178 */

  function hookEmbed(doc){ /* L179 */
    if(!doc) return; /* L180 */
    let timer=null; /* L181 */
    const debounced=function(){ clearTimeout(timer); timer=setTimeout(function(){ enforceOrder(doc); }, 50); }; /* L182 */
    debounced(); /* L183 */
    try{ /* L184 */
      const mo=new MutationObserver(debounced); /* L185 */
      mo.observe(doc.body||doc,{childList:true,subtree:true,characterData:true}); /* L186 */
    }catch(_){} /* L187 */
  } /* L188 */

  function attachHookToIframe(ifr){ /* L189 */
    if(!ifr) return; /* L190 */
    const cb=function(){ try{ hookEmbed(ifr.contentWindow.document); }catch(_){} }; /* L191 */
    if(ifr.contentWindow && (ifr.contentDocument && (ifr.contentDocument.readyState==='complete' || ifr.contentDocument.readyState==='interactive'))){ /* L192 */
      cb(); /* L193 */
    }else{ /* L194 */
      ifr.addEventListener('load', cb, {once:false}); /* L195 */
    } /* L196 */
  } /* L197 */

  attachHookToIframe(document.getElementById('mapFrame')); /* L198 */
  attachHookToIframe(document.getElementById('view-browser-map')); /* L199 */

  function activateTab(btn, doPush){ /* L200 */
    if(!btn) return; /* L201 */
    document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); }); /* L202 */
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); }); /* L203 */
    btn.classList.add('active'); /* L204 */
    const vid=btn.dataset.view; if(vid){ const v=document.getElementById(vid); if(v) v.classList.add('active'); } /* L205 */
    requestAnimationFrame(function(){ /* L206 */
      snapIntoView(btn); /* L207 */
    }); /* L208 */
  } /* L209 */

  function nextLabel(){ /* L210 */
    const list=Array.from(document.querySelectorAll('.tab')).filter(function(n){ return !n.classList.contains('add') && !['tab-map','tab-browser'].includes(n.id); }); /* L211 */
    return 'Ai('+(list.length+1)+')'; /* L212 */
  } /* L213 */

  function startContentHTML(viewId){ /* L214 */
    return '<div class="start" aria-label="リンク集">' + /* L215 */
      '<div class="card">' + /* L216 */
        '<div style="font-size:24px">🗺️</div>' + /* L217 */
        '<div class="title">このタブで地図を表示</div>' + /* L218 */
        '<div class="row"><button class="btn" data-action="open-map-here" data-view="' + viewId + '" type="button">地図を表示</button></div>' + /* L219 */
      '</div>' + /* L220 */
      '<div class="card">' + /* L221 */
        '<div style="font-size:24px">🧠</div>' + /* L222 */
        '<div class="title">Gemini</div>' + /* L223 */
        '<div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>' + /* L224 */
        '<div class="url">https://gemini.google.com/</div>' + /* L225 */
      '</div>' + /* L226 */
      '<div class="card">' + /* L227 */
        '<div style="font-size:24px">💬</div>' + /* L228 */
        '<div class="title">ChatGPT</div>' + /* L229 */
        '<div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>' + /* L230 */
        '<div class="url">https://chatgpt.com/</div>' + /* L231 */
      '</div>' + /* L232 */
      '<div class="muted">※ リンクは新しいブラウザタブで開きます。本アプリは残ります。</div>' + /* L233 */
    '</div>' + /* L234 */
    '<iframe class="tabmap" id="' + viewId + '-map" title="タブ内地図" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe>'; /* L235 */
  } /* L236 */

  let tabCounter=0; /* L237 */
  function makeIds(){ /* L238 */
    tabCounter++; /* L239 */
    const id='user-'+Date.now()+'-'+tabCounter; /* L240 */
    return {tabId:'tab-'+id, viewId:'view-'+id}; /* L241 */
  } /* L242 */

  function persistTabs(){ /* L243 */
    const nodes=Array.from(document.querySelectorAll('.tab')).filter(function(n){ return !n.classList.contains('add') && !['tab-map','tab-browser'].includes(n.id); }); /* L244 */
    const data=nodes.map(function(n){ /* L245 */
      const viewId=n.dataset.view; /* L246 */
      const mapEl=document.getElementById(viewId+'-map'); /* L247 */
      const mapOpened=!!(mapEl && mapEl.classList.contains('active') && mapEl.src.includes('embed.html')); /* L248 */
      const label=(n.querySelector('.label') && n.querySelector('.label').textContent) || n.textContent; /* L249 */
      return {tabId:n.id, viewId:viewId, label:label, mapOpened:mapOpened}; /* L250 */
    }); /* L251 */
    const aiMap=document.getElementById('view-browser-map'); /* L252 */
    const aiOpened=!!(aiMap && aiMap.classList.contains('active') && aiMap.src.includes('embed.html')); /* L253 */
    try{ sessionStorage.setItem(SKEY_TABS, JSON.stringify({tabs:data, aiOpened:aiOpened})); }catch(_){} /* L254 */
  } /* L255 */

  function addTabFromState(state){ /* L256 */
    const addBtn=document.getElementById('tab-add'); /* L257 */
    const tab=document.createElement('div'); /* L258 */
    tab.className='tab'; tab.id=state.tabId; tab.dataset.view=state.viewId; /* L259 */
    tab.innerHTML='<span class="label"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="#25d07a"/><circle cx="9" cy="10" r="1.5" fill="#fff"/><circle cx="15" cy="10" r="1.5" fill="#fff"/><path d="M8 14c0 2.2 1.8 4 4 4s4-1.8 4-4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>'+state.label+'</span><span class="close" data-close="'+state.viewId+'" aria-label="閉じる">×</span>'; /* L260 */
    addBtn.parentNode.insertBefore(tab, addBtn); /* L261 */

    const view=document.createElement('div'); /* L262 */
    view.className='view'; view.id=state.viewId; view.innerHTML=startContentHTML(state.viewId); /* L263 */
    document.getElementById('app').appendChild(view); /* L264 */

    const m=document.getElementById(state.viewId+'-map'); attachHookToIframe(m); /* L265 */
    if(state.mapOpened){ /* L266 */
      if(m){ m.classList.add('active'); } /* L267 */
      const s=view.querySelector('.start'); if(s) s.style.display='none'; /* L268 */
    } /* L269 */
  } /* L270 */

  function restoreTabs(){ /* L271 */
    try{ /* L272 */
      const saved=JSON.parse(sessionStorage.getItem(SKEY_TABS)||'{"tabs":[]}'); /* L273 */
      (saved.tabs||[]).forEach(addTabFromState); /* L274 */
      if(saved.aiOpened){ /* L275 */
        const ai=document.getElementById('view-browser-map'); /* L276 */
        const s=document.querySelector('#view-browser .start'); /* L277 */
        if(ai){ ai.classList.add('active'); } /* L278 */
        if(s) s.style.display='none'; /* L279 */
      } /* L280 */
    }catch(_){} /* L281 */
  } /* L282 */

  function addTab(label){ /* L283 */
    const ids=makeIds(); /* L284 */
    const tabId=ids.tabId; /* L285 */
    const viewId=ids.viewId; /* L286 */
    const addBtn=document.getElementById('tab-add'); /* L287 */
    const tab=document.createElement('div'); /* L288 */
    tab.className='tab'; tab.id=tabId; tab.dataset.view=viewId; /* L289 */
    tab.innerHTML='<span class="label"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="#25d07a"/><circle cx="9" cy="10" r="1.5" fill="#fff"/><circle cx="15" cy="10" r="1.5" fill="#fff"/><path d="M8 14c0 2.2 1.8 4 4 4s4-1.8 4-4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>'+label+'</span><span class="close" data-close="'+viewId+'" aria-label="閉じる">×</span>'; /* L290 */
    addBtn.parentNode.insertBefore(tab, addBtn); /* L291 */
    tab.classList.add('flash'); setTimeout(function(){ tab.classList.remove('flash'); },200); /* L292 */

    const view=document.createElement('div'); /* L293 */
    view.className='view'; view.id=viewId; view.innerHTML=startContentHTML(viewId); /* L294 */
    document.getElementById('app').appendChild(view); /* L295 */
    attachHookToIframe(document.getElementById(viewId+'-map')); /* L296 */

    activateTab(tab);  /* L297 */
    persistTabs();  /* L298 */
    requestAnimationFrame(function(){ /* L299 */
      snapIntoView(addBtn); /* L300 */
    }); /* L301 */
  } /* L302 */

  function closeTab(viewId){ /* L303 */
    const tab=Array.from(document.querySelectorAll('.tab')).find(function(t){ return t.dataset.view===viewId; }); /* L304 */
    const view=document.getElementById(viewId); /* L305 */
    if(!tab||!view) return; /* L306 */
    const isActive=tab.classList.contains('active'); /* L307 */
    tab.remove(); view.remove(); persistTabs(); /* L308 */
