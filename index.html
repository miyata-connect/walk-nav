<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WalkNav v2.3 (Debugged)</title>
<style>
:root{
  --glass:rgba(20,28,44,.7);
  --glass-strong:rgba(16,22,36,.85);
  --stroke:rgba(255,255,255,.14);
  --text:#eaf2ff;
  --muted:#a7b8ce;
  --primary:#5fb1ff;
  --ok:#25d07a;
  --danger:#ff6565;
  --accent:#64d2ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a1321;color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.app{position:relative;height:100dvh;overflow:hidden}
#map{position:absolute;inset:0;display:none}

/* コントロールパネル */
.control-panel{
  position:absolute;
  left:10px;
  right:10px;
  bottom:0;
  z-index:500;
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:16px 16px 0 0;
  backdrop-filter:blur(14px);
  padding:16px;
  transition:transform .3s;
}
.control-panel.hidden{transform:translateY(100%)}

.panel-toggle{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  border:none;
  border-radius:12px;
  padding:14px 40px;
  color:#000;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  z-index:490;
  display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.panel-toggle.show{display:block}

/* ローディング画面 */
.loading-screen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#0a1321 0%,#1e2a3e 100%);
  z-index:10000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:opacity .3s,visibility .3s;
}
.loading-screen.fade-out{opacity:0;visibility:hidden}
.loading-logo{font-size:48px;margin-bottom:20px;animation:pulse 2s infinite}
.loading-text{font-size:18px;color:var(--muted)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.8}}

/* 現在地パネル */
.location-panel{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:12px;
  padding:12px;
  backdrop-filter:blur(10px);
  z-index:400;
  display:none;
}
.location-text{
  font-size:13px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px;
}
.location-text .icon{font-size:16px}

/* 検索パネル */
.search-panel{
  position:absolute;
  top:60px;
  left:10px;
  right:10px;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:12px;
  padding:12px;
  backdrop-filter:blur(14px);
  z-index:450;
  display:none;
}
.search-box{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.search-input{
  flex:1;
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:10px;
  color:var(--text);
  font-size:14px;
}
.search-input::placeholder{color:var(--muted)}
.search-button{
  background:var(--primary);
  border:none;
  border-radius:8px;
  padding:10px 16px;
  color:#000;
  font-weight:600;
  cursor:pointer;
  transition:transform .1s;
}
.search-button:active{transform:scale(.95)}

.search-options{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.search-range{
  display:flex;
  gap:4px;
}
.range-btn{
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:6px;
  padding:6px 12px;
  color:var(--text);
  font-size:13px;
  cursor:pointer;
  transition:background .2s;
}
.range-btn.active{
  background:var(--primary);
  color:#000;
  font-weight:600;
}

.search-results{
  max-height:300px;
  overflow-y:auto;
}
.result-item{
  background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:10px;
  margin-bottom:8px;
  cursor:pointer;
  transition:background .2s;
}
.result-item:hover{background:rgba(255,255,255,.08)}
.result-name{
  font-size:14px;
  font-weight:600;
  margin-bottom:4px;
}
.result-address{
  font-size:12px;
  color:var(--muted);
  margin-bottom:4px;
}
.result-distance{
  font-size:11px;
  color:var(--accent);
}

/* ルートパネル */
.route-panel{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:12px;
  padding:16px;
  backdrop-filter:blur(14px);
  z-index:480;
  display:none;
}
.route-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.route-stats{
  display:flex;
  gap:20px;
}
.route-stat{
  display:flex;
  flex-direction:column;
}
.stat-label{
  font-size:11px;
  color:var(--muted);
  margin-bottom:2px;
}
.stat-value{
  font-size:20px;
  font-weight:700;
  color:var(--accent);
}
.route-end-btn{
  background:var(--danger);
  border:none;
  border-radius:8px;
  padding:10px 20px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* FABボタン */
.fab-container{
  position:fixed;
  right:16px;
  bottom:80px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:470;
}
.fab-btn{
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform .2s;
  color:var(--text);
  font-size:24px;
}
.fab-btn:active{transform:scale(.9)}
.fab-btn.active{
  background:var(--ok);
  color:#000;
}
.fab-btn.processing{
  animation:pulse 1s infinite;
}

/* コントロールボタングリッド */
.control-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}
.control-btn{
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:12px;
  color:var(--text);
  font-size:13px;
  cursor:pointer;
  transition:background .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.control-btn:hover{background:rgba(255,255,255,.12)}
.control-btn:active{transform:scale(.98)}
.control-btn.active{
  background:var(--primary);
  color:#000;
  font-weight:600;
}
.control-btn.disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* 保存地点パネル */
.saved-panel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:600;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.saved-content{
  width:100%;
  max-width:400px;
  max-height:80vh;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:16px;
  backdrop-filter:blur(14px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.saved-header{
  padding:16px;
  border-bottom:1px solid var(--stroke);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.saved-title{
  font-size:18px;
  font-weight:600;
}
.saved-close{
  width:32px;
  height:32px;
  background:rgba(255,255,255,.1);
  border:1px solid var(--stroke);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
}
.saved-list{
  flex:1;
  overflow-y:auto;
  padding:12px;
}
.saved-item{
  background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:12px;
  margin-bottom:8px;
}
.saved-item-header{
  display:flex;
  justify-content:space-between;
  align-items:start;
  margin-bottom:8px;
}
.saved-name{
  font-size:15px;
  font-weight:600;
  flex:1;
}
.saved-coords{
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
}
.saved-actions{
  display:flex;
  gap:6px;
}
.saved-btn{
  padding:6px 12px;
  border-radius:6px;
  border:none;
  font-size:12px;
  cursor:pointer;
  transition:transform .1s;
}
.saved-btn:active{transform:scale(.95)}
.saved-btn.nav{
  background:var(--primary);
  color:#000;
  font-weight:600;
}
.saved-btn.edit{
  background:rgba(255,255,255,.1);
  color:var(--text);
  border:1px solid var(--stroke);
}
.saved-btn.delete{
  background:var(--danger);
  color:#fff;
}
.saved-empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}

/* カスタムダイアログ */
.custom-dialog{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:700;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.dialog-content{
  width:100%;
  max-width:360px;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:16px;
  backdrop-filter:blur(14px);
  padding:20px;
}
.dialog-title{
  font-size:16px;
  font-weight:600;
  margin-bottom:16px;
}
.dialog-input{
  width:100%;
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:10px;
  color:var(--text);
  font-size:14px;
  margin-bottom:16px;
}
.dialog-input::placeholder{color:var(--muted)}
.dialog-buttons{
  display:flex;
  gap:8px;
  justify-content:flex-end;
}
.dialog-btn{
  padding:8px 16px;
  border-radius:8px;
  border:none;
  font-size:14px;
  cursor:pointer;
  font-weight:600;
}
.dialog-btn.cancel{
  background:rgba(255,255,255,.1);
  color:var(--text);
  border:1px solid var(--stroke);
}
.dialog-btn.confirm{
  background:var(--primary);
  color:#000;
}

/* トースト通知 */
.toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:12px 20px;
  backdrop-filter:blur(10px);
  z-index:800;
  opacity:0;
  transition:transform .3s,opacity .3s;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
.toast.success{border-color:var(--ok);color:var(--ok)}
.toast.error{border-color:var(--danger);color:var(--danger)}

/* デバッグパネル */
.debug-panel{
  position:fixed;
  top:10px;
  right:10px;
  background:var(--glass-strong);
  border:1px solid var(--accent);
  border-radius:8px;
  padding:10px;
  max-width:300px;
  max-height:200px;
  overflow-y:auto;
  z-index:9000;
  display:none;
  font-size:11px;
  font-family:monospace;
}
.debug-panel.show{display:block}
.debug-log{
  margin-bottom:4px;
  color:var(--muted);
}
.debug-log.error{color:var(--danger)}
.debug-log.success{color:var(--ok)}
.debug-log.info{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <!-- 地図 -->
  <div id="map"></div>
  
  <!-- ローディング画面 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-logo">🚶</div>
    <div class="loading-text">WalkNav v2.3 (Debug)</div>
  </div>
  
  <!-- デバッグパネル -->
  <div class="debug-panel" id="debugPanel">
    <div style="font-weight:bold;margin-bottom:8px;color:var(--accent)">🐛 Debug Log</div>
    <div id="debugLog"></div>
  </div>
  
  <!-- 現在地表示パネル -->
  <div class="location-panel" id="locationPanel">
    <div class="location-text">
      <span class="icon">📍</span>
      <span id="locationText">現在地を取得中...</span>
    </div>
  </div>
  
  <!-- 検索パネル -->
  <div class="search-panel" id="searchPanel">
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="場所を検索...">
      <button class="search-button" onclick="searchPlaces()">検索</button>
    </div>
    <div class="search-options">
      <div class="search-range">
        <button class="range-btn active" data-range="10000" onclick="setSearchRange(this)">10km</button>
        <button class="range-btn" data-range="20000" onclick="setSearchRange(this)">20km</button>
      </div>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
  
  <!-- ルート案内パネル -->
  <div class="route-panel" id="routePanel">
    <div class="route-info">
      <div class="route-stats">
        <div class="route-stat">
          <div class="stat-label">距離</div>
          <div class="stat-value" id="routeDistance">--</div>
        </div>
        <div class="route-stat">
          <div class="stat-label">徒歩</div>
          <div class="stat-value" id="routeDuration">--</div>
        </div>
      </div>
      <button class="route-end-btn" onclick="endRoute()">ルート終了</button>
    </div>
  </div>
  
  <!-- FABボタン群 -->
  <div class="fab-container" id="fabContainer">
    <button class="fab-btn" id="fabSearchToggle" onclick="toggleSearchPanel()" title="検索パネル">🔍</button>
    <button class="fab-btn" id="fabPointSelect" onclick="togglePointSelect()" title="ポイント選択">📍</button>
    <button class="fab-btn" id="fabSaved" onclick="showSavedLocations()" title="保存地点">⭐</button>
    <button class="fab-btn" id="fabDebug" onclick="toggleDebug()" title="デバッグ">🐛</button>
  </div>
  
  <!-- コントロールパネル -->
  <div class="control-panel" id="controlPanel">
    <div class="control-grid">
      <button class="control-btn" id="btnTextSearch" onclick="focusSearch()">
        <span>🔤</span>テキスト検索
      </button>
      <button class="control-btn" id="btnVoiceSearch" onclick="startVoiceSearch()">
        <span>🎤</span>音声検索
      </button>
      <button class="control-btn" id="btnSaveLocation" onclick="saveCurrentLocation()">
        <span>📌</span>現在地登録
      </button>
      <button class="control-btn" id="btnEditSaved" onclick="showSavedLocations(true)">
        <span>✏️</span>登録地点修正
      </button>
    </div>
  </div>
  
  <!-- パネル開閉ボタン -->
  <button class="panel-toggle" id="panelToggle" onclick="togglePanel()">コントロール</button>
  
  <!-- 保存地点パネル -->
  <div class="saved-panel" id="savedPanel">
    <div class="saved-content">
      <div class="saved-header">
        <div class="saved-title" id="savedTitle">保存地点</div>
        <div class="saved-close" onclick="closeSavedPanel()">✕</div>
      </div>
      <div class="saved-list" id="savedList"></div>
    </div>
  </div>
  
  <!-- カスタムダイアログ -->
  <div class="custom-dialog" id="customDialog">
    <div class="dialog-content">
      <div class="dialog-title" id="dialogTitle">タイトル</div>
      <input type="text" class="dialog-input" id="dialogInput" placeholder="入力してください">
      <div class="dialog-buttons">
        <button class="dialog-btn cancel" onclick="closeDialog()">キャンセル</button>
        <button class="dialog-btn confirm" id="dialogConfirm">OK</button>
      </div>
    </div>
  </div>
  
  <!-- トースト通知 -->
  <div class="toast" id="toast"></div>
</div>

<script>
// デバッグログ機能
const DEBUG_ENABLED = true;
const debugLogs = [];

function debugLog(message, type = 'info') {
  const timestamp = new Date().toLocaleTimeString('ja-JP');
  const log = `[${timestamp}] ${message}`;
  debugLogs.push({message: log, type});
  
  if (DEBUG_ENABLED) {
    console.log(`[DEBUG] ${log}`);
  }
  
  updateDebugPanel();
}

function updateDebugPanel() {
  const panel = document.getElementById('debugLog');
  if (panel) {
    panel.innerHTML = debugLogs.slice(-20).reverse().map(log => 
      `<div class="debug-log ${log.type}">${log.message}</div>`
    ).join('');
  }
}

function toggleDebug() {
  const panel = document.getElementById('debugPanel');
  const btn = document.getElementById('fabDebug');
  
  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    btn.classList.remove('active');
  } else {
    panel.classList.add('show');
    btn.classList.add('active');
  }
}

// グローバル変数
let map = null;
let currentPos = null;
let currentMarker = null;
let destMarker = null;
let searchMarkers = [];
let routePolyline = null;
let searchRange = 10000;
let pointSearchMode = false;
let searchPoint = null;
let searchPointMarker = null;
let savedLocations = [];
let isEditMode = false;

// Worker URL
const WORKER_URL = 'https://ors-proxy.miyata-connect-jp.workers.dev';

// APIキー(固定)
const API_KEY = 'AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk';

// 初期化
window.onload = () => {
  debugLog('アプリケーション起動', 'success');
  loadSavedLocations();
  loadGoogleMapsAPI();
};

// Google Maps API読み込み
function loadGoogleMapsAPI() {
  debugLog('Google Maps API読み込み開始');
  
  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places,marker,geometry&callback=initMapCallback&language=ja`;
  script.async = true;
  script.defer = true;
  
  script.onerror = function() {
    debugLog('Google Maps API読み込みエラー', 'error');
    showToast('地図の読み込みに失敗しました', 'error');
    setTimeout(() => {
      document.getElementById('loadingScreen').classList.add('fade-out');
    }, 500);
  };
  
  script.onload = function() {
    debugLog('Google Maps APIスクリプト読み込み完了', 'success');
  };
  
  document.head.appendChild(script);
}

// API認証エラーハンドリング
window.gm_authFailure = function() {
  debugLog('Google Maps API認証失敗', 'error');
  showToast('API認証エラー（続行します）', 'error');
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('fade-out');
  }, 500);
};

// Google Maps初期化コールバック
function initMapCallback() {
  debugLog('地図初期化コールバック実行', 'info');
  try {
    initMap();
    debugLog('地図初期化成功', 'success');
  } catch (error) {
    debugLog(`地図初期化エラー: ${error.message}`, 'error');
    showToast('地図の初期化に失敗しました', 'error');
  }
  
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('fade-out');
  }, 1500);
}

// Google Maps初期化
function initMap() {
  const defaultPos = {lat: 35.681236, lng: 139.767125};
  debugLog(`デフォルト位置: ${defaultPos.lat}, ${defaultPos.lng}`);
  
  try {
    map = new google.maps.Map(document.getElementById('map'), {
      center: defaultPos,
      zoom: 17,
      mapId: 'DEMO_MAP_ID',
      gestureHandling: 'greedy',
      clickableIcons: true,
      disableDefaultUI: true,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false
    });
    
    document.getElementById('map').style.display = 'block';
    debugLog('地図表示完了', 'success');
  } catch (error) {
    debugLog(`地図作成エラー: ${error.message}`, 'error');
    throw error;
  }
  
  // 現在地取得
  if (navigator.geolocation) {
    debugLog('位置情報取得開始');
    
    navigator.geolocation.getCurrentPosition(
      position => {
        currentPos = {
          lat: position.coords.latitude,
          lng: position.coords.longitude
        };
        
        debugLog(`現在地取得成功: ${currentPos.lat}, ${currentPos.lng}`, 'success');
        
        try {
          map.setCenter(currentPos);
          createCurrentLocationMarker();
          updateLocationAddress();
        } catch (error) {
          debugLog(`現在地マーカー作成エラー: ${error.message}`, 'error');
        }
      },
      error => {
        debugLog(`位置情報取得エラー: ${error.message} (code: ${error.code})`, 'error');
        showToast('位置情報を取得できませんでした', 'error');
        
        // デフォルト位置を現在地として設定
        currentPos = defaultPos;
        debugLog('デフォルト位置を使用');
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  } else {
    debugLog('位置情報APIが利用できません', 'error');
    showToast('位置情報APIに対応していません', 'error');
  }
  
  // 地図タップイベント
  map.addListener('click', (e) => {
    if (pointSearchMode) {
      debugLog(`地図タップ: ${e.latLng.lat()}, ${e.latLng.lng()}`);
      setSearchPoint(e.latLng.lat(), e.latLng.lng());
    }
  });
}

// 検索地点設定
function setSearchPoint(lat, lng) {
  searchPoint = {lat, lng};
  debugLog(`検索地点設定: ${lat}, ${lng}`);
  
  // 既存マーカー削除
  if (searchPointMarker) {
    removeMarker(searchPointMarker);
  }
  
  try {
    if (google.maps.marker && google.maps.marker.AdvancedMarkerElement) {
      const pin = document.createElement('div');
      pin.style.width = '28px';
      pin.style.height = '28px';
      pin.style.borderRadius = '50%';
      pin.style.background = '#ff6565';
      pin.style.border = '3px solid #fff';
      pin.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
      
      searchPointMarker = new google.maps.marker.AdvancedMarkerElement({
        map,
        position: {lat, lng},
        content: pin,
        zIndex: 900
      });
    } else {
      searchPointMarker = new google.maps.Marker({
        map,
        position: {lat, lng},
        zIndex: 900,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 12,
          fillColor: '#ff6565',
          fillOpacity: 0.8,
          strokeColor: '#fff',
          strokeWeight: 3
        }
      });
    }
    
    debugLog('検索地点マーカー作成完了', 'success');

    debugLog(`検索地点マーカーエラー: ${error.message}`, 'error');
  }
  
  // 地名取得
  const geocoder = new google.maps.Geocoder();
  geocoder.geocode({location: {lat, lng}}, (results, status) => {
    if (status === 'OK' && results && results[0]) {
      const address = results[0].formatted_address.replace('日本、', '');
      showToast(`検索地点: ${address.substring(0, 30)}...`, 'success');
    }
  });
  
  map.panTo({lat, lng});

// マーカー削除（統一関数）
function removeMarker(marker) {
  if (!marker) return;
  
  try {
    if (marker.map !== undefined) {
      marker.map = null;
    } else if (marker.setMap) {
      marker.setMap(null);
    }
  } catch (error) {
    debugLog(`マーカー削除エラー: ${error.message}`, 'error');
  }
}

function setSearchRange(btn) {

// 場所検索
async function searchPlaces() {
  const query = document.getElementById('searchInput').value.trim();
  
  if (!query) {
    showToast('検索キーワードを入力してください', 'error');
    return;
  }
  
  debugLog(`検索開始: "${query}"`);
  
  const searchOrigin = searchPoint || currentPos;
  if (!searchOrigin) {
    showToast('現在地が取得できていません', 'error');
    debugLog('検索起点が未設定', 'error');
    return;
  }
  
  clearSearchMarkers();
  
  try {
    debugLog(`Worker URL: ${WORKER_URL}/places:searchText`);
    
    const response = await fetch(`${WORKER_URL}/places:searchText`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        textQuery: query,
        locationBias: {
          circle: {
            center: {
              latitude: searchOrigin.lat,
              longitude: searchOrigin.lng
            },
            radius: searchRange
          }
        },
        maxResultCount: 10,
        languageCode: 'ja'
      })
    });
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    const data = await response.json();
    debugLog(`検索結果: ${data.places ? data.places.length : 0}件`, 'success');
    
    if (data.places && data.places.length > 0) {
      displaySearchResults(data.places, searchOrigin);
    } else {
      showToast('検索結果が見つかりませんでした', 'error');
      debugLog('検索結果なし');
    }
  } catch (error) {
    debugLog(`検索エラー: ${error.message}`, 'error');
    showToast('検索中にエラーが発生しました', 'error');
  }
}

// 検索結果表示
function displaySearchResults(places, origin) {
  debugLog('検索結果表示開始');
  
  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = '';
  
  // 距離計算とソート
  places.forEach(place => {
    if (place.location) {
      place.distance = calculateDistance(
        origin.lat, origin.lng,
        place.location.latitude, place.location.longitude
      );
    }
  });
  
  places.sort((a, b) => (a.distance || 999999) - (b.distance || 999999));
  
  // 上位5件を表示
  const displayCount = Math.min(5, places.length);
  debugLog(`表示件数: ${displayCount}`);
  
  places.slice(0, 5).forEach((place, index) => {
    if (place.location && place.distance <= 10000) {
      createSearchMarker(place, index);
      createResultItem(place, index, resultsDiv);
    }
  });
  
  // 地図を調整
  if (searchMarkers.length > 0) {
    const bounds = new google.maps.LatLngBounds();
    bounds.extend(new google.maps.LatLng(origin.lat, origin.lng));
    searchMarkers.forEach(marker => {
      const pos = marker.position || (marker.getPosition && marker.getPosition());
      if (pos) bounds.extend(pos);
    });
    map.fitBounds(bounds);
    debugLog('地図範囲を調整', 'success');
  }
}

// 検索結果アイテム作成
function createResultItem(place, index, container) {
  const item = document.createElement('div');
  item.className = 'result-item';
  item.innerHTML = `
    <div class="result-name">${index + 1}. ${place.displayName?.text || '名称不明'}</div>
    <div class="result-address">${place.formattedAddress || '住所不明'}</div>
    <div class="result-distance">約${Math.round(place.distance)}m</div>
  `;
  
  item.onclick = () => startNavigation(place);

// ナビゲーション開始
async function startNavigation(place) {
  if (!place.location) {
    debugLog('目的地の位置情報がありません', 'error');
    return;
  }
  
  debugLog(`ナビ開始: ${place.displayName?.text || '目的地'}`);
  
  const origin = searchPoint || currentPos;
  if (!origin) {
    showToast('現在地が取得できていません', 'error');
    debugLog('ナビ開始失敗: 現在地未設定', 'error');
    return;
  }
  
  // 目的地マーカー設置
  if (destMarker) {
    removeMarker(destMarker);
  }
  
  try {
    if (google.maps.marker && google.maps.marker.AdvancedMarkerElement) {
      const pin = document.createElement('div');
      pin.style.width = '32px';
      pin.style.height = '32px';
      pin.style.background = '#ff6565';
      pin.style.border = '3px solid #fff';
      pin.style.borderRadius = '50%';
      pin.style.display = 'flex';
      pin.style.alignItems = 'center';
      pin.style.justifyContent = 'center';
      pin.style.color = '#fff';
      pin.style.fontSize = '18px';
      pin.textContent = '🎯';
      
      destMarker = new google.maps.marker.AdvancedMarkerElement({
        map,
        position: {
          lat: place.location.latitude,
          lng: place.location.longitude
        },
        content: pin,
        title: place.displayName?.text || '目的地'
      });
    } else {
      destMarker = new google.maps.Marker({
        map,
        position: {
          lat: place.location.latitude,
          lng: place.location.longitude
        },
        title: place.displayName?.text || '目的地',
        icon: {
          path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW,
          scale: 8,
          fillColor: '#ff6565',
          fillOpacity: 1,
          strokeColor: '#fff',
          strokeWeight: 3
        }
      });
    }
    
    debugLog('目的地マーカー作成完了', 'success');
  } catch (error) {
    debugLog(`目的地マーカーエラー: ${error.message}`, 'error');
  }
  
  // ルート取得
  try {
    debugLog('ルート取得開始');
    
    const response = await fetch(`${WORKER_URL}/directions`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        origin: `${origin.lat},${origin.lng}`,
        destination: `${place.location.latitude},${place.location.longitude}`,
        mode: 'walking',
        language: 'ja'
      })
    });
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    const data = await response.json();
    
    if (data.routes && data.routes[0]) {
      const route = data.routes[0];
      drawRoute(route);
      
      // ルート情報表示
      const leg = route.legs[0];
      document.getElementById('routeDistance').textContent = leg.distance.text;
      document.getElementById('routeDuration').textContent = leg.duration.text;
      document.getElementById('routePanel').style.display = 'block';
      
      debugLog(`ルート取得成功: ${leg.distance.text}, ${leg.duration.text}`, 'success');
      
      // パネルを隠す
      document.getElementById('searchPanel').style.display = 'none';
      document.getElementById('fabSearchToggle').classList.remove('active');
      clearSearchMarkers();
    } else {
      throw new Error('ルートデータが不正');
    }
  } catch (error) {
    debugLog(`ルート取得エラー: ${error.message}`, 'error');
    showToast('ルート取得に失敗しました', 'error');
  }
}

// ルート描画
function drawRoute(route) {
  if (routePolyline) {
    routePolyline.setMap(null);
  }
  
  try {
    const path = google.maps.geometry.encoding.decodePath(route.overview_polyline.points);
    
    routePolyline = new google.maps.Polyline({
      path: path,
      geodesic: true,
      strokeColor: '#5fb1ff',
      strokeOpacity: 0.8,
      strokeWeight: 5,
      map: map
    });
    
    debugLog('ルート描画完了', 'success');
    
    // カメラワーク
    const bounds = new google.maps.LatLngBounds();
    path.forEach(point => bounds.extend(point));
    map.fitBounds(bounds);
    
    setTimeout(() => {
      map.setZoom(18);
      const destPos = destMarker.position || (destMarker.getPosition && destMarker.getPosition());
      if (destPos) map.panTo(destPos);
    }, 2000);
    
    setTimeout(() => {
      const origin = searchPoint || currentPos;
      map.panTo(new google.maps.LatLng(origin.lat, origin.lng));
    }, 4000);
  } catch (error) {
    debugLog(`ルート描画エラー: ${error.message}`, 'error');
  }
}

// ルート終了
function endRoute() {
  debugLog('ルート終了');
  
  if (routePolyline) {
    routePolyline.setMap(null);
    routePolyline = null;
  }
  
  if (destMarker) {
    removeMarker(destMarker);
    destMarker = null;
  }
  
  clearSearchMarkers();
  document.getElementById('routePanel').style.display = 'none';
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('searchInput').value = '';
  
  if (currentPos) {
    map.setCenter(currentPos);
    map.setZoom(17);
  }
}

// 検索マーカークリア
function clearSearchMarkers() {
  debugLog(`検索マーカークリア: ${searchMarkers.length}個`);
  searchMarkers.forEach(marker => removeMarker(marker));
  searchMarkers = [];
}

// 検索フォーカス
function focusSearch() {
  document.getElementById('searchPanel').style.display = 'block';
  document.getElementById('fabSearchToggle').classList.add('active');
  document.getElementById('searchInput').focus();
  debugLog('検索入力フォーカス');
}

// 音声検索
function startVoiceSearch() {
  if (!('webkitSpeechRecognition' in window)) {
    showToast('音声認識はこのブラウザでサポートされていません', 'error');
    debugLog('音声認識API未対応', 'error');
    return;
  }
  
  debugLog('音声検索開始');
  
  const recognition = new webkitSpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = false;
  recognition.interimResults = false;
  
  recognition.onstart = () => {
    showToast('🎤 音声入力中...', 'success');
    debugLog('音声認識開始');
  };
  
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    debugLog(`音声認識結果: "${transcript}"`, 'success');
    document.getElementById('searchInput').value = transcript;
    document.getElementById('searchPanel').style.display = 'block';
    document.getElementById('fabSearchToggle').classList.add('active');
    searchPlaces();
  };
  
  recognition.onerror = (event) => {
    debugLog(`音声認識エラー: ${event.error}`, 'error');
    showToast('音声認識エラー', 'error');
  };
  
  recognition.start();
}

// 現在地登録
function saveCurrentLocation() {
  if (!currentPos) {
    showToast('現在地が取得できていません', 'error');
    debugLog('現在地未設定のため登録不可', 'error');
    return;
  }
  
  debugLog('現在地登録開始');
  
  const geocoder = new google.maps.Geocoder();
  geocoder.geocode({location: currentPos}, (results, status) => {
    let defaultName = '現在地';
    if (status === 'OK' && results && results[0]) {
      defaultName = results[0].formatted_address.replace('日本、', '').substring(0, 30);
    }
    
    showDialog('現在地点登録', defaultName, (name) => {
      if (name) {
        savedLocations.push({
          name: name,
          lat: currentPos.lat,
          lng: currentPos.lng,
          timestamp: Date.now()
        });
        saveSavedLocations();
        showToast('地点を登録しました', 'success');
        debugLog(`地点登録: ${name}`, 'success');
      }
    });
  });
}

// LocalStorage保存
function saveSavedLocations() {
  try {
    localStorage.setItem('walkNavSavedLocations', JSON.stringify(savedLocations));
    debugLog(`保存地点を保存: ${savedLocations.length}件`, 'success');
  } catch (error) {
    debugLog(`LocalStorage保存エラー: ${error.message}`, 'error');
    showToast('保存に失敗しました', 'error');
  }
}

// LocalStorage読込
function loadSavedLocations() {
  try {
    const saved = localStorage.getItem('walkNavSavedLocations');
    if (saved) {
      savedLocations = JSON.parse(saved);
      debugLog(`保存地点を読込: ${savedLocations.length}件`, 'success');
    }
  } catch (error) {
    debugLog(`LocalStorage読込エラー: ${error.message}`, 'error');
    savedLocations = [];
  }
}

// 保存地点表示
function showSavedLocations(editMode = false) {
  isEditMode = editMode;
  debugLog(`保存地点パネル表示: ${editMode ? '編集' : '通常'}モード`);
  
  const panel = document.getElementById('savedPanel');
  const title = document.getElementById('savedTitle');
  const list = document.getElementById('savedList');
  
  title.textContent = editMode ? '登録地点修正' : '保存地点';
  list.innerHTML = '';
  
  if (savedLocations.length === 0) {
    list.innerHTML = '<div class="saved-empty">保存された地点がありません</div>';
  } else {
    savedLocations.forEach((location, index) => {
      const item = document.createElement('div');
      item.className = 'saved-item';
      
      const header = document.createElement('div');
      header.className = 'saved-item-header';
      
      const name = document.createElement('div');
      name.className = 'saved-name';
      name.textContent = `${index + 1}. ${location.name}`;
      header.appendChild(name);
      
      item.appendChild(header);
      
      const coords = document.createElement('div');
      coords.className = 'saved-coords';
      coords.textContent = `緯度: ${location.lat.toFixed(6)}, 経度: ${location.lng.toFixed(6)}`;
      item.appendChild(coords);
      
      const actions = document.createElement('div');
      actions.className = 'saved-actions';
      
      if (editMode) {
        const editBtn = document.createElement('button');
        editBtn.className = 'saved-btn edit';
        editBtn.textContent = '名称変更';
        editBtn.onclick = () => editLocation(index);
        actions.appendChild(editBtn);
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'saved-btn delete';
        deleteBtn.textContent = '削除';
        deleteBtn.onclick = () => deleteLocation(index);
        actions.appendChild(deleteBtn);
      } else {
        const navBtn = document.createElement('button');
        navBtn.className = 'saved-btn nav';
        navBtn.textContent = 'ナビ開始';
        navBtn.onclick = () => navigateToSaved(location);
        actions.appendChild(navBtn);
      }
      
      item.appendChild(actions);
      list.appendChild(item);
    });
  }
  
  panel.style.display = 'flex';
}

// 保存地点へナビゲーション
function navigateToSaved(location) {
  debugLog(`保存地点からナビ開始: ${location.name}`);
  closeSavedPanel();
  
  const place = {
    location: {
      latitude: location.lat,
      longitude: location.lng
    },
    displayName: {
      text: location.name
    }
  };
  
  startNavigation(place);
}

// 地点名編集
function editLocation(index) {
  const location = savedLocations[index];
  debugLog(`地点名編集: ${location.name}`);
  
  showDialog('地点名を変更', location.name, (newName) => {
    if (newName && newName !== location.name) {
      savedLocations[index].name = newName;
      saveSavedLocations();
      showSavedLocations(true);
      showToast('地点名を変更しました', 'success');
      debugLog(`地点名変更: ${location.name} → ${newName}`, 'success');
    }
  });
}

// 地点削除
function deleteLocation(index) {
  const location = savedLocations[index];
  
  if (confirm(`「${location.name}」を削除しますか?`)) {
    debugLog(`地点削除: ${location.name}`);
    savedLocations.splice(index, 1);
    saveSavedLocations();
    showSavedLocations(true);
    showToast('地点を削除しました', 'success');
  }
}

// 保存地点パネル閉じる
function closeSavedPanel() {
  document.getElementById('savedPanel').style.display = 'none';
  debugLog('保存地点パネルを閉じた');
}

// カスタムダイアログ表示
function showDialog(title, defaultValue, callback) {
  debugLog(`ダイアログ表示: ${title}`);
  
  const dialog = document.getElementById('customDialog');
  const dialogTitle = document.getElementById('dialogTitle');
  const dialogInput = document.getElementById('dialogInput');
  const dialogConfirm = document.getElementById('dialogConfirm');
  
  dialogTitle.textContent = title;
  dialogInput.value = defaultValue;
  
  dialogConfirm.onclick = () => {
    const value = dialogInput.value.trim();
    if (value) {
      closeDialog();
      callback(value);
    }
  };
  
  // Enterキーでも確定
  dialogInput.onkeypress = (e) => {
    if (e.key === 'Enter') {
      dialogConfirm.click();
    }
  };
  
  dialog.style.display = 'flex';
  setTimeout(() => {
    dialogInput.select();
    dialogInput.focus();
  }, 100);
}

// ダイアログ閉じる
function closeDialog() {
  document.getElementById('customDialog').style.display = 'none';
  debugLog('ダイアログを閉じた');
}

// パネル切替
function togglePanel() {
  const panel = document.getElementById('controlPanel');
  const toggle = document.getElementById('panelToggle');
  
  if (panel.classList.contains('hidden')) {
    panel.classList.remove('hidden');
    toggle.classList.remove('show');
    debugLog('コントロールパネルを表示');
  } else {
    panel.classList.add('hidden');
    toggle.classList.add('show');
    debugLog('コントロールパネルを非表示');
  }
}

// トースト表示
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  
  debugLog(`トースト: ${message} (${type})`);
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

// 距離計算
function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000; // 地球の半径(m)
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  
  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  
  return R * c;
}

// イベントリスナー設定
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', setupEventListeners);
} else {
  setupEventListeners();
}

function setupEventListeners() {
  debugLog('イベントリスナー設定');
  
  // Enterキーで検索
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchPlaces();
      }
    });
  }
  
  // ESCキーでダイアログを閉じる
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeDialog();
      closeSavedPanel();
      
      const debugPanel = document.getElementById('debugPanel');
      if (debugPanel.classList.contains('show')) {
        toggleDebug();
      }
    }
  });
}
