<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>WalkNav App</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body id="appBody">

  <div id="map"></div>

  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <p>起動中...</p>
  </div>

  <div id="fabStack" class="fab-container">
    <button id="btnSearch" class="fab-btn" aria-label="検索パネルを開く">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
  </div>

  <div id="searchPanel" class="panel-sheet">
    
    <div class="panel-tabs">
      <button data-panel-tab="search" class="active">操作</button>
      <button data-panel-tab="nav">案内</button>
      <button disabled>設定</button>
    </div>

    <div id="tabPaneSearch" class="tab-pane active">
      <div class="panel-header">
        <h2>近くを検索 (<span id="radiusLabel">10km</span> / 5件)</h2>
      </div>

      <div class="filter-row">
        <div class="radius-group">
          <button id="r10" class="radius-btn active">10km</button>
          <button id="r20" class="radius-btn">20km</button>
          <button id="r30" class="radius-btn">30km</button>
        </div>
        <button id="btnPointSearch" class="point-btn">
          <span class="icon">📍</span> ポイント選択
        </button>
      </div>

      <div class="info-row">
         <div class="info-col">
           <div id="locAddress" class="address-text">現在地取得中...</div>
           <span id="locCoords" class="coords-text">---</span>
         </div>
      </div>
      <div id="pointAddressBlock" class="info-row" style="display:none; border-top:1px solid #444; padding-top:4px; margin-top:4px;">
         <div class="info-col">
           <span style="color:#ff6565; font-size:11px;">選択地点:</span>
           <div id="pointAddress" class="address-text">---</div>
           <span id="pointCoords" class="coords-text">---</span>
         </div>
      </div>

      <div class="action-row">
        <button id="btnLocatePanel" class="action-btn">現在地登録</button>
        <button class="action-btn" disabled>登録地修正</button>
      </div>

      <div class="search-box-container">
        <div class="search-input-wrapper">
          <div class="google-icon">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          </div>
          <input type="text" id="q" placeholder="店舗名・電話番号・住所・座標など" enterkeyhint="search">
          <button id="btnSearchIcon" class="icon-btn" aria-label="検索実行">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="icon-btn" aria-label="音声検索(ダミー)">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <div class="bottom-actions">
        <button id="btnReset" class="danger-btn">リセット</button>
        <button id="btnCurrentLoc" class="primary-btn" onclick="acquireLocation()">現在地</button>
        <button id="btnClosePanel" class="secondary-btn">閉じる</button>
      </div>

      <div id="results" class="results-list"></div>
    </div>

    <div id="tabPaneNav" class="tab-pane">
      <div id="routeInfoSection" style="display:none;">
        <h2 id="destinationName" style="border-bottom:1px solid #444; padding-bottom:8px; margin-bottom:10px;">目的地</h2>
        <div class="route-summary">
          <div class="summary-item">
             <span class="label">距離</span>
             <span id="routeDistance" class="val">-- km</span>
          </div>
          <div class="summary-item">
             <span class="label">時間</span>
             <span id="routeTime" class="val">-- 分</span>
          </div>
        </div>
      </div>

      <div id="instructionsSection" class="instructions-list">
        <div id="navPanelInstructions"></div>
      </div>

      <div id="routeControlSection" class="bottom-actions" style="display:none; margin-top:15px;">
        <button id="btnStopRoute" class="danger-btn full-width">案内終了</button>
      </div>
    </div>

  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBuX-4y1Cgl6jdKcHZWWlsoosDWK_RGqF0&libraries=places,marker,geometry&callback=initMap&language=ja" async defer></script>
  
  <script src="app.js"></script>
</body>
</html>
