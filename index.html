<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — タブ内で地図／Gemini・ChatGPTはリンク</title> <!-- L006 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='30'%20fill='%232563eb'/%3E%3Cpath%20d='M32%2012c-7%200-12%205-12%2012%200%209%2012%2020%2012%2020s12-11%2012-20c0-7-5-12-12-12zm0%2017a5%205%200%20110-10%205%205%200%20010%2010z'%20fill='%23ffffff'/%3E%3C/svg%3E" /> <!-- L007: favicon をピクトグラムSVGの data URL に変更 -->
  <style> /* L008 */
    :root{ --bar:56px; --barW:60px; --hit:44px; } /* L009 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L010 */
    body{background:#f8fafc;} /* L011 */
    #app{position:relative;width:100%;height:100dvh;overflow:hidden;} /* L012 */

    .topbar{position:absolute;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:9999;} /* L013 */
    .tabs-container{display:flex;gap:6px;flex:1 1 auto;align-items:center;overflow:hidden;} /* L014 */
    .tabs-scroll{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1 1 auto;} /* L015 */
    .tabs-scroll::-webkit-scrollbar{display:none;} /* L016 */

    .tab{display:flex;flex-direction:row;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;cursor:pointer;user-select:none;max-width:38vw;white-space:normal;overflow-wrap:anywhere;} /* L017 */
    #app.pos-left .tab,#app.pos-right .tab{max-width:calc(var(--barW) - 12px);flex-direction:column;align-items:center;} /* L018 */
    .tab .label{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;width:100%;gap:2px;} /* L019 */
    .tab .label > span{display:block;text-align:center;} /* L020 */
    .tab .label svg{display:block;margin:0 auto;} /* L021 */
    .tab .close{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:10px;font-size:14px;background:#f3f4f6;color:#374151;margin-left:auto;margin-top:4px;} /* L022 */
    .tab .close:hover{background:#e5e7eb} /* L023 */
    .tab.active{border-color:#2563eb;color:#fff;background:#2563eb;} /* L024 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;align-items:center;} /* L025 */
    .tab.flash{transition:background-color .2s, box-shadow .2s;background:#eef2ff;box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L026 */

    #app.pos-top .tab, #app.pos-bottom .tab{flex-direction:row;align-items:center;max-width:none;padding:6px 10px;} /* L027 */
    #app.pos-top .tab .label, #app.pos-bottom .tab .label{white-space:nowrap;} /* L028 */

    .view{position:absolute;top:var(--bar);left:0;right:0;bottom:0;display:none;z-index:0;} /* L029 */
    .view.active{display:block;} /* L030 */

    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L031 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;display:block;} /* L032 */

    .start{position:absolute;inset:0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:flex-start;background:#f8fafc;z-index:1;} /* L033 */
    .card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:14px;background:#fff;min-height:120px;text-decoration:none;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.06);} /* L034 */
    .card .title{margin-top:6px;font-size:13px;color:#374151;} /* L035 */
    .card .url{margin-top:8px;font-size:12px;color:#6b7280;word-break:break-all;padding:0 10px;text-align:center;} /* L036 */
    .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;} /* L037 */
    .btn,.alink{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#111;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:12px;text-decoration:none;} /* L038 */
    .muted{color:#6b7280;font-size:12px;margin-top:8px;text-align:center;grid-column:1/-1;} /* L039 */
    .tabmap{position:absolute;inset:0;border:0;background:#e5e7eb;display:none;width:100%;height:100%;z-index:2;} /* L040 */
    .tabmap.active{display:block;} /* L041 */

    #app.pos-bottom .topbar{inset:auto 0 0 0;height:var(--bar);box-shadow:0 -8px 24px rgba(0,0,0,.08);} /* L042 */
    #app.pos-bottom .view{top:0;bottom:var(--bar);} /* L043 */

    #app.pos-left .topbar{inset:0 auto 0 0;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-start;box-shadow:8px 0 24px rgba(0,0,0,.08);} /* L044 */
    #app.pos-left .view{top:0;left:var(--barW);right:0;bottom:0;} /* L045 */
    #app.pos-left .tabs-container{flex-direction:column;width:100%;} /* L046 */
    #app.pos-left .tabs-scroll{flex-direction:column;overflow-y:auto;overflow-x:hidden;width:100%;} /* L047 */

    #app.pos-right .topbar{inset:0 0 0 auto;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-end;box-shadow:-8px 0 24px rgba(0,0,0,.08);} /* L048 */
    #app.pos-right .view{top:0;left:0;right:var(--barW);bottom:0;} /* L049 */
    #app.pos-right .tabs-container{flex-direction:column;width:100%;} /* L050 */
    #app.pos-right .tabs-scroll{flex-direction:column;overflow-y:auto;overflow-x:hidden;width:100%;} /* L051 */

    .navtools{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:0 0 auto;} /* L052 */
    .navbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--hit);height:var(--hit);border-radius:12px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;user-select:none;transition:transform .06s ease;} /* L053 */
    .navbtn:active{transform:translateY(1px);} /* L054 */
    .navbtn svg{width:28px;height:28px;display:block;} /* L055 */
    .navbtn.home{background:#e0f2fe;border-color:#bae6fd;} .navbtn.home svg path{fill:#2563eb;} /* L056 */
    .navbtn.back{background:#fef3c7;border-color:#fde68a;} .navbtn.back svg path{fill:#b45309;} /* L057 */
    .navbtn.forward{background:#dcfce7;border-color:#bbf7d0;} .navbtn.forward svg path{fill:#16a34a;} /* L058 */

    #app.pos-left .navbtn, #app.pos-right .navbtn{width:52px;height:52px;border-radius:14px;margin-left:auto;margin-right:auto;} /* L059 */
    #app.pos-left .navtools,#app.pos-right .navtools{flex-direction:column;gap:10px;margin-top:auto;margin-bottom:6px;} /* L060 */
    #app.pos-left .topbar,#app.pos-right .topbar{padding-top:6px;padding-bottom:6px;} /* L061 */
  </style> <!-- L062 -->
</head> <!-- L063 -->
<body> <!-- L064 -->
<div id="app" class="pos-left"> <!-- L065 -->
  <div class="topbar"> <!-- L066 -->
    <div class="tabs-container"> <!-- L067 -->
      <!-- 固定：地図タブ --> <!-- L068 -->
      <div class="tab active" data-view="view-map" id="tab-map"> <!-- L069 -->
        <span class="label"> <!-- L070 -->
          <svg viewBox="0 0 24 24" width="24" height="24"> <!-- L071 -->
            <path fill="#62b5ff" d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/> <!-- L072 -->
          </svg> <!-- L073 -->
          地図 <!-- L074 -->
        </span> <!-- L075 -->
      </div> <!-- L076 -->

      <!-- スクロール可能：Aiタブ領域 --> <!-- L077 -->
      <div class="tabs-scroll" id="tabs"> <!-- L078 -->
        <div class="tab" data-view="view-browser" id="tab-browser"> <!-- L079 -->
          <span class="label"> <!-- L080 -->
            <svg viewBox="0 0 24 24" width="24" height="24"> <!-- L081 -->
              <circle cx="12" cy="12" r="10" fill="#25d07a"/> <!-- L082 -->
              <circle cx="9" cy="10" r="1.5" fill="#fff"/> <!-- L083 -->
              <circle cx="15" cy="10" r="1.5" fill="#fff"/> <!-- L084 -->
              <path d="M8 14c0 2.2 1.8 4 4 4s4-1.8 4-4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/> <!-- L085 -->
            </svg> <!-- L086 -->
            <span>Ai</span> <!-- L087 -->
          </span> <!-- L088 -->
        </div> <!-- L089 -->
        <div class="tab add" id="tab-add" title="新しいタブを作成"> <!-- L090 -->
          <span class="label"> <!-- L091 -->
            <svg viewBox="0 0 24 24" width="24" height="24"> <!-- L092 -->
              <path fill="#64748b" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/> <!-- L093 -->
            </svg> <!-- L094 -->
          </span> <!-- L095 -->
        </div> <!-- L096 -->
      </div> <!-- L097 -->

      <!-- 固定：設定タブ --> <!-- L098 -->
      <div class="tab" data-view="view-settings" id="tab-settings"> <!-- L099 -->
        <span class="label"> <!-- L100 -->
          <svg viewBox="0 0 24 24" width="24" height="24"> <!-- L101 -->
            <path fill="#94a3b8" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/> <!-- L102 -->
          </svg> <!-- L103 -->
          設定 <!-- L104 -->
        </span> <!-- L105 -->
      </div> <!-- L106 -->
    </div> <!-- L107 -->

    <div class="navtools" aria-label="ナビゲーション操作"> <!-- L108 -->
      <button class="navbtn home" id="btn-home" aria-label="ホーム"> <!-- L109 -->
        <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v10h-5V15H11v6H6V11H3z"/></svg> <!-- L110 -->
      </button> <!-- L111 -->
      <button class="navbtn back" id="btn-back" aria-label="戻る"> <!-- L112 -->
        <svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5V7z"/></svg> <!-- L113 -->
      </button> <!-- L114 -->
      <button class="navbtn forward" id="btn-forward" aria-label="進む"> <!-- L115 -->
        <svg viewBox="0 0 24 24"><path d="M10 7l5 5-5 5V7z"/></svg> <!-- L116 -->
      </button> <!-- L117 -->
    </div> <!-- L118 -->
  </div> <!-- L119 -->

  <!-- 地図タブ --> <!-- L120 -->
  <div class="view active" id="view-map"> <!-- L121 -->
    <div id="mapHost"> <!-- L122 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L123 -->
    </div> <!-- L124 -->
  </div> <!-- L125 -->

  <!-- Aiブラウザ --> <!-- L126 -->
  <div class="view" id="view-browser"> <!-- L127 -->
    <div class="start" aria-label="スタート"> <!-- L128 -->
      <div class="card"> <!-- L129 -->
        <div style="font-size:24px">🗺️</div> <!-- L130 -->
        <div class="title">このタブで地図を表示</div> <!-- L131 -->
        <div class="row"><button class="btn" data-action="open-map-here" data-view="view-browser" type="button">地図を表示</button></div> <!-- L132 -->
      </div> <!-- L133 -->
      <div class="card"> <!-- L134 -->
        <div style="font-size:24px">🧠</div> <!-- L135 -->
        <div class="title">Gemini</div> <!-- L136 -->
        <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div> <!-- L137 -->
        <div class="url">https://gemini.google.com/</div> <!-- L138 -->
      </div> <!-- L139 -->
      <div class="card"> <!-- L140 -->
        <div style="font-size:24px">💬</div> <!-- L141 -->
        <div class="title">ChatGPT</div> <!-- L142 -->
        <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div> <!-- L143 -->
        <div class="url">https://chatgpt.com/</div> <!-- L144 -->
      </div> <!-- L145 -->
      <div class="muted">※ リンクは新しいブラウザタブで開きます（本アプリは残ります）。『地図を表示』はこのタブ内だけに適用。</div> <!-- L146 -->
    </div> <!-- L147 -->
    <iframe class="tabmap" id="view-browser-map" title="Aiタブ内地図" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L148 -->
  </div> <!-- L149 -->

  <!-- 設定 --> <!-- L150 -->
  <div class="view" id="view-settings"> <!-- L151 -->
    <div class="start" aria-label="設定"> <!-- L152 -->
      <div class="card" style="grid-column:span 3"> <!-- L153 -->
        <div class="title">設定：タブの場所（上／下／右／左）</div> <!-- L154 -->
        <div class="row" id="posControls" role="radiogroup"> <!-- L155 -->
          <label class="btn"><input type="radio" name="tabpos" value="top" style="display:none">上</label> <!-- L156 -->
          <label class="btn"><input type="radio" name="tabpos" value="bottom" style="display:none">下</label> <!-- L157 -->
          <label class="btn"><input type="radio" name="tabpos" value="left" style="display:none">左</label> <!-- L158 -->
          <label class="btn"><input type="radio" name="tabpos" value="right" style="display:none">右</label> <!-- L159 -->
        </div> <!-- L160 -->
        <div class="muted">選択は自動保存され、次回起動時に復元されます。</div> <!-- L161 -->
      </div> <!-- L162 -->
      <div class="card" style="grid-column:span 3"><div class="title">状態：未ログイン／通知未設定／v=tab-local-map+links</div></div> <!-- L163 -->
    </div> <!-- L164 -->
  </div> <!-- L165 -->
</div> <!-- L166 -->

<script> /* L167 */
(function(){ /* L168 */
  const appEl=document.getElementById('app'); /* L169 */
  const tabsContainer=document.querySelector('.tabs-container'); /* L170 */
  const SKEY_TABS='WN_TABS_LOCAL_V2'; /* L171 */
  const SKEY_POS ='WN_TAB_POS_V1'; /* L172 */

  function snapIntoView(el){  /* L173 */
    if(!el) return; /* L174 */
    try{  /* L175 */
      const isVertical = appEl.classList.contains('pos-left') || appEl.classList.contains('pos-right'); /* L176 */
      el.scrollIntoView({ /* L177 */
        block: isVertical ? 'nearest' : 'nearest', /* L178 */
        inline: isVertical ? 'nearest' : 'end', /* L179 */
        behavior: 'smooth' /* L180 */
      });  /* L181 */
    }catch(_){ /* L182 */
      try{ /* L183 */
        el.scrollIntoView({block:'nearest',inline:'end'}); /* L184 */
      }catch(_){/*noop*/} /* L185 */
    }  /* L186 */
  } /* L187 */

  function enforceOrder(doc){ /* L188 */
    try{ /* L189 */
      const all = Array.from(doc.querySelectorAll('div,li,p,span')); /* L190 */
      const addr = all.find(n => /〒\s*\d{3}-?\d{4}/.test(n.textContent||'')); /* L191 */
      const coord= all.find(n => /(緯度|経度)/.test(n.textContent||'')); /* L192 */
      if(!addr || !coord) return; /* L193 */

      const t = (coord.textContent||'').trim(); /* L194 */
      if(!/^現在地：/.test(t)){ /* L195 */
        coord.textContent = '現在地：' + t.replace(/^(.*?：)?\s*/,''); /* L196 */
      } /* L197 */

      if (addr.compareDocumentPosition(coord) & Node.DOCUMENT_POSITION_FOLLOWING){ /* L198 */
      } else { /* L199 */
        coord.parentNode.insertBefore(addr, coord); /* L200 */
      } /* L201 */
    }catch(_){/*noop*/} /* L202 */
  } /* L203 */

  function hookEmbed(doc){ /* L204 */
    if(!doc) return; /* L205 */
    let timer=null; /* L206 */
    const debounced=()=>{ clearTimeout(timer); timer=setTimeout(()=>enforceOrder(doc), 50); }; /* L207 */
    debounced(); /* L208 */
    try{ /* L209 */
      const mo=new MutationObserver(debounced); /* L210 */
      mo.observe(doc.body||doc,{childList:true,subtree:true,characterData:true}); /* L211 */
    }catch(_){/*noop*/} /* L212 */
  } /* L213 */

  function attachHookToIframe(ifr){ /* L214 */
    if(!ifr) return; /* L215 */
    const cb=()=>{ try{ hookEmbed(ifr.contentWindow.document); }catch(_){ } }; /* L216 */
    if(ifr.contentWindow && (ifr.contentDocument?.readyState==='complete' || ifr.contentDocument?.readyState==='interactive')){ /* L217 */
      cb(); /* L218 */
    }else{ /* L219 */
      ifr.addEventListener('load', cb, {once:false}); /* L220 */
    } /* L221 */
  } /* L222 */

  attachHookToIframe(document.getElementById('mapFrame')); /* L223 */
  attachHookToIframe(document.getElementById('view-browser-map')); /* L224 */

  function activateTab(btn, doPush=true){ /* L225 */
    if(!btn) return; /* L226 */
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); /* L227 */
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); /* L228 */
    btn.classList.add('active'); /* L229 */
    const vid=btn.dataset.view; if(vid){ const v=document.getElementById(vid); if(v) v.classList.add('active'); } /* L230 */
    requestAnimationFrame(()=>{ /* L231 */
      snapIntoView(btn); /* L232 */
    }); /* L233 */
  } /* L234 */

  function nextLabel(){ /* L235 */
    const list=[...document.querySelectorAll('.tab')].filter(n=>!n.classList.contains('add') && !['tab-map','tab-browser','tab-settings'].includes(n.id)); /* L236 */
    return 'Ai('+(list.length+1)+')'; /* L237 */
  } /* L238 */

  function startContentHTML(viewId){ /* L239 */
    return ` /* L240 */
      <div class="start" aria-label="リンク集"> /* L241 */
        <div class="card"> /* L242 */
          <div style="font-size:24px">🗺️</div> /* L243 */
          <div class="title">このタブで地図を表示</div> /* L244 */
          <div class="row"><button class="btn" data-action="open-map-here" data-view="${viewId}" type="button">地図を表示</button></div> /* L245 */
        </div> /* L246 */
        <div class="card"> /* L247 */
          <div style="font-size:24px">🧠</div> /* L248 */
          <div class="title">Gemini</div> /* L249 */
          <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div> /* L250 */
          <div class="url">https://gemini.google.com/</div> /* L251 */
        </div> /* L252 */
        <div class="card"> /* L253 */
          <div style="font-size:24px">💬</div> /* L254 */
          <div class="title">ChatGPT</div> /* L255 */
          <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div> /* L256 */
          <div class="url">https://chatgpt.com/</div> /* L257 */
        </div> /* L258 */
        <div class="muted">※ リンクは新しいブラウザタブで開きます。本アプリは残ります。</div> /* L259 */
      </div> /* L260 */
      <iframe class="tabmap" id="${viewId}-map" title="タブ内地図" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> /* L261 */
    `; /* L262 */
  } /* L263 */

  let tabCounter=0; /* L264 */
  function makeIds(){ /* L265 */
    tabCounter++; /* L266 */
    const id=`user-${Date.now()}-${tabCounter}`; /* L267 */
    return {tabId:`tab-${id}`, viewId:`view-${id}`}; /* L268 */
  } /* L269 */

  function persistTabs(){ /* L270 */
    const nodes=[...document.querySelectorAll('.tab')].filter(n=>!n.classList.contains('add') && !['tab-map','tab-browser','tab-settings'].includes(n.id)); /* L271 */
    const data=nodes.map(n=>{ /* L272 */
      const viewId=n.dataset.view; /* L273 */
      const mapEl=document.getElementById(viewId+'-map'); /* L274 */
      const mapOpened=!!(mapEl && mapEl.classList.contains('active') && mapEl.src.includes('embed.html')); /* L275 */
      const label=n.querySelector('.label')?.textContent || n.textContent; /* L276 */
      return {tabId:n.id, viewId, label, mapOpened}; /* L277 */
    }); /* L278 */
    const aiMap=document.getElementById('view-browser-map'); /* L279 */
    const aiOpened=!!(aiMap && aiMap.classList.contains('active') && aiMap.src.includes('embed.html')); /* L280 */
    try{ sessionStorage.setItem(SKEY_TABS, JSON.stringify({tabs:data, aiOpened})); }catch(_){/*noop*/} /* L281 */
  } /* L282 */

  function addTabFromState(state){ /* L283 */
    const addBtn=document.getElementById('tab-add'); /* L284 */
    const tab=document.createElement('div'); /* L285 */
    tab.className='tab'; tab.id=state.tabId; tab.dataset.view=state.viewId; /* L286 */
