<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>WalkNav</title>
<meta name="description" content="WalkNav - 近くを検索 & ルート案内" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link rel="stylesheet" href="app.css?v=5" />
</head>
<body id="appBody">
<div class="app">
<div id="map" aria-label="地図"></div>
<section class="panel" id="searchPanel">
<div class="panel-tabs-header" id="panelTabHeader">
<div class="tab-btn active" data-panel-tab="search" tabindex="0">操作</div>
<div class="tab-btn" data-panel-tab="nav" tabindex="0">案内</div>
<div class="tab-btn" data-panel-tab="settings" tabindex="0">設定</div>
</div>
<div class="panel-tabs-body">
<div class="tab-pane active" id="tabPaneSearch">
<h2>近くを検索 (<span id="radiusLabel">10km</span> / 5件)</h2>
<div class="row" style="margin-bottom:8px;justify-content:center;flex-wrap:wrap;">
<button class="chip active" id="r10">10km</button>
<button class="chip" id="r20">20km</button>
<button class="chip" id="r30">30km</button>
<button class="chip" id="btnPointSearch" style="flex-grow:1;min-width:120px;">📍 ポイント選択</button>
</div>
<div class="row" id="pointAddressBlock" style="font-size:13px;color:var(--muted);margin-bottom:8px;display:none;background:rgba(0,0,0,0.2);padding:8px;border-radius:8px;">
<div id="pointAddress" style="line-height:1.5;color:var(--warning);">ポイント：取得中...</div>
<div id="pointCoords" style="line-height:1.5;"></div>
</div>
<div class="row" style="margin-bottom:8px;">
<button class="btn" id="btnSaveLocation" style="flex:1">現在地登録</button>
<button class="btn" id="btnEditLocation" style="flex:1">登録地修正</button>
</div>
<div class="row" style="margin-bottom:8px;">
<div class="input-wrapper">
<span class="icon icon-g">
<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;">
<path d="M21.35,11.1H12.18V13.83H18.69C18.36,17.64 15.19,19.27 12.19,19.27C8.36,19.27 5.03,16.21 5.03,12.39C5.03,8.57 8.36,5.5 12.19,5.5C14.73,5.5 16.29,6.5 17.2,7.38L19.31,5.26C17.38,3.53 15.05,2.5 12.19,2.5C6.92,2.5 2.73,6.63 2.73,12.39C2.73,18.15 6.92,22.28 12.19,22.28C17.63,22.28 21.64,18.5 21.64,12.61C21.64,12 21.52,11.55 21.35,11.1Z"></path>
</svg>
</span>
<input id="q" class="input" placeholder="店舗名・電話番号・住所・座標など" autocomplete="off" style="flex:1" />
<span class="icon icon-search" id="btnSearchIcon">
<svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor;">
<path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
</svg>
</span>
<span class="icon icon-mic" id="btnVoiceIcon">
<svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor;">
<path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c1.66 1.66 3 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"></path>
</svg>
</span>
</div>
</div>
<div id="results" class="results" style="display:none"></div>
<div class="row" style="margin-top:12px;gap:8px;">
<button id="btnReset" class="btn danger" style="flex:1">リセット</button>
<button id="btnLocatePanel" class="btn" style="flex:1;background:var(--primary);color:#fff;font-weight:600;">現在地</button>
<button id="btnClosePanel" class="btn" style="flex:1;background:rgba(255,255,255,0.1);">閉じる</button>
</div>
</div><div class="tab-pane" id="tabPaneNav">
<div class="nav-section">
<div class="nav-section-title">📍 現在地</div>
<div id="locCoords" style="font-size:13px;color:var(--muted);">現在地：取得中...</div>
<div id="locAddress" style="font-size:14px;color:var(--text);font-weight:600;margin-top:4px;"></div>
</div>
<div class="nav-section">
<div class="nav-section-title">🌤️ 天気予報</div>
<div id="navWeather" class="nav-weather">
<div class="weather-item"><span>3H</span><span id="weather3h">--</span></div>
<div class="weather-item"><span>6H</span><span id="weather6h">--</span></div>
<div class="weather-item"><span>9H</span><span id="weather9h">--</span></div>
</div>
</div>
<div class="nav-section" id="routeInfoSection" style="display:none;">
<div class="nav-section-title">🚶 ルート情報</div>
<div style="margin-bottom:8px;">
<div style="font-size:14px;color:var(--text);margin-bottom:4px;">
<span id="destinationName">目的地</span>へのルート
</div>
<div>
<span id="routeDistance" class="route-distance">--</span>
<span id="routeTime" class="route-time" style="margin-left:8px;font-size:14px;color:var(--muted);">徒歩 --分</span>
</div>
</div>
<button id="btnExportText" class="btn" style="width:100%;background:rgba(255,255,255,0.1);margin-bottom:8px;">📋 道順をコピー</button>
</div>
<div class="nav-section" id="incidentSection" style="display:none;">
<div class="nav-section-title">⚠️ インシデント</div>
<div id="incidentText" style="font-size:13px;color:var(--warning);line-height:1.6;"></div>
</div>
<div class="nav-section" id="instructionsSection" style="display:none;">
<div class="nav-section-title">🧭 道順</div>
<div id="navPanelInstructions" class="nav-instructions-list"></div>
</div>
</div><div class="tab-pane" id="tabPaneSettings">
<h2>設定</h2>
<div class="map-mode-section">
<div class="map-mode-label">地図表示モード</div>
<div class="map-mode-buttons">
<button id="btnMapPhoto" class="map-mode-btn" data-mode="photo">写真</button>
<button id="btnMapRoadmap" class="map-mode-btn active" data-mode="roadmap">地図</button>
<button id="btnMap3D" class="map-mode-btn" data-mode="3d">3D</button>
</div>
</div>
<div style="margin-bottom:16px;">
<div style="font-size:14px;color:var(--muted);margin-bottom:8px;">タブの位置</div>
<div class="row" style="justify-content:center;flex-wrap:wrap;gap:8px;">
<button class="chip" data-pos="top">上</button>
<button class="chip" data-pos="bottom">下</button>
<button class="chip" data-pos="left">左</button>
<button class="chip active" data-pos="right">右</button>
</div>
</div>
<div id="routeControlSection" style="display:none;margin-bottom:16px;">
<div style="font-size:14px;color:var(--muted);margin-bottom:8px;">ルート操作</div>
<div class="row" style="flex-direction:column;gap:8px;">
<button id="btnPauseSettings" class="btn" style="width:100%;">⏸️ 一時停止</button>
<button id="btnRerouteSettings" class="btn" style="width:100%;background:rgba(98,181,255,0.2);color:var(--primary);">🔄 リルート</button>
<button id="btnStopRoute" class="btn danger" style="width:100%;">🛑 ルート終了</button>
</div>
</div>
<div style="font-size:12px;color:var(--muted);text-align:center;margin-top:16px;">v=embedless-walknav</div>
</div>
</div></section>
<div class="fab-stack" id="fabStack">
<div class="fab" id="btnSearch">検索パネル</div>
<div class="fab" id="btnLocate">現在地</div>
<div class="fab" id="btnDestination" style="display:none">目的地</div>
</div>
<div class="loading" id="loading">
<div style="text-align:center">
<div style="font-size:24px;margin-bottom:16px;">📍 現在地取得中</div>
<div style="font-size:16px;opacity:0.8;">しばらくお待ちください...</div>
</div>
</div>
</div><script src="app.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBuX-4y1Cgl6jdKcHZWWlsoosDWK_RGqF0&v=weekly&libraries=marker,geometry&loading=async" async defer></script>
<script>
(function () {
function initPanelTabs() {
var tabButtons = document.querySelectorAll('[data-panel-tab]');
var paneSearch = document.getElementById('tabPaneSearch');
var paneNav = document.getElementById('tabPaneNav');
var paneSettings = document.getElementById('tabPaneSettings');
var posButtons = document.querySelectorAll('[data-pos]');
function setMode(mode) {
var isNav = (mode === 'nav');
var isSettings = (mode === 'settings');
if (paneSearch) paneSearch.classList.toggle('active', !isNav && !isSettings);
if (paneNav) paneNav.classList.toggle('active', isNav);
if (paneSettings) paneSettings.classList.toggle('active', isSettings);
var target = isSettings ? 'settings' : (isNav ? 'nav' : 'search');
for (var i = 0; i < tabButtons.length; i++) {
var b = tabButtons[i];
if (!b || !b.getAttribute) continue;
var tab = b.getAttribute('data-panel-tab');
b.classList.toggle('active', tab === target);
}
}
for (var i = 0; i < tabButtons.length; i++) {
(function (btn) {
if (!btn) return;
btn.addEventListener('click', function () {
var mode = btn.getAttribute('data-panel-tab') || 'search';
setMode(mode);
});
btn.addEventListener('keydown', function (e) {
if (e.key === 'Enter' || e.key === ' ') {
var mode = btn.getAttribute('data-panel-tab') || 'search';
setMode(mode);
}
});
})(tabButtons[i]);
}
setMode('search');
for (var j = 0; j < posButtons.length; j++) {
(function (btnPos) {
if (!btnPos) return;
btnPos.addEventListener('click', function () {
for (var k = 0; k < posButtons.length; k++) {
posButtons[k].classList.remove('active');
}
btnPos.classList.add('active');
if (window.parent !== window) {
window.parent.postMessage(
{ type: 'WN_SET_TAB_POS', position: btnPos.getAttribute('data-pos') },
'*'
);
}
});
})(posButtons[j]);
}
window.addEventListener('message', function (e) {
if (e.data && e.data.type === 'WN_CURRENT_TAB_POS') {
var pos = e.data.position || 'right';
for (var m = 0; m < posButtons.length; m++) {
var bpos = posButtons[m];
if (!bpos || !bpos.getAttribute) continue;
bpos.classList.toggle('active', bpos.getAttribute('data-pos') === pos);
}
}
});
if (window.parent !== window) {
window.parent.postMessage({ type: 'WN_REQUEST_TAB_POS' }, '*');
}
}
if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', initPanelTabs);
} else {
initPanelTabs();
}
})();
</script>
</body>
</html>
