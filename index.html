<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — 内部タブ作成固定版</title> <!-- L006 -->
  <style> /* L007 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L008 */
    #app{position:relative;width:100%;height:100%;overflow:hidden;background:#f8fafc;} /* L009 */
    .topbar{position:absolute;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:10;} /* L010 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;} /* L011 */
    .tabs::-webkit-scrollbar{display:none;} /* L012 */
    .tab{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;white-space:nowrap;cursor:pointer;user-select:none;} /* L013 */
    .tab.active{border-color:#2563eb;color:#2563eb;} /* L014 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;} /* L015 */
    .tab.flash{transition:background-color .2s, box-shadow .2s; background:#eef2ff; box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L016 */
    .view{position:absolute;top:52px;left:0;right:0;bottom:0;display:none;} /* L017 */
    .view.active{display:block;} /* L018 */
    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L019 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;} /* L020 */
    .placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:#374151;opacity:.9} /* L021 */
    .placeholder .box{padding:16px 20px;border:1px dashed #cbd5e1;border-radius:14px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.06);font-size:14px;} /* L022 */
  </style> <!-- L023 -->
</head> <!-- L024 -->
<body> <!-- L025 -->
<div id="app"> <!-- L026 -->
  <div class="topbar"> <!-- L027 -->
    <div class="tabs" id="tabs"> <!-- L028 -->
      <div class="tab active" data-view="view-map" id="tab-map">🗺️ 地図</div> <!-- L029 -->
      <div class="tab" data-view="view-browser" id="tab-browser">🤖 Aiブラウザ</div> <!-- L030 -->
      <div class="tab" data-view="view-settings" id="tab-settings">⚙️ 設定</div> <!-- L031 -->
      <div class="tab add" id="tab-add" title="新しいタブを作成">＋</div> <!-- L032 -->
    </div> <!-- L033 -->
  </div> <!-- L034 -->

  <!-- 地図（embed.html を内部iframeで） --> <!-- L035 -->
  <div class="view active" id="view-map"> <!-- L036 -->
    <div id="mapHost"> <!-- L037 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L038 -->
    </div> <!-- L039 -->
  </div> <!-- L040 -->

  <!-- Aiブラウザ（プレースホルダー：外部遷移なし） --> <!-- L041 -->
  <div class="view" id="view-browser"> <!-- L042 -->
    <div class="placeholder"><div class="box">Aiブラウザ：このタブは内部表示のみ（外部ウィンドウは開きません）</div></div> <!-- L043 -->
  </div> <!-- L044 -->

  <!-- 設定（骨子） --> <!-- L045 -->
  <div class="view" id="view-settings"> <!-- L046 -->
    <div class="placeholder"><div class="box">設定：未ログイン／通知未設定／バージョン embed-iframe v1.3</div></div> <!-- L047 -->
  </div> <!-- L048 -->
</div> <!-- L049 -->

<script> /* L050 */
  // ===== タブの基盤 ===== /* L051 */
  const tabsEl=document.getElementById('tabs'); /* L052 */
  function activateTab(btn){ /* L053 */
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); /* L054 */
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); /* L055 */
    btn.classList.add('active'); /* L056 */
    const vid=btn.dataset.view; if(vid) document.getElementById(vid).classList.add('active'); /* L057 */
    const r=btn.getBoundingClientRect(), tr=tabsEl.getBoundingClientRect(); /* L058 */
    if(r.right>tr.right-20){ tabsEl.scrollLeft += (r.right-tr.right)+20; } /* L059 */
    if(r.left<tr.left+20){ tabsEl.scrollLeft -= (tr.left-r.left)+20; } /* L060 */
  } /* L061 */

  // ===== セッション復元 ===== /* L062 */
  const SKEY='WN_TABS_V2'; /* L063 */
  function restoreTabs(){ /* L064 */
    try{ const data=JSON.parse(sessionStorage.getItem(SKEY)||'[]'); data.forEach(addTabFromState); }catch(_){/* noop */} /* L065 */
  } /* L066 */

  // ===== 新規タブ生成（内部のみ・外部ウィンドウ禁止） ===== /* L067 */
  let tabCounter=0; /* L068 */
  function makeIds(){ tabCounter++; const id=`user-${Date.now()}-${tabCounter}`; return {tabId:`tab-${id}`,viewId:`view-${id}`}; } /* L069 */

  function addTab(label){ /* L070 */
    const {tabId,viewId}=makeIds(); /* L071 */
    const addBtn=document.getElementById('tab-add'); /* L072 */

    // タブ要素（内部のみ） /* L073 */
    const tab=document.createElement('div'); /* L074 */
    tab.className='tab'; tab.id=tabId; tab.dataset.view=viewId; tab.textContent=label; /* L075 */
    addBtn.before(tab); /* L076 */
    tab.classList.add('flash'); setTimeout(()=>tab.classList.remove('flash'),180); /* L077 */

    // 対応ビュー（内部プレースホルダー。外部遷移・window.openなし） /* L078 */
    const view=document.createElement('div'); /* L079 */
    view.className='view'; view.id=viewId; /* L080 */
    view.innerHTML=`<div class="placeholder"><div class="box">${label}（内部タブ）</div></div>`; /* L081 */
    document.getElementById('app').appendChild(view); /* L082 */

    // アクティブ化＋保存 /* L083 */
    activateTab(tab); /* L084 */
    persistTabs(); /* L085 */
  } /* L086 */

  function addTabFromState(state){ /* L087 */
    const addBtn=document.getElementById('tab-add'); /* L088 */
    const tab=document.createElement('div'); /* L089 */
    tab.className='tab'; tab.id=state.tabId; tab.dataset.view=state.viewId; tab.textContent=state.label; /* L090 */
    addBtn.before(tab); /* L091 */
    const view=document.createElement('div'); /* L092 */
    view.className='view'; view.id=state.viewId; /* L093 */
    view.innerHTML=`<div class="placeholder"><div class="box">${state.label}（内部タブ）</div></div>`; /* L094 */
    document.getElementById('app').appendChild(view); /* L095 */
  } /* L096 */

  function persistTabs(){ /* L097 */
    const nodes=[...document.querySelectorAll('.tab')].filter(n=>!n.classList.contains('add') && !['tab-map','tab-browser','tab-settings'].includes(n.id)); /* L098 */
    const data=nodes.map(n=>({tabId:n.id, viewId:n.dataset.view, label:n.textContent})); /* L099 */
    try{ sessionStorage.setItem(SKEY, JSON.stringify(data)); }catch(_){/* ignore */} /* L100 */
  } /* L101 */

  // ===== クリック／タッチ／マウスダウンすべて抑止 → 内部タブのみ発火 ===== /* L102 */
  function killExternal(e){ e.preventDefault(); e.stopPropagation(); } /* L103 */
  ['click','touchstart','mousedown'].forEach(ev=>{
    tabsEl.addEventListener(ev,(e)=>{
      const b=e.target.closest('.tab'); if(!b) return;
      // まず外部挙動を完全抑止
      killExternal(e);
      // ＋なら内部タブ作成、既存タブなら内部切替のみ
      if(b.id==='tab-add'){ addTab(`新規タブ ${document.querySelectorAll('.tab').length-2}`); return false; }
      if(b.dataset.view){ activateTab(b); }
      return false;
    }, {passive:false});
  });

  // 初期化
  restoreTabs(); /* L104 */
  activateTab(document.querySelector('.tab.active')||document.getElementById('tab-map')); /* L105 */
</script> <!-- L106 -->
</body> <!-- L107 -->
</html> <!-- L108 -->
