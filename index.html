<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8"> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- L005 -->
  <title>WalkNav — 地図復元</title> <!-- L006 -->
  <style> /* L007 */
    html,body { height:100%; margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif; } /* L008 */
    #app { position:relative; width:100%; height:100%; overflow:hidden; } /* L009 */

    /* 上部タブ（既存デザイン維持） */ /* L010 */
    .topbar { position:absolute; inset:0 0 auto 0; height:52px; display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(255,255,255,0.92); backdrop-filter:saturate(180%) blur(8px); box-shadow:0 8px 24px rgba(0,0,0,.08); z-index:10; } /* L011 */
    .tabs { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; } /* L012 */
    .tabs::-webkit-scrollbar{ display:none; } /* L013 */
    .tab { display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px; border:1px solid transparent; background:#fff; font-size:14px; color:#111; white-space:nowrap; cursor:pointer; } /* L014 */
    .tab.active{ border-color:#2563eb; color:#2563eb; } /* L015 */
    .tab.add{ background:#f8fafc; border:1px dashed #cbd5e1; } /* L016 */

    /* ビュー領域 */ /* L017 */
    .view { position:absolute; top:52px; left:0; right:0; bottom:0; display:none; } /* L018 */
    .view.active{ display:block; } /* L019 */

    /* 地図要素（ズームUIはMaps標準。カスタム+/-は出さない） */ /* L020 */
    #view-map{ background:#e5e7eb; } /* L021 */
    #map { width:100%; height:100%; } /* L022 */

    /* ローディング（現在地取得→描画まで） */ /* L023 */
    .loading { position:absolute; inset:52px 0 0 0; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#fff,rgba(255,255,255,.82)); z-index:9; } /* L024 */
    .spinner{ width:22px; height:22px; border:2px solid #cbd5e1; border-top-color:#2563eb; border-radius:50%; animation:spin 0.9s linear infinite; } /* L025 */
    .loading p{ margin-left:10px; font-size:13px; color:#374151; } /* L026 */
    @keyframes spin{ to{ transform:rotate(360deg);} } /* L027 */

    /* そのほかビュー（骨子だけ保持） */ /* L028 */
    .browser{ width:100%; height:100%; border:0; } /* L029 */
    .settings{ padding:16px; line-height:1.7; } /* L030 */
  </style> <!-- L031 -->
</head> <!-- L032 -->
<body> <!-- L033 -->
<div id="app"> <!-- L034 -->
  <div class="topbar"> <!-- L035 -->
    <div class="tabs" id="tabs"> <!-- L036 -->
      <div class="tab active" data-view="view-map" id="tab-map">🗺️ 地図</div> <!-- L037 -->
      <div class="tab" data-view="view-browser" id="tab-browser">🤖 Aiブラウザ</div> <!-- L038 -->
      <div class="tab" data-view="view-settings" id="tab-settings">⚙️ 設定</div> <!-- L039 -->
      <div class="tab add" id="tab-add">＋</div> <!-- L040 -->
    </div> <!-- L041 -->
  </div> <!-- L042 -->

  <!-- 地図ビュー（最優先で復元） --> <!-- L043 -->
  <div class="view active" id="view-map"> <!-- L044 -->
    <div id="map" aria-label="地図"></div> <!-- L045 -->
    <div id="loading" class="loading" role="status" aria-live="polite"> <!-- L046 -->
      <div class="spinner" aria-hidden="true"></div> <!-- L047 -->
      <p>現在地を取得しています…</p> <!-- L048 -->
    </div> <!-- L049 -->
  </div> <!-- L050 -->

  <!-- Aiブラウザ（骨子） --> <!-- L051 -->
  <div class="view" id="view-browser"> <!-- L052 -->
    <iframe id="webview" class="browser" title="Aiブラウザ"></iframe> <!-- L053 -->
  </div> <!-- L054 -->

  <!-- 設定（骨子） --> <!-- L055 -->
  <div class="view" id="view-settings"> <!-- L056 -->
    <div class="settings"> <!-- L057 -->
      <div>アカウント：未ログイン</div> <!-- L058 -->
      <div>通知：未設定</div> <!-- L059 -->
      <div>バージョン：map-restore v1.0</div> <!-- L060 -->
    </div> <!-- L061 -->
  </div> <!-- L062 -->
</div> <!-- L063 -->

<script> /* L064 */
  // ===== タブ切替（既存踏襲・見た目不変） ===== /* L065 */
  const tabsEl=document.getElementById('tabs'); /* L066 */
  function activateTab(btn){ /* L067 */
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); /* L068 */
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); /* L069 */
    btn.classList.add('active'); /* L070 */
    const vid=btn.dataset.view; if(vid) document.getElementById(vid).classList.add('active'); /* L071 */
  } /* L072 */
  tabsEl.addEventListener('click',(e)=>{ const b=e.target.closest('.tab'); if(!b) return; if(b.id==='tab-add'){/* 次工程で実装 */ return;} activateTab(b); }); /* L073 */

  // ====== 地図復元：現在地の取得が成功してから描画（失敗時だけフォールバック） ====== /* L074 */
  let map; /* L075 */
  const loadingEl=document.getElementById('loading'); /* L076 */
  const FALLBACK={ lat:35.681236, lng:139.767125 }; // 東京駅（失敗時のみ使用） /* L077 */

  // 位置情報の取得（高精度＋タイムアウト） /* L078 */
  function getCurrentPosition(opts){
    return new Promise((resolve,reject)=>{
      if(!navigator.geolocation){ reject(new Error('Geolocation未対応')); return; }
      navigator.geolocation.getCurrentPosition(resolve,reject,{ enableHighAccuracy:true, timeout:8000, maximumAge:0 });
    });
  } /* L079 */

  // Map描画（マーカーは一切出さない＝初期値地点の非表示） /* L080 */
  function drawMap(center){
    map=new google.maps.Map(document.getElementById('map'),{
      center, zoom:16, mapId:'DEMO_MAP_ID', clickableIcons:true, gestureHandling:'greedy'
    });
    // 重要：初期位置にマーカー等は追加しない（非表示の要件） /* L081 */
  } /* L082 */

  // 起動フロー：現在地→成功で描画／失敗で静かにフォールバック中心へ描画（マーカーなし） /* L083 */
  (async function init(){
    try{
      const pos=await getCurrentPosition();
      const center={ lat:pos.coords.latitude, lng:pos.coords.longitude };
      drawMap(center);
    }catch(e){
      drawMap(FALLBACK);
    }finally{
      loadingEl.style.display='none';
    }
  })(); /* L084 */

  // Googleコールバックは空でOK（直上IIFEで描画） /* L085 */
  window.initMap=function(){}; /* L086 */
</script> <!-- L087 -->

<!-- Google Maps JavaScript（Maps JS のみ・提供キー直埋め） --> <!-- L088 -->
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk&callback=initMap"></script> <!-- L089 -->
</body> <!-- L090 -->
</html> <!-- L091 -->
