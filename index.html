<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — 地図タブ（同一オリジンiframe）</title> <!-- L006 -->
  <style> /* L007 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L008 */
    #app{position:relative;width:100%;height:100%;overflow:hidden;background:#f8fafc;} /* L009 */
    .topbar{position:absolute;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:10;} /* L010 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;} /* L011 */
    .tabs::-webkit-scrollbar{display:none;} /* L012 */
    .tab{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;white-space:nowrap;cursor:pointer;} /* L013 */
    .tab.active{border-color:#2563eb;color:#2563eb;} /* L014 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;} /* L015 */
    .view{position:absolute;top:52px;left:0;right:0;bottom:0;display:none;} /* L016 */
    .view.active{display:block;} /* L017 */
    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L018 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;} /* L019 */
  </style> <!-- L020 -->
</head> <!-- L021 -->
<body> <!-- L022 -->
<div id="app"> <!-- L023 -->
  <div class="topbar"> <!-- L024 -->
    <div class="tabs" id="tabs"> <!-- L025 -->
      <div class="tab active" data-view="view-map" id="tab-map">🗺️ 地図</div> <!-- L026 -->
      <div class="tab" data-view="view-browser" id="tab-browser">🤖 Aiブラウザ</div> <!-- L027 -->
      <div class="tab" data-view="view-settings" id="tab-settings">⚙️ 設定</div> <!-- L028 -->
      <div class="tab add" id="tab-add">＋</div> <!-- L029 -->
    </div> <!-- L030 -->
  </div> <!-- L031 -->

  <div class="view active" id="view-map"> <!-- L032 -->
    <div id="mapHost"> <!-- L033 -->
      <!-- 同一オリジンの別ファイルを読み込む：Referer/CSP/相対パス問題を回避 --> <!-- L034 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L035 -->
    </div> <!-- L036 -->
  </div> <!-- L037 -->

  <div class="view" id="view-browser"> <!-- L038 -->
    <iframe id="webview" style="width:100%;height:100%;border:0" title="Aiブラウザ"></iframe> <!-- L039 -->
  </div> <!-- L040 -->

  <div class="view" id="view-settings"> <!-- L041 -->
    <div style="padding:16px;line-height:1.7"> <!-- L042 -->
      <div>アカウント：未ログイン</div> <!-- L043 -->
      <div>通知：未設定</div> <!-- L044 -->
      <div>バージョン：embed-iframe v1.0</div> <!-- L045 -->
    </div> <!-- L046 -->
  </div> <!-- L047 -->
</div> <!-- L048 -->

<script> /* L049 */
  // タブ切替（見た目不変） /* L050 */
  const tabsEl=document.getElementById('tabs'); /* L051 */
  function activateTab(btn){ /* L052 */
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); /* L053 */
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); /* L054 */
    btn.classList.add('active'); /* L055 */
    const vid=btn.dataset.view; if(vid) document.getElementById(vid).classList.add('active'); /* L056 */
  } /* L057 */
  tabsEl.addEventListener('click',(e)=>{ const b=e.target.closest('.tab'); if(!b)return; if(b.id==='tab-add'){return;} activateTab(b); }); /* L058 */
</script> <!-- L059 -->
</body> <!-- L060 -->
</html> <!-- L061 -->
