<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — タブ内で地図／Gemini・ChatGPTはリンク</title> <!-- L006 -->
  <style> /* L007 */
    :root{ --bar:56px; --barW:60px; --hit:44px; } /* L008: 縦バー幅とヒットサイズをスリム化 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L009 */
    body{background:#f8fafc;} /* L010 */
    #app{position:relative;width:100%;height:100dvh;overflow:hidden;} /* L011 */

    /* タブバー */ /* L012 */
    .topbar{position:absolute;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:9999;} /* L013 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1 1 auto;} /* L014 */
    .tabs::-webkit-scrollbar{display:none;} /* L015 */

    /* タブ（基準は左/右=縦方向UI想定） */ /* L016 */
    .tab{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px 10px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;cursor:pointer;user-select:none;max-width:38vw;white-space:normal;overflow-wrap:anywhere;} /* L017: パディング軽量化 */
    #app.pos-left .tab,#app.pos-right .tab{max-width:calc(var(--barW) - 12px);} /* L018: 縦バー幅に追従してスリム化 */
    .tab .label{display:block;line-height:1.2;} /* L019 */
    .tab .close{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:10px;font-size:12px;line-height:1;background:#f3f4f6;color:#374151;margin-left:6px;} /* L020: 角丸も控えめに */
    .tab .close:hover{background:#e5e7eb} /* L021 */
    .tab.active{border-color:#2563eb;color:#2563eb;} /* L022 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;align-items:center;} /* L023 */
    .tab.flash{transition:background-color .2s, box-shadow .2s;background:#eef2ff;box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L024 */

    /* 上/下配置では横並び・横書き固定（既定のまま維持） */ /* L025 */
    #app.pos-top .tab, #app.pos-bottom .tab{flex-direction:row;align-items:center;max-width:none;padding:6px 10px;} /* L026: 上下もスリム化 */
    #app.pos-top .tab .label, #app.pos-bottom .tab .label{white-space:nowrap;} /* L027 */

    /* ビュー */ /* L028 */
    .view{position:absolute;top:var(--bar);left:0;right:0;bottom:0;display:none;z-index:0;} /* L029 */
    .view.active{display:block;} /* L030 */

    /* 地図埋め込み */ /* L031 */
    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L032 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;display:block;} /* L033 */

    /* スタート画面 */ /* L034 */
    .start{position:absolute;inset:0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:flex-start;background:#f8fafc;} /* L035 */
    .card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:14px;background:#fff;min-height:120px;text-decoration:none;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.06);} /* L036 */
    .card .title{margin-top:6px;font-size:13px;color:#374151;} /* L037 */
    .card .url{margin-top:8px;font-size:12px;color:#6b7280;word-break:break-all;padding:0 10px;text-align:center;} /* L038 */
    .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;} /* L039 */
    .btn,.alink{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#111;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:12px;text-decoration:none;} /* L040 */
    .muted{color:#6b7280;font-size:12px;margin-top:8px;text-align:center;grid-column:1/-1;} /* L041 */
    .tabmap{position:absolute;inset:0;border:0;background:#e5e7eb;display:none;width:100%;height:100%;} /* L042 */
    .tabmap.active{display:block;} /* L043 */

    /* 下配置 */ /* L044 */
    #app.pos-bottom .topbar{inset:auto 0 0 0;height:var(--bar);box-shadow:0 -8px 24px rgba(0,0,0,.08);} /* L045 */
    #app.pos-bottom .view{top:0;bottom:var(--bar);} /* L046 */
    #app.pos-bottom .tabs{flex-direction:row;overflow-x:auto;overflow-y:hidden;} /* L047 */

    /* 左配置 */ /* L048 */
    #app.pos-left .topbar{inset:0 auto 0 0;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-start;box-shadow:8px 0 24px rgba(0,0,0,.08);} /* L049 */
    #app.pos-left .view{top:0;left:var(--barW);right:0;bottom:0;} /* L050 */
    #app.pos-left .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;flex:1 1 auto;} /* L051 */

    /* 右配置 */ /* L052 */
    #app.pos-right .topbar{inset:0 0 0 auto;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-end;box-shadow:-8px 0 24px rgba(0,0,0,.08);} /* L053 */
    #app.pos-right .view{top:0;left:0;right:var(--barW);bottom:0;} /* L054 */
    #app.pos-right .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;flex:1 1 auto;} /* L055 */

    /* 独立ナビツール（スリム化＋色付け） */ /* L056 */
    .navtools{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:0 0 auto;} /* L057: 間隔を微縮 */
    .navbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--hit);height:var(--hit);border-radius:12px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;user-select:none;transition:transform .06s ease;outline:none;} /* L058: 44px・角丸12・影軽量化 */
    .navbtn:active{transform:translateY(1px);} /* L059 */
    .navbtn svg{width:22px;height:22px;display:block;} /* L060 */
    .navbtn.home{background:#e0f2fe;border-color:#bae6fd;} /* L061: ホーム=淡い青 */
    .navbtn.home svg path{fill:#2563eb;}
    .navbtn.back{background:#fef3c7;border-color:#fde68a;} /* L062: 戻る=淡い琥珀 */
    .navbtn.back svg path{fill:#b45309;}
    .navbtn.forward{background:#dcfce7;border-color:#bbf7d0;} /* L063: 進む=淡い緑 */
    .navbtn.forward svg path{fill:#16a34a;}

    /* 縦バー時は最下部に縦並び（余白も軽く） */ /* L064 */
    #app.pos-left .navtools,#app.pos-right .navtools{flex-direction:column;gap:10px;margin-top:auto;margin-bottom:6px;}
    #app.pos-left .topbar,#app.pos-right .topbar{padding-top:6px;padding-bottom:6px;}
  </style> <!-- L065 -->
</head> <!-- L066 -->
<body> <!-- L067 -->
<div id="app" class="pos-left"> <!-- L068 -->
  <div class="topbar"> <!-- L069 -->
    <div class="tabs" id="tabs"> <!-- L070 -->
      <div class="tab active" data-view="view-map" id="tab-map"><span class="label">🗺️ 地図</span></div> <!-- L071 -->
      <div class="tab" data-view="view-browser" id="tab-browser"><span class="label">🤖 Aiブラウザ</span></div> <!-- L072 -->
      <div class="tab" data-view="view-settings" id="tab-settings"><span class="label">⚙️ 設定</span></div> <!-- L073 -->
      <div class="tab add" id="tab-add" title="新しいタブを作成"><span class="label">＋</span></div> <!-- L074 -->
    </div> <!-- L075 -->

    <!-- 独立ナビツール（色付き・スリム化） --> <!-- L076 -->
    <div class="navtools" id="navtools" aria-label="ナビゲーション操作">
      <button class="navbtn home" id="btn-home" aria-label="ホーム">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v10h-5V15H11v6H6V11H3z"/></svg>
      </button>
      <button class="navbtn back" id="btn-back" aria-label="戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l-5 5 5 5V7z"/></svg>
      </button>
      <button class="navbtn forward" id="btn-forward" aria-label="進む">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5V7z"/></svg>
      </button>
    </div>
  </div> <!-- L077 -->

  <!-- 地図タブ（embed.html） --> <!-- L078 -->
  <div class="view active" id="view-map"> <!-- L079 -->
    <div id="mapHost"> <!-- L080 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L081 -->
    </div> <!-- L082 -->
  </div> <!-- L083 -->

  <!-- Aiブラウザ（同タブで地図を表示） --> <!-- L084 -->
  <div class="view" id="view-browser"> <!-- L085 -->
    <div class="start" aria-label="スタート"> <!-- L086 -->
      <div class="card">
        <div style="font-size:24px">🗺️</div>
        <div class="title">このタブで地図を表示</div>
        <div class="row"><button class="btn" data-action="open-map-here" data-view="view-browser" type="button">地図を表示</button></div>
      </div> <!-- L087 -->
      <div class="card">
        <div style="font-size:24px">🧠</div>
        <div class="title">Gemini</div>
        <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>
        <div class="url">https://gemini.google.com/</div>
      </div> <!-- L088 -->
      <div class="card">
        <div style="font-size:24px">💬</div>
        <div class="title">ChatGPT</div>
        <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>
        <div class="url">https://chatgpt.com/</div>
      </div> <!-- L089 -->
      <div class="muted">※ リンクは新しいブラウザタブで開きます（本アプリは残ります）。『地図を表示』はこのタブ内だけに適用。</div> <!-- L090 -->
    </div> <!-- L091 -->
    <iframe class="tabmap" id="view-browser-map" title="Aiタブ内地図" src="" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L092 -->
  </div> <!-- L093 -->

  <!-- 設定（タブ位置切替＋即クローズ） --> <!-- L094 -->
  <div class="view" id="view-settings"> <!-- L095 -->
    <div class="start" aria-label="設定"> <!-- L096 -->
      <div class="card" style="grid-column:span 3">
        <div class="title">設定：タブの場所（上／下／右／左）</div>
        <div class="row" id="posControls" role="radiogroup" aria-label="タブの場所">
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="top" style="display:none">上</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="bottom" style="display:none">下</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="left" style="display:none">左</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="right" style="display:none">右</label>
        </div>
        <div class="muted">選択は自動保存され、次回起動時に復元されます。</div>
      </div>
      <div class="card" style="grid-column:span 3"><div class="title">状態：未ログイン／通知未設定／v=tab-local-map+links</div></div>
    </div>
  </div> <!-- L097 -->
</div> <!-- L098 -->

<script> /* L099 */
(function(){
  var appEl=document.getElementById('app');
  var tabsEl=document.getElementById('tabs');
  var navHome=document.getElementById('btn-home');
  var navBack=document.getElementById('btn-back');
  var navFwd =document.getElementById('btn-forward');

  var SKEY_TABS='WN_TABS_LOCAL_V2';
  var SKEY_POS ='WN_TAB_POS_V1';

  function snapIntoView(el){ if(!el) return; try{ el.scrollIntoView({block:'nearest',inline:'end'}); }catch(_){} }

  /* ===== 履歴（実履歴） ===== */ /* L100 */
  function currentState(){
    var activeTab=document.querySelector('.tab.active');
    var viewId=activeTab?activeTab.getAttribute('data-view'):'view-map';
    var mode=null;
    if(viewId){
      var v=document.getElementById(viewId);
      if(v){
        var map=v.querySelector('.tabmap');
        var s=v.querySelector('.start');
        if(map && map.classList.contains('active')) mode='map';
        else if(s) mode='start';
      }
    }
    return {view:viewId||'view-map', mode:mode||null};
  }
  function statesEqual(a,b){ return a && b && a.view===b.view && a.mode===b.mode; }
  function applyState(state){
    var viewId=state && state.view ? state.view : 'view-map';
    var tab=[].slice.call(document.querySelectorAll('.tab')).find(function(t){ return t.getAttribute('data-view')===viewId; }) || document.getElementById('tab-map');
    if(tab){ activateTab(tab,false); }
    if(state && state.mode){
      var v=document.getElementById(viewId);
      if(v){
        var map=v.querySelector('.tabmap');
        var s=v.querySelector('.start');
        if(state.mode==='map'){ if(map){ if(!map.src) map.src='./embed.html'; map.classList.add('active'); } if(s) s.style.display='none'; }
        if(state.mode==='start'){ if(map){ map.classList.remove('active'); } if(s) s.style.display='block'; }
      }
    }
  }
  function pushStateIfChanged(newState, replace){
    var cur=history.state || null;
    if(replace){ history.replaceState(newState,''); return; }
    if(!statesEqual(cur,newState)){ history.pushState(newState,''); }
  }

  /* ===== 位置切替（保存のみ。UIはCSSで反映） ===== */ /* L101 */
  function setTabPosition(pos){
    var p=(pos==='bottom'||pos==='left'||pos==='right')?pos:'top';
    appEl.classList.remove('pos-top','pos-bottom','pos-left','pos-right');
    appEl.classList.add('pos-'+p);
    try{ localStorage.setItem(SKEY_POS,p); }catch(_){}
    snapIntoView(document.getElementById('tab-add'));
  }

  /* ===== タブ切替（履歴積み対応） ===== */ /* L102 */
  function activateTab(btn, doPush){
    if(doPush===undefined) doPush=true;
    if(!btn) return;
    var views=document.querySelectorAll('.view'); for(var i=0;i<views.length;i++) views[i].classList.remove('active');
    var tabs=document.querySelectorAll('.tab');  for(var j=0;j<tabs.length;j++)  tabs[j].classList.remove('active');
    btn.classList.add('active');
    var vid=btn.getAttribute('data-view'); if(vid){ var v=document.getElementById(vid); if(v) v.classList.add('active'); }
    if(doPush){ pushStateIfChanged({view:vid, mode:(vid==='view-browser'?'start':null)}, false); }
    snapIntoView(btn);
  }

  /* ===== ユーザータブ管理 ===== */ /* L103 */
  function nextLabel(){
    var list=[].slice.call(document.querySelectorAll('.tab')).filter(function(n){
      return !n.classList.contains('add') && ['tab-map','tab-browser','tab-settings'].indexOf(n.id)===-1;
    });
    return '新規タブ '+(list.length+1);
  }
  function startContentHTML(viewId){
    return ''+
    '<div class="start" aria-label="リンク集">'+
      '<div class="card"><div style="font-size:24px">🗺️</div><div class="title">このタブで地図を表示</div>'+
      '<div class="row"><button class="btn" data-action="open-map-here" data-view="'+viewId+'" type="button">地図を表示</button></div></div>'+
      '<div class="card"><div style="font-size:24px">🧠</div><div class="title">Gemini</div>'+
      '<div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>'+
      '<div class="url">https://gemini.google.com/</div></div>'+
      '<div class="card"><div style="font-size:24px">💬</div><div class="title">ChatGPT</div>'+
      '<div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>'+
      '<div class="url">https://chatgpt.com/</div></div>'+
      '<div class="muted">※ リンクは新しいブラウザタブで開きます。本アプリは残ります。</div>'+
    '</div>'+
    '<iframe class="tabmap" id="'+viewId+'-map" title="タブ内地図" src="" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe>';
  }
  var tabCounter=0;
  function makeIds(){ tabCounter++; var id='user-'+Date.now()+'-'+tabCounter; return {tabId:'tab-'+id, viewId:'view-'+id}; }

  function persistTabs(){
    var nodes=[].slice.call(document.querySelectorAll('.tab')).filter(function(n){
      return !n.classList.contains('add') && ['tab-map','tab-browser','tab-settings'].indexOf(n.id)===-1;
    });
    var data=nodes.map(function(n){
      var viewId=n.getAttribute('data-view');
      var mapEl=document.getElementById(viewId+'-map');
      var mapOpened=!!(mapEl && mapEl.classList.contains('active') && mapEl.src && mapEl.src.indexOf('embed.html')!==-1);
      var label=(n.querySelector('.label')?n.querySelector('.label').textContent:n.textContent)||'';
      return {tabId:n.id, viewId:viewId, label:label, mapOpened:mapOpened};
    });
    var aiMap=document.getElementById('view-browser-map');
    var aiOpened=!!(aiMap && aiMap.classList.contains('active') && aiMap.src && aiMap.src.indexOf('embed.html')!==-1);
    try{ sessionStorage.setItem(SKEY_TABS, JSON.stringify({tabs:data, aiOpened:aiOpened})); }catch(_){}
  }
  function addTabFromState(state){
    var addBtn=document.getElementById('tab-add'); if(!addBtn) return;
    var tab=document.createElement('div');
    tab.className='tab'; tab.id=state.tabId; tab.setAttribute('data-view',state.viewId);
    tab.innerHTML='<span class="label">'+state.label+'</span><span class="close" data-close="'+state.viewId+'" aria-label="閉じる">×</span>';
    addBtn.parentNode.insertBefore(tab, addBtn);

    var view=document.createElement('div');
    view.className='view'; view.id=state.viewId; view.innerHTML=startContentHTML(state.viewId);
    document.getElementById('app').appendChild(view);

    if(state.mapOpened){
      var m=document.getElementById(state.viewId+'-map'); if(m){ m.src='./embed.html'; m.classList.add('active'); }
      var s=view.querySelector('.start'); if(s) s.style.display='none';
    }
  }
  function restoreTabs(){
    try{
      var saved=JSON.parse(sessionStorage.getItem(SKEY_TABS)||'{"tabs":[]}');
      (saved.tabs||[]).forEach(addTabFromState);
      if(saved.aiOpened){
        var ai=document.getElementById('view-browser-map'); var s=document.querySelector('#view-browser .start');
        if(ai){ ai.src='./embed.html'; ai.classList.add('active'); } if(s) s.style.display='none';
      }
    }catch(_){}
  }

  function addTab(label){
    var ids=makeIds(); var addBtn=document.getElementById('tab-add'); if(!addBtn) return;
    var tab=document.createElement('div');
    tab.className='tab'; tab.id=ids.tabId; tab.setAttribute('data-view',ids.viewId);
    tab.innerHTML='<span class="label">'+label+'</span><span class="close" data-close="'+ids.viewId+'" aria-label="閉じる">×</span>';
    addBtn.parentNode.insertBefore(tab, addBtn);
    tab.classList.add('flash'); setTimeout(function(){ tab.classList.remove('flash'); },200);

    var view=document.createElement('div');
    view.className='view'; view.id=ids.viewId; view.innerHTML=startContentHTML(ids.viewId);
    document.getElementById('app').appendChild(view);

    activateTab(tab); /* pushState inside */
    persistTabs();
    snapIntoView(addBtn);
  }
  function closeTab(viewId){
    var tabs=[].slice.call(document.querySelectorAll('.tab'));
    var tab=tabs.find(function(t){ return t.getAttribute('data-view')===viewId; });
    var view=document.getElementById(viewId);
    if(!tab||!view) return;
    var isActive=tab.classList.contains('active');
    tab.remove(); view.remove(); persistTabs();
    if(isActive){ var mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab); }
  }

  /* ===== Aiブラウザ：ホーム／地図表示（履歴対応） ===== */ /* L104 */
  function aiHome(){
    var state={view:'view-browser', mode:'start'};
    applyState(state);
    pushStateIfChanged(state,false);
  }
  function openMapHere(viewId){
    var v=document.getElementById(viewId); if(!v) return;
    var map=v.querySelector('.tabmap'); var s=v.querySelector('.start');
    if(map){ if(!map.src) map.src='./embed.html'; map.classList.add('active'); }
    if(s) s.style.display='none';
    persistTabs();
    pushStateIfChanged({view:viewId, mode:'map'}, false);
  }

  /* ===== イベント登録 ===== */ /* L105 */
  function bindEvents(){
    if(!tabsEl) return;
    tabsEl.addEventListener('click', function(e){
      var tgt=e.target;
      var btn=tgt && tgt.closest ? tgt.closest('.tab') : null; if(!btn) return;
      var close=tgt.closest ? tgt.closest('.close') : null;
      if(close){ closeTab(close.getAttribute('data-close')); return; }
      if(btn.id==='tab-add'){ addTab(nextLabel()); return; }
      if(btn.getAttribute('data-view')){ activateTab(btn); }
    });

    document.addEventListener('click', function(e){
      var b=e.target && e.target.closest ? e.target.closest('.btn') : null;
      if(b && b.getAttribute('data-action')==='open-map-here'){
        var vid=b.getAttribute('data-view'); if(vid) openMapHere(vid);
        e.preventDefault(); e.stopPropagation();
      }
    });

    if(navHome){ navHome.addEventListener('click', function(){ aiHome(); }); }
    if(navBack){ navBack.addEventListener('click', function(){ history.back(); }); }
    if(navFwd ){ navFwd .addEventListener('click', function(){ history.forward(); }); }

    document.addEventListener('keydown', function(e){
      if((e.key==='Enter'||e.key===' '||e.code==='Space')){
        var b=e.target && e.target.closest ? e.target.closest('.btn') : null;
        if(b && b.getAttribute('data-action')==='open-map-here'){
          var vid=b.getAttribute('data-view'); if(vid) openMapHere(vid);
          e.preventDefault(); e.stopPropagation();
        }
      }
    });

    window.addEventListener('popstate', function(ev){
      var st=ev.state || null;
      if(st){ applyState(st); }
    });
  }

  /* ===== 設定UI（即クローズ実装） ===== */ /* L106 */
  function initPositionUI(){
    var saved='left'; try{ saved=localStorage.getItem(SKEY_POS)||saved; }catch(_){}
    setTabPosition(saved);
    var posEl=document.getElementById('posControls'); if(!posEl) return;
    var radios=[].slice.call(posEl.querySelectorAll('input[name="tabpos"]'));
    radios.forEach(function(r){ r.checked=(r.value===saved); });
    posEl.addEventListener('click', function(e){
      var lab=e.target && e.target.closest ? e.target.closest('label') : null; if(!lab) return;
      var input=lab.querySelector('input[name="tabpos"]'); if(!input) return;
      setTabPosition(input.value);            /* 位置反映・保存 */
      radios.forEach(function(r){ r.checked=(r===input); });
      var mapTab=document.getElementById('tab-map'); /* 即クローズ＝地図へ復帰 */
      if(mapTab){ activateTab(mapTab); }
    });
  }

  /* ===== 初期化 ===== */ /* L107 */
  function init(){
    initPositionUI();
    restoreTabs();
    var initialTab=document.querySelector('.tab.active')||document.getElementById('tab-map');
    activateTab(initialTab,false);
    if(!history.state){ pushStateIfChanged(currentState(),true); } /* replaceState */
    snapIntoView(document.getElementById('tab-add'));
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', function(){ try{ bindEvents(); init(); }catch(_){ setTimeout(function(){ try{ bindEvents(); init(); }catch(__){} },0); } });
  }else{
    try{ bindEvents(); init(); }catch(_){ setTimeout(function(){ try{ bindEvents(); init(); }catch(__){} },0); }
  }
})();
