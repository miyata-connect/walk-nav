<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeti Web App - Pulsing Marker</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* 地図を全画面表示にするための基本スタイル */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
        }
        #map { 
            height: 100vh; 
            width: 100%; 
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
    
    <script src="PulsingMarkerOverlay.js"></script>

    <script>
        let map;
        let myLocationMarker; // 波動マーカーのインスタンスを保持する変数

        // Google Maps APIが読み込まれたら呼び出されるコールバック関数
        function initMap() {
            
            // 初期表示位置（例：徳島県美馬市付近）
            const initialLocation = new google.maps.LatLng(34.053, 134.053); 

            map = new google.maps.Map(document.getElementById('map'), {
                center: initialLocation,
                zoom: 16,
                disableDefaultUI: true, // Googleの標準UIを非表示
                zoomControl: true,      // ズームコントロールは表示
            });

            // --- 波動マーカーを生成 ---
            myLocationMarker = new PulsingMarkerOverlay(
                initialLocation, // 初期位置
                map              // 表示する地図
            );

            // --- 実際のGPS（位置情報）を取得開始 ---
            if (navigator.geolocation) {
                // watchPositionでデバイスの移動に追従する
                navigator.geolocation.watchPosition(
                    (position) => {
                        // 取得成功
                        const newPos = new google.maps.LatLng(
                            position.coords.latitude,
                            position.coords.longitude
                        );

                        if (myLocationMarker) {
                            // マーカーの位置をGPSの現在地に更新
                            myLocationMarker.updatePosition(newPos);
                        } else {
                            // 初回取得時（もしinitMapより先にGPSが取得できた場合）
                            myLocationMarker = new PulsingMarkerOverlay(newPos, map);
                        }
                        
                        // 地図の中心も現在地に移動（初回のみでも可）
                        map.panTo(newPos);
                        
                    }, 
                    (error) => {
                        // 取得失敗
                        console.error("位置情報の取得に失敗しました: ", error.message);
                        // TODO: ユーザーにエラーを通知する処理
                    },
                    {
                        // 高精度な位置情報を要求
                        enableHighAccuracy: true,
                    }
                );
            } else {
                // ブラウザがGeolocation APIに非対応
                console.error("お使いのブラウザは位置情報機能に対応していません。");
            }
        }
    </script>
</body>
</html>
