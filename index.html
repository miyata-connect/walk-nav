<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — 無限タブ／＋常時隣接／外部抑止</title> <!-- L006 -->
  <style> /* L007 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L008 */
    #app{position:relative;width:100%;height:100%;overflow:hidden;background:#f8fafc;} /* L009 */
    .topbar{position:absolute;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:10;} /* L010 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;} /* L011 */
    .tabs::-webkit-scrollbar{display:none;} /* L012 */
    .tab{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;white-space:nowrap;cursor:pointer;user-select:none;} /* L013 */
    .tab.active{border-color:#2563eb;color:#2563eb;} /* L014 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;} /* L015 */
    .tab.flash{transition:background-color .2s, box-shadow .2s;background:#eef2ff;box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L016 */
    .view{position:absolute;top:52px;left:0;right:0;bottom:0;display:none;} /* L017 */
    .view.active{display:block;} /* L018 */
    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L019 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;} /* L020 */
    .start{height:100%;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:flex-start;} /* L021 */
    .card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:14px;background:#fff;min-height:110px;text-decoration:none;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.06);} /* L022 */
    .card .title{margin-top:6px;font-size:13px;color:#374151;} /* L023 */
    .card .url{margin-top:6px;font-size:12px;color:#6b7280;word-break:break-all;padding:0 8px;text-align:center;} /* L024 */
    .row{display:flex;gap:8px;margin-top:10px;} /* L025 */
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#111;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:12px;} /* L026 */
    .muted{color:#6b7280;font-size:12px;margin-top:8px;text-align:center;grid-column:1/-1;} /* L027 */
  </style> <!-- L028 -->
</head> <!-- L029 -->
<body> <!-- L030 -->
<div id="app"> <!-- L031 -->
  <div class="topbar"> <!-- L032 -->
    <div class="tabs" id="tabs"> <!-- L033 -->
      <div class="tab active" data-view="view-map" id="tab-map">🗺️ 地図</div> <!-- L034 -->
      <div class="tab" data-view="view-browser" id="tab-browser">🤖 Aiブラウザ</div> <!-- L035 -->
      <div class="tab" data-view="view-settings" id="tab-settings">⚙️ 設定</div> <!-- L036 -->
      <div class="tab add" id="tab-add" title="新しいタブを作成">＋</div> <!-- L037 -->
    </div> <!-- L038 -->
  </div> <!-- L039 -->

  <!-- 地図（embed.html を内部iframeで表示） --> <!-- L040 -->
  <div class="view active" id="view-map"> <!-- L041 -->
    <div id="mapHost"> <!-- L042 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L043 -->
    </div> <!-- L044 -->
  </div> <!-- L045 -->

  <!-- Aiブラウザ（骨子） --> <!-- L046 -->
  <div class="view" id="view-browser"> <!-- L047 -->
    <div class="start" aria-label="スタート"> <!-- L048 -->
      <div class="card"><div style="font-size:24px">🗺️</div><div class="title">地図へ切替</div><div class="row"><button class="btn" data-action="goto-map">地図タブ</button></div></div> <!-- L049 -->
      <div class="card"><div style="font-size:24px">🧠</div><div class="title">Gemini</div><div class="url">https://gemini.google.com/</div><div class="row"><button class="btn" data-action="copy" data-url="https://gemini.google.com/">リンクをコピー</button></div></div> <!-- L050 -->
      <div class="card"><div style="font-size:24px">💬</div><div class="title">ChatGPT</div><div class="url">https://chatgpt.com/</div><div class="row"><button class="btn" data-action="copy" data-url="https://chatgpt.com/">リンクをコピー</button></div></div> <!-- L051 -->
      <div class="muted">※ 外部サイトへは遷移しません（誤作動防止）。必要に応じてリンクをコピーしてご利用ください。</div> <!-- L052 -->
    </div> <!-- L053 -->
  </div> <!-- L054 -->

  <!-- 設定（骨子） --> <!-- L055 -->
  <div class="view" id="view-settings"> <!-- L056 -->
    <div class="start"><div class="card" style="grid-column:span 3"><div class="title">設定：未ログイン／通知未設定／v=∞tabs</div></div></div> <!-- L057 -->
  </div> <!-- L058 -->
</div> <!-- L059 -->

<script> /* L060 */
  // ===== 定数・参照 ===== /* L061 */
  const tabsEl=document.getElementById('tabs'); /* L062 */
  const SKEY_TABS='WN_TABS_INF_V2'; /* L063 */
  const SKEY_NEXT='WN_TABS_NEXTNUM'; /* L064 */

  // ===== 補助：タブ可視域へスナップ ===== /* L065 */
  function snapIntoView(el){ /* L066 */
    try{ el.scrollIntoView({block:'nearest',inline:'end'}); }catch(_){} /* L067 */
  } /* L068 */

  // ===== タブ切替（見た目不変） ===== /* L069 */
  function activateTab(btn){ /* L070 */
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); /* L071 */
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); /* L072 */
    btn.classList.add('active'); /* L073 */
    const vid=btn.dataset.view; if(vid) document.getElementById(vid).classList.add('active'); /* L074 */
    snapIntoView(btn); /* L075 */
  } /* L076 */

  // ===== 採番（セッション継続） ===== /* L077 */
  function nextNumber(){ /* L078 */
    let n=parseInt(sessionStorage.getItem(SKEY_NEXT)||'1',10); /* L079 */
    sessionStorage.setItem(SKEY_NEXT, String(n+1)); /* L080 */
    return n; /* L081 */
  } /* L082 */

  // ===== 新規タブの内容HTML（地図・Gemini・ChatGPT） ===== /* L083 */
  function startContentHTML(){ /* L084 */
    return `
      <div class="start" aria-label="リンク集">
        <div class="card">
          <div style="font-size:24px">🗺️</div>
          <div class="title">地図へ切替</div>
          <div class="row"><button class="btn" data-action="goto-map">地図タブ</button></div>
        </div>
        <div class="card">
          <div style="font-size:24px">🧠</div>
          <div class="title">Gemini</div>
          <div class="url">https://gemini.google.com/</div>
          <div class="row"><button class="btn" data-action="copy" data-url="https://gemini.google.com/">リンクをコピー</button></div>
        </div>
        <div class="card">
          <div style="font-size:24px">💬</div>
          <div class="title">ChatGPT</div>
          <div class="url">https://chatgpt.com/</div>
          <div class="row"><button class="btn" data-action="copy" data-url="https://chatgpt.com/">リンクをコピー</button></div>
        </div>
        <div class="muted">※ 外部サイトへは遷移しません（誤作動防止）。必要に応じてリンクをコピーしてご利用ください。</div>
      </div>`;
  } /* L085 */

  // ===== ID生成 ===== /* L086 */
  let tabCounter=0; /* L087 */
  function makeIds(){ /* L088 */
    tabCounter++; const id=`user-${Date.now()}-${tabCounter}`; /* L089 */
    return {tabId:`tab-${id}`, viewId:`view-${id}`}; /* L090 */
  } /* L091 */

  // ===== タブ追加（＋の直前に置き、＋は常に末尾） ===== /* L092 */
  function addTab(label){ /* L093 */
    const {tabId,viewId}=makeIds(); /* L094 */
    const addBtn=document.getElementById('tab-add'); /* L095 */

    // タブ要素を＋の直前に追加（軽い視覚反応） /* L096 */
    const tab=document.createElement('div'); /* L097 */
    tab.className='tab'; tab.id=tabId; tab.dataset.view=viewId; tab.textContent=label; /* L098 */
    addBtn.before(tab); /* L099 */
    tab.classList.add('flash'); setTimeout(()=>tab.classList.remove('flash'),200); /* L100 */

    // 対応ビューを追加（軽量・外部遷移なし） /* L101 */
    const view=document.createElement('div'); /* L102 */
    view.className='view'; view.id=viewId; view.innerHTML=startContentHTML(); /* L103 */
    document.getElementById('app').appendChild(view); /* L104 */

    // ＋を常に末尾に維持 → ＋を可視域へスナップ → 新規タブをアクティブ化 /* L105 */
    tabsEl.appendChild(addBtn); /* L106 */
    snapIntoView(addBtn); /* L107 */
    activateTab(tab); /* L108 */

    // 保存 /* L109 */
    persistTabs(); /* L110 */
  } /* L111 */

  // ===== 永続化と復元 ===== /* L112 */
  function persistTabs(){ /* L113 */
    const nodes=[...document.querySelectorAll('.tab')]
      .filter(n=>!n.classList.contains('add') && !['tab-map','tab-browser','tab-settings'].includes(n.id)); /* L114 */
    const data=nodes.map(n=>({tabId:n.id, viewId:n.dataset.view, label:n.textContent})); /* L115 */
    try{ sessionStorage.setItem(SKEY_TABS, JSON.stringify(data)); }catch(_){/* ignore */} /* L116 */
  } /* L117 */

  function addTabFromState(state){ /* L118 */
    const addBtn=document.getElementById('tab-add'); /* L119 */
    const tab=document.createElement('div'); /* L120 */
    tab.className='tab'; tab.id=state.tabId; tab.dataset.view=state.viewId; tab.textContent=state.label; /* L121 */
    addBtn.before(tab); /* L122 */
    const view=document.createElement('div'); /* L123 */
    view.className='view'; view.id=state.viewId; view.innerHTML=startContentHTML(); /* L124 */
    document.getElementById('app').appendChild(view); /* L125 */
    tabsEl.appendChild(addBtn); /* L126 */
  } /* L127 */

  function restoreTabs(){ /* L128 */
    try{ const data=JSON.parse(sessionStorage.getItem(SKEY_TABS)||'[]'); data.forEach(addTabFromState); }catch(_){/* noop */} /* L129 */
  } /* L130 */

  // ===== 外部挙動の完全抑止：tabs クリックを1本化 ===== /* L131 */
  tabsEl.addEventListener('click',(e)=>{ /* L132 */
    const b=e.target.closest('.tab'); if(!b) return; /* L133 */
    e.preventDefault(); e.stopPropagation(); /* L134 */
    if(b.id==='tab-add'){ /* L135 */
      // 採番はセッション継続（新規タブ 1,2,3,…） /* L136 */
      const n=nextNumber(); /* L137 */
      addTab(`新規タブ ${n}`); /* L138 */
      return false; /* L139 */
    }
    if(b.dataset.view){ activateTab(b); } /* L140 */
    return false; /* L141 */
  }, {passive:false}); /* L142 */

  // ===== 新規タブ内のボタン（コピー／地図へ切替） ===== /* L143 */
  document.addEventListener('click',(e)=>{ /* L144 */
    const btn=e.target.closest('.btn'); if(!btn) return; /* L145 */
    const act=btn.dataset.action; /* L146 */
    if(act==='copy'){ /* L147 */
      e.preventDefault(); e.stopPropagation(); /* L148 */
      const url=btn.dataset.url||''; /* L149 */
      navigator.clipboard?.writeText(url).catch(()=>{}); /* L150 */
      const old=btn.textContent; btn.textContent='コピー済み'; setTimeout(()=>btn.textContent=old,1000); /* L151 */
      return false; /* L152 */
    }
    if(act==='goto-map'){ /* L153 */
      e.preventDefault(); e.stopPropagation(); /* L154 */
      const mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab); /* L155 */
      return false; /* L156 */
    }
  }, {passive:false}); /* L157 */

  // ===== 初期化 ===== /* L158 */
  (function init(){ /* L159 */
    // 旧版の無効化属性を強制除去（＋が無効化されている事象の排除） /* L160 */
    const addBtn=document.getElementById('tab-add'); /* L161 */
    addBtn.removeAttribute('aria-disabled'); addBtn.removeAttribute('data-disabled'); /* L162 */
    addBtn.style.pointerEvents='auto'; /* L163 */
    if(!sessionStorage.getItem(SKEY_NEXT)) sessionStorage.setItem(SKEY_NEXT,'1'); /* L164 */
    restoreTabs(); /* L165 */
    activateTab(document.querySelector('.tab.active')||document.getElementById('tab-map')); /* L166 */
    snapIntoView(addBtn); /* L167 */
  })(); /* L168 */
</script> <!-- L169 -->
</body> <!-- L170 -->
</html> <!-- L171 -->
