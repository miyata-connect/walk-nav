<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — タブ内で地図／Gemini・ChatGPTはリンク</title> <!-- L006 -->
  <style> /* L007 */
    :root{ --bar:56px; --barW:72px; } /* L008 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L009 */
    body{background:#f8fafc;} /* L010 */
    #app{position:relative;width:100%;height:100dvh;overflow:hidden;} /* L011 */

    /* タブバー（最前面固定） */ /* L012 */
    .topbar{position:absolute;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:9999;pointer-events:auto;} /* L013 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;} /* L014 */
    .tabs::-webkit-scrollbar{display:none;} /* L015 */

    /* タブ本体（折返し許可＋最大幅で収める） */ /* L016 */
    .tab{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:8px 12px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;cursor:pointer;user-select:none;max-width:38vw;white-space:normal;overflow-wrap:anywhere;} /* L017 */
    /* 縦バー時は横幅をサイドバー幅に合わせる */ /* L018 */
    #app.pos-left .tab,#app.pos-right .tab{max-width:calc(var(--barW) - 16px);} /* L019 */
    .tab .label{display:block;line-height:1.2;} /* L020 */
    .tab .tools{display:flex;gap:6px;justify-content:flex-start;} /* L021 */
    .tab .tools .mini{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid #e5e7eb;background:#fff;font-size:12px;line-height:1;} /* L022 */
    .tab .close{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:12px;line-height:1;background:#f3f4f6;color:#374151;margin-left:6px;} /* L023 */
    .tab .close:hover{background:#e5e7eb} /* L024 */
    .tab.active{border-color:#2563eb;color:#2563eb;} /* L025 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;align-items:center;} /* L026 */
    .tab.flash{transition:background-color .2s, box-shadow .2s;background:#eef2ff;box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L027 */

    .view{position:absolute;top:var(--bar);left:0;right:0;bottom:0;display:none;z-index:0;} /* L028 */
    .view.active{display:block;} /* L029 */

    /* 地図埋め込み */ /* L030 */
    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L031 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;display:block;} /* L032 */

    /* スタートカード等 */ /* L033 */
    .start{position:absolute;inset:0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:flex-start;background:#f8fafc;} /* L034 */
    .card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:14px;background:#fff;min-height:120px;text-decoration:none;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.06);} /* L035 */
    .card .title{margin-top:6px;font-size:13px;color:#374151;} /* L036 */
    .card .url{margin-top:8px;font-size:12px;color:#6b7280;word-break:break-all;padding:0 10px;text-align:center;} /* L037 */
    .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;} /* L038 */
    .btn,.alink{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#111;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:12px;text-decoration:none;} /* L039 */
    .muted{color:#6b7280;font-size:12px;margin-top:8px;text-align:center;grid-column:1/-1;} /* L040 */
    .tabmap{position:absolute;inset:0;border:0;background:#e5e7eb;display:none;width:100%;height:100%;} /* L041 */
    .tabmap.active{display:block;} /* L042 */

    /* —— 位置切替：下 —— */ /* L043 */
    #app.pos-bottom .topbar{inset:auto 0 0 0;height:var(--bar);box-shadow:0 -8px 24px rgba(0,0,0,.08);} /* L044 */
    #app.pos-bottom .view{top:0;bottom:var(--bar);} /* L045 */
    #app.pos-bottom .tabs{flex-direction:row;overflow-x:auto;overflow-y:hidden;} /* L046 */

    /* —— 位置切替：左 —— */ /* L047 */
    #app.pos-left .topbar{inset:0 auto 0 0;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-start;box-shadow:8px 0 24px rgba(0,0,0,.08);} /* L048 */
    #app.pos-left .view{top:0;left:var(--barW);right:0;bottom:0;} /* L049 */
    #app.pos-left .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;} /* L050 */

    /* —— 位置切替：右 —— */ /* L051 */
    #app.pos-right .topbar{inset:0 0 0 auto;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-end;box-shadow:-8px 0 24px rgba(0,0,0,.08);} /* L052 */
    #app.pos-right .view{top:0;left:0;right:var(--barW);bottom:0;} /* L053 */
    #app.pos-right .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;} /* L054 */
  </style> <!-- L055 -->
</head> <!-- L056 -->
<body> <!-- L057 -->
<div id="app" class="pos-left"> <!-- L058 -->
  <div class="topbar"> <!-- L059 -->
    <div class="tabs" id="tabs"> <!-- L060 -->
      <div class="tab active" data-view="view-map" id="tab-map">
        <span class="label">🗺️ 地図</span>
      </div> <!-- L061 -->
      <div class="tab" data-view="view-browser" id="tab-browser">
        <span class="label">🤖 Aiブラウザ</span>
        <div class="tools" aria-label="Aiブラウザ操作（タブ内）">
          <button class="mini" type="button" data-nav="back" title="戻る">←</button>
          <button class="mini" type="button" data-nav="forward" title="進む">→</button>
          <button class="mini" type="button" data-nav="home" title="ホーム">🏠</button>
        </div>
      </div> <!-- L062 -->
      <div class="tab" data-view="view-settings" id="tab-settings">
        <span class="label">⚙️ 設定</span>
      </div> <!-- L063 -->
      <div class="tab add" id="tab-add" title="新しいタブを作成"><span class="label">＋</span></div> <!-- L064 -->
    </div> <!-- L065 -->
  </div> <!-- L066 -->

  <!-- 地図タブ（embed.html 使用） --> <!-- L067 -->
  <div class="view active" id="view-map"> <!-- L068 -->
    <div id="mapHost"> <!-- L069 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L070 -->
    </div> <!-- L071 -->
  </div> <!-- L072 -->

  <!-- Aiブラウザ（同タブで地図を表示） --> <!-- L073 -->
  <div class="view" id="view-browser"> <!-- L074 -->
    <div class="start" aria-label="スタート"> <!-- L075 -->
      <div class="card">
        <div style="font-size:24px">🗺️</div>
        <div class="title">このタブで地図を表示</div>
        <div class="row"><button class="btn" data-action="open-map-here" data-view="view-browser" type="button">地図を表示</button></div>
      </div> <!-- L076 -->
      <div class="card">
        <div style="font-size:24px">🧠</div>
        <div class="title">Gemini</div>
        <div class="row">
          <a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a>
        </div>
        <div class="url">https://gemini.google.com/</div>
      </div> <!-- L077 -->
      <div class="card">
        <div style="font-size:24px">💬</div>
        <div class="title">ChatGPT</div>
        <div class="row">
          <a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a>
        </div>
        <div class="url">https://chatgpt.com/</div>
      </div> <!-- L078 -->
      <div class="muted">※ リンクは新しいブラウザタブで開きます（本アプリは残ります）。『地図を表示』はこのタブ内だけに適用。</div> <!-- L079 -->
    </div> <!-- L080 -->
    <iframe class="tabmap" id="view-browser-map" title="Aiタブ内地図" src="" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L081 -->
  </div> <!-- L082 -->

  <!-- 設定（タブ位置の切替UI） --> <!-- L083 -->
  <div class="view" id="view-settings"> <!-- L084 -->
    <div class="start" aria-label="設定"> <!-- L085 -->
      <div class="card" style="grid-column:span 3">
        <div class="title">設定：タブの場所（上／下／右／左）</div>
        <div class="row" id="posControls" role="radiogroup" aria-label="タブの場所">
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="top" style="display:none">上</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="bottom" style="display:none">下</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="left" style="display:none">左</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="right" style="display:none">右</label>
        </div>
        <div class="muted">選択は自動保存され、次回起動時に復元されます。</div>
      </div>
      <div class="card" style="grid-column:span 3"><div class="title">状態：未ログイン／通知未設定／v=tab-local-map+links</div></div>
    </div>
  </div> <!-- L086 -->
</div> <!-- L087 -->

<script> /* L088 */
(function(){
  var appEl=document.getElementById('app');
  var tabsEl=document.getElementById('tabs');
  var SKEY_TABS='WN_TABS_LOCAL_V2';
  var SKEY_POS='WN_TAB_POS_V1';

  function snapIntoView(el){ if(!el) return; try{ el.scrollIntoView({block:'nearest',inline:'end'}); }catch(_){} }

  /* 位置切替／保存 */ /* L089 */
  function setTabPosition(pos){
    var p=(pos==='bottom'||pos==='left'||pos==='right')?pos:'top';
    appEl.classList.remove('pos-top','pos-bottom','pos-left','pos-right');
    appEl.classList.add('pos-'+p);
    try{ localStorage.setItem(SKEY_POS,p); }catch(_){}
    snapIntoView(document.getElementById('tab-add'));
  }

  /* タブ切替 */ /* L090 */
  function activateTab(btn){
    if(!btn) return;
    var views=document.querySelectorAll('.view'); for(var i=0;i<views.length;i++) views[i].classList.remove('active');
    var tabs=document.querySelectorAll('.tab'); for(var j=0;j<tabs.length;j++) tabs[j].classList.remove('active');
    btn.classList.add('active');
    var vid=btn.getAttribute('data-view'); if(vid){ var v=document.getElementById(vid); if(v) v.classList.add('active'); }
    snapIntoView(btn);
  }

  /* ラベル採番 */ /* L091 */
  function nextLabel(){
    var list=[].slice.call(document.querySelectorAll('.tab')).filter(function(n){
      return !n.classList.contains('add') && ['tab-map','tab-browser','tab-settings'].indexOf(n.id)===-1;
    });
    return '新規タブ '+(list.length+1);
  }

  /* 新規タブHTML */ /* L092 */
  function startContentHTML(viewId){
    return ''+
    '<div class="start" aria-label="リンク集">'+
      '<div class="card"><div style="font-size:24px">🗺️</div><div class="title">このタブで地図を表示</div>'+
      '<div class="row"><button class="btn" data-action="open-map-here" data-view="'+viewId+'" type="button">地図を表示</button></div></div>'+
      '<div class="card"><div style="font-size:24px">🧠</div><div class="title">Gemini</div>'+
      '<div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>'+
      '<div class="url">https://gemini.google.com/</div></div>'+
      '<div class="card"><div style="font-size:24px">💬</div><div class="title">ChatGPT</div>'+
      '<div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>'+
      '<div class="url">https://chatgpt.com/</div></div>'+
      '<div class="muted">※ リンクは新しいブラウザタブで開きます。本アプリは残ります。</div>'+
    '</div>'+
    '<iframe class="tabmap" id="'+viewId+'-map" title="タブ内地図" src="" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe>';
  }

  var tabCounter=0;
  function makeIds(){ tabCounter++; var id='user-'+Date.now()+'-'+tabCounter; return {tabId:'tab-'+id, viewId:'view-'+id}; }

  /* 状態保存 */ /* L093 */
  function persistTabs(){
    var nodes=[].slice.call(document.querySelectorAll('.tab')).filter(function(n){
      return !n.classList.contains('add') && ['tab-map','tab-browser','tab-settings'].indexOf(n.id)===-1;
    });
    var data=nodes.map(function(n){
      var viewId=n.getAttribute('data-view');
      var mapEl=document.getElementById(viewId+'-map');
      var mapOpened=!!(mapEl && mapEl.classList.contains('active') && mapEl.src && mapEl.src.indexOf('embed.html')!==-1);
      var label=(n.querySelector('.label')?n.querySelector('.label').textContent:n.textContent)||'';
      return {tabId:n.id, viewId:viewId, label:label, mapOpened:mapOpened};
    });
    var aiMap=document.getElementById('view-browser-map');
    var aiOpened=!!(aiMap && aiMap.classList.contains('active') && aiMap.src && aiMap.src.indexOf('embed.html')!==-1);
    try{ sessionStorage.setItem(SKEY_TABS, JSON.stringify({tabs:data, aiOpened:aiOpened})); }catch(_){}
  }

  /* 復元 */ /* L094 */
  function addTabFromState(state){
    var addBtn=document.getElementById('tab-add'); if(!addBtn) return;
    var tab=document.createElement('div');
    tab.className='tab'; tab.id=state.tabId; tab.setAttribute('data-view',state.viewId);
    tab.innerHTML='<span class="label">'+state.label+'</span><span class="close" data-close="'+state.viewId+'" aria-label="閉じる">×</span>';
    addBtn.parentNode.insertBefore(tab, addBtn);
    var view=document.createElement('div');
    view.className='view'; view.id=state.viewId; view.innerHTML=startContentHTML(state.viewId);
    document.getElementById('app').appendChild(view);
    if(state.mapOpened){ var m=document.getElementById(state.viewId+'-map'); if(m){ m.src='./embed.html'; m.classList.add('active'); } var s=view.querySelector('.start'); if(s) s.style.display='none'; }
  }

  function restoreTabs(){
    try{
      var saved=JSON.parse(sessionStorage.getItem(SKEY_TABS)||'{"tabs":[]}');
      (saved.tabs||[]).forEach(addTabFromState);
      if(saved.aiOpened){ var ai=document.getElementById('view-browser-map'); var s=document.querySelector('#view-browser .start'); if(ai){ ai.src='./embed.html'; ai.classList.add('active'); } if(s) s.style.display='none'; }
    }catch(_){}
  }

  /* 追加／削除 */ /* L095 */
  function addTab(label){
    var ids=makeIds(); var addBtn=document.getElementById('tab-add'); if(!addBtn) return;
    var tab=document.createElement('div');
    tab.className='tab'; tab.id=ids.tabId; tab.setAttribute('data-view',ids.viewId);
    tab.innerHTML='<span class="label">'+label+'</span><span class="close" data-close="'+ids.viewId+'" aria-label="閉じる">×</span>';
    addBtn.parentNode.insertBefore(tab, addBtn);
    tab.classList.add('flash'); setTimeout(function(){ tab.classList.remove('flash'); },200);
    var view=document.createElement('div');
    view.className='view'; view.id=ids.viewId; view.innerHTML=startContentHTML(ids.viewId);
    document.getElementById('app').appendChild(view);
    activateTab(tab); persistTabs(); snapIntoView(addBtn);
  }

  function closeTab(viewId){
    var tabs=[].slice.call(document.querySelectorAll('.tab'));
    var tab=tabs.find(function(t){ return t.getAttribute('data-view')===viewId; });
    var view=document.getElementById(viewId);
    if(!tab||!view) return;
    var isActive=tab.classList.contains('active');
    tab.remove(); view.remove(); persistTabs();
    if(isActive){ var mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab); }
  }

  /* 同タブ地図 */ /* L096 */
  function openMapHere(viewId){
    var v=document.getElementById(viewId); if(!v) return;
    var map=v.querySelector('.tabmap'); var s=v.querySelector('.start');
    if(map){ if(!map.src) map.src='./embed.html'; map.classList.add('active'); }
    if(s) s.style.display='none';
    persistTabs();
  }

  /* Aiブラウザ：タブ内ナビ（🏠のみ有効） */ /* L097 */
  function aiTabNav(action){
    var view=document.getElementById('view-browser'); if(!view) return;
    if(action==='home'){
      var s=view.querySelector('.start'); var m=view.querySelector('.tabmap');
      if(s) s.style.display='block';
      if(m) m.classList.remove('active');
    }
    // back/forward は将来のタブ内ブラウズ導入まで表示のみ
  }

  /* イベント登録（互換性重視） */ /* L098 */
  function bindEvents(){
    if(!tabsEl) return;
    tabsEl.addEventListener('click', function(e){
      var tgt=e.target;
      /* Aiブラウザのタブ内アイコン操作 */
      var mini=tgt && tgt.closest ? tgt.closest('.mini') : null;
      if(mini && mini.getAttribute('data-nav')){
        aiTabNav(mini.getAttribute('data-nav'));
        e.preventDefault(); e.stopPropagation(); return;
      }
      /* 通常のタブ切替／追加／クローズ */
      var btn=tgt && tgt.closest ? tgt.closest('.tab') : null; if(!btn) return;
      var close=tgt.closest ? tgt.closest('.close') : null;
      if(close){ closeTab(close.getAttribute('data-close')); return; }
      if(btn.id==='tab-add'){ addTab(nextLabel()); return; }
      if(btn.getAttribute('data-view')){ activateTab(btn); }
    });

    document.addEventListener('click', function(e){
      var b=e.target && e.target.closest ? e.target.closest('.btn') : null;
      if(b && b.getAttribute('data-action')==='open-map-here'){
        var vid=b.getAttribute('data-view'); if(vid) openMapHere(vid);
        e.preventDefault(); e.stopPropagation();
      }
    });

    document.addEventListener('keydown', function(e){
      if((e.key==='Enter'||e.key===' '||e.code==='Space')){
        var b=e.target && e.target.closest ? e.target.closest('.btn') : null;
        if(b && b.getAttribute('data-action')==='open-map-here'){
          var vid=b.getAttribute('data-view'); if(vid) openMapHere(vid);
          e.preventDefault(); e.stopPropagation();
        }
      }
    });
  }

  /* 設定UI */ /* L099 */
  function initPositionUI(){
    var saved='left'; try{ saved=localStorage.getItem(SKEY_POS)||saved; }catch(_){}
    setTabPosition(saved);
    var posEl=document.getElementById('posControls'); if(!posEl) return;
    var radios=[].slice.call(posEl.querySelectorAll('input[name="tabpos"]'));
    radios.forEach(function(r){ r.checked=(r.value===saved); });
    posEl.addEventListener('click', function(e){
      var lab=e.target && e.target.closest ? e.target.closest('label') : null; if(!lab) return;
      var input=lab.querySelector('input[name="tabpos"]'); if(!input) return;
      setTabPosition(input.value);
      radios.forEach(function(r){ r.checked=(r===input); });
    });
  }

  /* 初期化 */ /* L100 */
  function init(){
    initPositionUI();
    restoreTabs();
    activateTab(document.querySelector('.tab.active')||document.getElementById('tab-map'));
    snapIntoView(document.getElementById('tab-add'));
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', function(){ try{ bindEvents(); init(); }catch(_){ setTimeout(function(){ try{ bindEvents(); init(); }catch(__){} },0); } });
  }else{
    try{ bindEvents(); init(); }catch(_){ setTimeout(function(){ try{ bindEvents(); init(); }catch(__){} },0); }
  }
})();
</script> <!-- L101 -->
</body> <!-- L102 -->
</html> <!-- L103 -->
