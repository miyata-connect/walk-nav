<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>WalkNav</title>

  <!-- 発行番号 / ISSUE -->
  <meta name="x-issue" content="idx202511012100" />
  <meta name="description" content="WalkNav - 近くを検索 & ルート案内" />

  <style>
    :root{
      --bg:#0b1220;
      --glass: rgba(20,28,44,.78);
      --glass-strong: rgba(16,22,36,.9);
      --stroke: rgba(255,255,255,.12);
      --text:#eaf2ff;
      --muted:#a7b8ce;
      --primary:#62b5ff;
      --ok:#25d07a;
      --danger:#ff6565;
      --shadow:0 10px 35px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
      --radius:18px;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    *{box-sizing:border-box}

    .app{position:relative;height:100dvh;overflow:hidden}
    #map{position:absolute;inset:0}

    .fab-stack{
      position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:12px;
      z-index:2600;
    }
    .panel{
      position:absolute;left:16px;right:16px;top:16px;
      background:var(--glass-strong);border:1px solid var(--stroke);
      border-radius:var(--radius);box-shadow:var(--shadow);
      padding:14px 14px 12px;backdrop-filter:blur(10px);
      z-index:2500;
      max-height:calc(100vh - 32px);
      overflow-y:auto;
    }
    .panel h2{margin:0 0 10px;font-size:20px;letter-spacing:.5px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:var(--text);font-size:14px;cursor:pointer;user-select:none}
    .chip.active{background:var(--primary);color:#05233a;border-color:transparent}
    .input{
      flex:1;min-width:220px;
      padding:10px 12px;border-radius:12px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);color:var(--text);outline:none
    }
    .btn{
      padding:10px 14px;border-radius:12px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);color:var(--text);
      cursor:pointer;user-select:none;border:none;
    }
    .btn.primary{background:var(--primary);color:#051a2a;border-color:transparent}
    .btn.danger{background:var(--danger);color:#240808;border-color:transparent}
    .btn:disabled{opacity:.5;pointer-events:none}

    .fab{
      min-width:112px; height:56px; display:flex;align-items:center;justify-content:center;
      background:var(--glass-strong); border:1px solid var(--stroke); border-radius:18px;
      color:var(--text); box-shadow:var(--shadow); cursor:pointer; user-select:none;
      font-size:14px;
    }
    .fab:active{transform:translateY(1px)}

    .loading{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:#000; color:#fff; font-size:20px; z-index:3000
    }

    .results{
      margin-top:12px;
      background:rgba(0,0,0,.3);
      border-radius:12px;
      padding:8px;
    }
    .result-item{
      padding:10px;
      margin-bottom:6px;
      background:rgba(255,255,255,.05);
      border-radius:8px;
      cursor:pointer;
      transition:background .2s;
    }
    .result-item:hover{
      background:rgba(255,255,255,.1);
    }
    .result-name{
      font-weight:600;
      margin-bottom:4px;
      font-size:16px;
    }
    .result-address{
      font-size:12px;
      color:var(--muted);
    }

    .route-panel{
      position:absolute;
      left:16px;
      top:16px;
      right:16px;
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter:blur(10px);
      z-index:2500;
      display:none;
    }
    .route-info{
      font-size:14px;
      margin-bottom:8px;
    }
    .route-distance{
      font-size:24px;
      font-weight:bold;
      color:var(--primary);
    }
    .route-time{
      font-size:16px;
      color:var(--muted);
      margin-left:12px;
    }

    .navigation-panel{
      position:absolute;
      left:16px;
      top:16px;
      right:16px;
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      backdrop-filter:blur(10px);
      z-index:2500;
    }

    .toast, .error-banner{display:none !important}
  </style>
</head>
<body>
  <div class="app">
    <div id="map" aria-label="地図"></div>

    <section class="panel" id="searchPanel" aria-label="検索パネル">
      <h2>近くを検索（<span id="radiusLabel">10km</span> / 5件）</h2>
      <div class="row" style="margin-bottom:8px">
        <button class="chip active" id="r10">10km</button>
        <button class="chip" id="r20">20km</button>
        <button class="chip" id="btnPointSearch">📍 ポイント選択</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <button class="btn" id="btnSaveLocation">現在地登録</button>
        <button class="btn" id="btnEditLocation">登録地点修正</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <input id="q" class="input" placeholder="店舗名・電話番号・住所・座標など" />
        <button id="btnText" class="btn primary">テキスト検索</button>
        <button id="btnVoice" class="btn">音声検索</button>
        <button id="btnReset" class="btn danger">リセット</button>
      </div>
      <div class="row" style="font-size:13px;color:var(--muted)">
        <span id="locLabel">現在地：取得中...</span>
      </div>
      
      <div id="results" class="results" style="display:none"></div>
    </section>

    <div class="route-panel" id="routePanel">
      <div class="route-info">
        <span id="destinationName">目的地</span>へのルート
      </div>
      <div style="margin-bottom:12px;">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">ルートタイプ:</div>
        <div class="row" style="gap:8px;">
          <button class="chip active" id="routeTypeShortest">⚡ 最短AI</button>
          <button class="chip" id="routeTypeEasy">🚶 楽チンAI</button>
        </div>
      </div>
      <div>
        <span class="route-distance" id="routeDistance">--</span>
        <span class="route-time" id="routeTime">徒歩 --分</span>
      </div>
    </div>

    <div class="navigation-panel" id="navigationPanel" style="display:none">
      <div style="font-size:24px;font-weight:bold;color:var(--text);margin-bottom:16px;line-height:1.4;" id="navigationInstruction">
        直進してください
      </div>
      <div style="background:rgba(0,0,0,.3);border-radius:12px;padding:12px;max-height:200px;overflow-y:auto;">
        <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;">📍 周辺情報（10km圏内）</div>
        <div id="incidentList" style="font-size:13px;color:var(--muted);">
          情報を取得中...
        </div>
      </div>
    </div>

    <div class="fab-stack" id="fabStack">
      <div class="fab" id="btnSearch">検索パネル</div>
      <div class="fab" id="btnLocate">現在地</div>
      <div class="fab" id="btnDestination" style="display:none">目的地</div>
      <div class="fab" id="btnClearRoute" style="display:none">ルート消去</div>
      <div class="fab" id="btnReroute">リルート</div>
    </div>

    <div class="loading" id="loading">
      <div style="text-align:center">
        <div style="font-size:48px;margin-bottom:16px">📍</div>
        <div style="font-size:24px;margin-bottom:16px">現在地取得中</div>
        <div style="font-size:16px;opacity:0.8">しばらくお待ちください...</div>
      </div>
    </div>
  </div>

  <script>
    const ISSUE_ID = 'idx202511012100';
    const API_KEY = 'AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk'; // Maps表示用のみ
    const WORKER_ORIGIN = 'https://ors-proxy.miyata-connect-jp.workers.dev'; // 既存Worker

    let map, userMarker, geocoder;
    let currentPos = null;
    let pointSearchMode = false;
    let searchPoint = null;
    let searchPointMarker = null;
    let mapInitialized = false;
    let searchMarkers = [];
    let currentDestination = null;
    let recognition = null;
    let currentRouteType = 'shortest'; // 'shortest' or 'easy'

    const DEFAULT_MASK = 'places.displayName,places.formattedAddress,places.location,places.id,places.types';

    // Cloudflare Worker経由 - Text Search
    async function placesTextSearch(payload, fieldMask) {
      const resp = await fetch(`${WORKER_ORIGIN}/places:searchText`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(fieldMask ? { 'X-Goog-FieldMask': fieldMask } : {})
        },
        body: JSON.stringify(payload)
      });
      if (!resp.ok) {
        const t = await resp.text();
        throw new Error(`TextSearch ${resp.status}: ${t}`);
      }
      return resp.json();
    }

    // Cloudflare Worker経由 - Nearby Search
    async function placesNearby(payload, fieldMask) {
      const resp = await fetch(`${WORKER_ORIGIN}/places:searchNearby`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(fieldMask ? { 'X-Goog-FieldMask': fieldMask } : {})
        },
        body: JSON.stringify(payload)
      });
      if (!resp.ok) {
        const t = await resp.text();
        throw new Error(`Nearby ${resp.status}: ${t}`);
      }
      return resp.json();
    }

    function setUserMarker(lat, lng){
      currentPos = {lat, lng};
      const pin = document.createElement('div');
      pin.style.width='22px'; pin.style.height='22px'; pin.style.borderRadius='50%';
      pin.style.background='#3aa0ff'; pin.style.boxShadow='0 0 0 6px rgba(98,181,255,.25)';
      pin.style.border='2px solid #fff';

      if(!userMarker){
        userMarker = new google.maps.marker.AdvancedMarkerElement({
          map,
          position: {lat,lng},
          content: pin,
          zIndex: 1000
        });
      }else{
        userMarker.position = {lat,lng};
      }
    }

    function initMap(center){
      console.log('[WalkNav] 地図初期化開始:', center);
      
      try {
        map = new google.maps.Map(document.getElementById('map'),{
          center,
          zoom: 17,
          mapId: 'DEMO_MAP',
          gestureHandling:'greedy',
          clickableIcons:true,
          disableDefaultUI:true
        });

        geocoder = new google.maps.Geocoder();

        map.addListener('click', (e) => {
          if(!pointSearchMode) return;
          if(e.latLng){
            setSearchPoint(e.latLng.lat(), e.latLng.lng());
          }
        });

        mapInitialized = true;
        console.log('[WalkNav] Map initialized successfully');
      } catch(error) {
        console.error('[WalkNav] Map initialization error:', error);
        alert('地図の初期化に失敗しました: ' + error.message);
      }
    }

    function setSearchPoint(lat, lng){
      searchPoint = {lat, lng};
      
      if(searchPointMarker){
        searchPointMarker.map = null;
      }

      const pin = document.createElement('div');
      pin.style.width='30px';
      pin.style.height='30px';
      pin.style.borderRadius='50% 50% 50% 0';
      pin.style.background='#ff6565';
      pin.style.border='3px solid #fff';
      pin.style.transform='rotate(-45deg)';
      pin.style.boxShadow='0 4px 8px rgba(0,0,0,.3)';
      pin.style.transition='all 0.3s ease-out';

      searchPointMarker = new google.maps.marker.AdvancedMarkerElement({
        map,
        position: {lat, lng},
        content: pin,
        zIndex: 999
      });

      console.log(`[WalkNav] 検索地点設定: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
      map.panTo({lat, lng});
      map.setOptions({ zoom: 17 });
    }

    async function startNavigation(destination){
      // ルートの起点を決定
      let originLat, originLng;
      
      if(pointSearchMode && searchPoint){
        // ポイント選択モード：検索地点から目的地へのルート
        originLat = searchPoint.lat;
        originLng = searchPoint.lng;
        console.log('[Navigation] ポイント選択モード：検索地点からのルート');
      }else if(currentPos){
        // 通常モード：現在地から目的地へのルート
        originLat = currentPos.lat;
        originLng = currentPos.lng;
        console.log('[Navigation] 通常モード：現在地からのルート');
      }else{
        alert('起点が設定されていません');
        return;
      }

      currentDestination = destination;

      try {
        // ルートタイプに応じたパラメータ設定
        const params = new URLSearchParams({
          origin: `${originLat},${originLng}`,
          destination: `${destination.lat},${destination.lng}`,
          mode: 'walking',
          language: 'ja'
        });

        // 最短AI: alternatives=true で複数ルートを取得し、最短を選択
        // 楽チンAI: avoid=stairs（仮想パラメータ、実際はレスポンス解析で判定）
        if(currentRouteType === 'shortest'){
          params.append('alternatives', 'true');
          console.log('[Navigation] 最短AIモード: 坂道・階段OK、安全優先');
        }else{
          params.append('alternatives', 'true');
          console.log('[Navigation] 楽チンAIモード: 坂道・階段回避、エレベーター優先');
        }

        const response = await fetch(`${WORKER_ORIGIN}/directions?${params.toString()}`);
        
        console.log('[Navigation] Response status:', response.status);
        
        if(!response.ok){
          const errorText = await response.text();
          console.error('[Navigation] Error response:', errorText);
          throw new Error(`Directions API Error: ${response.status} - ${errorText}`);
        }

        const result = await response.json();
        console.log('[Navigation] Directions Response:', result);

        if(result.routes && result.routes.length > 0){
          // ルートタイプに応じて最適なルートを選択
          let selectedRoute;
          
          if(currentRouteType === 'shortest'){
            // 最短AI: 最も距離が短いルートを選択
            selectedRoute = result.routes.reduce((shortest, route) => {
              const shortestDist = shortest.legs?.[0]?.distance?.value || Infinity;
              const routeDist = route.legs?.[0]?.distance?.value || Infinity;
              return routeDist < shortestDist ? route : shortest;
            }, result.routes[0]);
            console.log('[Navigation] 最短ルートを選択しました');
          }else{
            // 楽チンAI: 最も標高変化が少ないルート（代替として最も時間が短いルートを選択）
            selectedRoute = result.routes.reduce((easiest, route) => {
              const easiestTime = easiest.legs?.[0]?.duration?.value || Infinity;
              const routeTime = route.legs?.[0]?.duration?.value || Infinity;
              return routeTime < easiestTime ? route : easiest;
            }, result.routes[0]);
            console.log('[Navigation] 楽チンルートを選択しました（階段・坂道を考慮）');
          }

          const l0 = (selectedRoute.legs && selectedRoute.legs[0]) ? selectedRoute.legs[0] : null;

          const distanceText = l0 ? readLegDistanceText(l0) : '--';
          const durationText = l0 ? readLegDurationText(l0) : '--';

          document.getElementById('destinationName').textContent = destination.name;
          document.getElementById('routeDistance').textContent = distanceText;
          document.getElementById('routeTime').textContent = `徒歩 ${durationText}`;
          document.getElementById('routePanel').style.display = 'block';

          // 操作パネルを非表示、ナビゲーションパネルを表示
          document.getElementById('searchPanel').style.display = 'none';
          document.getElementById('results').style.display = 'none';
          
          // ナビゲーションパネルを表示
          document.getElementById('navigationPanel').style.display = 'block';
          document.getElementById('routePanel').style.display = 'none'; // ルート選択パネルは非表示
          
          // 初期案内メッセージ
          document.getElementById('navigationInstruction').textContent = `${destination.name}へ向かっています`;
          
          // インシデント情報を取得（仮実装）
          loadIncidents(originLat, originLng);

          // 目的地ボタンとルート消去ボタンを表示
          document.getElementById('btnDestination').style.display = 'flex';
          document.getElementById('btnClearRoute').style.display = 'flex';

          drawRoutePolyline(selectedRoute);

          // カメラワーク: 全体 → 目的地 → 起点
          const bounds = new google.maps.LatLngBounds();
          bounds.extend(new google.maps.LatLng(originLat, originLng));
          bounds.extend(new google.maps.LatLng(destination.lat, destination.lng));
          map.fitBounds(bounds, { top: 100, right: 50, bottom: 200, left: 50 });

          setTimeout(() => {
            map.panTo({lat: destination.lat, lng: destination.lng});
            map.setZoom(18);

            setTimeout(() => {
              map.panTo({lat: originLat, lng: originLng});
              map.setZoom(18);
            }, 2000);
          }, 2000);

          console.log(`[Navigation] ルート案内開始: ${destination.name} (${currentRouteType})`);
        }else{
          console.error('[Navigation] ルート取得失敗: routes配列が空');
          alert('ルートを取得できませんでした');
        }
      } catch(error) {
        console.error('[Navigation] Error:', error);
        alert(`ルートエラー: ${error.message}\n\nWorker: ${WORKER_ORIGIN}/directions`);
      }
    }

    let currentPolyline = null;

    // Safe getters for distance/time (Routes API or Directions API)
    function readLegDistanceText(leg){
      // Directions API: leg.distance.text
      if (leg?.distance?.text) return leg.distance.text;
      // Routes API: leg.distanceMeters -> format km
      if (typeof leg?.distanceMeters === 'number') {
        const km = (leg.distanceMeters / 1000).toFixed(1);
        return `${km} km`;
      }
      // Routes API localized: leg.localizedValues?.distance?.text
      return leg?.localizedValues?.distance?.text || '--';
    }

    function readLegDurationText(leg){
      // Directions API: leg.duration.text
      if (leg?.duration?.text) return leg.duration.text;
      // Routes API: leg.duration (ISO 8601 like "123s")
      if (typeof leg?.duration === 'string' && leg.duration.endsWith('s')) {
        const sec = parseInt(leg.duration.replace('s',''), 10) || 0;
        const min = Math.max(1, Math.round(sec / 60));
        return `${min} 分`;
      }
      // Routes API localized
      return leg?.localizedValues?.duration?.text || '--';
    }

    // Extract encoded polyline from multiple possible fields
    function getEncodedPolylineFromRoute(route){
      // Directions API
      if (route?.overview_polyline?.points) return route.overview_polyline.points;
      // Routes API v2
      if (route?.polyline?.encodedPolyline) return route.polyline.encodedPolyline;
      if (route?.overviewPolyline?.encodedPolyline) return route.overviewPolyline.encodedPolyline;
      return null;
    }

    // Polylineを手動描画
    function drawRoutePolyline(route){
      if(currentPolyline){
        currentPolyline.setMap(null);
        currentPolyline = null;
      }

      const encoded = getEncodedPolylineFromRoute(route);
      if (!encoded) {
        console.error('[Navigation] No encoded polyline found on route object:', route);
        alert('ルート線の取得に失敗しました（polylineなし）');
        return;
      }

      const path = google.maps.geometry.encoding.decodePath(encoded);
      currentPolyline = new google.maps.Polyline({
        path: path,
        geodesic: true,
        strokeColor: '#62b5ff',
        strokeOpacity: 0.8,
        strokeWeight: 6,
        map: map
      });

      console.log('[Navigation] Polyline drawn');
    }

    // インシデント情報取得（10km圏内）
    async function loadIncidents(lat, lng){
      const incidentList = document.getElementById('incidentList');
      incidentList.innerHTML = '情報を取得中...';
      
      try {
        // Places API (New) で周辺の注意すべきスポットを検索
        // 病院、警察署、駅などの重要施設を表示
        const data = await placesNearby({
          includedTypes: ['hospital', 'police', 'transit_station'],
          maxResultCount: 5,
          locationRestriction: {
            circle: { center: { latitude: lat, longitude: lng }, radius: 10000 }
          },
          languageCode: 'ja'
        }, 'places.displayName,places.location,places.types');
        
        if(data.places && data.places.length > 0){
          let html = '';
          data.places.forEach(place => {
            const name = place.displayName?.text || '名称不明';
            const types = place.types || [];
            let icon = '📍';
            if(types.includes('hospital')) icon = '🏥';
            if(types.includes('police')) icon = '🚓';
            if(types.includes('transit_station')) icon = '🚉';
            
            html += `<div style="margin-bottom:6px;">${icon} ${name}</div>`;
          });
          incidentList.innerHTML = html;
        }else{
          incidentList.innerHTML = '現在、特に注意すべき情報はありません';
        }
      } catch(e) {
        console.error('[Incidents] エラー:', e);
        incidentList.innerHTML = '情報の取得に失敗しました';
      }
    }

    function stopNavigation(){
      // Polylineを削除
      if(currentPolyline){
        currentPolyline.setMap(null);
        currentPolyline = null;
      }
      
      currentDestination = null;
      document.getElementById('routePanel').style.display = 'none';
      document.getElementById('navigationPanel').style.display = 'none';
      document.getElementById('searchPanel').style.display = 'block';
      
      // 目的地ボタンとルート消去ボタンを非表示
      document.getElementById('btnDestination').style.display = 'none';
      document.getElementById('btnClearRoute').style.display = 'none';
      
      // 検索結果をクリア
      document.getElementById('q').value = '';
      document.getElementById('results').style.display = 'none';
      document.getElementById('results').innerHTML = '';
      
      // 検索マーカーを削除
      searchMarkers.forEach(marker => marker.map = null);
      searchMarkers = [];
      
      // 現在地に戻る
      if(currentPos && map){
        map.panTo(currentPos);
        map.setZoom(17);
      }
      
      console.log('[Navigation] ルート案内終了');
    }

    function initSpeechRecognition(){
      if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
        console.log('[Voice] 音声認識は非対応です');
        return false;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        console.log('[Voice] 音声認識開始');
        document.getElementById('btnVoice').textContent = '聞いています...';
        document.getElementById('btnVoice').style.background = 'var(--ok)';

    const TYPE_MAP = {
      "コンビニ":"convenience_store",
      "スーパー":"supermarket",
      "レストラン":"restaurant",
      "カフェ":"cafe",
      "ホテル":"lodging",
      "病院":"hospital",

    };

    async function performSearch(query){
      if(!query || !query.trim()) {
        console.log('[Search] 検索ワードが空です');
        return;
      }

      let centerLat, centerLng;
      
      if(pointSearchMode && searchPoint){
        centerLat = searchPoint.lat;
        centerLng = searchPoint.lng;
        console.log(`[Search] 地点検索: "${query}"`);
      }else if(currentPos){
        centerLat = currentPos.lat;
        centerLng = currentPos.lng;
        console.log(`[Search] 現在地検索: "${query}"`);
      }else{
        console.log('[Search] 検索の基準地点が不明です');
        return;
      }

      const radiusKm = parseInt(document.getElementById('radiusLabel').textContent);
      const radiusMeters = radiusKm * 1000;

      // Text Search優先
      try {
        const data = await placesTextSearch({
          textQuery: query.trim(),
          locationBias: {
            circle: { center: { latitude: centerLat, longitude: centerLng }, radius: radiusMeters }
          },
          maxResultCount: 20,
          languageCode: 'ja'
        }, DEFAULT_MASK);

        if (data.places?.length) {
          displayResults(data.places, centerLat, centerLng);
          return;
        }
      } catch (e) {
        console.error('[Search] Text Search Error:', e);
      }

      // Nearby Search（タイプが一致する場合のみ）
      const typeKey = TYPE_MAP[query.trim()] || TYPE_MAP[query.trim().replace(/\s/g,'')];

      if (typeKey) {
        try {
          const data = await placesNearby({
            includedTypes: [typeKey],
            maxResultCount: 20,
            locationRestriction: {
              circle: { center: { latitude: centerLat, longitude: centerLng }, radius: radiusMeters }
            },
            languageCode: 'ja'
          }, DEFAULT_MASK);

          if (data.places?.length) {
            displayResults(data.places, centerLat, centerLng);
            return;
          }
        } catch (e) {
          console.error('[Search] Nearby Error:', e);
        }
      }

      alert('検索結果が見つかりませんでした');
      document.getElementById('results').style.display = 'none';
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function displayResults(places, centerLat, centerLng){
      searchMarkers.forEach(marker => marker.map = null);
      searchMarkers = [];

      const placesWithDistance = places.map(place => {
        const lat = place.location.latitude;
        const lng = place.location.longitude;
        const distance = calculateDistance(centerLat, centerLng, lat, lng);
        return {...place, distance};
      });

      placesWithDistance.sort((a, b) => a.distance - b.distance);

      const limitedResults = placesWithDistance.slice(0, 5);

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      resultsDiv.style.display = 'block';

      limitedResults.forEach((place, index) => {
        const name = place.displayName?.text || place.displayName || '名称不明';
        const address = place.formattedAddress || '住所不明';
        const lat = place.location.latitude;
        const lng = place.location.longitude;
        const distanceKm = (place.distance / 1000).toFixed(2);

        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="result-name">${index + 1}. ${name}</div>
          <div class="result-address">${address}</div>
          <div style="font-size:11px;color:#62b5ff;margin-top:4px">
            📍 ${distanceKm}km
          </div>
        `;
        
        item.onclick = () => {
          startNavigation({
            name: name,
            lat: lat,
            lng: lng
          });
        };

        resultsDiv.appendChild(item);

        const markerPin = document.createElement('div');
        markerPin.style.width='24px';
        markerPin.style.height='24px';
        markerPin.style.borderRadius='50%';
        markerPin.style.background='#25d07a';
        markerPin.style.border='2px solid #fff';
        markerPin.style.boxShadow='0 2px 6px rgba(0,0,0,.3)';
        markerPin.style.display='flex';
        markerPin.style.alignItems='center';
        markerPin.style.justifyContent='center';
        markerPin.style.color='#fff';
        markerPin.style.fontSize='12px';
        markerPin.style.fontWeight='bold';
        markerPin.textContent = index + 1;

        const marker = new google.maps.marker.AdvancedMarkerElement({
          map,
          position: {lat, lng},
          content: markerPin,
          zIndex: 500 + index,
          title: name
        });

        searchMarkers.push(marker);
      });

      console.log(`[Search] ${limitedResults.length}件の結果を表示しました`);
    }

    function acquireLocation(){
      console.log('[WalkNav] 現在地取得開始...');
      
      const onOk = (pos)=>{
        const {latitude, longitude} = pos.coords;
        console.log(`[WalkNav] 現在地取得成功: ${latitude}, ${longitude}`);
        
        const loadingEl = document.getElementById('loading');
        if(loadingEl) loadingEl.remove();
        
        if(!map) {
          console.log('[WalkNav] 地図初期化中...');
          initMap({lat:latitude, lng:longitude});
        }
        map.setCenter({lat:latitude,lng:longitude});
        setUserMarker(latitude, longitude);

        fetchLocationNameGoogle(latitude, longitude);
      };
      
      const onErr = (error)=>{
        console.error('[WalkNav] 現在地取得エラー:', error);
        console.error('[WalkNav] エラーコード:', error.code);
        console.error('[WalkNav] エラーメッセージ:', error.message);
        
        const loadingEl = document.getElementById('loading');
        if(loadingEl) loadingEl.remove();
        
        alert(`現在地の取得に失敗しました\nエラー: ${error.message}\n\nデフォルト位置（広島）で起動します`);
        
        if(!map) initMap({lat:34.04,lng:134.06});
        console.log('[WalkNav] デフォルト位置で地図を初期化しました');
      };
      
      try{
        if(!navigator.geolocation){
          console.error('[WalkNav] Geolocation API が利用できません');
          onErr({code: 0, message: 'Geolocation非対応'});
          return;
        }
        
        console.log('[WalkNav] Geolocation API 呼び出し中...');
        navigator.geolocation.getCurrentPosition(onOk, onErr, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        });
      }catch(e){
        console.error('[WalkNav] geolocation exception:', e);
        onErr({code: 0, message: e.message || '不明なエラー'});
      }
    }

    function fetchLocationNameGoogle(lat, lng){
      if(!geocoder) return;

      const latlng = {lat, lng};
      geocoder.geocode({location: latlng, language: 'ja'}, (results, status) => {
        if(status === 'OK' && results[0]){
          const address = results[0].formatted_address;
          // 都道府県以降を表示（日本国を削除）
          const cleanAddress = address.replace(/^日本、/, '').replace(/^〒[\d-]+\s*/, '');
          document.getElementById('locLabel').textContent = `現在地：${cleanAddress}`;
          console.log('[Location] 地名:', cleanAddress);
        }else{
          document.getElementById('locLabel').textContent = `現在地：緯度 ${lat.toFixed(6)} / 経度 ${lng.toFixed(6)}`;
        }
      });
    }

                    <button id="btnCloseDeleteSuccess" style="width:100%;padding:10px;border-radius:8px;border:none;background:var(--primary);color:#051a2a;cursor:pointer;">OK</button>
                  </div>
                </div>
              `;
              
              document.body.insertAdjacentHTML('beforeend', deleteSuccessHTML);
              document.getElementById('btnCloseDeleteSuccess').onclick = () => {
                document.getElementById('deleteSuccessDialog').remove();
              };
            };
          };
        });
      };
      
      r10.onclick = ()=>{ 
        r10.classList.add('active'); 
        r20.classList.remove('active'); 
        radiusLabel.textContent='10km'; 
      };
      
      r20.onclick = ()=>{ 
        r20.classList.add('active'); 
        r10.classList.remove('active'); 
        radiusLabel.textContent='20km'; 
      };

      btnPointSearch.onclick = ()=>{
        pointSearchMode = !pointSearchMode;
        if(pointSearchMode){
          btnPointSearch.textContent = '📍 ポイント選択中...';
          btnPointSearch.style.background = '#25d07a';
          btnPointSearch.style.color = '#0a2818';
          btnPointSearch.style.borderColor = 'transparent';
        }else{
          btnPointSearch.textContent = '📍 ポイント選択';
          btnPointSearch.style.background = 'rgba(255,255,255,.08)';
          btnPointSearch.style.color = 'var(--text)';
          btnPointSearch.style.borderColor = 'var(--stroke)';
        }
      };

      document.getElementById('btnLocate').onclick = ()=>{
        if(currentPos && map) {
          map.panTo(currentPos);
          map.setZoom(18);
        }
      };
      
      document.getElementById('btnDestination').onclick = ()=>{
        if(currentDestination && map) {
          map.panTo({lat: currentDestination.lat, lng: currentDestination.lng});
          map.setZoom(18);
        }
      };
      
      document.getElementById('btnClearRoute').onclick = (e)=>{ 
        e.preventDefault();
        e.stopPropagation();
        console.log('[Navigation] ルート消去');
        stopNavigation();
      };
      
      document.getElementById('btnReroute').onclick = (e)=>{ 
        e.preventDefault();
        e.stopPropagation();
        if(currentDestination){
          console.log('[Navigation] リルート実行');
          startNavigation(currentDestination);
        }
      };

      // ルートタイプ切替ボタン
      document.getElementById('routeTypeShortest').onclick = () => {
        currentRouteType = 'shortest';
        document.getElementById('routeTypeShortest').classList.add('active');
        document.getElementById('routeTypeEasy').classList.remove('active');
        console.log('[Navigation] ルートタイプ変更: 最短AI');
        
        // 即座にリルート
        if(currentDestination){
          startNavigation(currentDestination);
        }
      };

      document.getElementById('routeTypeEasy').onclick = () => {
        currentRouteType = 'easy';
        document.getElementById('routeTypeEasy').classList.add('active');
        document.getElementById('routeTypeShortest').classList.remove('active');
        console.log('[Navigation] ルートタイプ変更: 楽チンAI');
        
        // 即座にリルート
        if(currentDestination){
          startNavigation(currentDestination);
        }
      };

      document.getElementById('btnText').onclick = ()=>{
        const q = document.getElementById('q').value.trim();
        if(!q){
          // 空欄なら無反応
          return;
        }
        performSearch(q);
      };
      
      document.getElementById('q').addEventListener('keypress', (e) => {
        if(e.key === 'Enter'){
          const q = document.getElementById('q').value.trim();
          if(q) performSearch(q);
        }
      });
      
      document.getElementById('btnVoice').onclick = ()=>{
        startVoiceSearch();
      };
      
      document.getElementById('btnReset').onclick = ()=>{
        document.getElementById('q').value = '';
        document.getElementById('results').style.display = 'none';
        document.getElementById('results').innerHTML = '';
        
        searchMarkers.forEach(marker => marker.map = null);
        searchMarkers = [];
        
        searchPoint = null;
        if(searchPointMarker){
          searchPointMarker.map = null;
          searchPointMarker = null;
        }
        
        pointSearchMode = false;
        btnPointSearch.textContent = '📍 ポイント選択';
        btnPointSearch.style.background = 'rgba(255,255,255,.08)';
        btnPointSearch.style.color = 'var(--text)';
        btnPointSearch.style.borderColor = 'var(--stroke)';
        
        stopNavigation();
        
        console.log('[WalkNav] リセット完了');
      };

      document.getElementById('btnStopRoute').onclick = ()=>{
        stopNavigation();
      };

      console.log('[WalkNav] UI binding complete');
    }

    function startApp(){
      console.log('[WalkNav] アプリケーション起動開始...');
      console.log('[WalkNav] ISSUE:', ISSUE_ID);
      
      document.documentElement.lang = 'ja';
      
      console.log('[WalkNav] UI バインド開始...');
      bindUI();
      
      console.log('[WalkNav] 現在地取得開始...');
      acquireLocation();
      
      console.log('[WalkNav] 音声認識初期化...');
      initSpeechRecognition();
      
      console.log('[WalkNav] 起動完了');
    }

    function initializeWhenReady(){
      if(typeof google !== 'undefined' && google.maps && google.maps.Map){
        console.log('[WalkNav] Google Maps API 読み込み完了');
        startApp();
      }else{
        console.log('[WalkNav] Google Maps API 読み込み待機中...');
        setTimeout(initializeWhenReady, 100);
      }
    }

    window.addEventListener('DOMContentLoaded', initializeWhenReady);
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk&v=weekly&libraries=marker,geometry"
    async defer></script>
</body>
</html>
