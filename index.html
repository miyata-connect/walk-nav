<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WalkNav v2.4</title>
<style>
:root{
  --glass:rgba(20,28,44,.7);
  --glass-strong:rgba(16,22,36,.85);
  --stroke:rgba(255,255,255,.14);
  --text:#eaf2ff;
  --muted:#a7b8ce;
  --primary:#5fb1ff;
  --ok:#25d07a;
  --danger:#ff6565;
  --accent:#64d2ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a1321;color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.app{position:relative;height:100dvh;overflow:hidden}
#map{position:absolute;inset:0;display:none}

/* ローディング画面 */
.loading-screen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#0a1321 0%,#1e2a3e 100%);
  z-index:10000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:opacity .3s,visibility .3s;
}
.loading-screen.fade-out{opacity:0;visibility:hidden}
.loading-logo{font-size:48px;margin-bottom:20px;animation:walk 1.5s infinite}
.loading-text{font-size:18px;color:var(--muted)}
@keyframes walk{
  0%{transform:translateX(-30px) translateY(0) rotate(-5deg)}
  25%{transform:translateX(-15px) translateY(-5px) rotate(0deg)}
  50%{transform:translateX(0) translateY(0) rotate(5deg)}
  75%{transform:translateX(15px) translateY(-5px) rotate(0deg)}
  100%{transform:translateX(30px) translateY(0) rotate(-5deg)}
}

/* 現在地パネル */
.location-panel{
  position:absolute;
  top:10px;
  left:10px;
  right:80px;
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:12px;
  padding:12px;
  backdrop-filter:blur(10px);
  z-index:400;
  display:none;
}
.location-text{
  font-size:13px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px;
}
.location-text .icon{font-size:16px}

/* 検索パネル */
.search-panel{
  position:absolute;
  bottom:10px;
  left:10px;
  right:80px;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:12px;
  padding:12px;
  backdrop-filter:blur(14px);
  z-index:450;
  display:none;
  max-height:60vh;
  overflow-y:auto;
}
.search-box{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.search-input{
  flex:1;
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:10px;
  color:var(--text);
  font-size:14px;
}
.search-input::placeholder{color:var(--muted)}
.search-button{
  background:var(--primary);
  border:none;
  border-radius:8px;
  padding:10px 16px;
  color:#000;
  font-weight:600;
  cursor:pointer;
  transition:transform .1s;
}
.search-button:active{transform:scale(.95)}

.search-results{
  max-height:300px;
  overflow-y:auto;
}
.result-item{
  background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:10px;
  margin-bottom:8px;
  cursor:pointer;
  transition:background .2s;
}
.result-item:hover{background:rgba(255,255,255,.08)}
.result-name{
  font-size:14px;
  font-weight:600;
  margin-bottom:4px;
}
.result-address{
  font-size:12px;
  color:var(--muted);
  margin-bottom:4px;
}
.result-distance{
  font-size:11px;
  color:var(--accent);
}

/* ルートパネル */
.route-panel{
  position:absolute;
  top:10px;
  left:10px;
  right:80px;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:12px;
  padding:16px;
  backdrop-filter:blur(14px);
  z-index:480;
  display:none;
}
.route-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.route-stats{
  display:flex;
  gap:20px;
}
.route-stat{
  display:flex;
  flex-direction:column;
}
.stat-label{
  font-size:11px;
  color:var(--muted);
  margin-bottom:2px;
}
.stat-value{
  font-size:20px;
  font-weight:700;
  color:var(--accent);
}

/* 右側FABボタン */
.fab-container{
  position:fixed;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:470;
}
.fab-btn{
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform .2s;
  color:var(--text);
  font-size:24px;
  position:relative;
}
.fab-btn:active{transform:scale(.9)}
.fab-btn.active{
  background:var(--ok);
  color:#000;
}

/* トースト通知 */
.toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:12px 20px;
  backdrop-filter:blur(10px);
  z-index:800;
  opacity:0;
  transition:transform .3s,opacity .3s;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
.toast.success{border-color:var(--ok);color:var(--ok)}
.toast.error{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>
<div class="app">
  <!-- 地図 -->
  <div id="map"></div>
  
  <!-- ローディング画面 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-logo">🚶</div>
    <div class="loading-text">WalkNav v2.4</div>
  </div>
  
  <!-- 現在地表示パネル -->
  <div class="location-panel" id="locationPanel">
    <div class="location-text">
      <span class="icon">📍</span>
      <span id="locationText">現在地を取得中...</span>
    </div>
  </div>
  
  <!-- ルート案内パネル -->
  <div class="route-panel" id="routePanel">
    <div class="route-info">
      <div class="route-stats">
        <div class="route-stat">
          <div class="stat-label">距離</div>
          <div class="stat-value" id="routeDistance">--</div>
        </div>
        <div class="route-stat">
          <div class="stat-label">徒歩</div>
          <div class="stat-value" id="routeDuration">--</div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 検索パネル -->
  <div class="search-panel" id="searchPanel">
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="場所を検索...">
      <button class="search-button" onclick="searchPlaces()">検索</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
  
  <!-- 右側FABボタン群 -->
  <div class="fab-container" id="fabContainer">
    <button class="fab-btn" id="fabSearch" onclick="toggleSearchPanel()" title="検索パネル">🔍</button>
    <button class="fab-btn" id="fabCurrentLocation" onclick="moveToCurrentLocation()" title="現在地">📍</button>
    <button class="fab-btn" id="fabDestination" onclick="setDestinationMode()" title="目的地設定">🎯</button>
    <button class="fab-btn" id="fabReroute" onclick="rerouteNavigation()" title="リルート" style="display:none">🔄</button>
  </div>
  
  <!-- トースト通知 -->
  <div class="toast" id="toast"></div>
</div>

<script>
// グローバル変数
let map;
let currentPos = null;
let currentMarker = null;
let destMarker = null;
let searchMarkers = [];
let routePolyline = null;
let destinationMode = false;
let isNavigating = false;

// Worker URL
const WORKER_URL = 'https://ors-proxy.miyata-connect-jp.workers.dev';

// APIキー(固定)
const API_KEY = 'AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk';

// 初期化
window.onload = () => {
  loadGoogleMapsAPI();
};

// Google Maps API読み込み
function loadGoogleMapsAPI() {
  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places,marker,geometry&callback=initMapCallback&language=ja`;
  script.async = true;
  script.defer = true;
  
  script.onerror = function() {
    console.error('Google Maps API読み込みエラー');
    setTimeout(() => {
      document.getElementById('loadingScreen').classList.add('fade-out');
    }, 500);
  };
  
  document.head.appendChild(script);
}

// API認証エラーハンドリング
window.gm_authFailure = function() {
  console.error('Google Maps API認証失敗');
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('fade-out');
  }, 500);
};

// Google Maps初期化コールバック
function initMapCallback() {
  initMap();
  
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('fade-out');
  }, 1500);
}

// Google Maps初期化
function initMap() {
  const defaultPos = {lat: 35.681236, lng: 139.767125};
  
  map = new google.maps.Map(document.getElementById('map'), {
    center: defaultPos,
    zoom: 17,
    mapId: 'DEMO_MAP_ID',
    gestureHandling: 'greedy',
    clickableIcons: true,
    disableDefaultUI: true,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false
  });
  
  document.getElementById('map').style.display = 'block';
  
  // 現在地取得
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      position => {
        currentPos = {
          lat: position.coords.latitude,
          lng: position.coords.longitude
        };
        
        map.setCenter(currentPos);
        
        // 現在地マーカー
        const pin = document.createElement('div');
        pin.style.width = '24px';
        pin.style.height = '24px';
        pin.style.borderRadius = '50%';
        pin.style.background = '#5fb1ff';
        pin.style.border = '3px solid #fff';
        pin.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
        
        if (google.maps.marker && google.maps.marker.AdvancedMarkerElement) {
          currentMarker = new google.maps.marker.AdvancedMarkerElement({
            map,
            position: currentPos,
            content: pin,
            title: '現在地'
          });
        } else {
          currentMarker = new google.maps.Marker({
            map,
            position: currentPos,
            title: '現在地',
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 10,
              fillColor: '#5fb1ff',
              fillOpacity: 0.8,
              strokeColor: '#fff',
              strokeWeight: 3
            }
          });
        }
        
        // 住所取得
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({location: currentPos}, (results, status) => {
          if (status === 'OK' && results[0]) {
            const address = results[0].formatted_address.replace('日本、', '');
            document.getElementById('locationText').textContent = `現在地: ${address}`;
            document.getElementById('locationPanel').style.display = 'block';
          }
        });
      },
      error => {
        console.error('位置情報取得エラー:', error);
        showToast('位置情報を取得できませんでした', 'error');
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  }
  
  // 地図タップイベント
  map.addListener('click', (e) => {
    if (destinationMode) {
      setDestination(e.latLng.lat(), e.latLng.lng());
    }
  });
}

// 検索パネル切替
function toggleSearchPanel() {
  const panel = document.getElementById('searchPanel');
  const fab = document.getElementById('fabSearch');
  
  if (panel.style.display === 'block') {
    panel.style.display = 'none';
    fab.classList.remove('active');
  } else {
    panel.style.display = 'block';
    fab.classList.add('active');
    document.getElementById('searchInput').focus();
  }
}

// 現在地に移動
function moveToCurrentLocation() {
  if (currentPos) {
    map.setCenter(currentPos);
    map.setZoom(17);
    showToast('現在地に移動しました', 'success');
  } else {
    showToast('現在地が取得できていません', 'error');
  }
}

// 目的地設定モード切替
function setDestinationMode() {
  const btn = document.getElementById('fabDestination');
  destinationMode = !destinationMode;
  
  if (destinationMode) {
    btn.classList.add('active');
    showToast('地図上をタップして目的地を設定', 'success');
  } else {
    btn.classList.remove('active');
  }
}

// 目的地設定
function setDestination(lat, lng) {
  destinationMode = false;
  document.getElementById('fabDestination').classList.remove('active');
  
  const place = {
    location: {
      latitude: lat,
      longitude: lng
    },
    displayName: {
      text: '選択した地点'
    }
  };
  
  startNavigation(place);
}

// 場所検索
async function searchPlaces() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) {
    showToast('検索キーワードを入力してください', 'error');
    return;
  }
  
  if (!currentPos) {
    showToast('現在地が取得できていません', 'error');
    return;
  }
  
  clearSearchMarkers();
  
  try {
    const response = await fetch(`${WORKER_URL}/places:searchText`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        textQuery: query,
        locationBias: {
          circle: {
            center: {
              latitude: currentPos.lat,
              longitude: currentPos.lng
            },
            radius: 10000
          }
        },
        maxResultCount: 10,
        languageCode: 'ja'
      })
    });
    
    const data = await response.json();
    
    if (data.places && data.places.length > 0) {
      displaySearchResults(data.places);
    } else {
      showToast('検索結果が見つかりませんでした', 'error');
    }
  } catch (error) {
    console.error('検索エラー:', error);
    showToast('検索中にエラーが発生しました', 'error');
  }
}

// 検索結果表示
function displaySearchResults(places) {
  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = '';
  
  places.forEach(place => {
    if (place.location) {
      place.distance = calculateDistance(
        currentPos.lat, currentPos.lng,
        place.location.latitude, place.location.longitude
      );
    }
  });
  
  places.sort((a, b) => (a.distance || 999999) - (b.distance || 999999));
  
  places.slice(0, 5).forEach((place, index) => {
    if (place.location && place.distance <= 10000) {
      if (google.maps.marker && google.maps.marker.AdvancedMarkerElement) {
        const pin = document.createElement('div');
        pin.style.width = '32px';
        pin.style.height = '32px';
        pin.style.background = '#fff';
        pin.style.border = '2px solid #5fb1ff';
        pin.style.borderRadius = '50%';
        pin.style.display = 'flex';
        pin.style.alignItems = 'center';
        pin.style.justifyContent = 'center';
        pin.style.fontWeight = 'bold';
        pin.style.color = '#5fb1ff';
        pin.textContent = (index + 1).toString();
        
        const marker = new google.maps.marker.AdvancedMarkerElement({
          map,
          position: {
            lat: place.location.latitude,
            lng: place.location.longitude
          },
          content: pin,
          title: place.displayName?.text || ''
        });
        
        searchMarkers.push(marker);
      } else {
        const marker = new google.maps.Marker({
          map,
          position: {
            lat: place.location.latitude,
            lng: place.location.longitude
          },
          title: place.displayName?.text || '',
          label: {
            text: (index + 1).toString(),
            color: '#5fb1ff',
            fontWeight: 'bold'
          },
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 16,
            fillColor: '#fff',
            fillOpacity: 1,
            strokeColor: '#5fb1ff',
            strokeWeight: 2
          }
        });
        
        searchMarkers.push(marker);
      }
      
      const item = document.createElement('div');
      item.className = 'result-item';
      item.innerHTML = `
        <div class="result-name">${index + 1}. ${place.displayName?.text || '名称不明'}</div>
        <div class="result-address">${place.formattedAddress || '住所不明'}</div>
        <div class="result-distance">約${Math.round(place.distance)}m</div>
      `;
      
      item.onclick = () => startNavigation(place);
      resultsDiv.appendChild(item);
    }
  });
  
  if (searchMarkers.length > 0) {
    const bounds = new google.maps.LatLngBounds();
    bounds.extend(new google.maps.LatLng(currentPos.lat, currentPos.lng));
    searchMarkers.forEach(marker => {
      if (marker.position) {
        bounds.extend(marker.position);
      } else if (marker.getPosition) {
        bounds.extend(marker.getPosition());
      }
    });
    map.fitBounds(bounds);
  }
}

// ナビゲーション開始
async function startNavigation(place) {
  if (!place.location) return;
  
  if (!currentPos) {
    showToast('現在地が取得できていません', 'error');
    return;
  }
  
  if (destMarker) {
    if (destMarker.map) {
      destMarker.map = null;
    } else if (destMarker.setMap) {
      destMarker.setMap(null);
    }
  }
  
  if (google.maps.marker && google.maps.marker.AdvancedMarkerElement) {
    const pin = document.createElement('div');
    pin.style.width = '32px';
    pin.style.height = '32px';
    pin.style.background = '#ff6565';
    pin.style.border = '3px solid #fff';
    pin.style.borderRadius = '50%';
    pin.style.display = 'flex';
    pin.style.alignItems = 'center';
    pin.style.justifyContent = 'center';
    pin.style.color = '#fff';
    pin.style.fontSize = '18px';
    pin.textContent = '🎯';
    
    destMarker = new google.maps.marker.AdvancedMarkerElement({
      map,
      position: {
        lat: place.location.latitude,
        lng: place.location.longitude
      },
      content: pin,
      title: place.displayName?.text || '目的地'
    });
  } else {
    destMarker = new google.maps.Marker({
      map,
      position: {
        lat: place.location.latitude,
        lng: place.location.longitude
      },
      title: place.displayName?.text || '目的地',
      icon: {
        path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW,
        scale: 8,
        fillColor: '#ff6565',
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 3
      }
    });
  }
  
  try {
    const response = await fetch(`${WORKER_URL}/directions`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        origin: `${currentPos.lat},${currentPos.lng}`,
        destination: `${place.location.latitude},${place.location.longitude}`,
        mode: 'walking',
        language: 'ja'
      })
    });
    
    const data = await response.json();
    
    if (data.routes && data.routes[0]) {
      const route = data.routes[0];
      drawRoute(route);
      
      const leg = route.legs[0];
      document.getElementById('routeDistance').textContent = leg.distance.text;
      document.getElementById('routeDuration').textContent = leg.duration.text;
      document.getElementById('routePanel').style.display = 'block';
      
      // ナビゲーション中フラグ
      isNavigating = true;
      document.getElementById('fabReroute').style.display = 'flex';
      
      document.getElementById('searchPanel').style.display = 'none';
      document.getElementById('fabSearch').classList.remove('active');
      clearSearchMarkers();
    }
  } catch (error) {
    console.error('ルート取得エラー:', error);
    showToast('ルート取得に失敗しました', 'error');
  }
}

// ルート描画
function drawRoute(route) {
  if (routePolyline) {
    routePolyline.setMap(null);
  }
  
  const path = google.maps.geometry.encoding.decodePath(route.overview_polyline.points);
  
  routePolyline = new google.maps.Polyline({
    path: path,
    geodesic: true,
    strokeColor: '#5fb1ff',
    strokeOpacity: 0.8,
    strokeWeight: 5,
    map: map
  });
  
  const bounds = new google.maps.LatLngBounds();
  path.forEach(point => bounds.extend(point));
  map.fitBounds(bounds);
}

// リルート
function rerouteNavigation() {
  if (!isNavigating || !destMarker) {
    showToast('案内中ではありません', 'error');
    return;
  }
  
  const destPos = destMarker.position || destMarker.getPosition();
  if (!destPos) return;
  
  const place = {
    location: {
      latitude: destPos.lat(),
      longitude: destPos.lng()
    },
    displayName: {
      text: '目的地'
    }
  };
  
  showToast('ルートを再計算中...', 'success');
  startNavigation(place);
}

// 検索マーカークリア
function clearSearchMarkers() {
  searchMarkers.forEach(marker => {
    if (marker.map) {
      marker.map = null;
    } else if (marker.setMap) {
      marker.setMap(null);
    }
  });
  searchMarkers = [];
}

// トースト表示
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

// 距離計算
function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  
  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  
  return R * c;
}

// Enterキーで検索
document.addEventListener('DOMContentLoaded', () => {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchPlaces();
      }
