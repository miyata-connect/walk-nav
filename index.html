<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>WalkNav</title>

  <!-- 発行番号 / ISSUE -->
  <meta name="x-issue" content="idx202511032100" />
  <meta name="description" content="WalkNav - 近くを検索 & ルート案内" />

  <style>
    :root{
      --bg:#0b1220;
      --glass: rgba(20,28,44,.78);
      --glass-strong: rgba(16,22,36,.9);
      --stroke: rgba(255,255,255,.12);
      --text:#eaf2ff;
      --muted:#a7b8ce;
      --primary:#62b5ff;
      --ok:#25d07a;
      --danger:#ff6565;
      --warning:#ffb84d;
      --shadow:0 10px 35px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
      --radius:18px;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    *{box-sizing:border-box}

    .app{position:relative;height:100dvh;overflow:hidden}
    #map{position:absolute;inset:0}

    .fab-stack{
      position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;
      z-index:2600;
    }
    .panel{
      position:absolute;
      left:16px;
      right:16px;
      bottom:16px;
      top:auto;
      background:var(--glass-strong);border:1px solid var(--stroke);
      border-radius:var(--radius);box-shadow:var(--shadow);
      padding:14px 14px 12px;backdrop-filter:blur(10px);
      z-index:2500;
      max-height:calc(100vh - 32px);
      overflow-y:auto;
    }
    .panel h2{
      margin:0 0 10px;
      font-size:17px;
      letter-spacing:.3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-align:center;
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:var(--text);font-size:14px;cursor:pointer;user-select:none}
    .chip.active{background:var(--primary);color:#05233a;border-color:transparent}
    .input{
      flex:1;min-width:220px;
      padding:10px 12px;border-radius:12px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);color:var(--text);outline:none
    }
    .btn{
      padding:10px 14px;border-radius:12px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);color:var(--text);
      cursor:pointer;user-select:none;border:none;
    }
    .btn.primary{background:var(--primary);color:#051a2a;border-color:transparent}
    .btn.danger{background:var(--danger);color:#240808;border-color:transparent}
    .btn:disabled{opacity:.5;pointer-events:none}

    .fab{
      min-width:112px; height:56px; display:flex;align-items:center;justify-content:center;
      background:var(--glass-strong); border:1px solid var(--stroke); border-radius:18px;
      color:var(--text); box-shadow:var(--shadow); cursor:pointer; user-select:none;
      font-size:14px;
    }
    .fab:active{transform:translateY(1px)}
    .fab.paused{background:var(--warning);color:#2a1d05;border-color:transparent}

    .loading{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:#000; color:#fff; font-size:20px; z-index:3000
    }

    .results{
      margin-top:12px;
      background:rgba(0,0,0,.3);
      border-radius:12px;
      padding:8px;
    }
    .result-item{
      padding:10px;
      margin-bottom:6px;
      background:rgba(255,255,255,.05);
      border-radius:8px;
      cursor:pointer;
      transition:background .2s;
    }
    .result-item:hover{
      background:rgba(255,255,255,.1);
    }
    .result-name{
      font-weight:600;
      margin-bottom:4px;
      font-size:16px;
    }
    .result-address{
      font-size:12px;
      color:var(--muted);
    }

    .route-panel{
      position:absolute;
      left:16px;
      bottom:16px;
      top:auto;
      right:16px;
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter:blur(10px);
      z-index:2500;
      display:none;
    }
    .route-info{
      font-size:14px;
      margin-bottom:8px;
    }
    .route-distance{
      font-size:24px;
      font-weight:bold;
      color:var(--primary);
    }
    .route-time{
      font-size:16px;
      color:var(--muted);
      margin-left:12px;
    }

    /* ダイアログ共通スタイル */
    .dialog-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.7);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
      backdrop-filter:blur(4px);
    }
    .dialog-overlay.scroll{
      overflow:auto;
    }
    .dialog-box{
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      padding:24px;
      max-width:400px;
      width:90%;
      box-shadow:var(--shadow);
    }
    .dialog-box.wide{
      max-width:500px;
      max-height:80vh;
      overflow-y:auto;
      margin:20px;
    }
    .dialog-title{
      margin:0 0 16px;
      font-size:18px;
      color:var(--text);
      font-weight:600;
    }
    .dialog-text{
      margin:0 0 16px;
      font-size:14px;
      color:var(--text);
    }
    .dialog-muted{
      margin:0 0 16px;
      font-size:12px;
      color:var(--muted);
    }
    .dialog-input{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,0.1);
      color:var(--text);
      font-size:16px;
      outline:none;
      margin-bottom:16px;
    }
    .dialog-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
    }
    .dialog-btn{
      padding:10px 20px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-size:14px;
    }
    .dialog-btn.cancel{
      background:rgba(255,255,255,0.1);
      color:var(--text);
    }
    .dialog-btn.confirm{
      background:var(--primary);
      color:#051a2a;
    }
    .dialog-btn.delete{
      background:var(--danger);
      color:#240808;
    }
    .dialog-btn.full{
      width:100%;
      margin-top:0;
    }

    /* 登録地点リスト */
    .location-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .location-item{
      background:rgba(255,255,255,0.05);
      border-radius:8px;
      padding:12px;
    }
    .location-item-name{
      font-size:16px;
      font-weight:600;
      color:var(--text);
      margin-bottom:4px;
    }
    .location-item-coords{
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
    }
    .location-item-actions{
      display:flex;
      gap:8px;
    }
    .location-item-btn{
      flex:1;
      padding:8px;
      border-radius:6px;
      border:none;
      cursor:pointer;
      font-size:13px;
    }
    .location-item-btn.nav{
      background:var(--primary);
      color:#051a2a;
    }
    .location-item-btn.edit{
      background:rgba(255,255,255,0.1);
      color:var(--text);
    }
    .location-item-btn.delete{
      background:var(--danger);
      color:#240808;
    }

    /* 現在地ラベルのスタイル */
    #locLabel{
      display:block;
      white-space:pre-line;
      line-height:1.6;
      word-break:break-word;
      max-width:100%;
    }

    /* トースト通知 */
    .toast-container{
      position:fixed;
      bottom:420px;
      left:16px;
      z-index:10000;
      pointer-events:none;
      max-width:calc(100% - 32px);
    }
    .toast{
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      border-radius:12px;
      padding:12px 20px;
      margin-bottom:10px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      display:flex;
      align-items:center;
      gap:10px;
      min-width:200px;
      max-width:100%;
      animation:slideUp 0.3s ease-out;
      pointer-events:auto;
    }
    .toast.error{
      border-color:var(--danger);
      background:rgba(255,101,101,0.15);
    }
    .toast.success{
      border-color:var(--ok);
      background:rgba(37,208,122,0.15);
    }
    .toast.warning{
      border-color:var(--warning);
      background:rgba(255,184,77,0.15);
    }
    .toast-icon{
      font-size:20px;
      flex-shrink:0;
    }
    .toast-message{
      flex:1;
      font-size:14px;
      color:#ffffff;
      font-weight:500;
    }
    @keyframes slideUp{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .error-banner{display:none !important}
  </style>
</head>
<body>
  <div class="app">
    <div id="map" aria-label="地図"></div>

    <section class="panel" id="searchPanel" aria-label="検索パネル">
      <h2>近くを検索 (<span id="radiusLabel">10km</span> / 5件)</h2>
      <div class="row" style="margin-bottom:8px;justify-content:center">
        <button class="chip active" id="r10">10km</button>
        <button class="chip" id="r20">20km</button>
        <button class="chip" id="r30">30km</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <button class="chip" id="btnPointSearch" style="width:100%">📍 ポイント選択</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <button class="btn" id="btnSaveLocation" style="flex:1">現在地登録</button>
        <button class="btn" id="btnEditLocation" style="flex:1">登録地修正</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <input id="q" class="input" placeholder="店舗名・電話番号・住所・座標など" style="flex:1" />
      </div>
      <div class="row" style="margin-bottom:8px">
        <button id="btnText" class="btn primary" style="flex:1">テキスト検索</button>
        <button id="btnVoice" class="btn" style="flex:1">音声検索</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <button id="btnReset" class="btn danger" style="width:100%">リセット</button>
      </div>
      <div class="row" style="font-size:13px;color:var(--muted);margin-bottom:8px;flex-direction:column;align-items:flex-start;gap:2px">
        <div id="locAddress" style="line-height:1.5">現在地：取得中...</div>
        <div id="locCoords" style="line-height:1.5;font-size:12px"></div>
      </div>
      
      <div id="results" class="results" style="display:none"></div>
      
      <div class="row" style="margin-top:12px">
        <button id="btnClosePanel" class="btn" style="width:100%;background:rgba(255,255,255,0.1)">検索パネルを閉じる</button>
      </div>
    </section>

    <div class="route-panel" id="routePanel">
      <div class="route-info">
        <span id="destinationName">目的地</span>へのルート
      </div>
      <div>
        <span class="route-distance" id="routeDistance">--</span>
        <span class="route-time" id="routeTime">徒歩 --分</span>
      </div>
      <button id="btnStopRoute" class="btn danger" style="margin-top:10px;width:100%">ルート終了</button>
    </div>

    <div class="fab-stack" id="fabStack">
      <div class="fab" id="btnSearch">検索パネル</div>
      <div class="fab" id="btnLocate">現在地</div>
      <div class="fab" id="btnDestination" style="display:none">目的地</div>
      <div class="fab" id="btnPause">一時停止</div>
      <div class="fab" id="btnReroute">リルート</div>
    </div>

    <div class="loading" id="loading">
      <div style="text-align:center">
        <div style="font-size:24px;margin-bottom:16px">📍 現在地取得中</div>
        <div style="font-size:16px;opacity:0.8">しばらくお待ちください...</div>
      </div>
    </div>

    <!-- トースト通知コンテナ -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script>
    'use strict';

    // ==========================================
    // 定数定義
    // ==========================================
    const ISSUE_ID = 'idx202511032100'; // 更新：現在地表示修正版
    const API_KEY = 'AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk'; // Maps表示用のみ
    const WORKER_ORIGIN = 'https://ors-proxy.miyata-connect-jp.workers.dev';
    const DEFAULT_MASK = 'places.displayName,places.formattedAddress,places.location,places.id,places.types';
    const MAX_RETRY = 3;
    const RETRY_DELAY = 1000;

    // ==========================================
    // 状態管理オブジェクト
    // ==========================================
    const appState = {
      map: null,
      userMarker: null,
      geocoder: null,
      currentPos: null,
      pointSearchMode: false,
      searchPoint: null,
      searchPointMarker: null,
      mapInitialized: false,
      searchMarkers: [],
      currentDestination: null,
      currentPolyline: null,
      recognition: null,
      isPaused: false,
      isNavigating: false
    };

    // ==========================================
    // トースト通知システム
    // ==========================================
    let lastToastTime = 0;
    let lastToastMessage = '';

    function showToast(message, type = 'info', duration = 3000) {
      const now = Date.now();
      
      // 同じメッセージが1500ms以内に表示済みなら無視（デバウンス）
      if (message === lastToastMessage && now - lastToastTime < 1500) {
        console.log(`[Toast:${type}] Debounced: ${message}`);
        return;
      }
      
      lastToastTime = now;
      lastToastMessage = message;
      
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const icons = {
        error: '❌',
        success: '✅',
        warning: '⚠️',
        info: 'ℹ️'
      };
      
      toast.innerHTML = `
        <div class="toast-icon">${icons[type] || icons.info}</div>
        <div class="toast-message">${message}</div>
      `;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-20px)';
        setTimeout(() => toast.remove(), 300);
      }, duration);
      
      console.log(`[Toast:${type}] ${message}`);
    }

    // ==========================================
    // リトライ機能付きfetch
    // ==========================================
    async function fetchWithRetry(url, options = {}, retries = MAX_RETRY) {
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok && i < retries - 1) {
            console.log(`[Retry] ${i + 1}/${retries}: ${url}`);
            await new Promise(resolve => setTimeout(resolve, RETRY_DELAY * (i + 1)));
            continue;
          }
          return response;
        } catch (error) {
          if (i === retries - 1) throw error;
          console.log(`[Retry] ${i + 1}/${retries}: ${error.message}`);
          await new Promise(resolve => setTimeout(resolve, RETRY_DELAY * (i + 1)));
        }
      }
    }

    // ==========================================
    // Places API - Text Search
    // ==========================================
    async function placesTextSearch(payload, fieldMask) {
      try {
        const resp = await fetchWithRetry(`${WORKER_ORIGIN}/places:searchText`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(fieldMask ? { 'X-Goog-FieldMask': fieldMask } : {})
          },
          body: JSON.stringify(payload)
        });
        
        if (!resp.ok) {
          const text = await resp.text();
          throw new Error(`TextSearch ${resp.status}: ${text}`);
        }
        return await resp.json();
      } catch (error) {
        showToast(`検索エラー: ${error.message}`, 'error');
        throw error;
      }
    }

    // ==========================================
    // Places API - Nearby Search
    // ==========================================
    async function placesNearby(payload, fieldMask) {
      try {
        const resp = await fetchWithRetry(`${WORKER_ORIGIN}/places:searchNearby`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(fieldMask ? { 'X-Goog-FieldMask': fieldMask } : {})
          },
          body: JSON.stringify(payload)
        });
        
        if (!resp.ok) {
          const text = await resp.text();
          throw new Error(`Nearby ${resp.status}: ${text}`);
        }
        return await resp.json();
      } catch (error) {
        showToast(`検索エラー: ${error.message}`, 'error');
        throw error;
      }
    }

    // ==========================================
    // 地図初期化
    // ==========================================
    function initMap(center) {
      appState.map = new google.maps.Map(document.getElementById('map'), {
        center,
        zoom: 17,
        mapId: 'DEMO_MAP',
        gestureHandling: 'greedy',
        clickableIcons: true,
        disableDefaultUI: true
      });

      appState.geocoder = new google.maps.Geocoder();

      // 地図クリックイベント（ポイント選択用）
      appState.map.addListener('click', (e) => {
        if (!appState.pointSearchMode) return;
        if (e.latLng) {
          setSearchPoint(e.latLng.lat(), e.latLng.lng());
        }
      });

      appState.mapInitialized = true;
      console.log('[WalkNav] Map initialized');
    }

    // ==========================================
    // ユーザー位置マーカー設定
    // ==========================================
    async function fetchCurrentAddress(lat, lng) {
      try {
        const resp = await fetch(`${WORKER_ORIGIN}/geocode?lat=${lat}&lng=${lng}&lang=ja`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        const raw = data?.formattedAddress || "";
        const clean = raw.replace(/^日本、\s*/, "") || "位置情報取得済み";

        const el = document.getElementById("locAddress");
        if (el) el.textContent = `現在地：${clean} 付近`;

        console.log("[ReverseGeocode OK]", clean);
      } catch (err) {
        console.error("[ReverseGeocode Error]", err);
        const el = document.getElementById("locAddress");
        if (el) el.textContent = "現在地：位置情報取得済み";
      }
    }

    function setUserMarker(lat, lng) {
      appState.currentPos = { lat, lng };
      
      const pin = document.createElement('div');
      pin.style.width = '22px';
      pin.style.height = '22px';
      pin.style.borderRadius = '50%';
      pin.style.background = '#3aa0ff';
      pin.style.boxShadow = '0 0 0 6px rgba(98,181,255,.25)';
      pin.style.border = '2px solid #fff';

      if (!appState.userMarker) {
        appState.userMarker = new google.maps.marker.AdvancedMarkerElement({
          map: appState.map,
          position: { lat, lng },
          content: pin,
          zIndex: 1000
        });
      } else {
        appState.userMarker.position = { lat, lng };
      }
      
      // 緯度・経度表示
      document.getElementById('locCoords').textContent = `緯度 ${lat.toFixed(6)} / 経度 ${lng.toFixed(6)}`;
      
      // 住所取得して表示
      fetchCurrentAddress(lat, lng);
    }

    // ==========================================
    // 検索地点設定
    // ==========================================
    function setSearchPoint(lat, lng) {
      appState.searchPoint = { lat, lng };
      
      if (appState.searchPointMarker) {
        appState.searchPointMarker.map = null;
      }

      const pin = document.createElement('div');
      pin.style.width = '30px';
      pin.style.height = '30px';
      pin.style.borderRadius = '50% 50% 50% 0';
      pin.style.background = '#ff6565';
      pin.style.border = '3px solid #fff';
      pin.style.transform = 'rotate(-45deg)';
      pin.style.boxShadow = '0 4px 8px rgba(0,0,0,.3)';
      pin.style.transition = 'all 0.3s ease-out';

      appState.searchPointMarker = new google.maps.marker.AdvancedMarkerElement({
        map: appState.map,
        position: { lat, lng },
        content: pin,
        zIndex: 999
      });

      console.log(`[WalkNav] 検索地点設定: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
      showToast('検索地点を設定しました', 'success');
    }

    // ==========================================
    // 距離計算（Haversine公式）
    // ==========================================
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000; // 地球の半径（メートル）
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // ==========================================
    // レスポンスから距離/時間を取得
    // ==========================================
    function readLegDistanceText(leg) {
      if (leg?.distance?.text) return leg.distance.text;
      if (typeof leg?.distanceMeters === 'number') {
        const km = (leg.distanceMeters / 1000).toFixed(1);
        return `${km} km`;
      }
      return leg?.localizedValues?.distance?.text || '--';
    }

    function readLegDurationText(leg) {
      if (leg?.duration?.text) return leg.duration.text;
      if (typeof leg?.duration === 'string' && leg.duration.endsWith('s')) {
        const sec = parseInt(leg.duration.replace('s', ''), 10) || 0;
        const min = Math.max(1, Math.round(sec / 60));
        return `${min} 分`;
      }
      return leg?.localizedValues?.duration?.text || '--';
    }

    // ==========================================
    // エンコードされたポリラインを取得
    // ==========================================
    function getEncodedPolylineFromRoute(route) {
      if (route?.overview_polyline?.points) return route.overview_polyline.points;
      if (route?.polyline?.encodedPolyline) return route.polyline.encodedPolyline;
      if (route?.overviewPolyline?.encodedPolyline) return route.overviewPolyline.encodedPolyline;
      return null;
    }

    // ==========================================
    // ルートポリライン描画
    // ==========================================
    function drawRoutePolyline(route) {
      if (appState.currentPolyline) {
        appState.currentPolyline.setMap(null);
        appState.currentPolyline = null;
      }

      const encoded = getEncodedPolylineFromRoute(route);
      if (!encoded) {
        console.error('[Navigation] No encoded polyline found');
        showToast('ルート線の取得に失敗しました', 'error');
        return;
      }

      const path = google.maps.geometry.encoding.decodePath(encoded);
      appState.currentPolyline = new google.maps.Polyline({
        path: path,
        geodesic: true,
        strokeColor: '#62b5ff',
        strokeOpacity: 0.8,
        strokeWeight: 6,
        map: appState.map
      });

      console.log('[Navigation] Polyline drawn');
    }

    // ==========================================
    // ナビゲーション開始
    // ==========================================
    async function startNavigation(destination) {
      let originLat, originLng;
      
      // 起点決定
      if (appState.pointSearchMode && appState.searchPoint) {
        originLat = appState.searchPoint.lat;
        originLng = appState.searchPoint.lng;
        console.log('[Navigation] ポイント選択モード：検索地点からのルート');
      } else if (appState.currentPos) {
        originLat = appState.currentPos.lat;
        originLng = appState.currentPos.lng;
        console.log('[Navigation] 通常モード：現在地からのルート');
      } else {
        showToast('起点が設定されていません', 'error');
        return;
      }

      appState.currentDestination = destination;
      appState.isNavigating = true;
      appState.isPaused = false;
      
      // 検索パネルを閉じて全FABボタンを表示
      document.getElementById('searchPanel').style.display = 'none';
      document.getElementById('btnSearch').style.display = 'flex';
      document.getElementById('btnLocate').style.display = 'flex';
      document.getElementById('btnDestination').style.display = 'flex';
      document.getElementById('btnPause').style.display = 'flex';
      document.getElementById('btnReroute').style.display = 'flex';

      try {
        showToast('ルートを取得中...', 'info', 2000);

        const params = new URLSearchParams({
          origin: `${originLat},${originLng}`,
          destination: `${destination.lat},${destination.lng}`,
          mode: 'walking',
          language: 'ja'
        });

        const response = await fetchWithRetry(`${WORKER_ORIGIN}/directions?${params.toString()}`);
        
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`Directions API Error: ${response.status} - ${errorText}`);
        }

        const result = await response.json();
        console.log('[Navigation] Directions Response:', result);

        if (result.routes && result.routes.length > 0) {
          const r0 = result.routes[0];
          const l0 = (r0.legs && r0.legs[0]) ? r0.legs[0] : null;

          const distanceText = l0 ? readLegDistanceText(l0) : '--';
          const durationText = l0 ? readLegDurationText(l0) : '--';

          // UI更新
          document.getElementById('destinationName').textContent = destination.name;
          document.getElementById('routeDistance').textContent = distanceText;
          document.getElementById('routeTime').textContent = `徒歩 ${durationText}`;
          document.getElementById('routePanel').style.display = 'block';
          document.getElementById('searchPanel').style.display = 'none';
          document.getElementById('results').style.display = 'none';
          document.getElementById('btnDestination').style.display = 'flex';

          // ポリライン描画
          drawRoutePolyline(r0);

          // カメラワーク: 全体 → 目的地 → 起点
          const bounds = new google.maps.LatLngBounds();
          bounds.extend(new google.maps.LatLng(originLat, originLng));
          bounds.extend(new google.maps.LatLng(destination.lat, destination.lng));
          appState.map.fitBounds(bounds, { top: 100, right: 50, bottom: 200, left: 50 });

          setTimeout(() => {
            appState.map.panTo({ lat: destination.lat, lng: destination.lng });
            appState.map.setZoom(18);

            setTimeout(() => {
              appState.map.panTo({ lat: originLat, lng: originLng });
              appState.map.setZoom(18);
            }, 2000);
          }, 2000);

          showToast(`${destination.name} へのルート案内を開始`, 'success');
          console.log(`[Navigation] ルート案内開始: ${destination.name}`);
        } else {
          throw new Error('ルートが取得できませんでした');
        }
      } catch (error) {
        console.error('[Navigation] Error:', error);
        showToast(`ルートエラー: ${error.message}`, 'error', 5000);
        appState.isNavigating = false;
      }
    }

    // ==========================================
    // 検索実行
    // ==========================================
    const TYPE_MAP = {
      "コンビニ": "convenience_store",
      "スーパー": "supermarket",
      "レストラン": "restaurant",
      "カフェ": "cafe",
      "ホテル": "lodging",
      "病院": "hospital",
      "薬局": "pharmacy",
      "ガソリンスタンド": "gas_station",
      "駐車場": "parking",
      "銀行": "bank"
    };

    async function performSearch(query) {
      if (!query || !query.trim()) {
        showToast('検索ワードを入力してください', 'warning');
        return;
      }

      let centerLat, centerLng;
      
      if (appState.pointSearchMode && appState.searchPoint) {
        centerLat = appState.searchPoint.lat;
        centerLng = appState.searchPoint.lng;
        console.log(`[Search] 地点検索: "${query}"`);
      } else if (appState.currentPos) {
        centerLat = appState.currentPos.lat;
        centerLng = appState.currentPos.lng;
        console.log(`[Search] 現在地検索: "${query}"`);
      } else {
        showToast('検索の基準地点が不明です', 'error');
        return;
      }

      const radiusKm = parseInt(document.getElementById('radiusLabel').textContent);
      const radiusMeters = radiusKm * 1000;

      showToast('検索中...', 'info', 2000);

      // Text Search優先
      try {
        const data = await placesTextSearch({
          textQuery: query.trim(),
          locationBias: {
            circle: { center: { latitude: centerLat, longitude: centerLng }, radius: radiusMeters }
          },
          maxResultCount: 20,
          languageCode: 'ja'
        }, DEFAULT_MASK);

        if (data.places?.length) {
          displayResults(data.places, centerLat, centerLng);
          return;
        }
      } catch (e) {
        console.error('[Search] Text Search Error:', e);
      }

      // Nearby Search（タイプが一致する場合のみ）
      const typeKey = TYPE_MAP[query.trim()] || TYPE_MAP[query.trim().replace(/\s/g, '')];

      if (typeKey) {
        try {
          const data = await placesNearby({
            includedTypes: [typeKey],
            maxResultCount: 20,
            locationRestriction: {
              circle: { center: { latitude: centerLat, longitude: centerLng }, radius: radiusMeters }
            },
            languageCode: 'ja'
          }, DEFAULT_MASK);

          if (data.places?.length) {
            displayResults(data.places, centerLat, centerLng);
            return;
          }
        } catch (e) {
          console.error('[Search] Nearby Error:', e);
        }
      }

      showToast('検索結果が見つかりませんでした', 'warning');
      document.getElementById('results').style.display = 'none';
    }

    // ==========================================
    // 検索結果表示
    // ==========================================
    function displayResults(places, centerLat, centerLng) {
      // 既存の検索マーカーを削除
      appState.searchMarkers.forEach(marker => marker.map = null);
      appState.searchMarkers = [];

      // 距離計算とソート
      const placesWithDistance = places.map(place => {
        const lat = place.location.latitude;
        const lng = place.location.longitude;
        const distance = calculateDistance(centerLat, centerLng, lat, lng);
        return { ...place, distance };
      });

      placesWithDistance.sort((a, b) => a.distance - b.distance);
      const limitedResults = placesWithDistance.slice(0, 5);

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      resultsDiv.style.display = 'block';

      limitedResults.forEach((place, index) => {
        const name = place.displayName?.text || place.displayName || '名称不明';
        const address = place.formattedAddress || '住所不明';
        const lat = place.location.latitude;
        const lng = place.location.longitude;
        const distanceKm = (place.distance / 1000).toFixed(2);

        // 結果アイテム作成
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="result-name">${index + 1}. ${name}</div>
          <div class="result-address">${address}</div>
          <div style="font-size:11px;color:#62b5ff;margin-top:4px">
            📍 ${distanceKm}km
          </div>
        `;
        
        item.onclick = () => {
          startNavigation({
            name: name,
            lat: lat,
            lng: lng
          });
        };

        resultsDiv.appendChild(item);

        // マーカー作成
        const markerPin = document.createElement('div');
        markerPin.style.width = '24px';
        markerPin.style.height = '24px';
        markerPin.style.borderRadius = '50%';
        markerPin.style.background = '#25d07a';
        markerPin.style.border = '2px solid #fff';
        markerPin.style.boxShadow = '0 2px 6px rgba(0,0,0,.3)';
        markerPin.style.display = 'flex';
        markerPin.style.alignItems = 'center';
        markerPin.style.justifyContent = 'center';
        markerPin.style.color = '#fff';
        markerPin.style.fontSize = '12px';
        markerPin.style.fontWeight = 'bold';
        markerPin.textContent = index + 1;

        const marker = new google.maps.marker.AdvancedMarkerElement({
          map: appState.map,
          position: { lat, lng },
          content: markerPin,
          zIndex: 500 + index,
          title: name
        });

        appState.searchMarkers.push(marker);
      });

      showToast(`${limitedResults.length}件の検索結果`, 'success');
      console.log(`[Search] ${limitedResults.length}件の結果を表示しました`);
    }

    // ==========================================
    // 音声認識初期化
    // ==========================================
    function initSpeechRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        console.log('[Voice] 音声認識は非対応です');
        return false;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      appState.recognition = new SpeechRecognition();
      appState.recognition.lang = 'ja-JP';
      appState.recognition.continuous = false;
      appState.recognition.interimResults = false;

      appState.recognition.onstart = () => {
        console.log('[Voice] 音声認識開始');
        document.getElementById('btnVoice').textContent = '聞いています...';
        document.getElementById('btnVoice').style.background = 'var(--ok)';
      };

      appState.recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        console.log('[Voice] 認識結果:', transcript);
        document.getElementById('q').value = transcript;
        performSearch(transcript);
        showToast(`音声認識: ${transcript}`, 'success');
      };

      appState.recognition.onerror = (event) => {
        console.error('[Voice] エラー:', event.error);
        document.getElementById('btnVoice').textContent = '音声検索';
        document.getElementById('btnVoice').style.background = '';
        showToast('音声認識エラーが発生しました', 'error');
      };

      appState.recognition.onend = () => {
        console.log('[Voice] 音声認識終了');
        document.getElementById('btnVoice').textContent = '音声検索';
        document.getElementById('btnVoice').style.background = '';
      };

      return true;
    }

    // ==========================================
    // 音声検索開始
    // ==========================================
    function startVoiceSearch() {
      if (!appState.recognition) {
        if (!initSpeechRecognition()) {
          showToast('お使いのブラウザは音声認識に対応していません', 'error');
          return;
        }
      }

      try {
        appState.recognition.start();
      } catch (e) {
        console.error('[Voice] 開始エラー:', e);
        appState.recognition.stop();
        setTimeout(() => {
          try {
            appState.recognition.start();
          } catch (e2) {
            console.error('[Voice] 再開エラー:', e2);
            showToast('音声認識の開始に失敗しました', 'error');
          }
        }, 100);
      }
    }

    // ==========================================
    // 現在地取得
    // ==========================================
    function acquireLocation() {
      const onSuccess = (pos) => {
        const { latitude, longitude } = pos.coords;
        document.getElementById('loading')?.remove();
        
        if (!appState.map) {
          initMap({ lat: latitude, lng: longitude });
        }
        
        appState.map.setCenter({ lat: latitude, lng: longitude });
        setUserMarker(latitude, longitude);
        showToast('現在地を取得しました', 'success');
      };
      
      const onError = (error) => {
        console.log('[WalkNav] geolocation error', error?.message || error);
        document.getElementById('loading')?.remove();
        
        if (!appState.map) {
          initMap({ lat: 35.0, lng: 135.0 });
        }
        
        showToast('現在地の取得に失敗しました', 'error');
      };
      
      try {
        navigator.geolocation.getCurrentPosition(onSuccess, onError, {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        });
      } catch (e) {
        console.log('[WalkNav] geolocation exception', e);
        showToast('位置情報へのアクセスが拒否されました', 'error');
      }
    }

    // ==========================================
    function createDialog(config) {
      const overlay = document.createElement('div');
      overlay.className = `dialog-overlay ${config.scroll ? 'scroll' : ''}`;
      overlay.id = config.id || 'dialog';
      
      const box = document.createElement('div');
      box.className = `dialog-box ${config.wide ? 'wide' : ''}`;
      box.innerHTML = config.content;
      
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      
      return overlay;
    }

        r10.classList.add('active'); 
        r20.classList.remove('active');
        r30.classList.remove('active');
        radiusLabel.textContent = '10km'; 
      };
      
      r20.onclick = () => { 
        r20.classList.add('active'); 
        r10.classList.remove('active');
        r30.classList.remove('active');
        radiusLabel.textContent = '20km'; 
      };
      
      r30.onclick = () => { 
        r30.classList.add('active'); 
        r10.classList.remove('active');
        r20.classList.remove('active');
        radiusLabel.textContent = '30km'; 
      };

      btnPointSearch.onclick = () => {
        appState.pointSearchMode = !appState.pointSearchMode;
        if (appState.pointSearchMode) {
          btnPointSearch.textContent = '📍 ポイント選択中...';
          btnPointSearch.style.background = '#25d07a';
          btnPointSearch.style.color = '#0a2818';
          btnPointSearch.style.borderColor = 'transparent';
          showToast('地図をタップして検索地点を選択', 'info');
        } else {
          btnPointSearch.textContent = '📍 ポイント選択';
          btnPointSearch.style.background = 'rgba(255,255,255,.08)';
          btnPointSearch.style.color = 'var(--text)';
          btnPointSearch.style.borderColor = 'var(--stroke)';
        }
      };
    }

    function bindLocationEvents() {
      document.getElementById('btnSaveLocation').onclick = showSaveLocationDialog;
      document.getElementById('btnEditLocation').onclick = showEditLocationDialog;
    }

    function bindSearchEvents() {
      document.getElementById('btnText').onclick = () => {
        const q = document.getElementById('q').value.trim();
        if (q) performSearch(q);
      };
      
      document.getElementById('q').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          const q = document.getElementById('q').value.trim();
          if (q) performSearch(q);
        }
      });
      
      document.getElementById('btnVoice').onclick = startVoiceSearch;
      
      document.getElementById('btnReset').onclick = () => {
        document.getElementById('q').value = '';
        document.getElementById('results').style.display = 'none';
        document.getElementById('results').innerHTML = '';
        
        appState.searchMarkers.forEach(marker => marker.map = null);
        appState.searchMarkers = [];
        
        appState.searchPoint = null;
        if (appState.searchPointMarker) {
          appState.searchPointMarker.map = null;
          appState.searchPointMarker = null;
        }
        
        appState.pointSearchMode = false;
        const btnPointSearch = document.getElementById('btnPointSearch');
        btnPointSearch.textContent = '📍 ポイント選択';
        btnPointSearch.style.background = 'rgba(255,255,255,.08)';
        btnPointSearch.style.color = 'var(--text)';
        btnPointSearch.style.borderColor = 'var(--stroke)';
        
        // 半径を10kmにリセット
        document.getElementById('r10').classList.add('active');
        document.getElementById('r20').classList.remove('active');
        document.getElementById('r30').classList.remove('active');
        document.getElementById('radiusLabel').textContent = '10km';
        
        stopNavigation();
        showToast('リセットしました', 'info');
        console.log('[WalkNav] リセット完了');
      };
    }

    function bindFABEvents() {
      let lastLocateTime = 0;
      
      // 検索パネルボタン
      document.getElementById('btnSearch').onclick = () => {
        const panel = document.getElementById('searchPanel');
        const btnSearch = document.getElementById('btnSearch');
        
        if (panel.style.display === 'none') {
          // パネルを開く
          panel.style.display = 'block';
          // 全てのFABボタンを非表示
          btnSearch.style.display = 'none';
          document.getElementById('btnLocate').style.display = 'none';
          document.getElementById('btnDestination').style.display = 'none';
          document.getElementById('btnPause').style.display = 'none';
          document.getElementById('btnReroute').style.display = 'none';
        } else {
          // パネルを閉じる
          panel.style.display = 'none';
          // FABボタンを表示
          btnSearch.style.display = 'flex';
          document.getElementById('btnLocate').style.display = 'flex';
          if (appState.currentDestination) {
            document.getElementById('btnDestination').style.display = 'flex';
          }
          document.getElementById('btnPause').style.display = 'flex';
          document.getElementById('btnReroute').style.display = 'flex';
        }
      };
      
      // 検索パネルを閉じるボタン
      document.getElementById('btnClosePanel').onclick = () => {
        document.getElementById('searchPanel').style.display = 'none';
        // 全てのFABボタンを表示
        document.getElementById('btnSearch').style.display = 'flex';
        document.getElementById('btnLocate').style.display = 'flex';
        if (appState.currentDestination) {
          document.getElementById('btnDestination').style.display = 'flex';
        }
        document.getElementById('btnPause').style.display = 'flex';
        document.getElementById('btnReroute').style.display = 'flex';
      };

      document.getElementById('btnLocate').onclick = () => {
        const now = Date.now();
        
        // 1秒以内の連打を防止
        if (now - lastLocateTime < 1000) {
          console.log('[Locate] クールダウン中');
          return;
        }
        
        lastLocateTime = now;
        
        if (appState.currentPos && appState.map) {
          appState.map.panTo(appState.currentPos);
          appState.map.setZoom(18);
          showToast('現在地に移動しました', 'info');
        }
      };
      
      document.getElementById('btnDestination').onclick = () => {
        const now = Date.now();
        
        // 1秒以内の連打を防止
        if (now - lastLocateTime < 1000) {
          console.log('[Destination] クールダウン中');
          return;
        }
        
        lastLocateTime = now;
        
        if (appState.currentDestination && appState.map) {
          appState.map.panTo({ lat: appState.currentDestination.lat, lng: appState.currentDestination.lng });
          appState.map.setZoom(18);
          showToast('目的地に移動しました', 'info');
        }
      };
      
      document.getElementById('btnPause').onclick = togglePause;
      
      document.getElementById('btnReroute').onclick = () => {
        if (appState.currentDestination) {
          startNavigation(appState.currentDestination);
        } else {
          showToast('目的地が設定されていません', 'warning');
        }
      };

      document.getElementById('btnStopRoute').onclick = stopNavigation;
    }

    function bindUI() {
      console.log('[WalkNav] Binding UI...');
      bindSearchPanelEvents();
      bindLocationEvents();
      bindSearchEvents();
      bindFABEvents();
      console.log('[WalkNav] UI binding complete');
    }

    // ==========================================
    // アプリケーション起動
    // ==========================================
    function startApp() {
      console.log('[WalkNav] Starting app...');
      document.documentElement.lang = 'ja';
      
      // 初期状態：検索パネル表示、全FABボタン非表示
      document.getElementById('searchPanel').style.display = 'block';
      document.getElementById('btnSearch').style.display = 'none';
      document.getElementById('btnLocate').style.display = 'none';
      document.getElementById('btnDestination').style.display = 'none';
      document.getElementById('btnPause').style.display = 'none';
      document.getElementById('btnReroute').style.display = 'none';
      
      bindUI();
      acquireLocation();
      initSpeechRecognition();
      console.log('[WalkNav] ISSUE', ISSUE_ID, 'boot');
    }

    function initializeWhenReady() {
      if (typeof google !== 'undefined' && google.maps && google.maps.Map) {
        startApp();
      } else {
        setTimeout(initializeWhenReady, 100);
      }
    }

    window.addEventListener('DOMContentLoaded', initializeWhenReady);
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk&v=weekly&libraries=marker,geometry&language=ja&region=JP"
    async defer></script>
</body>
