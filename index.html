<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — タブ内で地図／Gemini・ChatGPTはリンク</title> <!-- L006 -->
  <style> /* L007 */
    :root{ --bar:56px; --barW:64px; --hit:48px; } /* L008 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L009 */
    body{background:#f8fafc;} /* L010 */
    #app{position:relative;width:100%;height:100dvh;overflow:hidden;} /* L011 */

    /* ── タブバー ───────────────────────────── */ /* L012 */
    .topbar{position:absolute;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:9999;} /* L013 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1 1 auto;} /* L014 */
    .tabs::-webkit-scrollbar{display:none;} /* L015 */
    .tab{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px 10px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:13.5px;color:#111;cursor:pointer;user-select:none;max-width:42vw;white-space:normal;overflow-wrap:anywhere;} /* L016 */
    #app.pos-left .tab,#app.pos-right .tab{max-width:calc(var(--barW) - 12px);} /* L017 */
    .tab .label{display:block;line-height:1.2;text-align:center;} /* L018 */
    .tab .close{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:10px;font-size:12px;background:#f3f4f6;color:#374151;margin:4px auto 0;} /* L019 */
    .tab .close:hover{background:#e5e7eb} /* L020 */
    .tab.active{border-color:#2563eb;color:#2563eb;} /* L021 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;align-items:center;} /* L022 */
    .tab.flash{transition:background-color .2s, box-shadow .2s;background:#eef2ff;box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L023 */

    /* 横配列（上/下）は横書き固定 */ /* L024 */
    #app.pos-top .tab, #app.pos-bottom .tab{flex-direction:row;align-items:center;max-width:none;padding:6px 12px;} /* L025 */
    #app.pos-top .tab .label, #app.pos-bottom .tab .label{white-space:nowrap;text-align:left;margin-left:6px;} /* L026 */

    /* ピクトグラム（カラー） */ /* L027 */
    .icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;} /* L028 */
    .ico-map{background:#e0f2fe;} .ico-map svg path{fill:#2563eb;} /* L029 */
    .ico-ai{background:#f3e8ff;}  .ico-ai  svg path{fill:#7c3aed;} /* L030 */
    .ico-gear{background:#e5f3ff;} .ico-gear svg path{fill:#0ea5e9;} /* L031 */

    /* ── ビュー ───────────────────────────── */ /* L032 */
    .view{position:absolute;top:var(--bar);left:0;right:0;bottom:0;display:none;z-index:0;} /* L033 */
    .view.active{display:block;} /* L034 */

    /* 既定の地図埋め込み */ /* L035 */
    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L036 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;display:block;} /* L037 */

    /* Aiタブ/新規タブのカード＋地図 */ /* L038 */
    .start{position:absolute;inset:0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:flex-start;background:#0b0b0b;color:#f5f5f5;z-index:1;} /* L039 */
    .start.hidden{display:none !important;visibility:hidden;pointer-events:none;} /* L040 */
    .card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #2a2a2a;border-radius:14px;background:#111;min-height:120px;text-decoration:none;color:#f5f5f5;box-shadow:0 6px 16px rgba(0,0,0,.4);} /* L041 */
    .card .title{margin-top:6px;font-size:13px;color:#e5e7eb;} /* L042 */
    .card .url{margin-top:8px;font-size:12px;color:#9ca3af;word-break:break-all;padding:0 10px;text-align:center;} /* L043 */
    .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;} /* L044 */
    .btn,.alink{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#181818;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.5);font-size:12px;text-decoration:none;} /* L045 */
    .muted{color:#9ca3af;font-size:12px;margin-top:8px;text-align:center;grid-column:1/-1;} /* L046 */
    .tabmap{position:absolute;inset:0;border:0;background:#e5e7eb;display:none;width:100%;height:100%;z-index:2;pointer-events:auto;} /* L047 */
    .tabmap.active{display:block;} /* L048 */

    /* ── 下配置 ───────────────────────────── */ /* L049 */
    #app.pos-bottom .topbar{inset:auto 0 0 0;height:var(--bar);box-shadow:0 -8px 24px rgba(0,0,0,.08);} /* L050 */
    #app.pos-bottom .view{top:0;bottom:var(--bar);} /* L051 */

    /* ── 左右配置（縦タブ＋縦ナビ） ───────────── */ /* L052 */
    #app.pos-left .topbar{inset:0 auto 0 0;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:stretch;box-shadow:8px 0 24px rgba(0,0,0,.08);padding:6px 6px;} /* L053 */
    #app.pos-left .view{top:0;left:var(--barW);right:0;bottom:0;} /* L054 */
    #app.pos-left .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;flex:1 1 auto;} /* L055 */

    #app.pos-right .topbar{inset:0 0 0 auto;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:stretch;box-shadow:-8px 0 24px rgba(0,0,0,.08);padding:6px 6px;} /* L056 */
    #app.pos-right .view{top:0;left:0;right:var(--barW);bottom:0;} /* L057 */
    #app.pos-right .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;flex:1 1 auto;} /* L058 */

    /* ── ナビ（ホーム／戻る／進む） ───────────── */ /* L059 */
    .navtools{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex:0 0 auto;} /* L060 */
    .navbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--hit);height:var(--hit);border-radius:12px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;user-select:none;transition:transform .06s ease;} /* L061 */
    .navbtn:active{transform:translateY(1px);} /* L062 */
    .navbtn svg{width:22px;height:22px;display:block;} /* L063 */
    .navbtn.home{background:#e0f2fe;border-color:#bae6fd;}    .navbtn.home    svg path{fill:#2563eb;} /* L064 */
    .navbtn.back{background:#fef3c7;border-color:#fde68a;}    .navbtn.back    svg path{fill:#b45309;} /* L065 */
    .navbtn.forward{background:#dcfce7;border-color:#bbf7d0;} .navbtn.forward svg path{fill:#16a34a;} /* L066 */

    /* 縦配置時：中央寄せ＋サイズ拡大（押しやすさ） */ /* L067 */
    #app.pos-left  .navtools,
    #app.pos-right .navtools{flex-direction:column;gap:12px;align-items:center;justify-content:flex-end;width:100%;} /* L068 */
    #app.pos-left  .navbtn,
    #app.pos-right .navbtn{width:56px;height:56px;border-radius:14px;margin-left:auto;margin-right:auto;} /* L069 */
  </style> <!-- L070 -->
</head> <!-- L071 -->
<body> <!-- L072 -->
<div id="app" class="pos-left"> <!-- L073 -->
  <div class="topbar"> <!-- L074 -->
    <div class="tabs" id="tabs"> <!-- L075 -->
      <div class="tab active" data-view="view-map" id="tab-map"> <!-- L076 -->
        <span class="icon ico-map" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></span>
        <span class="label">地図</span>
      </div>
      <div class="tab" data-view="view-browser" id="tab-browser"> <!-- L077 -->
        <span class="icon ico-ai" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 8a5 5 0 1 1 10 0v2h1a3 3 0 1 1 0 6h-1v1a3 3 0 1 1-6 0H9a3 3 0 1 1 0-6h1V8z"/></svg></span>
        <span class="label">Aiブラウザ</span>
      </div>
      <div class="tab" data-view="view-settings" id="tab-settings"> <!-- L078 -->
        <span class="icon ico-gear" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19 13.5v-3l-2-.7-.5-1.3 1.2-1.8-2.1-2.1-1.8 1.2-1.3-.5L10.5 3h-3l-.7 2-1.3.5-1.8-1.2L1.6 6.4l1.2 1.8-.5 1.3-2 .5v3l2 .7.5 1.3-1.2 1.8 2.1 2.1 1.8-1.2 1.3.5.7 2h3l.7-2 1.3-.5 1.8 1.2 2.1-2.1-1.2-1.8.5-1.3 2-.7zM12 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg></span>
        <span class="label">設定</span>
      </div>
      <div class="tab add" id="tab-add" title="新しいタブを作成"><span class="label">＋</span></div> <!-- L079 -->
    </div>

    <!-- ナビ（ホーム／戻る／進む） --> <!-- L080 -->
    <div class="navtools" id="navtools" aria-label="ナビゲーション操作"> <!-- L081 -->
      <button class="navbtn home" id="btn-home" aria-label="ホーム">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v10h-5V15H11v6H6V11H3z"/></svg>
      </button>
      <button class="navbtn back" id="btn-back" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5V7z"/></svg>
      </button>
      <button class="navbtn forward" id="btn-forward" aria-label="進む">
        <svg viewBox="0 0 24 24"><path d="M10 7l5 5-5 5V7z"/></svg>
      </button>
    </div>
  </div> <!-- L082 -->

  <!-- 既定：地図タブ（embed.html） --> <!-- L083 -->
  <div class="view active" id="view-map"> <!-- L084 -->
    <div id="mapHost"> <!-- L085 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L086 -->
    </div> <!-- L087 -->
  </div> <!-- L088 -->

  <!-- 既定：Aiブラウザ（リンク／同タブ地図表示） --> <!-- L089 -->
  <div class="view" id="view-browser"> <!-- L090 -->
    <div class="start" aria-label="スタート"> <!-- L091 -->
      <div class="card">
        <div class="icon ico-map" aria-hidden="true" style="width:32px;height:32px;border-radius:10px;"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></div>
        <div class="title">このタブで地図を表示</div>
        <div class="row"><button class="btn" data-action="open-map-here" data-view="view-browser" type="button">地図を表示</button></div>
      </div>
      <div class="card">
        <div class="icon ico-ai" aria-hidden="true" style="width:32px;height:32px;border-radius:10px;"><svg viewBox="0 0 24 24"><path d="M7 8a5 5 0 1 1 10 0v2h1a3 3 0 1 1 0 6h-1v1a3 3 0 1 1-6 0H9a3 3 0 1 1 0-6h1V8z"/></svg></div>
        <div class="title">Gemini</div>
        <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>
        <div class="url">https://gemini.google.com/</div>
      </div>
      <div class="card">
        <div class="icon ico-ai" aria-hidden="true" style="width:32px;height:32px;border-radius:10px;"><svg viewBox="0 0 24 24"><path d="M7 8a5 5 0 1 1 10 0v2h1a3 3 0 1 1 0 6h-1v1a3 3 0 1 1-6 0H9a3 3 0 1 1 0-6h1V8z"/></svg></div>
        <div class="title">ChatGPT</div>
        <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>
        <div class="url">https://chatgpt.com/</div>
      </div>
      <div class="muted">※ リンクは新しいブラウザタブで開きます（本アプリは残ります）。『地図を表示』はこのタブ内だけに適用。</div>
    </div> <!-- L092 -->
    <iframe class="tabmap" id="view-browser-map" title="Aiタブ内地図" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L093 -->
  </div> <!-- L094 -->

  <!-- 既定：設定（タブ位置は選択後に即閉じ） --> <!-- L095 -->
  <div class="view" id="view-settings"> <!-- L096 -->
    <div class="start" aria-label="設定"> <!-- L097 -->
      <div class="card" style="grid-column:span 3">
        <div class="title">設定：タブの場所（上／下／右／左）</div>
        <div class="row" id="posControls" role="radiogroup">
          <label class="btn"><input type="radio" name="tabpos" value="top" style="display:none">上</label>
          <label class="btn"><input type="radio" name="tabpos" value="bottom" style="display:none">下</label>
          <label class="btn"><input type="radio" name="tabpos" value="left" style="display:none">左</label>
          <label class="btn"><input type="radio" name="tabpos" value="right" style="display:none">右</label>
        </div>
        <div class="muted">選択は自動保存され、次回起動時に復元されます。</div>
      </div>
      <div class="card" style="grid-column:span 3"><div class="title">状態：未ログイン／通知未設定／v=tab-local-map+links</div></div>
    </div>
  </div> <!-- L098 -->
</div> <!-- L099 -->

<script> /* L100 */
(function(){
  var appEl=document.getElementById('app'); /* L101 */
  var tabsEl=document.getElementById('tabs'); /* L102 */
  var SKEY='WN_TABS_LOCAL_V5'; /* L103 */
  var SKEY_POS='WN_TAB_POS_V1'; /* L104 */

  /* ===== ユーティリティ ===== */ /* L105 */
  function snapIntoView(el){ try{ el && el.scrollIntoView({block:'nearest',inline:'end'}); }catch(_){} } /* L106 */

  /* 住所→現在地：緯度経度 の順へ補正（同一オリジン embed.html のみ対象） */ /* L107 */
  function enforceOrder(doc){
    try{
      const all = Array.from(doc.querySelectorAll('div,li,p,span'));
      const addr = all.find(n => /〒\s*\d{3}-?\d{4}/.test(n.textContent||''));
      const coord= all.find(n => /(緯度|経度)/.test(n.textContent||''));
      if(!addr || !coord) return;
      const t=(coord.textContent||'').trim();
      if(!/^現在地：/.test(t)){ coord.textContent='現在地：'+t.replace(/^(.*?：)?\s*/,''); }
      if(!(addr.compareDocumentPosition(coord) & Node.DOCUMENT_POSITION_FOLLOWING)){
        coord.parentNode.insertBefore(addr, coord);
      }
    }catch(_){}
  } /* L108 */
  function hookEmbed(doc){
    if(!doc) return;
    let timer=null;
    const debounced=()=>{ clearTimeout(timer); timer=setTimeout(()=>enforceOrder(doc), 80); };
    debounced();
    try{ new MutationObserver(debounced).observe(doc.body||doc,{childList:true,subtree:true,characterData:true}); }catch(_){}
  } /* L109 */
  function hookIframe(ifr){
    if(!ifr) return;
    const cb=()=>{ try{ hookEmbed(ifr.contentWindow.document); }catch(_){/* cross-originなら無視 */} };
    if(ifr.contentDocument && ifr.contentDocument.readyState!=='loading') cb();
    ifr.addEventListener('load', cb);
  } /* L110 */

  /* ===== 状態（単一ソース） ===== */ /* L111 */
  function getState(){ try{ return JSON.parse(sessionStorage.getItem(SKEY)||'{}'); }catch(_){ return {}; } }
  function setState(st){ try{ sessionStorage.setItem(SKEY, JSON.stringify(st||{})); }catch(_){ } }
  function ensureState(){
    const st=getState();
    if(!st.tabs) st.tabs=[];               // [{tabId,viewId,label,mode}]
    if(st.aiMode!=='start' && st.aiMode!=='map') st.aiMode='start';
    return st;
  }

  function reflect(viewId, mode){ /* mode: 'start'|'map' */ /* L112 */
    const v=document.getElementById(viewId); if(!v) return;
    const start=v.querySelector('.start'); const map=v.querySelector('.tabmap');
    if(mode==='map'){
      if(map){
        if(!map.src || !map.src.includes('embed.html')) map.src='./embed.html?ts='+Date.now();
        map.classList.add('active');
      }
      if(start) start.classList.add('hidden');
    }else{
      if(map) map.classList.remove('active');
      if(start) start.classList.remove('hidden');
    }
  }

  /* ===== タブ操作 ===== */ /* L113 */
  function activateTab(btn){
    if(!btn) return;
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    const vid=btn.dataset.view;
    if(vid){
      const v=document.getElementById(vid); if(v) v.classList.add('active');
      const st=ensureState();
      if(vid==='view-browser'){ reflect('view-browser', st.aiMode); }
      if(/^view-user-/.test(vid)){
        const entry=(st.tabs||[]).find(x=>x.viewId===vid);
        reflect(vid, entry && entry.mode==='map' ? 'map' : 'start');
      }
    }
    snapIntoView(document.getElementById('tab-add')); /* ＋マークを見える位置へ */ 
  }

  function nextLabel(){
    const list=[...document.querySelectorAll('.tab')].filter(n=>!n.classList.contains('add') && !['tab-map','tab-browser','tab-settings'].includes(n.id));
    return '新規タブ '+(list.length+1);
  }

  function startContentHTML(viewId){
    return `
      <div class="start" aria-label="リンク集">
        <div class="card">
          <div class="icon ico-map" aria-hidden="true" style="width:32px;height:32px;border-radius:10px;">
            <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          </div>
          <div class="title">このタブで地図を表示</div>
          <div class="row"><button class="btn" data-action="open-map-here" data-view="${viewId}" type="button">地図を表示</button></div>
        </div>
        <div class="card">
          <div class="icon ico-ai" aria-hidden="true" style="width:32px;height:32px;border-radius:10px;">
            <svg viewBox="0 0 24 24"><path d="M7 8a5 5 0 1 1 10 0v2h1a3 3 0 1 1 0 6h-1v1a3 3 0 1 1-6 0H9a3 3 0 1 1 0-6h1V8z"/></svg>
          </div>
          <div class="title">Gemini</div>
          <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>
          <div class="url">https://gemini.google.com/</div>
        </div>
        <div class="card">
          <div class="icon ico-ai" aria-hidden="true" style="width:32px;height:32px;border-radius:10px;">
            <svg viewBox="0 0 24 24"><path d="M7 8a5 5 0 1 1 10 0v2h1a3 3 0 1 1 0 6h-1v1a3 3 0 1 1-6 0H9a3 3 0 1 1 0-6h1V8z"/></svg>
          </div>
          <div class="title">ChatGPT</div>
          <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>
          <div class="url">https://chatgpt.com/</div>
        </div>
        <div class="muted">※ リンクは新しいブラウザタブで開きます。本アプリは残ります。</div>
      </div>
      <iframe class="tabmap" id="${viewId}-map" title="タブ内地図" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe>
    `;
  }

  /* 追加タブ */ /* L114 */
  let tabCounter=0; function makeIds(){ tabCounter++; const id=`user-${Date.now()}-${tabCounter}`; return {tabId:`tab-${id}`, viewId:`view-user-${id}`}; }

  function addTabFromState(entry){
    const addBtn=document.getElementById('tab-add');
    const tab=document.createElement('div');
    tab.className='tab'; tab.id=entry.tabId; tab.dataset.view=entry.viewId;
    tab.innerHTML=`<span class="icon ico-map" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></span><span class="label">${entry.label}</span><span class="close" data-close="${entry.viewId}" aria-label="閉じる">×</span>`;
    addBtn.parentNode.insertBefore(tab, addBtn);

    const view=document.createElement('div');
    view.className='view'; view.id=entry.viewId; view.innerHTML=startContentHTML(entry.viewId);
    document.getElementById('app').appendChild(view);

    hookIframe(document.getElementById(entry.viewId+'-map'));
    reflect(entry.viewId, entry.mode==='map' ? 'map' : 'start');
  }

  function restore(){
    const st=ensureState();
    (st.tabs||[]).forEach(addTabFromState);
    reflect('view-browser', st.aiMode);
  }

  function persist(st){ setState(st); }

  function addTab(label){
    const ids=makeIds(); const addBtn=document.getElementById('tab-add');
    const tab=document.createElement('div');
    tab.className='tab'; tab.id=ids.tabId; tab.dataset.view=ids.viewId;
    tab.innerHTML=`<span class="icon ico-map" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></span><span class="label">${label}</span><span class="close" data-close="${ids.viewId}" aria-label="閉じる">×</span>`;
    addBtn.parentNode.insertBefore(tab, addBtn);
    tab.classList.add('flash'); setTimeout(()=>tab.classList.remove('flash'),200);

    const view=document.createElement('div');
    view.className='view'; view.id=ids.viewId; view.innerHTML=startContentHTML(ids.viewId);
    document.getElementById('app').appendChild(view);
    hookIframe(document.getElementById(ids.viewId+'-map'));

    const st=ensureState();
    st.tabs.push({tabId:ids.tabId, viewId:ids.viewId, label, mode:'start'});
    persist(st);

    activateTab(tab);
    snapIntoView(addBtn); /* ＋を常に見える位置へ */ 
  }

  function closeTab(viewId){
    const tab=[...document.querySelectorAll('.tab')].find(t=>t.dataset.view===viewId);
    const view=document.getElementById(viewId);
    if(!tab||!view) return;
    const isActive=tab.classList.contains('active');
    tab.remove(); view.remove();

    const st=ensureState();
    st.tabs=(st.tabs||[]).filter(x=>x.viewId!==viewId);
    persist(st);

    if(isActive){ const mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab); }
  }

  /* ===== イベント ===== */ /* L115 */
  tabsEl.addEventListener('click',(e)=>{
    const btn=e.target.closest('.tab'); if(!btn) return;
    const close=e.target.closest('.close'); if(close){ closeTab(close.dataset.close); return; }
    if(btn.id==='tab-add'){ addTab(nextLabel()); return; }
    if(btn.dataset.view){ activateTab(btn); }
  }, {passive:true});

  document.addEventListener('click',(e)=>{
    const b=e.target.closest('.btn'); if(!b) return;
    if(b.dataset.action==='open-map-here'){
      const vid=b.dataset.view; if(!vid) return;
      const st=ensureState();
      if(vid==='view-browser'){ st.aiMode='map'; }
      else{
        const entry=(st.tabs||[]).find(x=>x.viewId===vid);
        if(entry) entry.mode='map';
      }
      persist(st);
      reflect(vid,'map');
      history.pushState({view:vid,mode:'map'},'');
    }
  }, {passive:false});

  /* ホーム／戻る／進む（履歴対応） */ /* L116 */
  document.getElementById('btn-home').addEventListener('click', ()=>{
    const st=ensureState(); st.aiMode='start'; persist(st);
    reflect('view-browser','start');
    history.pushState({view:'view-browser',mode:'start'},'');
  }, {passive:true});
  document.getElementById('btn-back').addEventListener('click', ()=>history.back(), {passive:true});
  document.getElementById('btn-forward').addEventListener('click', ()=>history.forward(), {passive:true});
  window.addEventListener('popstate',(ev)=>{
    const s=ev.state||null; if(!s) return;
    const tab=[...document.querySelectorAll('.tab')].find(t=>t.dataset.view===s.view) || document.getElementById('tab-map');
    if(tab) activateTab(tab);
    reflect(s.view, s.mode==='map' ? 'map' : 'start');
  });

  /* 設定：タブ位置を即適用→設定を閉じる（地図タブへ） */ /* L117 */
  function setTabPosition(pos){
    const p=(pos==='bottom'||pos==='left'||pos==='right')?pos:'top';
    appEl.className=''; appEl.classList.add('pos-'+p);
    try{ localStorage.setItem(SKEY_POS,p); }catch(_){}
    const mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab);
  }
  (function initPos(){
    let saved='left'; try{ saved=localStorage.getItem(SKEY_POS)||saved; }catch(_){}
    setTabPosition(saved);
    const posEl=document.getElementById('posControls'); if(!posEl) return;
    const radios=[...posEl.querySelectorAll('input[name="tabpos"]')];
    radios.forEach(r=>{ r.checked=(r.value===saved); });
    posEl.addEventListener('click',(e)=>{
      const lab=e.target.closest('label'); if(!lab) return;
      const input=lab.querySelector('input[name="tabpos"]'); if(!input) return;
      setTabPosition(input.value);
      radios.forEach(r=>{ r.checked=(r===input); });
    });
  })();

  /* 初期化 */ /* L118 */
  (function init(){
    hookIframe(document.getElementById('mapFrame'));
    hookIframe(document.getElementById('view-browser-map'));
    restore();
    const initial=document.querySelector('.tab.active')||document.getElementById('tab-map');
    activateTab(initial);
    if(!history.state){ history.replaceState({view:'view-map',mode:null},''); }
    snapIntoView(document.getElementById('tab-add'));
  })();
})();
