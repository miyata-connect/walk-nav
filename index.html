<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WalkNav v2.2</title>
<style>
:root{
  --glass:rgba(20,28,44,.7);
  --glass-strong:rgba(16,22,36,.85);
  --stroke:rgba(255,255,255,.14);
  --text:#eaf2ff;
  --muted:#a7b8ce;
  --primary:#5fb1ff;
  --ok:#25d07a;
  --danger:#ff6565;
  --accent:#64d2ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a1321;color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.app{position:relative;height:100dvh;overflow:hidden}
#map{position:absolute;inset:0;display:none}

/* コントロールパネル */
.control-panel{
  position:absolute;
  left:10px;
  right:10px;
  bottom:0;
  z-index:500;
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:16px 16px 0 0;
  backdrop-filter:blur(14px);
  padding:16px;
  transition:transform .3s;
}
.control-panel.hidden{transform:translateY(100%)}

.panel-toggle{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  border:none;
  border-radius:12px;
  padding:14px 40px;
  color:#000;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  z-index:490;
  display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.panel-toggle.show{display:block}

/* ローディング画面 */
.loading-screen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#0a1321 0%,#1e2a3e 100%);
  z-index:10000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:opacity .3s,visibility .3s;
}
.loading-screen.fade-out{opacity:0;visibility:hidden}
.loading-logo{font-size:48px;margin-bottom:20px;animation:pulse 2s infinite}
.loading-text{font-size:18px;color:var(--muted)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.8}}

/* 現在地パネル */
.location-panel{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:12px;
  padding:12px;
  backdrop-filter:blur(10px);
  z-index:400;
  display:none;
}
.location-text{
  font-size:13px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px;
}
.location-text .icon{font-size:16px}

/* 検索パネル */
.search-panel{
  position:absolute;
  top:60px;
  left:10px;
  right:10px;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:12px;
  padding:12px;
  backdrop-filter:blur(14px);
  z-index:450;
  display:none;
}
.search-box{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.search-input{
  flex:1;
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:10px;
  color:var(--text);
  font-size:14px;
}
.search-input::placeholder{color:var(--muted)}
.search-button{
  background:var(--primary);
  border:none;
  border-radius:8px;
  padding:10px 16px;
  color:#000;
  font-weight:600;
  cursor:pointer;
  transition:transform .1s;
}
.search-button:active{transform:scale(.95)}

.search-options{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.search-range{
  display:flex;
  gap:4px;
}
.range-btn{
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:6px;
  padding:6px 12px;
  color:var(--text);
  font-size:13px;
  cursor:pointer;
  transition:background .2s;
}
.range-btn.active{
  background:var(--primary);
  color:#000;
  font-weight:600;
}

.search-results{
  max-height:300px;
  overflow-y:auto;
}
.result-item{
  background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:10px;
  margin-bottom:8px;
  cursor:pointer;
  transition:background .2s;
}
.result-item:hover{background:rgba(255,255,255,.08)}
.result-name{
  font-size:14px;
  font-weight:600;
  margin-bottom:4px;
}
.result-address{
  font-size:12px;
  color:var(--muted);
  margin-bottom:4px;
}
.result-distance{
  font-size:11px;
  color:var(--accent);
}

/* ルートパネル */
.route-panel{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:12px;
  padding:16px;
  backdrop-filter:blur(14px);
  z-index:480;
  display:none;
}
.route-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.route-stats{
  display:flex;
  gap:20px;
}
.route-stat{
  display:flex;
  flex-direction:column;
}
.stat-label{
  font-size:11px;
  color:var(--muted);
  margin-bottom:2px;
}
.stat-value{
  font-size:20px;
  font-weight:700;
  color:var(--accent);
}
.route-end-btn{
  background:var(--danger);
  border:none;
  border-radius:8px;
  padding:10px 20px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* FABボタン */
.fab-container{
  position:fixed;
  right:16px;
  bottom:80px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:470;
}
.fab-btn{
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform .2s;
  color:var(--text);
  font-size:24px;
}
.fab-btn:active{transform:scale(.9)}
.fab-btn.active{
  background:var(--ok);
  color:#000;
}
.fab-btn.processing{
  animation:pulse 1s infinite;
}

/* コントロールボタングリッド */
.control-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}
.control-btn{
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:12px;
  color:var(--text);
  font-size:13px;
  cursor:pointer;
  transition:background .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.control-btn:hover{background:rgba(255,255,255,.12)}
.control-btn:active{transform:scale(.98)}
.control-btn.active{
  background:var(--primary);
  color:#000;
  font-weight:600;
}
.control-btn.disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* 保存地点パネル */
.saved-panel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:600;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.saved-content{
  width:100%;
  max-width:400px;
  max-height:80vh;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:16px;
  backdrop-filter:blur(14px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.saved-header{
  padding:16px;
  border-bottom:1px solid var(--stroke);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.saved-title{
  font-size:18px;
  font-weight:600;
}
.saved-close{
  width:32px;
  height:32px;
  background:rgba(255,255,255,.1);
  border:1px solid var(--stroke);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
}
.saved-list{
  flex:1;
  overflow-y:auto;
  padding:12px;
}
.saved-item{
  background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:12px;
  margin-bottom:8px;
}
.saved-item-header{
  display:flex;
  justify-content:space-between;
  align-items:start;
  margin-bottom:8px;
}
.saved-name{
  font-size:15px;
  font-weight:600;
  flex:1;
}
.saved-coords{
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
}
.saved-actions{
  display:flex;
  gap:6px;
}
.saved-btn{
  padding:6px 12px;
  border-radius:6px;
  border:none;
  font-size:12px;
  cursor:pointer;
  transition:transform .1s;
}
.saved-btn:active{transform:scale(.95)}
.saved-btn.nav{
  background:var(--primary);
  color:#000;
  font-weight:600;
}
.saved-btn.edit{
  background:rgba(255,255,255,.1);
  color:var(--text);
  border:1px solid var(--stroke);
}
.saved-btn.delete{
  background:var(--danger);
  color:#fff;
}
.saved-empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}

/* カスタムダイアログ */
.custom-dialog{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:700;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.dialog-content{
  width:100%;
  max-width:360px;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:16px;
  backdrop-filter:blur(14px);
  padding:20px;
}
.dialog-title{
  font-size:16px;
  font-weight:600;
  margin-bottom:16px;
}
.dialog-input{
  width:100%;
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:10px;
  color:var(--text);
  font-size:14px;
  margin-bottom:16px;
}
.dialog-input::placeholder{color:var(--muted)}
.dialog-buttons{
  display:flex;
  gap:8px;
  justify-content:flex-end;
}
.dialog-btn{
  padding:8px 16px;
  border-radius:8px;
  border:none;
  font-size:14px;
  cursor:pointer;
  font-weight:600;
}
.dialog-btn.cancel{
  background:rgba(255,255,255,.1);
  color:var(--text);
  border:1px solid var(--stroke);
}
.dialog-btn.confirm{
  background:var(--primary);
  color:#000;
}

/* トースト通知 */
.toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:12px 20px;
  backdrop-filter:blur(10px);
  z-index:800;
  opacity:0;
  transition:transform .3s,opacity .3s;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
.toast.success{border-color:var(--ok);color:var(--ok)}
.toast.error{border-color:var(--danger);color:var(--danger)}

/* APIキー設定モーダル */
.api-setup{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#0a1321 0%,#1e2a3e 100%);
  z-index:9999;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.api-setup.show{display:flex}
.api-setup-content{
  width:100%;
  max-width:500px;
  background:var(--glass-strong);
  border:1px solid var(--stroke);
  border-radius:16px;
  backdrop-filter:blur(14px);
  padding:30px;
}
.api-setup-title{
  font-size:24px;
  font-weight:700;
  margin-bottom:20px;
  text-align:center;
}
.api-setup-desc{
  font-size:14px;
  color:var(--muted);
  margin-bottom:20px;
  line-height:1.6;
}
.api-input-group{
  margin-bottom:20px;
}
.api-input-label{
  font-size:13px;
  color:var(--accent);
  margin-bottom:8px;
  display:block;
}
.api-input{
  width:100%;
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  border-radius:8px;
  padding:12px;
  color:var(--text);
  font-size:14px;
  font-family:monospace;
}
.api-input::placeholder{color:var(--muted)}
.api-setup-btn{
  width:100%;
  background:var(--primary);
  border:none;
  border-radius:8px;
  padding:14px;
  color:#000;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:transform .1s;
}
.api-setup-btn:active{transform:scale(.98)}
.api-setup-note{
  font-size:12px;
  color:var(--muted);
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--stroke);
}
</style>
</head>
<body>
<div class="app">
  <!-- 地図 -->
  <div id="map"></div>
  
  <!-- ローディング画面 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-logo">🚶</div>
    <div class="loading-text">WalkNav v2.2</div>
  </div>
  
  <!-- APIキー設定画面 -->
  <div class="api-setup" id="apiSetup">
    <div class="api-setup-content">
      <div class="api-setup-title">🗺️ Google Maps API設定</div>
      <div class="api-setup-desc">
        WalkNavを使用するには、Google Maps APIキーが必要です。<br>
        既存のAPIキーをお持ちの場合は入力してください。
      </div>
      
      <div class="api-input-group">
        <label class="api-input-label">APIキー</label>
        <input type="text" class="api-input" id="apiKeyInput" 
          placeholder="例: AIzaSyD..." 
          value="">
      </div>
      
      <button class="api-setup-btn" onclick="setupApiKey()">APIキーを設定</button>
      <button class="api-setup-btn" onclick="useDefaultKey()" style="margin-top:10px;background:rgba(255,255,255,.1);color:var(--text);">
        デモモードで続行（機能制限あり）
      </button>
      
      <div class="api-setup-note">
        ※ APIキーの取得方法：<br>
        1. <a href="https://console.cloud.google.com/" target="_blank" style="color:var(--accent);">Google Cloud Console</a>にアクセス<br>
        2. Maps JavaScript API, Places API, Geocoding APIを有効化<br>
        3. APIキーを作成し、上記に入力
      </div>
    </div>
  </div>
  
  <!-- 現在地表示パネル -->
  <div class="location-panel" id="locationPanel">
    <div class="location-text">
      <span class="icon">📍</span>
      <span id="locationText">現在地を取得中...</span>
    </div>
  </div>
  
  <!-- 検索パネル -->
  <div class="search-panel" id="searchPanel">
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="場所を検索...">
      <button class="search-button" onclick="searchPlaces()">検索</button>
    </div>
    <div class="search-options">
      <div class="search-range">
        <button class="range-btn active" data-range="10000" onclick="setSearchRange(this)">10km</button>
        <button class="range-btn" data-range="20000" onclick="setSearchRange(this)">20km</button>
      </div>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
  
  <!-- ルート案内パネル -->
  <div class="route-panel" id="routePanel">
    <div class="route-info">
      <div class="route-stats">
        <div class="route-stat">
          <div class="stat-label">距離</div>
          <div class="stat-value" id="routeDistance">--</div>
        </div>
        <div class="route-stat">
          <div class="stat-label">徒歩</div>
          <div class="stat-value" id="routeDuration">--</div>
        </div>
      </div>
      <button class="route-end-btn" onclick="endRoute()">ルート終了</button>
    </div>
  </div>
  
  <!-- FABボタン群 -->
  <div class="fab-container" id="fabContainer">
    <button class="fab-btn" id="fabSearchToggle" onclick="toggleSearchPanel()" title="検索パネル">🔍</button>
    <button class="fab-btn" id="fabPointSelect" onclick="togglePointSelect()" title="ポイント選択">📍</button>
    <button class="fab-btn" id="fabSaved" onclick="showSavedLocations()" title="保存地点">⭐</button>
  </div>
  
  <!-- コントロールパネル -->
  <div class="control-panel" id="controlPanel">
    <div class="control-grid">
      <button class="control-btn" id="btnTextSearch" onclick="focusSearch()">
        <span>🔤</span>テキスト検索
      </button>
      <button class="control-btn" id="btnVoiceSearch" onclick="startVoiceSearch()">
        <span>🎤</span>音声検索
      </button>
      <button class="control-btn" id="btnSaveLocation" onclick="saveCurrentLocation()">
        <span>📌</span>現在地登録
      </button>
      <button class="control-btn" id="btnEditSaved" onclick="showSavedLocations(true)">
        <span>✏️</span>登録地点修正
      </button>
    </div>
  </div>
  
  <!-- パネル開閉ボタン -->
  <button class="panel-toggle" id="panelToggle" onclick="togglePanel()">コントロール</button>
  
  <!-- 保存地点パネル -->
  <div class="saved-panel" id="savedPanel">
    <div class="saved-content">
      <div class="saved-header">
        <div class="saved-title" id="savedTitle">保存地点</div>
        <div class="saved-close" onclick="closeSavedPanel()">✕</div>
      </div>
      <div class="saved-list" id="savedList"></div>
    </div>
  </div>
  
  <!-- カスタムダイアログ -->
  <div class="custom-dialog" id="customDialog">
    <div class="dialog-content">
      <div class="dialog-title" id="dialogTitle">タイトル</div>
      <input type="text" class="dialog-input" id="dialogInput" placeholder="入力してください">
      <div class="dialog-buttons">
        <button class="dialog-btn cancel" onclick="closeDialog()">キャンセル</button>
        <button class="dialog-btn confirm" id="dialogConfirm">OK</button>
      </div>
    </div>
  </div>
  
  <!-- トースト通知 -->
  <div class="toast" id="toast"></div>
</div>

<script>
// グローバル変数
let map;
let currentPos = null;
let currentMarker = null;
let destMarker = null;
let searchMarkers = [];
let routePolyline = null;
let searchRange = 10000;
let pointSearchMode = false;
let searchPoint = null;
let searchPointMarker = null;
let savedLocations = [];
let isEditMode = false;
let API_KEY = '';

// Worker URL
const WORKER_URL = 'https://ors-proxy.miyata-connect-jp.workers.dev';

// デフォルトAPIキー（新しいキー）
const API_KEYS = [
  'AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk', // 最新のAPIキー
];
let currentKeyIndex = 0;

// 初期化
window.onload = () => {
  // LocalStorageからAPIキー読み込み
  const savedKey = localStorage.getItem('walkNavApiKey');
  if (savedKey) {
    API_KEY = savedKey;
  } else {
    // デフォルトキーを最初に試す
    API_KEY = API_KEYS[currentKeyIndex];
  }
  
  loadGoogleMapsAPI();
  loadSavedLocations();
};

// APIキー設定
function setupApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    showToast('APIキーを入力してください', 'error');
    return;
  }
  
  API_KEY = key;
  localStorage.setItem('walkNavApiKey', key);
  document.getElementById('apiSetup').classList.remove('show');
  document.getElementById('loadingScreen').style.display = 'flex';
  loadGoogleMapsAPI();
}

// デフォルトキー使用
function useDefaultKey() {
  // すべてのデフォルトキーをリセット
  currentKeyIndex = 0;
  API_KEY = API_KEYS[currentKeyIndex];
  
  document.getElementById('apiSetup').classList.remove('show');
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('loadingScreen').innerHTML = `
    <div class="loading-logo">🚶</div>
    <div class="loading-text">WalkNav v2.2</div>
  `;
  
  loadGoogleMapsAPI();
}

// Google Maps API読み込み
function loadGoogleMapsAPI() {
  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places,marker,geometry&callback=initMapCallback&language=ja`;
  script.async = true;
  script.defer = true;
  
  // エラーハンドリング
  script.onerror = function() {
    console.error('Google Maps API読み込みエラー');
    handleApiError('ネットワークエラー');
  };
  
  document.head.appendChild(script);
}

// API認証エラーハンドリング
window.gm_authFailure = function() {
  console.error('Google Maps API認証失敗');
  handleApiError('APIキー認証エラー');
};

// APIエラー処理
function handleApiError(errorType) {
  console.log(`APIキー試行: ${currentKeyIndex + 1}/${API_KEYS.length}`);
  
  // 次のキーを試す
  currentKeyIndex++;
  if (currentKeyIndex < API_KEYS.length) {
    API_KEY = API_KEYS[currentKeyIndex];
    console.log('別のAPIキーを試します...');
    
    // 既存のscriptタグを削除
    const oldScript = document.querySelector('script[src*="maps.googleapis.com"]');
    if (oldScript) {
      oldScript.remove();
    }
    
    // 新しいキーで再試行
    setTimeout(() => {
      loadGoogleMapsAPI();
    }, 1000);
  } else {
    // すべてのキーが失敗した場合、設定画面を表示
    localStorage.removeItem('walkNavApiKey');
    
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('apiSetup').classList.add('show');
    
    // エラーメッセージを表示
    const desc = document.querySelector('.api-setup-desc');
    desc.innerHTML = `
      <div style="color:var(--danger);margin-bottom:10px;">
        ⚠️ デフォルトのAPIキーが利用できません
      </div>
      WalkNavを使用するには、Google Maps APIキーが必要です。<br>
      既存のAPIキーをお持ちの場合は入力してください。
    `;
  }
}

// Google Maps初期化
function initMap() {
  // デフォルト位置（東京駅）
  const defaultPos = {lat: 35.681236, lng: 139.767125};
  
  map = new google.maps.Map(document.getElementById('map'), {
    center: defaultPos,
    zoom: 17,
    mapId: 'DEMO_MAP_ID',
    gestureHandling: 'greedy',
    clickableIcons: true,
    disableDefaultUI: true,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false
  });
  
  document.getElementById('map').style.display = 'block';
  
  // 現在地取得
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      position => {
        currentPos = {
          lat: position.coords.latitude,
          lng: position.coords.longitude
        };
        
        map.setCenter(currentPos);
        
        // 現在地マーカー
        const pin = document.createElement('div');
        pin.style.width = '24px';
        pin.style.height = '24px';
        pin.style.borderRadius = '50%';
        pin.style.background = '#5fb1ff';
        pin.style.border = '3px solid #fff';
        pin.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
        
        // AdvancedMarkerElementが使用可能か確認
        if (google.maps.marker && google.maps.marker.AdvancedMarkerElement) {
          currentMarker = new google.maps.marker.AdvancedMarkerElement({
            map,
            position: currentPos,
            content: pin,
            title: '現在地'
          });
        } else {
          // 従来のMarkerを使用
          currentMarker = new google.maps.Marker({
            map,
            position: currentPos,
            title: '現在地',
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 10,
              fillColor: '#5fb1ff',
              fillOpacity: 0.8,
              strokeColor: '#fff',
              strokeWeight: 3
            }
          });
        }
        
        // 住所取得
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({location: currentPos}, (results, status) => {
          if (status === 'OK' && results[0]) {
            const address = results[0].formatted_address.replace('日本、', '');
            document.getElementById('locationText').textContent = `現在地：${address}`;
            document.getElementById('locationPanel').style.display = 'block';
          }
        });
      },
      error => {
        console.error('位置情報取得エラー:', error);
        showToast('位置情報を取得できませんでした', 'error');
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  }
  
  // 地図タップイベント（ポイント選択モード時）
  map.addListener('click', (e) => {
    if (pointSearchMode) {
      setSearchPoint(e.latLng.lat(), e.latLng.lng());
    }
  });
}

// 検索地点設定
function setSearchPoint(lat, lng) {
  searchPoint = {lat, lng};
  
  if (searchPointMarker) {
    if (searchPointMarker.map) {
      searchPointMarker.map = null;
    } else if (searchPointMarker.setMap) {
      searchPointMarker.setMap(null);
    }
  }
  
  // AdvancedMarkerElementが使用可能か確認
  if (google.maps.marker && google.maps.marker.AdvancedMarkerElement) {
    const pin = document.createElement('div');
    pin.style.width = '28px';
    pin.style.height = '28px';
    pin.style.borderRadius = '50%';
    pin.style.background = '#ff6565';
    pin.style.border = '3px solid #fff';
    pin.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
    
    searchPointMarker = new google.maps.marker.AdvancedMarkerElement({
      map,
      position: {lat, lng},
      content: pin,
      zIndex: 900
    });
  } else {
    // 従来のMarkerを使用
    searchPointMarker = new google.maps.Marker({
      map,
      position: {lat, lng},
      zIndex: 900,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 12,
        fillColor: '#ff6565',
        fillOpacity: 0.8,
        strokeColor: '#fff',
        strokeWeight: 3
      }
    });
  }
  
  // 地名取得
  const geocoder = new google.maps.Geocoder();
  geocoder.geocode({location: {lat, lng}}, (results, status) => {
    if (status === 'OK' && results[0]) {
      const address = results[0].formatted_address.replace('日本、', '');
      showToast(`検索地点: ${address.substring(0, 30)}...`, 'success');
    }
  });
  
  map.panTo({lat, lng});
}

// 場所検索
async function searchPlaces() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) {
    showToast('検索キーワードを入力してください', 'error');
    return;
  }
  
  // 検索の起点を決定
  const searchOrigin = searchPoint || currentPos;
  if (!searchOrigin) {
    showToast('現在地が取得できていません', 'error');
    return;
  }
  
  // 既存マーカークリア
  clearSearchMarkers();
  
  try {
    const response = await fetch(`${WORKER_URL}/places:searchText`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        textQuery: query,
        locationBias: {
          circle: {
            center: {
              latitude: searchOrigin.lat,
              longitude: searchOrigin.lng
            },
            radius: searchRange
          }
        },
        maxResultCount: 10,
        languageCode: 'ja'
      })
    });
    
    const data = await response.json();
    
    if (data.places && data.places.length > 0) {
      displaySearchResults(data.places, searchOrigin);
    } else {
      showToast('検索結果が見つかりませんでした', 'error');
    }
  } catch (error) {
    console.error('検索エラー:', error);
    showToast('検索中にエラーが発生しました', 'error');
  }
}

// 検索結果表示
function displaySearchResults(places, origin) {
  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = '';
  
  // 距離計算とソート
  places.forEach(place => {
    if (place.location) {
      place.distance = calculateDistance(
        origin.lat, origin.lng,
        place.location.latitude, place.location.longitude
      );
    }
  });
  
  places.sort((a, b) => (a.distance || 999999) - (b.distance || 999999));
  
  // 上位5件を表示
  places.slice(0, 5).forEach((place, index) => {
    if (place.location && place.distance <= 10000) {
      // マーカー追加
      if (google.maps.marker && google.maps.marker.AdvancedMarkerElement) {
        const pin = document.createElement('div');
        pin.style.width = '32px';
        pin.style.height = '32px';
        pin.style.background = '#fff';
        pin.style.border = '2px solid #5fb1ff';
        pin.style.borderRadius = '50%';
        pin.style.display = 'flex';
        pin.style.alignItems = 'center';
        pin.style.justifyContent = 'center';
        pin.style.fontWeight = 'bold';
        pin.style.color = '#5fb1ff';
        pin.textContent = (index + 1).toString();
        
        const marker = new google.maps.marker.AdvancedMarkerElement({
          map,
          position: {
            lat: place.location.latitude,
            lng: place.location.longitude
          },
          content: pin,
          title: place.displayName?.text || ''
        });
        
        searchMarkers.push(marker);
      } else {
        // 従来のMarkerを使用
        const marker = new google.maps.Marker({
          map,
          position: {
            lat: place.location.latitude,
            lng: place.location.longitude
          },
          title: place.displayName?.text || '',
          label: {
            text: (index + 1).toString(),
            color: '#5fb1ff',
            fontWeight: 'bold'
          },
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 16,
            fillColor: '#fff',
            fillOpacity: 1,
            strokeColor: '#5fb1ff',
            strokeWeight: 2
          }
        });
        
        searchMarkers.push(marker);
      }
      
      // 結果リスト追加
      const item = document.createElement('div');
      item.className = 'result-item';
      item.innerHTML = `
        <div class="result-name">${index + 1}. ${place.displayName?.text || '名称不明'}</div>
        <div class="result-address">${place.formattedAddress || '住所不明'}</div>
        <div class="result-distance">約${Math.round(place.distance)}m</div>
      `;
      
      item.onclick = () => startNavigation(place);
      resultsDiv.appendChild(item);
    }
  });
  
  // 地図を調整
  if (searchMarkers.length > 0) {
    const bounds = new google.maps.LatLngBounds();
    bounds.extend(new google.maps.LatLng(origin.lat, origin.lng));
    searchMarkers.forEach(marker => {
      if (marker.position) {
        bounds.extend(marker.position);
      } else if (marker.getPosition) {
        bounds.extend(marker.getPosition());
      }
    });
    map.fitBounds(bounds);
  }
}

// ナビゲーション開始
async function startNavigation(place) {
  if (!place.location) return;
  
  const origin = searchPoint || currentPos;
  if (!origin) {
    showToast('現在地が取得できていません', 'error');
    return;
  }
  
  // 目的地マーカー設置
  if (destMarker) {
    if (destMarker.map) {
      destMarker.map = null;
    } else if (destMarker.setMap) {
      destMarker.setMap(null);
    }
  }
  
  if (google.maps.marker && google.maps.marker.AdvancedMarkerElement) {
    const pin = document.createElement('div');
    pin.style.width = '32px';
    pin.style.height = '32px';
    pin.style.background = '#ff6565';
    pin.style.border = '3px solid #fff';
    pin.style.borderRadius = '50%';
    pin.style.display = 'flex';
    pin.style.alignItems = 'center';
    pin.style.justifyContent = 'center';
    pin.style.color = '#fff';
    pin.style.fontSize = '18px';
    pin.textContent = '🎯';
    
    destMarker = new google.maps.marker.AdvancedMarkerElement({
      map,
      position: {
        lat: place.location.latitude,
        lng: place.location.longitude
      },
      content: pin,
      title: place.displayName?.text || '目的地'
    });
  } else {
    destMarker = new google.maps.Marker({
      map,
      position: {
        lat: place.location.latitude,
        lng: place.location.longitude
      },
      title: place.displayName?.text || '目的地',
      icon: {
        path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW,
        scale: 8,
        fillColor: '#ff6565',
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 3
      }
    });
  }
  
  // ルート取得
  try {
    const response = await fetch(`${WORKER_URL}/directions`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        origin: `${origin.lat},${origin.lng}`,
        destination: `${place.location.latitude},${place.location.longitude}`,
        mode: 'walking',
        language: 'ja'
      })
    });
    
    const data = await response.json();
    
    if (data.routes && data.routes[0]) {
      const route = data.routes[0];
      drawRoute(route);
      
      // ルート情報表示
      const leg = route.legs[0];
      document.getElementById('routeDistance').textContent = leg.distance.text;
      document.getElementById('routeDuration').textContent = leg.duration.text;
      document.getElementById('routePanel').style.display = 'block';
      
      // パネルを隠す
      document.getElementById('searchPanel').style.display = 'none';
      document.getElementById('fabSearchToggle').classList.remove('active');
      clearSearchMarkers();
    }
  } catch (error) {
    console.error('ルート取得エラー:', error);
    showToast('ルート取得に失敗しました', 'error');
  }
}

// ルート描画
function drawRoute(route) {
  if (routePolyline) {
    routePolyline.setMap(null);
  }
  
  const path = google.maps.geometry.encoding.decodePath(route.overview_polyline.points);
  
  routePolyline = new google.maps.Polyline({
    path: path,
    geodesic: true,
    strokeColor: '#5fb1ff',
    strokeOpacity: 0.8,
    strokeWeight: 5,
    map: map
  });
  
  // カメラワーク
  const bounds = new google.maps.LatLngBounds();
  path.forEach(point => bounds.extend(point));
  map.fitBounds(bounds);
  
  setTimeout(() => {
    map.setZoom(18);
    if (destMarker.position) {
      map.panTo(destMarker.position);
    } else if (destMarker.getPosition) {
      map.panTo(destMarker.getPosition());
    }
  }, 2000);
  
  setTimeout(() => {
    const origin = searchPoint || currentPos;
    map.panTo(new google.maps.LatLng(origin.lat, origin.lng));
  }, 4000);
}

// ルート終了
function endRoute() {
  if (routePolyline) {
    routePolyline.setMap(null);
    routePolyline = null;
  }
  
  if (destMarker) {
    if (destMarker.map) {
      destMarker.map = null;
    } else if (destMarker.setMap) {
      destMarker.setMap(null);
    }
    destMarker = null;
  }
  
  clearSearchMarkers();
  document.getElementById('routePanel').style.display = 'none';
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('searchInput').value = '';
  
  if (currentPos) {
    map.setCenter(currentPos);
    map.setZoom(17);
  }
}

// 検索マーカークリア
function clearSearchMarkers() {
  searchMarkers.forEach(marker => {
    if (marker.map) {
      marker.map = null;
    } else if (marker.setMap) {
      marker.setMap(null);
    }
  });
  searchMarkers = [];
}

// 音声検索
function startVoiceSearch() {
  if (!('webkitSpeechRecognition' in window)) {
    showToast('音声認識はこのブラウザでサポートされていません', 'error');
    return;
  }
  
  const recognition = new webkitSpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = false;
  recognition.interimResults = false;
  
  recognition.onstart = () => {
    showToast('🎤 音声入力中...', 'success');
  };
  
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    document.getElementById('searchInput').value = transcript;
    document.getElementById('searchPanel').style.display = 'block';
    document.getElementById('fabSearchToggle').classList.add('active');
    searchPlaces();
  };
  
  recognition.onerror = (event) => {
    showToast('音声認識エラー', 'error');
  };
  
  recognition.start();
}

// 距離計算
function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000; // 地球の半径(m)
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  
  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  
  return R * c;
}

// Enterキーで検索
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      searchPlaces();
    }
  });
  
  // ESCキーでダイアログを閉じる
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeDialog();
      closeSavedPanel();
    }
  });
});
</script>
