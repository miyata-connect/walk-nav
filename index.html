<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>WalkNav</title>

  <!-- 発行番号 / ISSUE -->
  <meta name="x-issue" content="idx202511040540" />
  <meta name="description" content="WalkNav - 近くを検索 & ルート案内" />

  <style>
    :root{
      --bg:#0b1220;
      --glass: rgba(20,28,44,.78);
      --glass-strong: rgba(16,22,36,.9);
      --stroke: rgba(255,255,255,.12);
      --text:#eaf2ff;
      --muted:#a7b8ce;
      --primary:#62b5ff;
      --ok:#25d07a;
      --danger:#ff6565;
      --warning:#ffb84d;
      --shadow:0 10px 35px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
      --radius:18px;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    *{box-sizing:border-box}

    .app{position:relative;height:100dvh;overflow:hidden}
    #map{position:absolute;inset:0}

    .fab-stack{
      position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;
      z-index:2600;
    }
    .panel{
      position:absolute;
      left:16px;
      right:16px;
      bottom:16px;
      top:auto;
      background:var(--glass-strong);border:1px solid var(--stroke);
      border-radius:var(--radius);box-shadow:var(--shadow);
      padding:14px 14px 12px;backdrop-filter:blur(10px);
      z-index:2500;
      max-height:calc(100vh - 32px);
      overflow-y:auto;
    }
    .panel h2{
      margin:0 0 10px;
      font-size:17px;
      letter-spacing:.3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-align:center;
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:var(--text);font-size:14px;cursor:pointer;user-select:none}
    .chip.active{background:var(--primary);color:#05233a;border-color:transparent}
    .input{
      flex:1;min-width:220px;
      padding:10px 12px;border-radius:12px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);color:var(--text);outline:none
    }
    .btn{
      padding:10px 14px;border-radius:12px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);color:var(--text);
      cursor:pointer;user-select:none;border:none;
    }
    .btn.primary{background:var(--primary);color:#051a2a;border-color:transparent}
    .btn.danger{background:var(--danger);color:#240808;border-color:transparent}
    .btn:disabled{opacity:.5;pointer-events:none}

    .fab{
      min-width:112px; height:56px; display:flex;align-items:center;justify-content:center;
      background:var(--glass-strong); border:1px solid var(--stroke); border-radius:18px;
      color:var(--text); box-shadow:var(--shadow); cursor:pointer; user-select:none;
      font-size:14px;
    }
    .fab:active{transform:translateY(1px)}
    .fab.paused{background:var(--warning);color:#2a1d05;border-color:transparent}

    .loading{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:#000; color:#fff; font-size:20px; z-index:3000
    }

    .results{
      margin-top:12px;
      background:rgba(0,0,0,.3);
      border-radius:12px;
      padding:8px;
    }
    .result-item{
      padding:10px;
      margin-bottom:6px;
      background:rgba(255,255,255,.05);
      border-radius:8px;
      cursor:pointer;
      transition:background .2s;
    }
    .result-item:hover{
      background:rgba(255,255,255,.1);
    }
    .result-name{
      font-weight:600;
      margin-bottom:4px;
      font-size:16px;
    }
    .result-address{
      font-size:12px;
      color:var(--muted);
    }

    .route-panel{
      position:absolute;
      left:16px;
      bottom:16px;
      top:auto;
      right:16px;
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter:blur(10px);
      z-index:2500;
      display:none;
    }
    .route-info{
      font-size:14px;
      margin-bottom:8px;
    }
    .route-distance{
      font-size:24px;
      font-weight:bold;
      color:var(--primary);
    }
    .route-time{
      font-size:16px;
      color:var(--muted);
      margin-left:12px;
    }

    /* ダイアログ共通スタイル */
    .dialog-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.7);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
      backdrop-filter:blur(4px);
    }
    .dialog-overlay.scroll{
      overflow:auto;
    }
    .dialog-box{
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      padding:24px;
      max-width:400px;
      width:90%;
      box-shadow:var(--shadow);
    }
    .dialog-box.wide{
      max-width:500px;
      max-height:80vh;
      overflow-y:auto;
      margin:20px;
    }
    .dialog-title{
      margin:0 0 16px;
      font-size:18px;
      color:var(--text);
      font-weight:600;
    }
    .dialog-text{
      margin:0 0 16px;
      font-size:14px;
      color:var(--text);
    }
    .dialog-muted{
      margin:0 0 16px;
      font-size:12px;
      color:var(--muted);
    }
    .dialog-input{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,0.1);
      color:var(--text);
      font-size:16px;
      outline:none;
      margin-bottom:16px;
    }
    .dialog-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
    }
    .dialog-btn{
      padding:10px 20px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-size:14px;
    }
    .dialog-btn.cancel{
      background:rgba(255,255,255,0.1);
      color:var(--text);
    }
    .dialog-btn.confirm{
      background:var(--primary);
      color:#051a2a;
    }
    .dialog-btn.delete{
      background:var(--danger);
      color:#240808;
    }
    .dialog-btn.full{
      width:100%;
      margin-top:0;
    }

    /* 登録地点リスト */
    .location-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .location-item{
      background:rgba(255,255,255,0.05);
      border-radius:8px;
      padding:12px;
    }
    .location-item-name{
      font-size:16px;
      font-weight:600;
      color:var(--text);
      margin-bottom:4px;
    }
    .location-item-coords{
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
    }
    .location-item-actions{
      display:flex;
      gap:8px;
    }
    .location-item-btn{
      flex:1;
      padding:8px;
      border-radius:6px;
      border:none;
      cursor:pointer;
      font-size:13px;
    }
    .location-item-btn.nav{
      background:var(--primary);
      color:#051a2a;
    }
    .location-item-btn.edit{
      background:rgba(255,255,255,0.1);
      color:var(--text);
    }
    .location-item-btn.delete{
      background:var(--danger);
      color:#240808;
    }

    /* 現在地ラベルのスタイル */
    #locLabel{
      display:block;
      white-space:pre-line;
      line-height:1.6;
      word-break:break-word;
      max-width:100%;
    }

    /* トースト通知 */
    .toast-container{
      position:fixed;
      bottom:420px;
      left:16px;
      z-index:10000;
      pointer-events:none;
      max-width:calc(100% - 32px);
    }
    .toast{
      background:var(--glass-strong);
      border:1px solid var(--stroke);
      border-radius:12px;
      padding:12px 20px;
      margin-bottom:10px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      display:flex;
      align-items:center;
      gap:10px;
      min-width:200px;
      max-width:100%;
      animation:slideUp 0.3s ease-out;
      pointer-events:auto;
    }
    .toast.error{
      border-color:var(--danger);
      background:rgba(255,101,101,0.15);
    }
    .toast.success{
      border-color:var(--ok);
      background:rgba(37,208,122,0.15);
    }
    .toast.warning{
      border-color:var(--warning);
      background:rgba(255,184,77,0.15);
    }
    .toast-icon{
      font-size:20px;
      flex-shrink:0;
    }
    .toast-message{
      flex:1;
      font-size:14px;
      color:#ffffff;
      font-weight:500;
    }
    @keyframes slideUp{
      from{opacity:0;transform:translateY(20px)}
      to{opacity:1;transform:translateY(0)}
    }

    .error-banner{display:none !important}
  </style>
</head>
<body>
  <div class="app">
    <div id="map" aria-label="地図"></div>

    <section class="panel" id="searchPanel" aria-label="検索パネル">
      <h2>近くを検索 (<span id="radiusLabel">10km</span> / 5件)</h2>
      <div class="row" style="margin-bottom:8px;justify-content:center">
        <button class="chip active" id="r10">10km</button>
        <button class="chip" id="r20">20km</button>
        <button class="chip" id="r30">30km</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <button class="chip" id="btnPointSearch" style="width:100%">📍 ポイント選択</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <button class="btn" id="btnSaveLocation" style="flex:1">現在地登録</button>
        <button class="btn" id="btnEditLocation" style="flex:1">登録地修正</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <input id="q" class="input" placeholder="店舗名・電話番号・住所・座標など" style="flex:1" />
      </div>
      <div class="row" style="margin-bottom:8px">
        <button id="btnText" class="btn primary" style="flex:1">テキスト検索</button>
        <button id="btnVoice" class="btn" style="flex:1">音声検索</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <button id="btnReset" class="btn danger" style="width:100%">リセット</button>
      </div>
      <div class="row" style="font-size:13px;color:var(--muted);margin-bottom:8px;flex-direction:column;align-items:flex-start;gap:2px">
        <div id="locAddress" style="line-height:1.5">現在地：取得中...</div>
        <div id="locCoords" style="line-height:1.5;font-size:12px"></div>
      </div>
      
      <div id="results" class="results" style="display:none"></div>
      
      <div class="row" style="margin-top:12px">
        <button id="btnClosePanel" class="btn" style="width:100%;background:rgba(255,255,255,0.1)">検索パネルを閉じる</button>
      </div>
    </section>

    <div class="route-panel" id="routePanel">
      <div class="route-info">
        <span id="destinationName">目的地</span>へのルート
      </div>
      <div>
        <span class="route-distance" id="routeDistance">--</span>
        <span class="route-time" id="routeTime">徒歩 --分</span>
      </div>
      <button id="btnStopRoute" class="btn danger" style="margin-top:10px;width:100%">ルート終了</button>
    </div>

    <div class="fab-stack" id="fabStack">
      <div class="fab" id="btnSearch">検索パネル</div>
      <div class="fab" id="btnLocate">現在地</div>
      <div class="fab" id="btnDestination" style="display:none">目的地</div>
      <div class="fab" id="btnPause">一時停止</div>
      <div class="fab" id="btnReroute">リルート</div>
    </div>

    <div class="loading" id="loading">
      <div style="text-align:center">
        <div style="font-size:24px;margin-bottom:16px">📍 現在地取得中</div>
        <div style="font-size:16px;opacity:0.8">しばらくお待ちください...</div>
      </div>
    </div>

    <!-- トースト通知コンテナ -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script>
    'use strict';

    // ==========================================
    // 定数定義
    // ==========================================
    const ISSUE_ID = 'idx202511040540';
    const API_KEY = 'AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk';
    const WORKER_ORIGIN = 'https://ors-proxy.miyata-connect-jp.workers.dev';
    const DEFAULT_MASK = 'places.displayName,places.formattedAddress,places.location,places.id,places.types';
    const MAX_RETRY = 3;
    const RETRY_DELAY = 1000;

    // ==========================================
    // 状態管理オブジェクト
    // ==========================================
    const appState = {
      map: null,
      userMarker: null,
      geocoder: null,
      currentPos: null,
      pointSearchMode: false,
      searchPoint: null,
      searchPointMarker: null,
      mapInitialized: false,
      searchMarkers: [],
      currentDestination: null,
      currentPolyline: null,
      recognition: null,
      isPaused: false,
      isNavigating: false
    };

    // ==========================================
    // トースト通知
    // ==========================================
    let lastToastTime = 0;
    let lastToastMessage = '';
    function showToast(message, type = 'info', duration = 3000) {
      const now = Date.now();
      if (message === lastToastMessage && now - lastToastTime < 1500) return;
      lastToastTime = now; lastToastMessage = message;
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { error:'❌', success:'✅', warning:'⚠️', info:'ℹ️' };
      toast.innerHTML = `<div class="toast-icon">${icons[type]||icons.info}</div><div class="toast-message">${message}</div>`;
      container.appendChild(toast);
      setTimeout(()=>{ toast.style.opacity='0'; toast.style.transform='translateY(-20px)'; setTimeout(()=>toast.remove(),300);}, duration);
    }

    // ==========================================
    // リトライ付き fetch
    // ==========================================
    async function fetchWithRetry(url, options = {}, retries = MAX_RETRY) {
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok && i < retries - 1) { await new Promise(r=>setTimeout(r, RETRY_DELAY*(i+1))); continue; }
          return response;
        } catch (e) {
          if (i === retries - 1) throw e;
          await new Promise(r=>setTimeout(r, RETRY_DELAY*(i+1)));
        }
      }
    }

    // ==========================================
    // Places API (Worker経由)
    // ==========================================
    async function placesTextSearch(payload, fieldMask) {
      const resp = await fetchWithRetry(`${WORKER_ORIGIN}/places:searchText`, {
        method:'POST', headers:{'Content-Type':'application/json', ...(fieldMask?{'X-Goog-FieldMask':fieldMask}:{})},
        body: JSON.stringify(payload)
      });
      if (!resp.ok) throw new Error(`TextSearch ${resp.status}`);
      return resp.json();
    }
    async function placesNearby(payload, fieldMask) {
      const resp = await fetchWithRetry(`${WORKER_ORIGIN}/places:searchNearby`, {
        method:'POST', headers:{'Content-Type':'application/json', ...(fieldMask?{'X-Goog-FieldMask':fieldMask}:{})},
        body: JSON.stringify(payload)
      });
      if (!resp.ok) throw new Error(`Nearby ${resp.status}`);
      return resp.json();
    }

    // ==========================================
    // 地図初期化
    // ==========================================
    function initMap(center) {
      appState.map = new google.maps.Map(document.getElementById('map'), {
        center, zoom:17, mapId:'DEMO_MAP', gestureHandling:'greedy', clickableIcons:true, disableDefaultUI:true
      });
      appState.geocoder = new google.maps.Geocoder();
      appState.map.addListener('click', (e) => {
        if (!appState.pointSearchMode) return;
        if (e.latLng) setSearchPoint(e.latLng.lat(), e.latLng.lng());
      });
      appState.mapInitialized = true;
    }

    // ==========================================
    // 住所取得（Maps Geocoder のみ）
    // ==========================================
    async function fetchCurrentAddress(lat, lng) {
      const el = document.getElementById('locAddress');
      const setOk = (text) => {
        const clean = (text||'').replace(/^日本、\s*/, '');
        if (el) el.textContent = clean ? `現在地：${clean} 付近` : '現在地：住所情報なし';
      };
      const setErr = () => { if (el) el.textContent = '現在地：住所取得エラー'; };

      try {
        if (!appState.geocoder) appState.geocoder = new google.maps.Geocoder();
        const resp = await appState.geocoder.geocode({ location: { lat, lng }, region: 'JP' });
        const results = resp && resp.results ? resp.results : [];
        if (results.length) {
          const target =
            results.find(r => r.types?.includes('premise')) ||
            results.find(r => r.types?.includes('street_address')) ||
            results[0];
          setOk(target.formatted_address || '');
          return;
        }
        setErr();
      } catch (e) {
        console.error('[ReverseGeocode] Geocoder error:', e);
        setErr();
      }
    }

    // ==========================================
    // 現在地マーカー
    // ==========================================
    function setUserMarker(lat, lng) {
      appState.currentPos = { lat, lng };
      const pin = document.createElement('div');
      pin.style.width='22px'; pin.style.height='22px'; pin.style.borderRadius='50%';
      pin.style.background='#3aa0ff'; pin.style.boxShadow='0 0 0 6px rgba(98,181,255,.25)'; pin.style.border='2px solid #fff';
      if (!appState.userMarker) {
        appState.userMarker = new google.maps.marker.AdvancedMarkerElement({
          map: appState.map, position:{lat,lng}, content: pin, zIndex:1000
        });
      } else {
        appState.userMarker.position = { lat, lng };
      }
      document.getElementById('locCoords').textContent = `緯度 ${lat.toFixed(6)} / 経度 ${lng.toFixed(6)}`;
      fetchCurrentAddress(lat, lng);
    }

    // ==========================================
    // 検索地点
    // ==========================================
    function setSearchPoint(lat, lng) {
      appState.searchPoint = { lat, lng };
      if (appState.searchPointMarker) appState.searchPointMarker.map = null;
      const pin = document.createElement('div');
      pin.style.width='30px'; pin.style.height='30px'; pin.style.borderRadius='50% 50% 50% 0';
      pin.style.background='#ff6565'; pin.style.border='3px solid #fff'; pin.style.transform='rotate(-45deg)';
      pin.style.boxShadow='0 4px 8px rgba(0,0,0,.3)'; pin.style.transition='all .3s ease-out';
      appState.searchPointMarker = new google.maps.marker.AdvancedMarkerElement({
        map: appState.map, position:{lat,lng}, content: pin, zIndex:999
      });
      showToast('検索地点を設定しました','success');
    }

    // ==========================================
    // 距離計算
    // ==========================================
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
      const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return 2*R*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ==========================================
    // 距離/時間テキスト
    // ==========================================
    function readLegDistanceText(leg) {
      if (leg?.distance?.text) return leg.distance.text;
      if (typeof leg?.distanceMeters==='number') return `${(leg.distanceMeters/1000).toFixed(1)} km`;
      return leg?.localizedValues?.distance?.text || '--';
    }
    function readLegDurationText(leg) {
      if (leg?.duration?.text) return leg.duration.text;
      if (typeof leg?.duration==='string' && leg.duration.endsWith('s')) {
        const sec=parseInt(leg.duration.replace('s',''),10)||0; return `${Math.max(1,Math.round(sec/60))} 分`;
      }
      return leg?.localizedValues?.duration?.text || '--';
    }
    function getEncodedPolylineFromRoute(route) {
      if (route?.overview_polyline?.points) return route.overview_polyline.points;
      if (route?.polyline?.encodedPolyline) return route.polyline.encodedPolyline;
      if (route?.overviewPolyline?.encodedPolyline) return route.overviewPolyline.encodedPolyline;
      return null;
    }
    function drawRoutePolyline(route) {
      if (appState.currentPolyline) { appState.currentPolyline.setMap(null); appState.currentPolyline=null; }
      const encoded = getEncodedPolylineFromRoute(route);
      if (!encoded) { showToast('ルート線の取得に失敗しました','error'); return; }
      const path = google.maps.geometry.encoding.decodePath(encoded);
      appState.currentPolyline = new google.maps.Polyline({ path, geodesic:true, strokeColor:'#62b5ff', strokeOpacity:.8, strokeWeight:6, map: appState.map });
    }

    // ==========================================
    // ナビ開始/停止
    // ==========================================
    async function startNavigation(destination) {
      let originLat, originLng;
      if (appState.pointSearchMode && appState.searchPoint) { originLat=appState.searchPoint.lat; originLng=appState.searchPoint.lng; }
      else if (appState.currentPos) { originLat=appState.currentPos.lat; originLng=appState.currentPos.lng; }
      else { showToast('起点が設定されていません','error'); return; }

      appState.currentDestination = destination; appState.isNavigating = true; appState.isPaused=false;
      document.getElementById('searchPanel').style.display='none';
      document.getElementById('btnSearch').style.display='flex';
      document.getElementById('btnLocate').style.display='flex';
      document.getElementById('btnDestination').style.display='flex';
      document.getElementById('btnPause').style.display='flex';
      document.getElementById('btnReroute').style.display='flex';

      try{
        showToast('ルートを取得中...','info',2000);
        const params = new URLSearchParams({ origin:`${originLat},${originLng}`, destination:`${destination.lat},${destination.lng}`, mode:'walking', language:'ja' });
        const response = await fetchWithRetry(`${WORKER_ORIGIN}/directions?${params.toString()}`);
        if(!response.ok){ throw new Error(`Directions API Error: ${response.status}`); }
        const result = await response.json();
        if (result.routes && result.routes.length>0){
          const r0=result.routes[0]; const l0=(r0.legs&&r0.legs[0])?r0.legs[0]:null;
          document.getElementById('destinationName').textContent = destination.name;
          document.getElementById('routeDistance').textContent = l0 ? readLegDistanceText(l0) : '--';
          document.getElementById('routeTime').textContent = `徒歩 ${l0 ? readLegDurationText(l0) : '--'}`;
          document.getElementById('routePanel').style.display='block';
          document.getElementById('results').style.display='none';
          document.getElementById('btnDestination').style.display='flex';
          drawRoutePolyline(r0);
          const bounds=new google.maps.LatLngBounds();
          bounds.extend(new google.maps.LatLng(originLat,originLng));
          bounds.extend(new google.maps.LatLng(destination.lat,destination.lng));
          appState.map.fitBounds(bounds,{top:100,right:50,bottom:200,left:50});
          setTimeout(()=>{ appState.map.panTo({lat:destination.lat,lng:destination.lng}); appState.map.setZoom(18);
            setTimeout(()=>{ appState.map.panTo({lat:originLat,lng:originLng}); appState.map.setZoom(18); },2000);
          },2000);
          showToast(`${destination.name} へのルート案内を開始`,'success');
        } else { throw new Error('ルートが取得できませんでした'); }
      }catch(e){
        console.error('[Navigation] Error:', e); showToast(`ルートエラー: ${e.message}`,'error',5000); appState.isNavigating=false;
      }
    }
    function stopNavigation() {
      if (appState.currentPolyline){ appState.currentPolyline.setMap(null); appState.currentPolyline=null; }
      appState.currentDestination=null; appState.isNavigating=false; appState.isPaused=false;
      document.getElementById('routePanel').style.display='none';
      document.getElementById('searchPanel').style.display='block';
      document.getElementById('btnDestination').style.display='none';
      document.getElementById('q').value=''; document.getElementById('results').style.display='none'; document.getElementById('results').innerHTML='';
      document.getElementById('btnSearch').style.display='none'; document.getElementById('btnLocate').style.display='none'; document.getElementById('btnPause').style.display='none'; document.getElementById('btnReroute').style.display='none';
      const btnPause=document.getElementById('btnPause'); btnPause.textContent='一時停止'; btnPause.classList.remove('paused');
      appState.searchMarkers.forEach(m=>m.map=null); appState.searchMarkers=[];
      if (appState.currentPos && appState.map){ appState.map.panTo(appState.currentPos); appState.map.setZoom(17); }
      showToast('ルート案内を終了しました','info');
    }
    function togglePause() {
      if (!appState.isNavigating){ showToast('ナビゲーション中ではありません','warning'); return; }
      appState.isPaused=!appState.isPaused;
      const btnPause=document.getElementById('btnPause');
      if (appState.isPaused){ btnPause.textContent='再開'; btnPause.classList.add('paused'); showToast('ナビゲーションを一時停止しました','warning'); }
      else { btnPause.textContent='一時停止'; btnPause.classList.remove('paused'); showToast('ナビゲーションを再開しました','success'); }
    }

    // ==========================================
    // 検索
    // ==========================================
    const TYPE_MAP = { "コンビニ":"convenience_store","スーパー":"supermarket","レストラン":"restaurant","カフェ":"cafe","ホテル":"lodging","病院":"hospital","薬局":"pharmacy","ガソリンスタンド":"gas_station","駐車場":"parking","銀行":"bank" };
    async function performSearch(query) {
      if (!query || !query.trim()){ showToast('検索ワードを入力してください','warning'); return; }
      let centerLat, centerLng;
      if (appState.pointSearchMode && appState.searchPoint){ centerLat=appState.searchPoint.lat; centerLng=appState.searchPoint.lng; }
      else if (appState.currentPos){ centerLat=appState.currentPos.lat; centerLng=appState.currentPos.lng; }
      else { showToast('検索の基準地点が不明です','error'); return; }
      const radiusKm=parseInt(document.getElementById('radiusLabel').textContent); const radiusMeters=radiusKm*1000;
      showToast('検索中...','info',2000);
      try{
        const data = await placesTextSearch({ textQuery: query.trim(), locationBias:{ circle:{ center:{ latitude:centerLat, longitude:centerLng }, radius:radiusMeters } }, maxResultCount:20, languageCode:'ja' }, DEFAULT_MASK);
        if (data.places?.length){ displayResults(data.places, centerLat, centerLng); return; }
      }catch(e){ console.error('[Search] Text Search Error:', e); }
      const typeKey = TYPE_MAP[query.trim()] || TYPE_MAP[query.trim().replace(/\s/g,'')];
      if (typeKey){
        try{
          const data = await placesNearby({ includedTypes:[typeKey], maxResultCount:20, locationRestriction:{ circle:{ center:{ latitude:centerLat, longitude:centerLng }, radius:radiusMeters } }, languageCode:'ja' }, DEFAULT_MASK);
          if (data.places?.length){ displayResults(data.places, centerLat, centerLng); return; }
        }catch(e){ console.error('[Search] Nearby Error:', e); }
      }
      showToast('検索結果が見つかりませんでした','warning'); document.getElementById('results').style.display='none';
    }
    function displayResults(places, centerLat, centerLng) {
      appState.searchMarkers.forEach(m=>m.map=null); appState.searchMarkers=[];
      const withDist = places.map(p=>({ ...p, distance: calculateDistance(centerLat,centerLng,p.location.latitude,p.location.longitude) }));
      withDist.sort((a,b)=>a.distance-b.distance); const limited=withDist.slice(0,5);
      const resultsDiv=document.getElementById('results'); resultsDiv.innerHTML=''; resultsDiv.style.display='block';
      limited.forEach((place, i)=>{
        const name=place.displayName?.text||place.displayName||'名称不明';
        const address=place.formattedAddress||'住所不明';
        const lat=place.location.latitude, lng=place.location.longitude;
        const item=document.createElement('div'); item.className='result-item';
        item.innerHTML=`<div class="result-name">${i+1}. ${name}</div><div class="result-address">${address}</div><div style="font-size:11px;color:#62b5ff;margin-top:4px">📍 ${(place.distance/1000).toFixed(2)}km</div>`;
        item.onclick=()=>startNavigation({ name, lat, lng }); resultsDiv.appendChild(item);
        const pin=document.createElement('div'); pin.style.width='24px'; pin.style.height='24px'; pin.style.borderRadius='50%'; pin.style.background='#25d07a'; pin.style.border='2px solid #fff'; pin.style.boxShadow='0 2px 6px rgba(0,0,0,.3)'; pin.style.display='flex'; pin.style.alignItems='center'; pin.style.justifyContent='center'; pin.style.color='#fff'; pin.style.fontSize='12px'; pin.style.fontWeight='bold'; pin.textContent=i+1;
        const marker=new google.maps.marker.AdvancedMarkerElement({ map:appState.map, position:{lat,lng}, content:pin, zIndex:500+i, title:name });
        appState.searchMarkers.push(marker);
      });
      showToast(`${limited.length}件の検索結果`,'success');
    }

    // ==========================================
    // 音声認識
    // ==========================================
    function initSpeechRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return false;
      const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
      appState.recognition=new SpeechRecognition(); appState.recognition.lang='ja-JP'; appState.recognition.continuous=false; appState.recognition.interimResults=false;
      appState.recognition.onstart=()=>{ document.getElementById('btnVoice').textContent='聞いています...'; document.getElementById('btnVoice').style.background='var(--ok)'; };
      appState.recognition.onresult=(e)=>{ const t=e.results[0][0].transcript; document.getElementById('q').value=t; performSearch(t); showToast(`音声認識: ${t}`,'success'); };
      appState.recognition.onerror=()=>{ document.getElementById('btnVoice').textContent='音声検索'; document.getElementById('btnVoice').style.background=''; showToast('音声認識エラーが発生しました','error'); };
      appState.recognition.onend=()=>{ document.getElementById('btnVoice').textContent='音声検索'; document.getElementById('btnVoice').style.background=''; };
      return true;
    }
    function startVoiceSearch() {
      if (!appState.recognition && !initSpeechRecognition()){ showToast('お使いのブラウザは音声認識に対応していません','error'); return; }
      try{ appState.recognition.start(); }catch(_){ try{ appState.recognition.stop(); setTimeout(()=>appState.recognition.start(),100);}catch(e2){ showToast('音声認識の開始に失敗しました','error'); } }
    }

    // ==========================================
    // 現在地取得
    // ==========================================
    function acquireLocation(retry = 0) {
      const MAX_RETRY_LOCAL=3, TIMEOUT=15000;
      const options={ enableHighAccuracy:true, timeout:TIMEOUT, maximumAge:0 };
      navigator.geolocation.getCurrentPosition(
        (pos)=>{
          const { latitude, longitude, accuracy } = pos.coords;
          const loading=document.getElementById('loading'); if (loading) loading.remove();
          if (!appState.map) initMap({ lat:latitude, lng:longitude });
          appState.map.setCenter({ lat:latitude, lng:longitude });
          setUserMarker(latitude, longitude);
          showToast('現在地を取得しました','success');
        },
        (err)=>{
          if (retry < MAX_RETRY_LOCAL){ showToast(`位置情報取得を再試行中... (${retry+1}/${MAX_RETRY_LOCAL})`,'warning',2000); setTimeout(()=>acquireLocation(retry+1),2000); }
          else{
            const loading=document.getElementById('loading'); if (loading) loading.remove();
            if (!appState.map) initMap({ lat:35.6812, lng:139.7671 });
            showToast('位置情報の取得に失敗しました。デフォルト位置を表示します','error',5000);
          }
        },
        options
      );
    }

    // ==========================================
    // ダイアログ/登録地点
    // ==========================================
    function createDialog(config){
      const overlay=document.createElement('div'); overlay.className=`dialog-overlay ${config.scroll?'scroll':''}`; overlay.id=config.id||'dialog';
      const box=document.createElement('div'); box.className=`dialog-box ${config.wide?'wide':''}`; box.innerHTML=config.content;
      overlay.appendChild(box); document.body.appendChild(overlay); return overlay;
    }
    function showSaveLocationDialog() {
      if (!appState.currentPos){ showToast('現在地が取得できていません','error'); return; }
      const dialog=createDialog({ id:'saveLocationDialog', content:`<h3 class="dialog-title">現在地点登録画面</h3><p class="dialog-text">登録する地点名を入力してください:</p><input type="text" id="locationNameInput" class="dialog-input" placeholder="地点名を入力" /><div class="dialog-actions"><button id="btnCancelSave" class="dialog-btn cancel">キャンセル</button><button id="btnConfirmSave" class="dialog-btn confirm">OK</button></div>` });
      const input=document.getElementById('locationNameInput'); const btnCancel=document.getElementById('btnCancelSave'); const btnConfirm=document.getElementById('btnConfirmSave'); setTimeout(()=>input.focus(),100);
      btnCancel.onclick=()=>dialog.remove();
      btnConfirm.onclick=()=>{ const name=input.value.trim(); if(!name){ showToast('地点名を入力してください','warning'); return; }
        const list=JSON.parse(localStorage.getItem('savedLocations')||'[]'); const saved={ name, lat:appState.currentPos.lat, lng:appState.currentPos.lng, timestamp:Date.now() };
        list.push(saved); localStorage.setItem('savedLocations', JSON.stringify(list)); dialog.remove(); showToast(`「${name}」を登録しました`,'success'); };
      input.addEventListener('keypress',(e)=>{ if(e.key==='Enter') btnConfirm.click(); });
    }
    function showEditLocationDialog() {
      const list=JSON.parse(localStorage.getItem('savedLocations')||'[]');
      if (!list.length){ const dlg=createDialog({ id:'editDialog', content:`<h3 class="dialog-title">登録地点修正</h3><p class="dialog-muted">登録された地点がありません</p><button id="btnCloseEmpty" class="dialog-btn confirm full">閉じる</button>` }); document.getElementById('btnCloseEmpty').onclick=()=>dlg.remove(); return; }
      let html='<div class="location-list">'; list.forEach((loc,i)=>{ html+=`<div class="location-item"><div class="location-item-name">${loc.name}</div><div class="location-item-coords">緯度: ${loc.lat.toFixed(6)} / 経度: ${loc.lng.toFixed(6)}</div><div class="location-item-actions"><button class="location-item-btn nav" data-index="${i}">ナビ開始</button><button class="location-item-btn edit" data-index="${i}">名前変更</button><button class="location-item-btn delete" data-index="${i}">削除</button></div></div>`; }); html+='</div>';
      const dlg=createDialog({ id:'editDialog', wide:true, scroll:true, content:`<h3 class="dialog-title">登録地点修正</h3>${html}<button id="btnCloseEdit" class="dialog-btn cancel full" style="margin-top:16px">閉じる</button>` });
      document.getElementById('btnCloseEdit').onclick=()=>dlg.remove();
      document.querySelectorAll('.location-item-btn.nav').forEach(b=>b.onclick=()=>{ const i=parseInt(b.dataset.index); const loc=list[i]; dlg.remove(); document.getElementById('searchPanel').style.display='none'; startNavigation({ name:loc.name, lat:loc.lat, lng:loc.lng }); });
      document.querySelectorAll('.location-item-btn.edit').forEach(b=>b.onclick=()=>{ const i=parseInt(b.dataset.index); const loc=list[i]; const rd=createDialog({ id:'renameDialog', content:`<h3 class="dialog-title">地点名変更</h3><input type="text" id="renameInput" value="${loc.name}" class="dialog-input" /><div class="dialog-actions"><button id="btnCancelRename" class="dialog-btn cancel">キャンセル</button><button id="btnConfirmRename" class="dialog-btn confirm">OK</button></div>` }); const ri=document.getElementById('renameInput'); setTimeout(()=>{ri.focus(); ri.select();},100); document.getElementById('btnCancelRename').onclick=()=>rd.remove(); document.getElementById('btnConfirmRename').onclick=()=>{ const nv=ri.value.trim(); if(!nv){ showToast('地点名を入力してください','warning'); return; } list[i].name=nv; localStorage.setItem('savedLocations', JSON.stringify(list)); rd.remove(); dlg.remove(); showToast(`地点名を「${nv}」に変更しました`,'success'); }; ri.addEventListener('keypress',(e)=>{ if(e.key==='Enter') document.getElementById('btnConfirmRename').click(); }); });
      document.querySelectorAll('.location-item-btn.delete').forEach(b=>b.onclick=()=>{ const i=parseInt(b.dataset.index); const loc=list[i]; const cd=createDialog({ id:'confirmDeleteDialog', content:`<h3 class="dialog-title">削除確認</h3><p class="dialog-text">「${loc.name}」を削除しますか？</p><div class="dialog-actions"><button id="btnCancelDelete" class="dialog-btn cancel">キャンセル</button><button id="btnConfirmDelete" class="dialog-btn delete">削除</button></div>` }); document.getElementById('btnCancelDelete').onclick=()=>cd.remove(); document.getElementById('btnConfirmDelete').onclick=()=>{ list.splice(i,1); localStorage.setItem('savedLocations', JSON.stringify(list)); cd.remove(); dlg.remove(); showToast(`「${loc.name}」を削除しました`,'success'); }; });
    }

    // ==========================================
    // UI バインド
    // ==========================================
    function bindSearchPanelEvents() {
      const radiusLabel=document.getElementById('radiusLabel');
      const r10=document.getElementById('r10'), r20=document.getElementById('r20'), r30=document.getElementById('r30');
      const btnPointSearch=document.getElementById('btnPointSearch');
      r10.onclick=()=>{ r10.classList.add('active'); r20.classList.remove('active'); r30.classList.remove('active'); radiusLabel.textContent='10km'; };
      r20.onclick=()=>{ r20.classList.add('active'); r10.classList.remove('active'); r30.classList.remove('active'); radiusLabel.textContent='20km'; };
      r30.onclick=()=>{ r30.classList.add('active'); r10.classList.remove('active'); r20.classList.remove('active'); radiusLabel.textContent='30km'; };
      btnPointSearch.onclick=()=>{ appState.pointSearchMode=!appState.pointSearchMode;
        if (appState.pointSearchMode){ btnPointSearch.textContent='📍 ポイント選択中...'; btnPointSearch.style.background='#25d07a'; btnPointSearch.style.color='#0a2818'; btnPointSearch.style.borderColor='transparent'; showToast('地図をタップして検索地点を選択','info'); }
        else { btnPointSearch.textContent='📍 ポイント選択'; btnPointSearch.style.background='rgba(255,255,255,.08)'; btnPointSearch.style.color='var(--text)'; btnPointSearch.style.borderColor='var(--stroke)'; }
      };
    }
    function bindLocationEvents(){ document.getElementById('btnSaveLocation').onclick=showSaveLocationDialog; document.getElementById('btnEditLocation').onclick=showEditLocationDialog; }
    function bindSearchEvents() {
      document.getElementById('btnText').onclick=()=>{ const q=document.getElementById('q').value.trim(); if(q) performSearch(q); };
      document.getElementById('q').addEventListener('keypress',(e)=>{ if(e.key==='Enter'){ const q=document.getElementById('q').value.trim(); if(q) performSearch(q); }});
      document.getElementById('btnVoice').onclick=startVoiceSearch;
      document.getElementById('btnReset').onclick=()=>{ document.getElementById('q').value=''; document.getElementById('results').style.display='none'; document.getElementById('results').innerHTML=''; appState.searchMarkers.forEach(m=>m.map=null); appState.searchMarkers=[]; appState.searchPoint=null; if(appState.searchPointMarker){ appState.searchPointMarker.map=null; appState.searchPointMarker=null; } appState.pointSearchMode=false; const b=document.getElementById('btnPointSearch'); b.textContent='📍 ポイント選択'; b.style.background='rgba(255,255,255,.08)'; b.style.color='var(--text)'; b.style.borderColor='var(--stroke)'; document.getElementById('r10').classList.add('active'); document.getElementById('r20').classList.remove('active'); document.getElementById('r30').classList.remove('active'); document.getElementById('radiusLabel').textContent='10km'; stopNavigation(); showToast('リセットしました','info'); };
    }
    function bindFABEvents() {
      let lastLocateTime=0;
      document.getElementById('btnSearch').onclick=()=>{ const panel=document.getElementById('searchPanel'); const btnSearch=document.getElementById('btnSearch');
        if (panel.style.display==='none'){ panel.style.display='block'; btnSearch.style.display='none'; document.getElementById('btnLocate').style.display='none'; document.getElementById('btnDestination').style.display='none'; document.getElementById('btnPause').style.display='none'; document.getElementById('btnReroute').style.display='none'; }
        else { panel.style.display='none'; btnSearch.style.display='flex'; document.getElementById('btnLocate').style.display='flex'; if(appState.currentDestination){ document.getElementById('btnDestination').style.display='flex'; } document.getElementById('btnPause').style.display='flex'; document.getElementById('btnReroute').style.display='flex'; }
      };
      document.getElementById('btnClosePanel').onclick=()=>{ document.getElementById('searchPanel').style.display='none'; document.getElementById('btnSearch').style.display='flex'; document.getElementById('btnLocate').style.display='flex'; if(appState.currentDestination){ document.getElementById('btnDestination').style.display='flex'; } document.getElementById('btnPause').style.display='flex'; document.getElementById('btnReroute').style.display='flex'; };
      document.getElementById('btnLocate').onclick=()=>{ const now=Date.now(); if(now-lastLocateTime<1000) return; lastLocateTime=now; if(appState.currentPos && appState.map){ appState.map.panTo(appState.currentPos); appState.map.setZoom(18); showToast('現在地に移動しました','info'); } else { showToast('現在地を取得します…','info'); acquireLocation(); } };
      document.getElementById('btnDestination').onclick=()=>{ const now=Date.now(); if(now-lastLocateTime<1000) return; lastLocateTime=now; if(appState.currentDestination && appState.map){ appState.map.panTo({lat:appState.currentDestination.lat,lng:appState.currentDestination.lng}); appState.map.setZoom(18); showToast('目的地に移動しました','info'); } };
      document.getElementById('btnPause').onclick=togglePause;
      document.getElementById('btnReroute').onclick=()=>{ if(appState.currentDestination) startNavigation(appState.currentDestination); else showToast('目的地が設定されていません','warning'); };
      document.getElementById('btnStopRoute').onclick=stopNavigation;
    }
    function bindUI(){ bindSearchPanelEvents(); bindLocationEvents(); bindSearchEvents(); bindFABEvents(); }

    // ==========================================
    // 起動
    // ==========================================
    async function checkGeoPermission(){ try{ if(!('permissions' in navigator)) return; const s=await navigator.permissions.query({name:'geolocation'}); if(s.state==='denied'){ showToast('位置情報がブロックされています。ブラウザの設定を確認してください','error',5000); } }catch(_){} }
    function startApp(){
      checkGeoPermission(); document.documentElement.lang='ja';
      document.getElementById('searchPanel').style.display='block';
      document.getElementById('btnSearch').style.display='none'; document.getElementById('btnLocate').style.display='none'; document.getElementById('btnDestination').style.display='none'; document.getElementById('btnPause').style.display='none'; document.getElementById('btnReroute').style.display='none';
      bindUI();
      if ('geolocation' in navigator){ acquireLocation(); }
      else { document.getElementById('loading').remove(); showToast('お使いのブラウザは位置情報に対応していません','error'); initMap({ lat:35.6812, lng:139.7671 }); }
      initSpeechRecognition();
    }

    // ==========================================
    // Google Maps API コールバック
    // ==========================================
    window.initApp = function(){ startApp(); };

    // ==========================================
    // DOMContentLoaded
    // ==========================================
    window.addEventListener('DOMContentLoaded', ()=>{ if (typeof google!=='undefined' && google.maps && google.maps.Map) startApp(); });
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk&v=weekly&libraries=marker,geometry&language=ja&region=JP&callback=initApp"
    async defer></script>
