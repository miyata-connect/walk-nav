<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — タブ内で地図／Gemini・ChatGPTはリンク</title> <!-- L006 -->
  <style> /* L007 */
    :root{ --bar:56px; --barW:60px; --hit:44px; } /* L008 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L009 */
    body{background:#f8fafc;} /* L010 */
    #app{position:relative;width:100%;height:100dvh;overflow:hidden;} /* L011 */

    .topbar{position:absolute;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:9999;} /* L012 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1 1 auto;} /* L013 */
    .tabs::-webkit-scrollbar{display:none;} /* L014 */

    .tab{display:flex;flex-direction:row;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;cursor:pointer;user-select:none;max-width:38vw;white-space:normal;overflow-wrap:anywhere;} /* L015 */
    #app.pos-left .tab,#app.pos-right .tab{max-width:calc(var(--barW) - 12px);flex-direction:column;align-items:center;} /* L016 */
    .tab .label{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;width:100%;gap:2px;} /* L017 */
    .tab .label > span{display:block;text-align:center;} /* テキスト部分も中央揃え */
    .tab .label svg{display:block;margin:0 auto;} /* 追加：SVGアイコンのスタイル */
    .tab.active .label svg path{filter:brightness(0) invert(1);} /* アクティブタブのSVGを白く */
    .tab.active .label svg circle{filter:brightness(0) invert(1);} /* アクティブタブのSVGを白く */
    .tab .close{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:10px;font-size:14px;background:#f3f4f6;color:#374151;margin-left:auto;margin-top:4px;} /* L018 */
    .tab .close:hover{background:#e5e7eb} /* L019 */
    .tab.active{border-color:#2563eb;color:#fff;background:#2563eb;} /* L020 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;align-items:center;} /* L021 */
    .tab.flash{transition:background-color .2s, box-shadow .2s;background:#eef2ff;box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L022 */

    #app.pos-top .tab, #app.pos-bottom .tab{flex-direction:row;align-items:center;max-width:none;padding:6px 10px;} /* L023 */
    #app.pos-top .tab .label, #app.pos-bottom .tab .label{white-space:nowrap;} /* L024 */

    .view{position:absolute;top:var(--bar);left:0;right:0;bottom:0;display:none;z-index:0;} /* L025 */
    .view.active{display:block;} /* L026 */

    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L027 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;display:block;} /* L028 */

    .start{position:absolute;inset:0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:flex-start;background:#f8fafc;z-index:1;} /* L029 */
    .card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:14px;background:#fff;min-height:120px;text-decoration:none;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.06);} /* L030 */
    .card .title{margin-top:6px;font-size:13px;color:#374151;} /* L031 */
    .card .url{margin-top:8px;font-size:12px;color:#6b7280;word-break:break-all;padding:0 10px;text-align:center;} /* L032 */
    .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;} /* L033 */
    .btn,.alink{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#111;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:12px;text-decoration:none;} /* L034 */
    .muted{color:#6b7280;font-size:12px;margin-top:8px;text-align:center;grid-column:1/-1;} /* L035 */
    .tabmap{position:absolute;inset:0;border:0;background:#e5e7eb;display:none;width:100%;height:100%;z-index:2;} /* L036 */
    .tabmap.active{display:block;} /* L037 */

    #app.pos-bottom .topbar{inset:auto 0 0 0;height:var(--bar);box-shadow:0 -8px 24px rgba(0,0,0,.08);} /* L038 */
    #app.pos-bottom .view{top:0;bottom:var(--bar);} /* L039 */

    #app.pos-left .topbar{inset:0 auto 0 0;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-start;box-shadow:8px 0 24px rgba(0,0,0,.08);} /* L040 */
    #app.pos-left .view{top:0;left:var(--barW);right:0;bottom:0;} /* L041 */
    #app.pos-left .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;flex:1 1 auto;} /* L042 */

    #app.pos-right .topbar{inset:0 0 0 auto;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-end;box-shadow:-8px 0 24px rgba(0,0,0,.08);} /* L043 */
    #app.pos-right .view{top:0;left:0;right:var(--barW);bottom:0;} /* L044 */
    #app.pos-right .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;flex:1 1 auto;} /* L045 */

    .navtools{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:0 0 auto;} /* L046 */
    .navbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--hit);height:var(--hit);border-radius:12px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;user-select:none;transition:transform .06s ease;} /* L047 */
    .navbtn:active{transform:translateY(1px);} /* L048 */
    .navbtn svg{width:28px;height:28px;display:block;} /* L049 */
    .navbtn.home{background:#e0f2fe;border-color:#bae6fd;} .navbtn.home svg path{fill:#2563eb;} /* L050 */
    .navbtn.back{background:#fef3c7;border-color:#fde68a;} .navbtn.back svg path{fill:#b45309;} /* L051 */
    .navbtn.forward{background:#dcfce7;border-color:#bbf7d0;} .navbtn.forward svg path{fill:#16a34a;} /* L052 */

    #app.pos-left .navbtn, #app.pos-right .navbtn{width:52px;height:52px;border-radius:14px;margin-left:auto;margin-right:auto;} /* L053 */
    #app.pos-left .navtools,#app.pos-right .navtools{flex-direction:column;gap:10px;margin-top:auto;margin-bottom:6px;} /* L054 */
    #app.pos-left .topbar,#app.pos-right .topbar{padding-top:6px;padding-bottom:6px;} /* L055 */
  </style> <!-- L056 -->
</head> <!-- L057 -->
<body> <!-- L058 -->
<div id="app" class="pos-left"> <!-- L059 -->
  <div class="topbar"> <!-- L060 -->
    <div class="tabs" id="tabs"> <!-- L061 -->
      <div class="tab active" data-view="view-map" id="tab-map">
        <span class="label">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="#62b5ff" d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/>
          </svg>
          地図
        </span>
      </div>
      <div class="tab" data-view="view-browser" id="tab-browser">
        <span class="label">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <circle cx="12" cy="12" r="10" fill="#25d07a"/>
            <circle cx="9" cy="10" r="1.5" fill="#fff"/>
            <circle cx="15" cy="10" r="1.5" fill="#fff"/>
            <path d="M8 14c0 2.2 1.8 4 4 4s4-1.8 4-4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          </svg>
          <span>Ai</span>
        </span>
      </div>
      <div class="tab" data-view="view-settings" id="tab-settings">
        <span class="label">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="#94a3b8" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
          設定
        </span>
      </div>
      <div class="tab add" id="tab-add" title="新しいタブを作成">
        <span class="label">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="#64748b" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </span>
      </div>
    </div> <!-- L066 -->

    <div class="navtools" aria-label="ナビゲーション操作">
      <button class="navbtn home" id="btn-home" aria-label="ホーム">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v10h-5V15H11v6H6V11H3z"/></svg>
      </button>
      <button class="navbtn back" id="btn-back" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5V7z"/></svg>
      </button>
      <button class="navbtn forward" id="btn-forward" aria-label="進む">
        <svg viewBox="0 0 24 24"><path d="M10 7l5 5-5 5V7z"/></svg>
      </button>
    </div>
  </div> <!-- L067 -->

  <!-- 地図タブ --> <!-- L068 -->
  <div class="view active" id="view-map"> <!-- L069 -->
    <div id="mapHost"> <!-- L070 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L071 -->
    </div> <!-- L072 -->
  </div> <!-- L073 -->

  <!-- Aiブラウザ --> <!-- L074 -->
  <div class="view" id="view-browser"> <!-- L075 -->
    <div class="start" aria-label="スタート"> <!-- L076 -->
      <div class="card">
        <div style="font-size:24px">🗺️</div>
        <div class="title">このタブで地図を表示</div>
        <div class="row"><button class="btn" data-action="open-map-here" data-view="view-browser" type="button">地図を表示</button></div>
      </div>
      <div class="card">
        <div style="font-size:24px">🧠</div>
        <div class="title">Gemini</div>
        <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>
        <div class="url">https://gemini.google.com/</div>
      </div>
      <div class="card">
        <div style="font-size:24px">💬</div>
        <div class="title">ChatGPT</div>
        <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>
        <div class="url">https://chatgpt.com/</div>
      </div>
      <div class="muted">※ リンクは新しいブラウザタブで開きます（本アプリは残ります）。『地図を表示』はこのタブ内だけに適用。</div>
    </div>
    <iframe class="tabmap" id="view-browser-map" title="Aiタブ内地図" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L077 -->
  </div> <!-- L078 -->

  <!-- 設定 --> <!-- L079 -->
  <div class="view" id="view-settings"> <!-- L080 -->
    <div class="start" aria-label="設定"> <!-- L081 -->
      <div class="card" style="grid-column:span 3">
        <div class="title">設定：タブの場所（上／下／右／左）</div>
        <div class="row" id="posControls" role="radiogroup">
          <label class="btn"><input type="radio" name="tabpos" value="top" style="display:none">上</label>
          <label class="btn"><input type="radio" name="tabpos" value="bottom" style="display:none">下</label>
          <label class="btn"><input type="radio" name="tabpos" value="left" style="display:none">左</label>
          <label class="btn"><input type="radio" name="tabpos" value="right" style="display:none">右</label>
        </div>
        <div class="muted">選択は自動保存され、次回起動時に復元されます。</div>
      </div>
      <div class="card" style="grid-column:span 3"><div class="title">状態：未ログイン／通知未設定／v=tab-local-map+links</div></div>
    </div>
  </div> <!-- L082 -->
</div> <!-- L083 -->

<script> /* L084 */
(function(){
  const appEl=document.getElementById('app');
  const tabsEl=document.getElementById('tabs');
  const SKEY_TABS='WN_TABS_LOCAL_V2';
  const SKEY_POS ='WN_TAB_POS_V1';

  function snapIntoView(el){ try{ el && el.scrollIntoView({block:'nearest',inline:'end'}); }catch(_){} }

  /* === 住所→現在地(緯度/経度) の順を強制 === */
  function enforceOrder(doc){
    try{
      const all = Array.from(doc.querySelectorAll('div,li,p,span'));
      const addr = all.find(n => /〒\s*\d{3}-?\d{4}/.test(n.textContent||''));
      const coord= all.find(n => /(緯度|経度)/.test(n.textContent||''));
      if(!addr || !coord) return;

      // ラベル補正（必ず「現在地：」で開始）
      const t = (coord.textContent||'').trim();
      if(!/^現在地：/.test(t)){
        coord.textContent = '現在地：' + t.replace(/^(.*?：)?\s*/,'');
      }

      // 住所を必ず座標の直前へ移動（親が異なってもOK）
      if (addr.compareDocumentPosition(coord) & Node.DOCUMENT_POSITION_FOLLOWING){
        // addr が coord の前に既にある → 何もしない
      } else {
        coord.parentNode.insertBefore(addr, coord);
      }
    }catch(_){}
  }

  function hookEmbed(doc){
    if(!doc) return;
    let timer=null;
    const debounced=()=>{ clearTimeout(timer); timer=setTimeout(()=>enforceOrder(doc), 50); };
    debounced();
    try{
      const mo=new MutationObserver(debounced);
      mo.observe(doc.body||doc,{childList:true,subtree:true,characterData:true});
    }catch(_){}
  }

  /* 主要 iframes へフック */
  function attachHookToIframe(ifr){
    if(!ifr) return;
    const cb=()=>{ try{ hookEmbed(ifr.contentWindow.document); }catch(_){ /* 同一オリジン前提 */ } };
    if(ifr.contentWindow && (ifr.contentDocument?.readyState==='complete' || ifr.contentDocument?.readyState==='interactive')){
      cb();
    }else{
      ifr.addEventListener('load', cb, {once:false});
    }
  }

  attachHookToIframe(document.getElementById('mapFrame'));
  attachHookToIframe(document.getElementById('view-browser-map'));

  /* 以降、既存のタブ・ナビ・設定ロジック（省略なし、動作は前版同等） */
  function activateTab(btn, doPush=true){
    if(!btn) return;
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    const vid=btn.dataset.view; if(vid){ const v=document.getElementById(vid); if(v) v.classList.add('active'); }
    snapIntoView(btn);
  }

  function nextLabel(){
    const list=[...document.querySelectorAll('.tab')].filter(n=>!n.classList.contains('add') && !['tab-map','tab-browser','tab-settings'].includes(n.id));
    return 'タブ1';
  }
  function startContentHTML(viewId){
    return `
      <div class="start" aria-label="リンク集">
        <div class="card">
          <div style="font-size:24px">🗺️</div>
          <div class="title">このタブで地図を表示</div>
          <div class="row"><button class="btn" data-action="open-map-here" data-view="${viewId}" type="button">地図を表示</button></div>
        </div>
        <div class="card">
          <div style="font-size:24px">🧠</div>
          <div class="title">Gemini</div>
          <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>
          <div class="url">https://gemini.google.com/</div>
        </div>
        <div class="card">
          <div style="font-size:24px">💬</div>
          <div class="title">ChatGPT</div>
          <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>
          <div class="url">https://chatgpt.com/</div>
        </div>
        <div class="muted">※ リンクは新しいブラウザタブで開きます。本アプリは残ります。</div>
      </div>
      <iframe class="tabmap" id="${viewId}-map" title="タブ内地図" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe>
    `;
  }

  let tabCounter=0; function makeIds(){ tabCounter++; const id=`user-${Date.now()}-${tabCounter}`; return {tabId:`tab-${id}`, viewId:`view-${id}`}; }
  function persistTabs(){
    const nodes=[...document.querySelectorAll('.tab')].filter(n=>!n.classList.contains('add') && !['tab-map','tab-browser','tab-settings'].includes(n.id));
    const data=nodes.map(n=>{
      const viewId=n.dataset.view;
      const mapEl=document.getElementById(viewId+'-map');
      const mapOpened=!!(mapEl && mapEl.classList.contains('active') && mapEl.src.includes('embed.html'));
      const label=n.querySelector('.label')?.textContent || n.textContent;
      return {tabId:n.id, viewId, label, mapOpened};
    });
    const aiMap=document.getElementById('view-browser-map');
    const aiOpened=!!(aiMap && aiMap.classList.contains('active') && aiMap.src.includes('embed.html'));
    try{ sessionStorage.setItem(SKEY_TABS, JSON.stringify({tabs:data, aiOpened})); }catch(_){}
  }
  function addTabFromState(state){
    const addBtn=document.getElementById('tab-add');
    const tab=document.createElement('div');
    tab.className='tab'; tab.id=state.tabId; tab.dataset.view=state.viewId;
    tab.innerHTML=`<span class="label"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="#a78bfa" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>${state.label}</span><span class="close" data-close="${state.viewId}" aria-label="閉じる">×</span>`;
    addBtn.parentNode.insertBefore(tab, addBtn);

    const view=document.createElement('div');
    view.className='view'; view.id=state.viewId; view.innerHTML=startContentHTML(state.viewId);
    document.getElementById('app').appendChild(view);

    const m=document.getElementById(state.viewId+'-map'); attachHookToIframe(m);
    if(state.mapOpened){ if(m){ m.classList.add('active'); } const s=view.querySelector('.start'); if(s) s.style.display='none'; }
  }
  function restoreTabs(){
    try{
      const saved=JSON.parse(sessionStorage.getItem(SKEY_TABS)||'{"tabs":[]}');
      (saved.tabs||[]).forEach(addTabFromState);
      if(saved.aiOpened){
        const ai=document.getElementById('view-browser-map'); const s=document.querySelector('#view-browser .start');
        if(ai){ ai.classList.add('active'); } if(s) s.style.display='none';
      }
    }catch(_){}
  }

  function addTab(label){
    const {tabId,viewId}=makeIds(); const addBtn=document.getElementById('tab-add');
    const tab=document.createElement('div');
    tab.className='tab'; tab.id=tabId; tab.dataset.view=viewId;
    tab.innerHTML=`<span class="label"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="#a78bfa" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>${label}</span><span class="close" data-close="${viewId}" aria-label="閉じる">×</span>`;
    addBtn.parentNode.insertBefore(tab, addBtn);
    tab.classList.add('flash'); setTimeout(()=>tab.classList.remove('flash'),200);

    const view=document.createElement('div');
    view.className='view'; view.id=viewId; view.innerHTML=startContentHTML(viewId);
    document.getElementById('app').appendChild(view);
    attachHookToIframe(document.getElementById(viewId+'-map'));

    activateTab(tab); persistTabs(); snapIntoView(addBtn);
  }
  function closeTab(viewId){
    const tab=[...document.querySelectorAll('.tab')].find(t=>t.dataset.view===viewId);
    const view=document.getElementById(viewId);
    if(!tab||!view) return;
    const isActive=tab.classList.contains('active');
    tab.remove(); view.remove(); persistTabs();
    if(isActive){ const mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab); }
  }

  /* イベント */
  tabsEl.addEventListener('click',(e)=>{
    const btn=e.target.closest('.tab'); if(!btn) return;
    const close=e.target.closest('.close');
    if(close){ closeTab(close.dataset.close); return; }
    if(btn.id==='tab-add'){ addTab(nextLabel()); return; }
    if(btn.dataset.view){ activateTab(btn); }
  });
  document.addEventListener('click',(e)=>{
    const b=e.target.closest('.btn'); if(!b) return;
    if(b.dataset.action==='open-map-here'){ const vid=b.dataset.view; if(vid){ const v=document.getElementById(vid); const map=v.querySelector('.tabmap'); const s=v.querySelector('.start'); if(map){ map.classList.add('active'); } if(s) s.style.display='none'; persistTabs(); } }
  });

  /* 設定：位置変更→即閉じ */
  function setTabPosition(pos){
    const p=(pos==='bottom'||pos==='left'||pos==='right')?pos:'top';
    appEl.classList.remove('pos-top','pos-bottom','pos-left','pos-right');
    appEl.classList.add('pos-'+p);
    try{ localStorage.setItem(SKEY_POS,p); }catch(_){}
    snapIntoView(document.getElementById('tab-add'));
  }
  (function initPositionUI(){
    let saved='left'; try{ saved=localStorage.getItem(SKEY_POS)||saved; }catch(_){}
    setTabPosition(saved);
    const posEl=document.getElementById('posControls'); if(!posEl) return;
    const radios=[...posEl.querySelectorAll('input[name="tabpos"]')];
    radios.forEach(r=>{ r.checked=(r.value===saved); });
    posEl.addEventListener('click',(e)=>{
      const lab=e.target.closest('label'); if(!lab) return;
      const input=lab.querySelector('input[name="tabpos"]'); if(!input) return;
      setTabPosition(input.value);
      radios.forEach(r=>{ r.checked=(r===input); });
      const mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab);
    });
  })();

  /* 初期化 */
  (function init(){
    restoreTabs();
    const mf=document.getElementById('mapFrame'); attachHookToIframe(mf);
    const initial=document.querySelector('.tab.active')||document.getElementById('tab-map');
    activateTab(initial,false);
    snapIntoView(document.getElementById('tab-add'));
  })();
})();
