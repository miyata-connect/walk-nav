<!-- 001 --> <!DOCTYPE html>
<!-- 002 --> <html lang="ja">
<!-- 003 --> <head>
<!-- 004 -->   <meta charset="utf-8">
<!-- 005 -->   <meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 006 -->   <title>WalkNav</title>
<!-- 007 -->   <!-- Material Symbols Rounded（カラー統一ピクトグラム用） -->
<!-- 008 -->   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<!-- 009 -->   <style>
<!-- 010 -->     :root{
<!-- 011 -->       --sz-icon: 28px;           /* アイコン基準サイズ */
<!-- 012 -->       --pad-icon: 10px;          /* タップ余白（配置は不変） */
<!-- 013 -->       --radius-btn: 12px;        /* 角丸（既存に影響しない標準） */
<!-- 014 -->       --clr-home: #2962FF;       /* ホーム */
<!-- 015 -->       --clr-map: #00C853;        /* 地図 */
<!-- 016 -->       --clr-ai: #FF6D00;         /* AIブラウザ */
<!-- 017 -->       --clr-settings: #455A64;   /* 設定 */
<!-- 018 -->       --clr-newtab: #6A1B9A;     /* 新規タブ */
<!-- 019 -->       --clr-back: #D50000;       /* 戻る */
<!-- 020 -->       --clr-fwd: #2E7D32;        /* 進む */
<!-- 021 -->       --clr-hover: rgba(0,0,0,.06);
<!-- 022 -->       --clr-active: rgba(0,0,0,.12);
<!-- 023 -->     }
<!-- 024 -->     /* アイコン列（既存レイアウトを壊さない独立ブロック） */
<!-- 025 -->     .iconbar{
<!-- 026 -->       display:flex; gap:8px; align-items:center;
<!-- 027 -->       /* 既存配置に合わせて下記は任意で調整可（本ファイルでは変更しません） */
<!-- 028 -->     }
<!-- 029 -->     .iconbtn{
<!-- 030 -->       display:inline-flex; align-items:center; justify-content:center;
<!-- 031 -->       width:calc(var(--sz-icon) + 2*var(--pad-icon));
<!-- 032 -->       height:calc(var(--sz-icon) + 2*var(--pad-icon));
<!-- 033 -->       border:none; background:transparent; border-radius:var(--radius-btn);
<!-- 034 -->       cursor:pointer; -webkit-tap-highlight-color: transparent;
<!-- 035 -->     }
<!-- 036 -->     .iconbtn:focus{ outline: 2px solid rgba(0,0,0,.2); outline-offset:2px; }
<!-- 037 -->     .iconbtn:hover{ background:var(--clr-hover); }
<!-- 038 -->     .iconbtn:active{ background:var(--clr-active); }
<!-- 039 -->     .material-symbols-rounded{
<!-- 040 -->       font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
<!-- 041 -->       font-size: var(--sz-icon);
<!-- 042 -->       line-height: 1;
<!-- 043 -->     }
<!-- 044 -->     /* 役割別カラー（統一） */
<!-- 045 -->     .ico-home{ color: var(--clr-home); }
<!-- 046 -->     .ico-map{ color: var(--clr-map); }
<!-- 047 -->     .ico-ai{ color: var(--clr-ai); }
<!-- 048 -->     .ico-settings{ color: var(--clr-settings); }
<!-- 049 -->     .ico-newtab{ color: var(--clr-newtab); }
<!-- 050 -->     .ico-back{ color: var(--clr-back); }
<!-- 051 -->     .ico-fwd{ color: var(--clr-fwd); }
<!-- 052 -->     /* 既存UIの干渉回避：このブロックは独立命名。外部のCSSを上書きしない方針。 */
<!-- 053 -->   </style>
<!-- 054 --> </head>
<!-- 055 --> <body>
<!-- 056 -->   <!-- 既存レイアウトは不変。下記の .iconbar を既存のヘッダー/フッター位置にそのまま配置します。 -->
<!-- 057 -->   <div class="iconbar" role="toolbar" aria-label="ナビゲーション">
<!-- 058 -->     <button class="iconbtn" aria-label="ホーム" title="ホーム">
<!-- 059 -->       <span class="material-symbols-rounded ico-home">home</span>
<!-- 060 -->     </button>
<!-- 061 -->     <button class="iconbtn" aria-label="地図" title="地図">
<!-- 062 -->       <span class="material-symbols-rounded ico-map">map</span>
<!-- 063 -->     </button>
<!-- 064 -->     <button class="iconbtn" aria-label="AIブラウザ" title="AIブラウザ">
<!-- 065 -->       <span class="material-symbols-rounded ico-ai">travel_explore</span>
<!-- 066 -->     </button>
<!-- 067 -->     <button class="iconbtn" aria-label="設定" title="設定">
<!-- 068 -->       <span class="material-symbols-rounded ico-settings">settings</span>
<!-- 069 -->     </button>
<!-- 070 -->     <button class="iconbtn" aria-label="新規タブ" title="新規タブ">
<!-- 071 -->       <span class="material-symbols-rounded ico-newtab">open_in_new</span>
<!-- 072 -->     </button>
<!-- 073 -->     <button class="iconbtn" aria-label="戻る" title="戻る">
<!-- 074 -->       <span class="material-symbols-rounded ico-back">arrow_back</span>
<!-- 075 -->     </button>
<!-- 076 -->     <button class="iconbtn" aria-label="進む" title="進む">
<!-- 077 -->       <span class="material-symbols-rounded ico-fwd">arrow_forward</span>
<!-- 078 -->     </button>
<!-- 079 -->   </div>
<!-- 080 --> 
<!-- 081 -->   <!-- 本アプリ本体のコンテンツ（既存を保持） -->
<!-- 082 -->   <main id="app" aria-live="polite">
<!-- 083 -->     <!-- 既存の地図・検索・案内UIはここに維持されます。ここでは触れません。 -->
<!-- 084 -->   </main>
<!-- 085 --> 
<!-- 086 -->   <!-- Google Maps JavaScript API（貴殿支給のブラウザ用キーを埋め込み） -->
<!-- 087 -->   <!-- 仕様遵守：Maps JavaScript のみを読み込み、Places(New)の直接呼び出しは行いません。 -->
<!-- 088 -->   <script async defer
<!-- 089 -->     src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk&libraries=&callback=initMap">
<!-- 090 -->   </script>
<!-- 091 -->   <script>
<!-- 092 -->     // 既存の初期化を壊さないダミー。既に定義済みなら上書きしません。
<!-- 093 -->     if(typeof window.initMap!=='function'){ window.initMap = function(){}; }
<!-- 094 -->     // アイコンのクリック挙動は既存ロジックにフック。ここではDOMのみ差し替え。
<!-- 095 -->   </script>
<!-- 096 --> </body>
<!-- 097 --> </html>
