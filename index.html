<!DOCTYPE html> <!-- L001 -->
<html lang="ja"> <!-- L002 -->
<head> <!-- L003 -->
  <meta charset="utf-8" /> <!-- L004 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <!-- L005 -->
  <title>WalkNav — タブ内で地図／Gemini・ChatGPTはリンク</title> <!-- L006 -->
  <style> /* L007 */
    :root{ --bar:56px; --barW:60px; --hit:44px; } /* L008 */
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;} /* L009 */
    body{background:#f8fafc;} /* L010 */
    #app{position:relative;width:100%;height:100dvh;overflow:hidden;} /* L011 */

    /* タブバー */ /* L012 */
    .topbar{position:absolute;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:9999;} /* L013 */
    .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1 1 auto;} /* L014 */
    .tabs::-webkit-scrollbar{display:none;} /* L015 */

    /* タブ本体（縦置き時＝折返し／横置き時＝横書き） */ /* L016 */
    .tab{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px 10px;border-radius:999px;border:1px solid transparent;background:#fff;font-size:14px;color:#111;cursor:pointer;user-select:none;max-width:38vw;white-space:normal;overflow-wrap:anywhere;} /* L017 */
    #app.pos-left .tab,#app.pos-right .tab{max-width:calc(var(--barW) - 12px);} /* L018 */
    .tab .label{display:block;line-height:1.2;} /* L019 */
    .tab .close{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:10px;font-size:12px;background:#f3f4f6;color:#374151;margin-left:6px;} /* L020 */
    .tab .close:hover{background:#e5e7eb} /* L021 */
    .tab.active{border-color:#2563eb;color:#2563eb;} /* L022 */
    .tab.add{background:#f8fafc;border:1px dashed #cbd5e1;align-items:center;} /* L023 */
    .tab.flash{transition:background-color .2s, box-shadow .2s;background:#eef2ff;box-shadow:0 0 0 2px rgba(37,99,235,.25) inset;} /* L024 */

    /* トップ/ボトム＝横書き固定＆はみ出し防止 */ /* L025 */
    #app.pos-top .tab, #app.pos-bottom .tab{flex-direction:row;align-items:center;max-width:none;padding:6px 10px;} /* L026 */
    #app.pos-top .tab .label, #app.pos-bottom .tab .label{white-space:nowrap;} /* L027 */

    /* ビュー領域 */ /* L028 */
    .view{position:absolute;top:var(--bar);left:0;right:0;bottom:0;display:none;z-index:0;} /* L029 */
    .view.active{display:block;} /* L030 */

    /* 地図埋め込み */ /* L031 */
    #mapHost{position:absolute;inset:0;display:flex;flex-direction:column;} /* L032 */
    #mapFrame{flex:1;width:100%;height:100%;border:0;background:#e5e7eb;display:block;} /* L033 */

    /* スタート画面 */ /* L034 */
    .start{position:absolute;inset:0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:flex-start;background:#f8fafc;z-index:1;} /* L035 */
    .card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:14px;background:#fff;min-height:120px;text-decoration:none;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.06);} /* L036 */
    .card .title{margin-top:6px;font-size:13px;color:#374151;} /* L037 */
    .card .url{margin-top:8px;font-size:12px;color:#6b7280;word-break:break-all;padding:0 10px;text-align:center;} /* L038 */
    .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;} /* L039 */
    .btn,.alink{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;color:#111;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:12px;text-decoration:none;} /* L040 */
    .muted{color:#6b7280;font-size:12px;margin-top:8px;text-align:center;grid-column:1/-1;} /* L041 */

    /* タブ内地図 */ /* L042 */
    .tabmap{position:absolute;inset:0;border:0;background:#e5e7eb;display:none;width:100%;height:100%;z-index:2;} /* L043 */
    .tabmap.active{display:block;} /* L044 */

    /* 下配置 */ /* L045 */
    #app.pos-bottom .topbar{inset:auto 0 0 0;height:var(--bar);box-shadow:0 -8px 24px rgba(0,0,0,.08);} /* L046 */
    #app.pos-bottom .view{top:0;bottom:var(--bar);} /* L047 */
    #app.pos-bottom .tabs{flex-direction:row;overflow-x:auto;overflow-y:hidden;} /* L048 */

    /* 左配置 */ /* L049 */
    #app.pos-left .topbar{inset:0 auto 0 0;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-start;box-shadow:8px 0 24px rgba(0,0,0,.08);} /* L050 */
    #app.pos-left .view{top:0;left:var(--barW);right:0;bottom:0;} /* L051 */
    #app.pos-left .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;flex:1 1 auto;} /* L052 */

    /* 右配置 */ /* L053 */
    #app.pos-right .topbar{inset:0 0 0 auto;width:var(--barW);height:auto;display:flex;flex-direction:column;align-items:flex-end;box-shadow:-8px 0 24px rgba(0,0,0,.08);} /* L054 */
    #app.pos-right .view{top:0;left:0;right:var(--barW);bottom:0;} /* L055 */
    #app.pos-right .tabs{flex-direction:column;overflow-y:auto;overflow-x:hidden;height:100%;flex:1 1 auto;} /* L056 */

    /* 独立ナビツール（センタリング・色付き・スリム） */ /* L057 */
    .navtools{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:0 0 auto;} /* L058 */
    .navbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--hit);height:var(--hit);border-radius:12px;border:1px solid #e5e7eb;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;user-select:none;transition:transform .06s ease;outline:none;} /* L059 */
    .navbtn:active{transform:translateY(1px);} /* L060 */
    .navbtn svg{width:22px;height:22px;display:block;} /* L061 */
    .navbtn.home{background:#e0f2fe;border-color:#bae6fd;} .navbtn.home svg path{fill:#2563eb;} /* L062 */
    .navbtn.back{background:#fef3c7;border-color:#fde68a;} .navbtn.back svg path{fill:#b45309;} /* L063 */
    .navbtn.forward{background:#dcfce7;border-color:#bbf7d0;} .navbtn.forward svg path{fill:#16a34a;} /* L064 */

    /* 縦バー＝ボタンを大きく＆左右完全センター（左右の余白差をゼロ） */ /* L065 */
    #app.pos-left .navbtn, #app.pos-right .navbtn{width:52px;height:52px;border-radius:14px;margin-left:auto;margin-right:auto;} /* L066 */
    #app.pos-left .navtools,#app.pos-right .navtools{flex-direction:column;gap:10px;margin-top:auto;margin-bottom:6px;align-self:stretch;} /* L067 */
    #app.pos-left .topbar,#app.pos-right .topbar{padding-top:6px;padding-bottom:6px;} /* L068 */
  </style> <!-- L069 -->
</head> <!-- L070 -->
<body> <!-- L071 -->
<div id="app" class="pos-left"> <!-- L072 -->
  <div class="topbar"> <!-- L073 -->
    <div class="tabs" id="tabs"> <!-- L074 -->
      <div class="tab active" data-view="view-map" id="tab-map"><span class="label">🗺️ 地図</span></div> <!-- L075 -->
      <div class="tab" data-view="view-browser" id="tab-browser"><span class="label">🤖 Aiブラウザ</span></div> <!-- L076 -->
      <div class="tab" data-view="view-settings" id="tab-settings"><span class="label">⚙️ 設定</span></div> <!-- L077 -->
      <div class="tab add" id="tab-add" title="新しいタブを作成"><span class="label">＋</span></div> <!-- L078 -->
    </div> <!-- L079 -->

    <!-- 独立ナビツール --> <!-- L080 -->
    <div class="navtools" id="navtools" aria-label="ナビゲーション操作">
      <button class="navbtn home" id="btn-home" aria-label="ホーム">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v10h-5V15H11v6H6V11H3z"/></svg>
      </button>
      <button class="navbtn back" id="btn-back" aria-label="戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l-5 5 5 5V7z"/></svg>
      </button>
      <button class="navbtn forward" id="btn-forward" aria-label="進む">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5V7z"/></svg>
      </button>
    </div>
  </div> <!-- L081 -->

  <!-- 地図タブ（embed.html） --> <!-- L082 -->
  <div class="view active" id="view-map"> <!-- L083 -->
    <div id="mapHost"> <!-- L084 -->
      <iframe id="mapFrame" title="地図（embed.html）" src="./embed.html" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L085 -->
    </div> <!-- L086 -->
  </div> <!-- L087 -->

  <!-- Aiブラウザ（同タブで地図を表示） --> <!-- L088 -->
  <div class="view" id="view-browser"> <!-- L089 -->
    <div class="start" aria-label="スタート"> <!-- L090 -->
      <div class="card">
        <div style="font-size:24px">🗺️</div>
        <div class="title">このタブで地図を表示</div>
        <div class="row"><button class="btn" data-action="open-map-here" data-view="view-browser" type="button">地図を表示</button></div>
      </div> <!-- L091 -->
      <div class="card">
        <div style="font-size:24px">🧠</div>
        <div class="title">Gemini</div>
        <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>
        <div class="url">https://gemini.google.com/</div>
      </div> <!-- L092 -->
      <div class="card">
        <div style="font-size:24px">💬</div>
        <div class="title">ChatGPT</div>
        <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>
        <div class="url">https://chatgpt.com/</div>
      </div> <!-- L093 -->
      <div class="muted">※ リンクは新しいブラウザタブで開きます（本アプリは残ります）。『地図を表示』はこのタブ内だけに適用。</div> <!-- L094 -->
    </div> <!-- L095 -->
    <iframe class="tabmap" id="view-browser-map" title="Aiタブ内地図" src="" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe> <!-- L096 -->
  </div> <!-- L097 -->

  <!-- 設定（位置変更→即閉じ） --> <!-- L098 -->
  <div class="view" id="view-settings"> <!-- L099 -->
    <div class="start" aria-label="設定"> <!-- L100 -->
      <div class="card" style="grid-column:span 3">
        <div class="title">設定：タブの場所（上／下／右／左）</div>
        <div class="row" id="posControls" role="radiogroup" aria-label="タブの場所">
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="top" style="display:none">上</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="bottom" style="display:none">下</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="left" style="display:none">左</label>
          <label class="btn" role="radio"><input type="radio" name="tabpos" value="right" style="display:none">右</label>
        </div>
        <div class="muted">選択は自動保存され、次回起動時に復元されます。</div>
      </div>
      <div class="card" style="grid-column:span 3"><div class="title">状態：未ログイン／通知未設定／v=tab-local-map+links</div></div>
    </div>
  </div> <!-- L101 -->
</div> <!-- L102 -->

<script> /* L103 */
(function(){
  const appEl=document.getElementById('app');
  const tabsEl=document.getElementById('tabs');
  const navHome=document.getElementById('btn-home');
  const navBack=document.getElementById('btn-back');
  const navFwd =document.getElementById('btn-forward');

  const SKEY_TABS='WN_TABS_LOCAL_V2';
  const SKEY_POS ='WN_TAB_POS_V1';

  function snapIntoView(el){ if(!el) return; try{ el.scrollIntoView({block:'nearest',inline:'end'}); }catch(_){} }

  /* 住所→現在地（緯度経度）に並べ替え（堅牢：MutationObserverで継続追従） */ /* L104 */
  function swapAddressAndCoords(doc){
    try{
      const nodes=[...doc.querySelectorAll('div,p,li,span')];
      const addr = nodes.find(n=>/〒\s*\d{3}-?\d{4}/.test(n.textContent||''));      // 住所
      const coord= nodes.find(n=>/(現在地[^：]?：)?\s*.*(緯度|経度)/.test(n.textContent||'')); // 緯度経度
      if(addr && coord){
        const sameParent = addr.parentElement===coord.parentElement;
        const parent = sameParent ? addr.parentElement : (addr.closest('*')||coord.closest('*'));
        if(parent && addr !== coord){
          if(coord.parentNode){ coord.parentNode.insertBefore(addr, coord); }
          const t=(coord.textContent||'').trim();
          if(!/^現在地/.test(t)){ coord.textContent='現在地：'+t.replace(/^(.*?：)?/,''); }
        }
      }
    }catch(_){}
  }
  function hookEmbed(doc){
    if(!doc) return;
    swapAddressAndCoords(doc);
    // 変化監視（動的更新時も順序維持）
    try{
      const mo=new MutationObserver(()=>swapAddressAndCoords(doc));
      mo.observe(doc.body||doc, {childList:true,subtree:true,characterData:true});
    }catch(_){}
  }

  /* — 真っ白対策：src を“一度だけ”確定し、以後は再設定しない — */ /* L105 */
  function lockSrc(ifr){
    if(!ifr) return;
    if(!ifr.dataset.locked){
      if(!ifr.src || ifr.src==='about:blank'){ ifr.src='./embed.html'; }
      ifr.dataset.locked='1';
      ifr.addEventListener('load',()=>{ try{ hookEmbed(ifr.contentWindow.document); }catch(_){}} ,{once:true});
    }
  }
  function isAlive(ifr){
    try{
      if(!ifr || !ifr.classList.contains('active')) return false;
      if(!ifr.src || ifr.src==='about:blank') return false;
      const d=ifr.contentDocument || ifr.contentWindow.document;
      return !!d && (d.readyState==='interactive' || d.readyState==='complete');
    }catch(_){ return false; }
  }

  /* 実履歴（アプリ状態をpushState） */ /* L106 */
  function currentState(){
    const activeTab=document.querySelector('.tab.active');
    const viewId=activeTab?activeTab.dataset.view:'view-map';
    let mode=null;
    if(viewId){
      const v=document.getElementById(viewId);
      if(v){
        const map=v.querySelector('.tabmap');
        const s=v.querySelector('.start');
        if(map && map.classList.contains('active')) mode='map';
        else if(s && s.style.display!=='none') mode='start';
      }
    }
    return {view:viewId||'view-map', mode:mode||null};
  }
  const statesEqual=(a,b)=>a&&b&&a.view===b.view&&a.mode===b.mode;
  function applyState(state){
    const viewId=state&&state.view?state.view:'view-map';
    const tab=[...document.querySelectorAll('.tab')].find(t=>t.dataset.view===viewId)||document.getElementById('tab-map');
    if(tab) activateTab(tab,false);
    if(state&&state.mode){
      const v=document.getElementById(viewId);
      if(v){
        const map=v.querySelector('.tabmap'); const s=v.querySelector('.start');
        if(state.mode==='map'){ if(map){ lockSrc(map); map.classList.add('active'); } if(s) s.style.display='none'; }
        else { if(map){ map.classList.remove('active'); } if(s) s.style.display='block'; }
      }
    }
  }
  function pushStateIfChanged(st,replace){
    const cur=history.state||null;
    if(replace){ history.replaceState(st,''); return; }
    if(!statesEqual(cur,st)){ history.pushState(st,''); }
  }

  /* タブ位置 */ /* L107 */
  function setTabPosition(pos){
    const p=(pos==='bottom'||pos==='left'||pos==='right')?pos:'top';
    appEl.classList.remove('pos-top','pos-bottom','pos-left','pos-right');
    appEl.classList.add('pos-'+p);
    try{ localStorage.setItem(SKEY_POS,p); }catch(_){}
    snapIntoView(document.getElementById('tab-add'));
  }

  /* タブ切替 */ /* L108 */
  function activateTab(btn, doPush=true){
    if(!btn) return;
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    const vid=btn.dataset.view; if(vid){ const v=document.getElementById(vid); if(v) v.classList.add('active'); }
    if(doPush){ pushStateIfChanged({view:vid, mode:(vid==='view-browser'?'start':null)}, false); }
    snapIntoView(btn);
  }

  /* ユーザータブ管理 */ /* L109 */
  function nextLabel(){
    const list=[...document.querySelectorAll('.tab')].filter(n=>!n.classList.contains('add') && !['tab-map','tab-browser','tab-settings'].includes(n.id));
    return '新規タブ '+(list.length+1);
  }
  function startContentHTML(viewId){
    return `
      <div class="start" aria-label="リンク集">
        <div class="card">
          <div style="font-size:24px">🗺️</div>
          <div class="title">このタブで地図を表示</div>
          <div class="row"><button class="btn" data-action="open-map-here" data-view="${viewId}" type="button">地図を表示</button></div>
        </div>
        <div class="card">
          <div style="font-size:24px">🧠</div>
          <div class="title">Gemini</div>
          <div class="row"><a class="alink" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini を開く</a></div>
          <div class="url">https://gemini.google.com/</div>
        </div>
        <div class="card">
          <div style="font-size:24px">💬</div>
          <div class="title">ChatGPT</div>
          <div class="row"><a class="alink" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT を開く</a></div>
          <div class="url">https://chatgpt.com/</div>
        </div>
        <div class="muted">※ リンクは新しいブラウザタブで開きます。本アプリは残ります。</div>
      </div>
      <iframe class="tabmap" id="${viewId}-map" title="タブ内地図" src="" allow="geolocation *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe>
    `;
  }
  let tabCounter=0; function makeIds(){ tabCounter++; const id=`user-${Date.now()}-${tabCounter}`; return {tabId:`tab-${id}`, viewId:`view-${id}`}; }

  function persistTabs(){
    const nodes=[...document.querySelectorAll('.tab')].filter(n=>!n.classList.contains('add') && !['tab-map','tab-browser','tab-settings'].includes(n.id));
    const data=nodes.map(n=>{
      const viewId=n.dataset.view;
      const mapEl=document.getElementById(viewId+'-map');
      const mapOpened=!!(mapEl && mapEl.classList.contains('active') && mapEl.src && mapEl.src.indexOf('embed.html')!==-1);
      const label=(n.querySelector('.label')?n.querySelector('.label').textContent:n.textContent)||'';
      return {tabId:n.id, viewId, label, mapOpened};
    });
    const aiMap=document.getElementById('view-browser-map');
    const aiOpened=!!(aiMap && aiMap.classList.contains('active') && aiMap.src && aiMap.src.indexOf('embed.html')!==-1);
    try{ sessionStorage.setItem(SKEY_TABS, JSON.stringify({tabs:data, aiOpened})); }catch(_){}
  }
  function addTabFromState(state){
    const addBtn=document.getElementById('tab-add');
    const tab=document.createElement('div');
    tab.className='tab'; tab.id=state.tabId; tab.dataset.view=state.viewId;
    tab.innerHTML=`<span class="label">${state.label}</span><span class="close" data-close="${state.viewId}" aria-label="閉じる">×</span>`;
    addBtn.parentNode.insertBefore(tab, addBtn);

    const view=document.createElement('div');
    view.className='view'; view.id=state.viewId; view.innerHTML=startContentHTML(state.viewId);
    document.getElementById('app').appendChild(view);

    if(state.mapOpened){
      const m=document.getElementById(state.viewId+'-map'); if(m){ lockSrc(m); m.classList.add('active'); }
      const s=view.querySelector('.start'); if(s) s.style.display='none';
    }
  }
  function restoreTabs(){
    try{
      const saved=JSON.parse(sessionStorage.getItem(SKEY_TABS)||'{"tabs":[]}');
      (saved.tabs||[]).forEach(addTabFromState);
      if(saved.aiOpened){
        const ai=document.getElementById('view-browser-map'); const s=document.querySelector('#view-browser .start');
        if(ai){ lockSrc(ai); ai.classList.add('active'); }
        if(s) s.style.display='none';
      }
    }catch(_){}
  }

  function addTab(label){
    const {tabId,viewId}=makeIds(); const addBtn=document.getElementById('tab-add');
    const tab=document.createElement('div');
    tab.className='tab'; tab.id=tabId; tab.dataset.view=viewId;
    tab.innerHTML=`<span class="label">${label}</span><span class="close" data-close="${viewId}" aria-label="閉じる">×</span>`;
    addBtn.parentNode.insertBefore(tab, addBtn);
    tab.classList.add('flash'); setTimeout(()=>tab.classList.remove('flash'),200);

    const view=document.createElement('div');
    view.className='view'; view.id=viewId; view.innerHTML=startContentHTML(viewId);
    document.getElementById('app').appendChild(view);

    activateTab(tab); persistTabs(); snapIntoView(addBtn);
  }
  function closeTab(viewId){
    const tab=[...document.querySelectorAll('.tab')].find(t=>t.dataset.view===viewId);
    const view=document.getElementById(viewId);
    if(!tab||!view) return;
    const isActive=tab.classList.contains('active');
    tab.remove(); view.remove(); persistTabs();
    if(isActive){ const mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab); }
  }

  /* Aiブラウザ：ホーム／地図表示 */ /* L110 */
  function aiHome(){
    const state={view:'view-browser', mode:'start'};
    applyState(state); pushStateIfChanged(state,false);
  }
  function openMapHere(viewId){
    const v=document.getElementById(viewId); if(!v) return;
    const map=v.querySelector('.tabmap'); const s=v.querySelector('.start');
    if(map){ lockSrc(map); map.classList.add('active'); }
    if(s) s.style.display='none';
    persistTabs();
    pushStateIfChanged({view:viewId, mode:'map'}, false);
  }

  /* イベント */ /* L111 */
  function bindEvents(){
    if(tabsEl){
      tabsEl.addEventListener('click',(e)=>{
        const btn=e.target.closest('.tab'); if(!btn) return;
        const close=e.target.closest('.close');
        if(close){ closeTab(close.dataset.close); return; }
        if(btn.id==='tab-add'){ addTab(nextLabel()); return; }
        if(btn.dataset.view){ activateTab(btn); }
      });
    }
    document.addEventListener('click',(e)=>{
      const b=e.target.closest && e.target.closest('.btn');
      if(b && b.dataset.action==='open-map-here'){
        const vid=b.dataset.view; if(vid) openMapHere(vid);
        e.preventDefault(); e.stopPropagation();
      }
    });

    if(navHome){ navHome.addEventListener('click', aiHome); }
    if(navBack){ navBack.addEventListener('click', ()=>history.back()); }
    if(navFwd ){ navFwd .addEventListener('click', ()=>history.forward()); }

    window.addEventListener('popstate',(ev)=>{ const st=ev.state||null; if(st){ applyState(st); }});
  }

  /* 設定（即クローズ） */ /* L112 */
  function initPositionUI(){
    let saved='left'; try{ saved=localStorage.getItem(SKEY_POS)||saved; }catch(_){}
    setTabPosition(saved);
    const posEl=document.getElementById('posControls'); if(!posEl) return;
    const radios=[...posEl.querySelectorAll('input[name="tabpos"]')];
    radios.forEach(r=>{ r.checked=(r.value===saved); });
    posEl.addEventListener('click',(e)=>{
      const lab=e.target.closest && e.target.closest('label'); if(!lab) return;
      const input=lab.querySelector('input[name="tabpos"]'); if(!input) return;
      setTabPosition(input.value);
      radios.forEach(r=>{ r.checked=(r===input); });
      const mapTab=document.getElementById('tab-map'); if(mapTab) activateTab(mapTab);
    });
  }

  /* 初期化 */ /* L113 */
  function init(){
    initPositionUI();
    restoreTabs();
    const initialTab=document.querySelector('.tab.active')||document.getElementById('tab-map');
    activateTab(initialTab,false);
    if(!history.state){ history.replaceState(currentState(),''); }
    snapIntoView(document.getElementById('tab-add'));
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', ()=>{ try{ bindEvents(); init(); }catch(_){ setTimeout(()=>{ try{ bindEvents(); init(); }catch(__){} },0); } });
  }else{
    try{ bindEvents(); init(); }catch(_){ setTimeout(()=>{ try{ bindEvents(); init(); }catch(__){} },0); }
  }
})();
