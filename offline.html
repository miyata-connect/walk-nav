<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WalkNav Offline</title>
  <link rel="icon" href="data:,">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1220;
      --glass: rgba(20,28,44,.88);
      --stroke: rgba(255,255,255,.12);
      --text: #eaf2ff;
      --muted: #a7b8ce;
      --primary: #62b5ff;
      --ok: #25d07a;
      --danger: #ff6565;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Noto Sans JP', sans-serif; }
    #map { position: absolute; inset: 0; }

    /* トップバー */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: env(safe-area-inset-top, 12px) 12px 10px;
      background: var(--glass); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--stroke);
      display: flex; flex-direction: column; gap: 8px;
    }
    .search-row { display: flex; gap: 8px; align-items: center; }
    #searchInput {
      flex: 1; padding: 10px 14px; border-radius: 12px;
      background: rgba(255,255,255,.08); border: 1px solid var(--stroke);
      color: var(--text); font-size: 15px; outline: none;
    }
    #searchInput::placeholder { color: var(--muted); }
    .btn {
      padding: 10px 14px; border-radius: 12px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .btn:active { opacity: .7; }
    .btn-primary { background: var(--primary); color: #051828; }
    .btn-ok      { background: var(--ok);      color: #05260e; }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-glass   { background: rgba(255,255,255,.1); border: 1px solid var(--stroke); color: var(--text); }
    .status-row  { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #onlineBadge {
      font-size: 12px; font-weight: 700; padding: 4px 10px;
      border-radius: 99px; background: var(--ok); color: #05260e;
    }
    #onlineBadge.offline { background: var(--danger); color: #fff; }
    #statusMsg {
      font-size: 12px; color: var(--muted); flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* 検索結果 */
    #results {
      position: fixed; left: 0; right: 0; z-index: 999;
      background: var(--glass); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--stroke);
      max-height: 40vh; overflow-y: auto; display: none;
    }
    .result-item { padding: 12px 16px; border-bottom: 1px solid var(--stroke); cursor: pointer; }
    .result-item:active { background: rgba(255,255,255,.08); }
    .result-name { font-size: 14px; font-weight: 600; }
    .result-addr { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ボトムパネル */
    #panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
      padding: 12px 14px calc(env(safe-area-inset-bottom, 12px) + 10px);
      background: var(--glass); backdrop-filter: blur(14px);
      border-top: 1px solid var(--stroke);
      display: none; flex-direction: column; gap: 10px;
    }
    #routeInfo   { font-size: 14px; font-weight: 700; }
    #routeDetail { font-size: 12px; color: var(--muted); }
    .panel-btns  { display: flex; gap: 8px; }

    /* キャッシュ進捗 */
    #cacheProgress {
      position: fixed; bottom: 130px; left: 16px; right: 16px; z-index: 2000;
      background: var(--glass); border: 1px solid var(--stroke);
      border-radius: var(--radius); padding: 14px 16px;
      backdrop-filter: blur(14px); display: none;
    }
    #cacheLabel { font-size: 13px; margin-bottom: 8px; }
    #cacheBarWrap { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
    #cacheBarFill { height: 100%; background: var(--ok); border-radius: 3px; width: 0%; transition: width .3s; }

    /* ローディング */
    #loading {
      position: fixed; inset: 0; z-index: 3000; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { display: none; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:14px;color:var(--muted)">📍 現在地取得中...</div>
</div>

<div id="map"></div>

<div id="topbar">
  <div class="search-row">
    <input id="searchInput" type="search" placeholder="目的地を検索..." autocomplete="off">
    <button class="btn btn-primary" id="searchBtn">🔍</button>
    <button class="btn btn-glass"   id="locateBtn">📍</button>
    <button class="btn btn-ok"      id="cacheBtn"  style="font-size:12px;padding:10px 10px;">💾</button>
  </div>
  <div class="status-row">
    <div id="onlineBadge">ONLINE</div>
    <div id="statusMsg">起動中...</div>
  </div>
</div>

<div id="results"></div>

<div id="panel">
  <div id="routeInfo"></div>
  <div id="routeDetail"></div>
  <div class="panel-btns">
    <button class="btn btn-danger" id="clearBtn" style="flex:1">✖ クリア</button>
  </div>
</div>

<div id="cacheProgress">
  <div id="cacheLabel">📥 保存中...</div>
  <div id="cacheBarWrap"><div id="cacheBarFill"></div></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
'use strict';

const WORKER_URL     = 'https://walknav-offline-proxy.miyata-connect-jp.workers.dev';
const ROUTE_CACHE_KEY = 'walknav-last-route';
const DEFAULT_POS    = { lat: 34.0658, lng: 134.5593 }; // 徳島市

const state = { map: null, currentPos: null, destMarker: null, userMarkerEl: null };

const $ = id => document.getElementById(id);

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./offline-sw.js').catch(() => {});
}

// オンライン監視
function updateOnline() {
  const on = navigator.onLine;
  $('onlineBadge').textContent = on ? 'ONLINE' : 'OFFLINE';
  $('onlineBadge').classList.toggle('offline', !on);
}
window.addEventListener('online',  updateOnline);
window.addEventListener('offline', updateOnline);
updateOnline();

// 実接続確認
async function checkConn() {
  try {
    const r = await fetch(`${WORKER_URL}/health`, { cache: 'no-store', signal: AbortSignal.timeout(4000) });
    return r.ok;
  } catch { return false; }
}

// ===== 地図初期化（OSMラスタータイル） =====
function initMap(lat, lng) {
  if (state.map) { state.map.flyTo({ center: [lng, lat], zoom: 16 }); return; }

  state.map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxzoom: 19,
        },
      },
      layers: [{ id: 'osm', type: 'raster', source: 'osm' }],
    },
    center: [lng, lat],
    zoom: 16,
  });

  state.map.on('load', () => {
    $('loading').style.display = 'none';
    setStatus('地図を読み込みました ✅');
    restoreCachedRoute();
  });

  state.map.on('error', e => console.warn('[WalkNav]', e));
}

// 現在地マーカー
function setUserMarker(lat, lng) {
  if (state.userMarkerEl) { state.userMarkerEl.setLngLat([lng, lat]); return; }
  const el = document.createElement('div');
  el.style.cssText = 'width:20px;height:20px;border-radius:50%;background:#62b5ff;border:3px solid #fff;box-shadow:0 0 0 4px rgba(98,181,255,.3);';
  state.userMarkerEl = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(state.map);
}

// 目的地マーカー
function setDestMarker(lat, lng, name) {
  if (state.destMarker) state.destMarker.remove();
  state.destMarker = new maplibregl.Marker({ color: '#ff6565' })
    .setLngLat([lng, lat])
    .setPopup(new maplibregl.Popup({ offset: 30 }).setText(name))
    .addTo(state.map);
}

// 現在地取得
function locateUser() {
  setStatus('📍 現在地取得中...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lng } = pos.coords;
      state.currentPos = { lat, lng };
      initMap(lat, lng);
      state.map.once('load', () => setUserMarker(lat, lng));
      if (state.map._loaded) setUserMarker(lat, lng);
      setStatus('現在地を取得しました');
    },
    () => {
      setStatus('⚠ 現在地不明 → 徳島市を表示');
      initMap(DEFAULT_POS.lat, DEFAULT_POS.lng);
      $('loading').style.display = 'none';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// テキスト検索
async function searchPlaces(q) {
  if (!q.trim()) return;
  const online = await checkConn();
  if (!online) { setStatus('⚠ オフライン：検索できません'); return; }
  setStatus('🔍 検索中...');
  try {
    const lat = state.currentPos?.lat ?? DEFAULT_POS.lat;
    const lng = state.currentPos?.lng ?? DEFAULT_POS.lng;
    const res  = await fetch(`${WORKER_URL}/search?q=${encodeURIComponent(q)}&lat=${lat}&lng=${lng}`);
    const data = await res.json();
    const feats = data.features || [];
    renderResults(feats);
    setStatus(feats.length ? `${feats.length}件見つかりました` : '検索結果がありません');
  } catch (e) { setStatus('❌ 検索失敗: ' + e.message); }
}

function renderResults(features) {
  const div = $('results');
  div.innerHTML = '';
  if (!features.length) { div.style.display = 'none'; return; }
  // results を topbar の直下に配置
  const topH = $('topbar').getBoundingClientRect().bottom;
  div.style.top = topH + 'px';
  features.forEach(f => {
    const name = f.properties.name || f.properties.label || '名称不明';
    const addr = f.properties.label || '';
    const [lng, lat] = f.geometry.coordinates;
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `<div class="result-name">${name}</div><div class="result-addr">${addr}</div>`;
    item.onclick = () => {
      div.style.display = 'none';
      state.map.flyTo({ center: [lng, lat], zoom: 17 });
      setDestMarker(lat, lng, name);
      fetchRoute(lat, lng, name);
    };
    div.appendChild(item);
  });
  div.style.display = 'block';
}

// ルート取得
async function fetchRoute(destLat, destLng, destName) {
  const online = await checkConn();
  if (!online) { showPanel(`🏁 ${destName}`, 'オフライン：ルート取得不可'); return; }
  if (!state.currentPos) { setStatus('⚠ 現在地が不明です'); return; }
  setStatus('🧭 ルート計算中...');
  try {
    const res  = await fetch(`${WORKER_URL}/directions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start: [state.currentPos.lng, state.currentPos.lat], end: [destLng, destLat] }),
    });
    const data = await res.json();
    if (!data.features?.length) { setStatus('❌ ルートが見つかりません'); return; }
    drawRoute(data);
    const summ = data.features[0].properties.summary;
    const dist = (summ.distance / 1000).toFixed(1);
    const mins = Math.ceil(summ.duration / 60);
    showPanel(`🏁 ${destName}`, `📏 ${dist} km　⏱ 約 ${mins} 分`);
    setStatus('ルートを取得しました ✅');
    saveRoute(data, destName, destLat, destLng);
  } catch (e) { setStatus('❌ ルート失敗: ' + e.message); }
}

// ルート描画
function drawRoute(geojson) {
  if (state.map.getSource('route')) { state.map.getSource('route').setData(geojson); return; }
  state.map.addSource('route', { type: 'geojson', data: geojson });
  state.map.addLayer({
    id: 'route-line', type: 'line', source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#62b5ff', 'line-width': 6, 'line-opacity': .9 },
  });
}

// ルートキャッシュ
function saveRoute(geojson, name, lat, lng) {
  try { localStorage.setItem(ROUTE_CACHE_KEY, JSON.stringify({ geojson, name, lat, lng, ts: Date.now() })); } catch (_) {}
}
function restoreCachedRoute() {
  try {
    const raw = localStorage.getItem(ROUTE_CACHE_KEY);
    if (!raw) return;
    const { geojson, name, lat, lng, ts } = JSON.parse(raw);
    if ((Date.now() - ts) / 3600000 > 12) return;
    drawRoute(geojson);
    setDestMarker(lat, lng, name);
    const summ = geojson.features[0].properties.summary;
    showPanel(`🏁 ${name}（キャッシュ）`, `📏 ${(summ.distance/1000).toFixed(1)} km　⏱ 約${Math.ceil(summ.duration/60)}分`);
    setStatus('前回のルートを復元しました');
  } catch (_) {}
}

// パネル
function showPanel(title, detail) {
  $('routeInfo').textContent   = title;
  $('routeDetail').textContent = detail;
  $('panel').style.display     = 'flex';
}
function clearRoute() {
  if (state.map.getLayer('route-line')) state.map.removeLayer('route-line');
  if (state.map.getSource('route'))     state.map.removeSource('route');
  if (state.destMarker) { state.destMarker.remove(); state.destMarker = null; }
  localStorage.removeItem(ROUTE_CACHE_KEY);
  $('panel').style.display = 'none';
  setStatus('クリアしました');
}

// タイルキャッシュ（💾ボタン）
function lng2tile(lng, z) { return Math.floor((lng + 180) / 360 * 2 ** z); }
function lat2tile(lat, z) {
  const r = lat * Math.PI / 180;
  return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z);
}

async function cacheArea() {
  if (!state.currentPos) { alert('先に現在地を取得してください'); return; }
  const online = await checkConn();
  if (!online) { alert('タイル保存にはネット接続が必要です'); return; }
  const { lat, lng } = state.currentPos;
  const tiles = [];
  for (let z = 10; z <= 16; z++) {
    const d  = Math.max(1, Math.floor(1.5 * 2 ** (z - 14)));
    const tx = lng2tile(lng, z), ty = lat2tile(lat, z);
    for (let x = tx - d; x <= tx + d; x++)
      for (let y = Math.max(0, ty - d); y <= ty + d; y++)
        tiles.push({ z, x, y });
  }
  const total = tiles.length;
  $('cacheProgress').style.display = 'block';
  $('cacheLabel').textContent = `📥 ${total} タイルをダウンロード中...`;

  const cache = await caches.open('walknav-tiles-v1');
  let done = 0;
  const chunks = [];
  for (let i = 0; i < tiles.length; i += 10) chunks.push(tiles.slice(i, i + 10));
  for (const chunk of chunks) {
    await Promise.allSettled(chunk.map(async ({ z, x, y }) => {
      const url = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
      try { const r = await fetch(url, { mode: 'no-cors' }); await cache.put(url, r); } catch (_) {}
      $('cacheBarFill').style.width = (++done / total * 100) + '%';
      $('cacheLabel').textContent   = `📥 ${done}/${total} タイル保存中...`;
    }));
  }
  $('cacheProgress').style.display = 'none';
  setStatus(`✅ ${total} タイルをオフライン保存しました`);
}

function setStatus(msg) { $('statusMsg').textContent = msg; }

// イベント
$('searchBtn').onclick = () => searchPlaces($('searchInput').value);
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchPlaces(e.target.value); });
$('locateBtn').onclick = locateUser;
$('cacheBtn').onclick  = cacheArea;
$('clearBtn').onclick  = clearRoute;
document.addEventListener('click', e => {
  if (!$('results').contains(e.target) && e.target !== $('searchInput') && e.target !== $('searchBtn'))
    $('results').style.display = 'none';
});

// 起動
locateUser();
</script>
</body>
</html>
