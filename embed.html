<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>WalkNav</title>

  <!-- 発行番号: idx202511120001 - unifiedPanel 常時固定 + app.js display 上書きロック -->
  <meta name="x-issue" content="idx202511120001" />
  <meta name="description" content="WalkNav - 近くを検索 & ルート案内" />

  <link rel="stylesheet" href="app.css?v=3" />
  <style>
    /* ========== 統合パネル常時固定表示（A） ========== */
    .unified-panel{
      position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;
      background:rgba(0,0,0,.85)!important;backdrop-filter:blur(10px);
      border-top:1px solid rgba(255,255,255,.1);
      display:flex!important;flex-direction:column;width:100%!important;max-height:60vh;z-index:1000!important;
    }
    .panel-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);flex-shrink:0}
    .panel-tab{flex:1;padding:12px 16px;background:transparent;border:none;color:rgba(255,255,255,.6);font-size:14px;font-weight:500;cursor:pointer;transition:.2s;border-bottom:2px solid transparent}
    .panel-tab.active{color:#fff;border-bottom-color:#62b5ff;background:rgba(255,255,255,.05)}
    .panel-tab:hover{color:#fff;background:rgba(255,255,255,.05)}
    .panel-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;min-height:0}
    .panel-page{display:none}.panel-page.active{display:block}

    /* app.js に隠されないための強制表示（Bの前提条件） */
    #navPanel{display:block!important}

    /* app.js 互換用ダミー searchPanel は「常に display:block」だが不可視・非干渉 */
    /* → display を常に block に保つのは app.js 互換のため。視覚的には透明・クリック不可にする */
    #searchPanel{display:block!important;position:absolute!important;inset:auto auto -9999px -9999px!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}

    /* インシデント UI コンテナ（自動取得ロジックは撤去済み） */
    .nav-incident{margin-top:12px;padding:12px;background:rgba(255,255,255,.1);border-radius:8px;border-top:2px solid #ef4444;display:none}
    .nav-incident.has-incidents{display:block}
    .incident-header{font-size:13px;font-weight:600;margin-bottom:8px;color:#fff;display:flex;align-items:center;gap:6px}
    .incident-list{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow-y:auto}
    .incident-item{padding:8px;border-radius:6px;border-left:3px solid;background:rgba(255,255,255,.95);font-size:11px;line-height:1.4;margin-bottom:6px}
    .incident-item.transport{border-left-color:#f59e0b;background:#fef3c7}
    .incident-item.accident{border-left-color:#ef4444;background:#fee2e2}
    .incident-item.weather{border-left-color:#3b82f6;background:#dbeafe}
    .incident-item.other{border-left-color:#6b7280;background:#f3f4f6}
    .incident-type{font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:4px}
    .incident-description{color:#374151;margin-bottom:3px;font-size:11px}
    .incident-time{font-size:10px;color:#6b7280;margin-top:2px}
    .incident-icon{display:inline-block;width:16px;height:16px;margin-right:4px}
  </style>
</head>
<body id="appBody">
  <div class="app">
    <div id="map" aria-label="地図"></div>

    <!-- 統合パネル（案内と検索を統合） -->
    <div class="unified-panel" id="unifiedPanel">
      <div class="panel-tabs">
        <button class="panel-tab active" id="tabNav" data-page="nav">📍 案内</button>
        <button class="panel-tab" id="tabSearch" data-page="search">🔍 検索</button>
      </div>
      <div class="panel-content">
        <!-- 案内ページ（起動時アクティブ：B） -->
        <div class="panel-page active" id="pageNav">
          <!-- app.js が参照する旧構造を内包（常時表示を CSS で強制） -->
          <div class="nav-panel" id="navPanel" style="display:block">
            <div class="nav-location">
              <div id="locCoords">現在地：取得中...</div>
              <div id="locAddress"></div>
            </div>

            <div class="nav-weather" id="navWeather">
              <div class="weather-item"><span>1H</span><span id="weather1h">--</span></div>
              <div class="weather-item"><span>2H</span><span id="weather2h">--</span></div>
              <div class="weather-item"><span>3H</span><span id="weather3h">--</span></div>
            </div>

            <!-- ルートAPI warnings 表示用（自動取得なし） -->
            <div class="nav-incident" id="incidentPanel">
              <div class="incident-header"><span>⚠️</span><span>インシデント情報</span></div>
              <div class="incident-list" id="incidentList"></div>
            </div>

            <div class="nav-instructions-list" id="navPanelInstructions"></div>
          </div>
        </div>

        <!-- 検索ページ -->
        <div class="panel-page" id="pageSearch">
          <div style="margin-bottom:12px;">
            <h2 style="margin:0 0 12px 0;font-size:16px;">近くを検索 (<span id="radiusLabel">10km</span> / 5件)</h2>
          </div>
          <div class="row" style="margin-bottom:8px;justify-content:center;flex-wrap:wrap;">
            <button class="chip active" id="r10">10km</button>
            <button class="chip" id="r20">20km</button>
            <button class="chip" id="r30">30km</button>
            <button class="chip" id="btnPointSearch" style="flex-grow:1;min-width:120px;">📍 ポイント選択</button>
          </div>
          <div class="row" id="pointAddressBlock" style="font-size:13px;color:var(--muted);margin-bottom:8px;display:none;background:rgba(0,0,0,.2);padding:8px;border-radius:8px;">
            <div id="pointAddress" style="line-height:1.5;color:var(--warning);">ポイント：取得中...</div>
            <div id="pointCoords" style="line-height:1.5;"></div>
          </div>
          <div class="row" style="margin-bottom:8px">
            <button class="btn" id="btnSaveLocation" style="flex:1">現在地登録</button>
            <button class="btn" id="btnEditLocation" style="flex:1">登録地修正</button>
          </div>
          <div class="row" style="margin-bottom:8px">
            <div class="input-wrapper">
              <span class="icon icon-g">
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;">
                  <path d="M21.35,11.1H12.18V13.83H18.69C18.36,17.64 15.19,19.27 12.19,19.27C8.36,19.27 5.03,16.21 5.03,12.39C5.03,8.57 8.36,5.5 12.19,5.5C14.73,5.5 16.29,6.5 17.2,7.38L19.31,5.26C17.38,3.53 15.05,2.5 12.19,2.5C6.92,2.5 2.73,6.63 2.73,12.39C2.73,18.15 6.92,22.28 12.19,22.28C17.63,22.28 21.64,18.5 21.64,12.61C21.64,12 21.52,11.55 21.35,11.1Z"></path>
                </svg>
              </span>
              <input id="q" class="input" placeholder="店舗名・電話番号・住所・座標など" style="flex:1" autocomplete="off" />
              <span class="icon icon-search" id="btnSearchIcon">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor;">
                  <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                </svg>
              </span>
              <span class="icon icon-mic" id="btnVoiceIcon">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor;">
                  <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c1.66 1.66 3 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"></path>
                </svg>
              </span>
            </div>
          </div>
          <div id="results" class="results" style="display:none"></div>
          <div class="row" style="margin-top:12px;gap:8px;">
            <button id="btnReset" class="btn danger" style="flex:1">リセット</button>
            <button id="btnLocatePanel" class="btn" style="flex:1;background:rgba(98,181,255,.2);color:var(--primary);">現在地</button>
            <button id="btnClosePanel" class="btn" style="flex:1;background:rgba(255,255,255,.1)">閉じる</button>
          </div>
        </div>
      </div>
    </div>

    <div class="route-panel" id="routePanel">
      <div class="route-info"><span id="destinationName">目的地</span>へのルート</div>
      <div>
        <span class="route-distance" id="routeDistance">--</span>
        <span class="route-time" id="routeTime">徒歩 --分</span>
      </div>
      <div class="route-actions">
        <button id="btnExportText" class="btn" style="width:100%;background:rgba(255,255,255,.1)">道順をコピー</button>
        <button id="btnStopRoute" class="btn danger" style="width:100%">ルート終了</button>
      </div>
    </div>

    <div class="fab-stack" id="fabStack">
      <div class="fab" id="btnSearch">検索パネル</div>
      <div class="fab" id="btnLocate">現在地</div>
      <div class="fab" id="btnDestination" style="display:none">目的地</div>
      <div class="fab" id="btnPause">一時停止</div>
      <div class="fab" id="btnReroute">リルート</div>
    </div>

    <div class="loading" id="loading">
      <div style="text-align:center">
        <div style="font-size:24px;margin-bottom:16px">📍 現在地取得中</div>
        <div style="font-size:16px;opacity:0.8">しばらくお待ちください...</div>
      </div>
    </div>
  </div>

  <!-- app.js 本体 -->
  <script src="app.js" defer></script>

  <!-- app.js 互換：#searchPanel を生成し display をロック（常時 block） -->
  <script>
    (function ensureSearchPanel(){
      function makeAndLock(){
        let sp = document.getElementById('searchPanel');
        if(!sp){
          sp = document.createElement('section');
          sp.id = 'searchPanel';
          sp.className = 'panel';
          document.body.appendChild(sp);
        }
        // 初期強制
        sp.style.display = 'block';
        // display を変更されたら即座に block に戻す
        const mo = new MutationObserver(() => {
          if (sp.style.display !== 'block') sp.style.display = 'block';
        });
        mo.observe(sp, { attributes:true, attributeFilter:['style'] });

        // 一部コードが要素を remove() するケースに備え、存在チェック
        setInterval(() => {
          if (!document.getElementById('searchPanel')) {
            document.body.appendChild(sp);
            sp.style.display = 'block';
          }
        }, 300);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', makeAndLock);
      } else {
        makeAndLock();
      }
    })();
  </script>

  <!-- 要素存在確認＆現在地ラベル監視（通信なし・ログのみ） -->
  <script>
    (function diag(){
      function check(){
        const locCoords = document.getElementById('locCoords');
        const locAddress = document.getElementById('locAddress');
        const navPanel   = document.getElementById('navPanel');
        const map        = document.getElementById('map');
        console.log('要素確認',{locCoords:!!locCoords,locAddress:!!locAddress,navPanel:!!navPanel,map:!!map});
        return !!(locCoords && locAddress && navPanel && map);
      }
      function watch(){
        const el = document.getElementById('locCoords');
        if(!el) return;
        let i=0;
        const t = setInterval(()=>{
          i++;
          const s = el.textContent||'';
          console.log(`現在地チェック ${i}:`, s);
          if (i>=30 || (s && !s.includes('取得中') && /\d+\.\d+/.test(s))) clearInterval(t);
        },1000);
      }
      if (document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded', ()=>{check(); setTimeout(watch,2000);});
      }else{
        check(); setTimeout(watch,2000);
      }
    })();
  </script>

  <!-- タブ切替（B：起動時は案内タブ active。unifiedPanel は常時表示のまま） -->
  <script>
    (function tabs(){
      const tabNav = document.getElementById('tabNav');
      const tabSearch = document.getElementById('tabSearch');
      const pageNav = document.getElementById('pageNav');
      const pageSearch = document.getElementById('pageSearch');

      function activate(which){
        tabNav.classList.remove('active'); tabSearch.classList.remove('active');
        pageNav.classList.remove('active'); pageSearch.classList.remove('active');
        if(which==='search'){ tabSearch.classList.add('active'); pageSearch.classList.add('active'); }
        else{ tabNav.classList.add('active'); pageNav.classList.add('active'); }
        localStorage.setItem('activeTab', which);
        // 案内タブ時は navPanel を確実に表示（app.js の display 操作を無効化）
        if(which==='nav'){
          const nav = document.getElementById('navPanel');
          if(nav) nav.style.display = 'block';
        }
      }

      tabNav && tabNav.addEventListener('click', ()=>activate('nav'));
      tabSearch && tabSearch.addEventListener('click', ()=>activate('search'));

      const saved = localStorage.getItem('activeTab');
      activate(saved==='search' ? 'search' : 'nav'); // 既定は案内タブ
      // unifiedPanel 自体は常時表示固定
      const up = document.getElementById('unifiedPanel');
      if (up) up.style.display = 'block';
    })();
  </script>

  <!-- Maps JS -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk&v=weekly&libraries=marker,geometry"
    async defer></script>
</body>
</html>
