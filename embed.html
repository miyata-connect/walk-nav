  <script>

    // インシデント情報を取得・表示する機能

    (function() {

      const incidentPanel = document.getElementById('incidentPanel');

      const incidentList = document.getElementById('incidentList');

      const INCIDENT_RADIUS_KM = 10; // 半径10km

      // Cloudflare Workers経由でインシデント情報を取得するエンドポイント

      const INCIDENT_API_ENDPOINT = 'https://ors-proxy.miyata-connect-jp.workers.dev/incidents';



      // 2点間の距離を計算（Haversine formula）

      function calculateDistance(lat1, lon1, lat2, lon2) {

        const R = 6371; // 地球の半径（km）

        const dLat = (lat2 - lat1) * Math.PI / 180;

        const dLon = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +

                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *

                  Math.sin(dLon / 2) * Math.sin(dLon / 2);

        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return R * c;

      }



      // インシデントタイプに応じたクラス名を取得

      function getIncidentClass(type) {

        if (type.includes('遅延') || type.includes('運休') || type.includes('バス') || 

            type.includes('電車') || type.includes('JR') || type.includes('私鉄') || 

            type.includes('航空') || type.includes('船')) {

          return 'transport';

        } else if (type.includes('事故') || type.includes('事件')) {

          return 'accident';

        } else if (type.includes('台風') || type.includes('地震') || type.includes('豪雨') || 

                   type.includes('気象') || type.includes('警報')) {

          return 'weather';

        }

        return 'other';

      }



      // インシデントタイプに応じたアイコンを取得

      function getIncidentIcon(type) {

        if (type.includes('遅延') || type.includes('運休') || type.includes('バス') || 

            type.includes('電車') || type.includes('JR') || type.includes('私鉄') || 

            type.includes('航空') || type.includes('船')) {

          return '🚌';

        } else if (type.includes('事故') || type.includes('事件')) {

          return '🚨';

        } else if (type.includes('台風') || type.includes('地震') || type.includes('豪雨') || 

                   type.includes('気象') || type.includes('警報')) {

          return '🌧️';

        }

        return '⚠️';

      }



      // インシデント項目を表示

      function renderIncident(incident) {

        const item = document.createElement('div');

        item.className = `incident-item ${getIncidentClass(incident.type)}`;

        

        const icon = getIncidentIcon(incident.type);

        const timeAgo = incident.time ? formatTimeAgo(incident.time) : '';

        

        item.innerHTML = `

          <div class="incident-type">

            <span class="incident-icon">${icon}</span>

            <span>${incident.type}</span>

          </div>

          <div class="incident-description">${incident.description}</div>

          ${incident.location ? `<div class="incident-description" style="font-size:11px;color:#6b7280;">📍 ${incident.location}</div>` : ''}

          ${timeAgo ? `<div class="incident-time">${timeAgo}</div>` : ''}

        `;

        

        return item;

      }



      // 時間の経過を表示（例: "5分前"）

      function formatTimeAgo(timestamp) {

        const now = Date.now();

        const diff = now - timestamp;

        const minutes = Math.floor(diff / 60000);

        const hours = Math.floor(minutes / 60);

        const days = Math.floor(hours / 24);

        

        if (days > 0) return `${days}日前`;

        if (hours > 0) return `${hours}時間前`;

        if (minutes > 0) return `${minutes}分前`;

        return 'たった今';

      }



      // インシデント情報を取得

      async function fetchIncidents(currentLat, currentLon) {

        try {

          const url = `${INCIDENT_API_ENDPOINT}?lat=${currentLat}&lng=${currentLon}&radius=${INCIDENT_RADIUS_KM}`;

          console.log('インシデント: API呼び出し', { url });

          

          // Cloudflare Workers経由でAPIを呼び出し

          const response = await fetch(url);

          

          console.log('インシデント: APIレスポンス', { status: response.status, ok: response.ok });

          

          if (!response.ok) {

            const errorText = await response.text();

            console.error('インシデント: APIエラー', { status: response.status, errorText });

            throw new Error(`インシデント情報の取得に失敗しました: ${response.status} ${errorText}`);

          }

          const data = await response.json();

          console.log('インシデント: APIデータ', data);

          return data.incidents || [];

        } catch (error) {

          console.error('インシデント情報の取得エラー:', error);

          // エラー時もパネルに表示

          if (incidentList && incidentPanel) {

            incidentList.innerHTML = `<div class="incident-item" style="color:#ef4444;text-align:center;padding:16px;">エラー: ${error.message}</div>`;

            incidentPanel.classList.add('has-incidents');

            incidentPanel.style.display = 'block';

          }

          return [];

        }

      }



      // インシデント情報をフィルタリング（半径10km以内）

      function filterIncidentsByRadius(incidents, currentLat, currentLon) {

        return incidents.filter(incident => {

          if (!incident.lat || !incident.lon) return false;

          const distance = calculateDistance(currentLat, currentLon, incident.lat, incident.lon);

          return distance <= INCIDENT_RADIUS_KM;

        });

      }



      // インシデントパネルを更新

      async function updateIncidentPanel(currentLat, currentLon) {

        if (!currentLat || !currentLon) {

          console.log('インシデント: 現在地が取得できていません', { currentLat, currentLon });

          return;

        }

        

        console.log('インシデント: 情報を取得中...', { lat: currentLat, lon: currentLon });

        

        // インシデント情報を取得

        const incidents = await fetchIncidents(currentLat, currentLon);

        

        console.log('インシデント: 取得結果', { count: incidents.length, incidents });

        

        // 半径10km以内でフィルタリング（API側でフィルタリングされていない場合）

        const filteredIncidents = filterIncidentsByRadius(incidents, currentLat, currentLon);

        

        console.log('インシデント: フィルタリング後', { count: filteredIncidents.length });

        

        // リストをクリア

        incidentList.innerHTML = '';

        

        if (filteredIncidents.length === 0) {

          // インシデントがない場合でも、パネルを表示（デバッグ用）

          incidentList.innerHTML = '<div class="incident-item" style="color:#6b7280;text-align:center;padding:16px;">インシデント情報はありません</div>';

          incidentPanel.classList.add('has-incidents');

          // 強制的に表示

          incidentPanel.style.display = 'block';

          console.log('インシデント: 情報がありません（パネルを表示）', {

            hasClass: incidentPanel.classList.contains('has-incidents'),

            display: window.getComputedStyle(incidentPanel).display

          });

          return;

        }

        

        // インシデント項目を追加

        filteredIncidents.forEach(incident => {

          const item = renderIncident(incident);

          incidentList.appendChild(item);

        });

        

        // パネルを表示

        incidentPanel.classList.add('has-incidents');

        // 強制的に表示

        incidentPanel.style.display = 'block';

        console.log('インシデント: パネルを表示しました', { 

          count: filteredIncidents.length,

          hasClass: incidentPanel.classList.contains('has-incidents'),

          display: window.getComputedStyle(incidentPanel).display

        });

      }



      // 現在地が更新されたときにインシデント情報を更新

      window.updateIncidents = function(lat, lon) {

        if (lat && lon) {

          currentLocation = { lat, lon };

          updateIncidentPanel(lat, lon);

        }

      };



      // 定期的にインシデント情報を更新（5分ごと）

      let currentLocation = null;

      setInterval(() => {

        if (currentLocation) {

          updateIncidentPanel(currentLocation.lat, currentLocation.lon);

        }

      }, 5 * 60 * 1000); // 5分



      // 現在地の変更を監視（カスタムイベント）

      document.addEventListener('locationUpdated', function(e) {

        if (e.detail && e.detail.lat && e.detail.lon) {

          window.updateIncidents(e.detail.lat, e.detail.lon);

        }

      });



      // app.jsで現在地が更新されたときに呼び出されることを想定

      // app.js側で以下のように呼び出す:

      // window.updateIncidents(lat, lon);

      // または

      // document.dispatchEvent(new CustomEvent('locationUpdated', { 

      //   detail: { lat: lat, lon: lon } 

      // }));



      // デバッグ用: ページ読み込み時にテスト表示

      // 即座に初期化を実行

      function initIncidentPanel() {

        console.log('インシデント: 初期化開始', { 

          panel: !!incidentPanel, 

          list: !!incidentList,

          readyState: document.readyState

        });

        

        // パネルが存在するか確認

        if (!incidentPanel || !incidentList) {

          console.error('インシデント: パネル要素が見つかりません', { 

            panel: incidentPanel, 

            list: incidentList 

          });

          // 再試行

          setTimeout(initIncidentPanel, 1000);

          return;

        }

        

        console.log('インシデント: パネル要素を確認しました');

        

        // 即座にテスト表示（現在地が取得できていない場合でも表示を確認）

        setTimeout(() => {

          console.log('インシデント: テスト表示を実行します', { currentLocation });

          // テスト用の座標（東京駅付近）

          const testLat = 35.6812;

          const testLon = 139.7671;

          updateIncidentPanel(testLat, testLon);

        }, 1000);

      }

      

      // 複数のタイミングで初期化を試行

      if (document.readyState === 'loading') {

        document.addEventListener('DOMContentLoaded', initIncidentPanel);

      } else {

        initIncidentPanel();

      }

      

      // window.onloadでも試行

      window.addEventListener('load', function() {

        console.log('インシデント: window.onload');

        if (!incidentPanel || !incidentPanel.classList.contains('has-incidents')) {

          initIncidentPanel();

        }

      });



      // グローバルに公開（デバッグ用）

      window.testIncidents = function(lat, lon) {

        const testLat = lat || 35.6812;

        const testLon = lon || 139.7671;

        console.log('インシデント: テスト実行', { lat: testLat, lon: testLon });

        updateIncidentPanel(testLat, testLon);

      };



      // パネルの表示状態を確認する関数

      window.checkIncidentPanel = function() {

        console.log('インシデントパネルの状態:', {

          exists: !!incidentPanel,

          visible: incidentPanel ? incidentPanel.classList.contains('has-incidents') : false,

          display: incidentPanel ? window.getComputedStyle(incidentPanel).display : 'N/A',

          innerHTML: incidentList ? incidentList.innerHTML.substring(0, 100) : 'N/A'

        });

        return incidentPanel;

      };

    })();

    // ==================== SNSシェア機能 ====================

    (function() {

      const navShare = document.getElementById('navShare');

      const shareTwitter = document.getElementById('shareTwitter');

      const shareFacebook = document.getElementById('shareFacebook');

      const shareLine = document.getElementById('shareLine');

      const shareCopy = document.getElementById('shareCopy');

      const locCoords = document.getElementById('locCoords');

      const locAddress = document.getElementById('locAddress');

      let currentShareLocation = null;

      // 要素の存在確認

      console.log('SNSシェア: 要素の初期化', {

        locCoords: !!locCoords,

        locAddress: !!locAddress,

        locCoordsText: locCoords ? locCoords.textContent : 'N/A',

        locAddressText: locAddress ? locAddress.textContent : 'N/A'

      });

      // 現在地情報を取得

      function getCurrentLocationInfo() {

        if (!locCoords || !locAddress) {

          console.log('SNSシェア: locCoordsまたはlocAddressが見つかりません', { locCoords: !!locCoords, locAddress: !!locAddress });

          return { coords: '', address: '', lat: null, lng: null };

        }

        const coordsText = locCoords.textContent || '';

        const addressText = locAddress.textContent || '';

        console.log('SNSシェア: 現在地テキストを取得', { coordsText, addressText });

        // 緯度経度を抽出（「現在地：」の部分も考慮、カンマやスペースに対応）

        let coordMatch = coordsText.match(/(\d+\.\d+)[,\s]+(\d+\.\d+)/);

        let lat = null;

        let lng = null;

        if (coordMatch && coordMatch.length >= 3) {

          lat = parseFloat(coordMatch[1]);

          lng = parseFloat(coordMatch[2]);

          console.log('SNSシェア: 緯度経度を抽出', { lat, lng, coordsText });

        } else {

          // 別のパターンも試す（「現在地：緯度, 経度」形式）

          coordMatch = coordsText.match(/現在地[：:]\s*(\d+\.\d+)[,\s]+(\d+\.\d+)/);

          if (coordMatch && coordMatch.length >= 3) {

            lat = parseFloat(coordMatch[1]);

            lng = parseFloat(coordMatch[2]);

            console.log('SNSシェア: 緯度経度を抽出（代替パターン）', { lat, lng, coordsText });

          } else {

            console.log('SNSシェア: 緯度経度の抽出に失敗', { coordsText, coordMatch });

          }

        }

        return {

          coords: coordsText,

          address: addressText,

          lat: lat,

          lng: lng

        };

      }

      // シェア用テキストを生成

      function generateShareText() {

        const info = getCurrentLocationInfo();

        let text = '現在地をシェアします\n\n';

        if (info.coords && info.coords !== '現在地：取得中...') {

          text += `📍 ${info.coords}\n`;

        }

        if (info.address) {

          text += `${info.address}\n`;

        }

        if (info.lat && info.lng) {

          text += `\n地図: https://www.google.com/maps?q=${info.lat},${info.lng}`;

        }

        return text;

      }

      // Google Maps URLを生成

      function generateMapsUrl(lat, lng) {

        return `https://www.google.com/maps?q=${lat},${lng}`;

      }

      // Twitter/Xでシェア

      shareTwitter.addEventListener('click', function() {

        const info = getCurrentLocationInfo();

        if (!info.lat || !info.lng) {

          alert('現在地情報が取得できていません。');

          return;

        }

        const text = encodeURIComponent(generateShareText());

        const url = `https://twitter.com/intent/tweet?text=${text}`;

        window.open(url, '_blank', 'width=550,height=420');

      });

      // Facebookでシェア

      shareFacebook.addEventListener('click', function() {

        const info = getCurrentLocationInfo();

        if (!info.lat || !info.lng) {

          alert('現在地情報が取得できていません。');

          return;

        }

        const mapsUrl = generateMapsUrl(info.lat, info.lng);

        const url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(mapsUrl)}`;

        window.open(url, '_blank', 'width=550,height=420');

      });

      // LINEでシェア

      shareLine.addEventListener('click', function() {

        const info = getCurrentLocationInfo();

        if (!info.lat || !info.lng) {

          alert('現在地情報が取得できていません。');

          return;

        }

        const text = encodeURIComponent(generateShareText());

        const mapsUrl = generateMapsUrl(info.lat, info.lng);

        // LINEのシェアURL（Web版）

        const url = `https://line.me/R/msg/text/?${text}%0A%0A${encodeURIComponent(mapsUrl)}`;

        window.open(url, '_blank', 'width=550,height=420');

      });

      // クリップボードにコピー

      shareCopy.addEventListener('click', async function() {

        const text = generateShareText();

        try {

          if (navigator.clipboard && navigator.clipboard.writeText) {

            await navigator.clipboard.writeText(text);

            // ボタンのテキストを一時的に変更

            const originalText = shareCopy.querySelector('.share-text').textContent;

            shareCopy.querySelector('.share-text').textContent = 'コピー済み！';

            setTimeout(() => {

              shareCopy.querySelector('.share-text').textContent = originalText;

            }, 2000);

          } else {

            // フォールバック: テキストエリアを使用

            const textarea = document.createElement('textarea');

            textarea.value = text;

            textarea.style.position = 'fixed';

            textarea.style.opacity = '0';

            document.body.appendChild(textarea);

            textarea.select();

            document.execCommand('copy');

            document.body.removeChild(textarea);

            alert('クリップボードにコピーしました！');

          }

        } catch (error) {

          console.error('コピーに失敗しました:', error);

          alert('コピーに失敗しました。');

        }

      });

      // 現在地情報が更新されたときにシェアボタンを表示

      function updateSharePanel() {

        if (!navShare) {

          console.error('SNSシェア: navShare要素が見つかりません');

          return;

        }

        // 案内ページがアクティブかどうか確認

        const pageNav = document.getElementById('pageNav');

        if (pageNav && !pageNav.classList.contains('active')) {

          console.log('SNSシェア: 案内ページが非アクティブのためスキップ（ただし要素は保持）');

          // 非アクティブでも要素は保持するが、表示はしない

          navShare.style.display = 'none';

          return;

        }

        const info = getCurrentLocationInfo();

        console.log('SNSシェア: 現在地情報をチェック', info);

        // 緯度経度が取得できていれば表示

        if (info.lat && info.lng && !isNaN(info.lat) && !isNaN(info.lng)) {

          navShare.classList.add('has-location');

          navShare.style.display = 'block';

          navShare.style.visibility = 'visible';

          currentShareLocation = { lat: info.lat, lng: info.lng };

          console.log('SNSシェア: ボタンを表示しました', { lat: info.lat, lng: info.lng, element: navShare });

        } else {

          navShare.classList.remove('has-location');

          navShare.style.display = 'none';

          console.log('SNSシェア: 現在地情報が取得できていません', { lat: info.lat, lng: info.lng, coords: info.coords });

        }

      }

      // 定期的に現在地情報をチェック

      setInterval(updateSharePanel, 1000);

      // 現在地更新イベントを監視

      document.addEventListener('locationUpdated', function(e) {

        if (e.detail && e.detail.lat && e.detail.lon) {

          console.log('SNSシェア: locationUpdatedイベントを受信', e.detail);

          setTimeout(updateSharePanel, 500);

        }

      });

      // 初期化（複数のタイミングで試行）

      if (document.readyState === 'loading') {

        document.addEventListener('DOMContentLoaded', function() {

          setTimeout(updateSharePanel, 1000);

        });

      } else {

        setTimeout(updateSharePanel, 1000);

      }

      // さらに遅延して初期化（現在地取得を待つ）

      setTimeout(updateSharePanel, 3000);

      setTimeout(updateSharePanel, 5000);

      setTimeout(updateSharePanel, 10000);

      // グローバルに公開（タブ切り替え時などに呼び出せるように）

      window.updateSharePanel = updateSharePanel;

      // MutationObserverでlocCoordsの変更を監視

      if (locCoords) {

        const observer = new MutationObserver(function(mutations) {

          console.log('SNSシェア: locCoordsが変更されました');

          setTimeout(updateSharePanel, 500);

        });

        observer.observe(locCoords, { childList: true, characterData: true, subtree: true });

        console.log('SNSシェア: MutationObserverを設定しました');

      }

    })();

    // ==================== パネルタブ切り替え機能 ====================

    (function() {

      const tabNav = document.getElementById('tabNav');

      const tabSearch = document.getElementById('tabSearch');

      const pageNav = document.getElementById('pageNav');

      const pageSearch = document.getElementById('pageSearch');

      // タブ切り替え関数

      function switchTab(targetTab) {

        if (!tabNav || !tabSearch || !pageNav || !pageSearch) {

          console.error('タブまたはページ要素が見つかりません');

          return;

        }

        // すべてのタブとページを非アクティブに

        tabNav.classList.remove('active');

        tabSearch.classList.remove('active');

        pageNav.classList.remove('active');

        pageSearch.classList.remove('active');

        // 選択されたタブとページをアクティブに

        if (targetTab === 'nav') {

          tabNav.classList.add('active');

          pageNav.classList.add('active');

          console.log('案内タブに切り替え');

          // 案内タブに切り替えたら、SNSシェアボタンを再チェック

          setTimeout(function() {

            if (window.updateSharePanel) {

              window.updateSharePanel();

            }

          }, 100);

        } else if (targetTab === 'search') {

          tabSearch.classList.add('active');

          pageSearch.classList.add('active');

          console.log('検索タブに切り替え');

        }

        // 状態をローカルストレージに保存

        localStorage.setItem('activeTab', targetTab);

      }

      // タブクリックイベント

      if (tabNav) {

        tabNav.addEventListener('click', function() {

          switchTab('nav');

        });

      }

      if (tabSearch) {

        tabSearch.addEventListener('click', function() {

          switchTab('search');

        });

      }

      // ローカルストレージから状態を復元

      const savedTab = localStorage.getItem('activeTab');

      if (savedTab === 'search') {

        switchTab('search');

      } else {

        switchTab('nav');

      }

      // 初期化を確認

      console.log('統合パネルのタブ切り替え機能を初期化しました', {

        tabNav: !!tabNav,

        tabSearch: !!tabSearch,

        pageNav: !!pageNav,

        pageSearch: !!pageSearch

      });

    })();

  </script>
