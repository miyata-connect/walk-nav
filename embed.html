  <title>WalkNav</title> <!-- L006 -->

  <style>
    /* 統合パネル用スタイル */
    .unified-panel {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 16px;
      top: auto;
      background: var(--glass-strong);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0;
      backdrop-filter: blur(10px);
      z-index: 2500;
      max-height: calc(100vh - 32px);
      overflow: hidden;
      display: none;
    }

    /* タブボタン領域 */
    .panel-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--stroke);
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    /* タブボタン */
    .panel-tab {
      flex: 1;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
      position: relative;
    }

    .panel-tab:first-child {
      border-radius: var(--radius) 0 0 0;
    }

    .panel-tab:last-child {
      border-radius: 0 var(--radius) 0 0;
    }

    .panel-tab.active {
      background: var(--glass-strong);
      color: var(--primary);
    }

    .panel-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    /* タブコンテンツ */
    .tab-content {
      display: none;
      padding: 14px 14px 12px;
      max-height: calc(100vh - 32px - 48px);
      overflow-y: auto;
    }

    .tab-content.active {
      display: block;
    }

    .tab-content h2 {
      margin: 0 0 10px;
      font-size: 17px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* 案内タブ内のルートパネル */
    .route-panel-inline {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--stroke);
      display: none;
    }

    .route-panel-inline .route-info {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .route-panel-inline .route-distance {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary);
    }

    .route-panel-inline .route-time {
      font-size: 16px;
      color: var(--muted);
      margin-left: 12px;
    }

    .route-panel-inline .route-actions {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head> <!-- L011 -->

  <!-- タブ切り替えロジック --> <!-- L119 -->
  <script> /* L120 */
    (function(){
      const unifiedPanel = document.getElementById('unifiedPanel');
      const panelTabs = document.querySelectorAll('.panel-tab');
      const tabContents = document.querySelectorAll('.tab-content');
      const btnSearch = document.getElementById('btnSearch');
      const btnClosePanel = document.getElementById('btnClosePanel');

      // タブ切り替え関数
      function switchTab(tabName){
        panelTabs.forEach(tab => tab.classList.remove('active'));
        tabContents.forEach(content => content.classList.remove('active'));

        const activeTab = document.querySelector(`.panel-tab[data-tab="${tabName}"]`);
        const activeContent = document.getElementById(tabName + 'Content');
        
        if(activeTab) activeTab.classList.add('active');
        if(activeContent) activeContent.classList.add('active');
      }

      // パネル表示関数
      function showPanel(tabName = 'operation'){
        if(unifiedPanel){
          unifiedPanel.style.display = 'block';
          switchTab(tabName);
        }
      }

      // パネル非表示関数
      function hidePanel(){
        if(unifiedPanel){
          unifiedPanel.style.display = 'none';
        }
      }

      // タブボタンのクリックイベント
      panelTabs.forEach(tab => {
        tab.addEventListener('click', function(){
          const tabName = this.dataset.tab;
          switchTab(tabName);
        });
      });

      // 検索パネルボタン（FAB）
      if(btnSearch){
        btnSearch.addEventListener('click', function(){
          showPanel('operation');
        });
      }

      // 閉じるボタン
      if(btnClosePanel){
        btnClosePanel.addEventListener('click', function(){
          hidePanel();
        });
      }

      // グローバルに公開（app.jsから呼び出し可能にする）
      window.WalkNavPanel = {
        show: showPanel,
        hide: hidePanel,
        switchTab: switchTab
      };

      // デフォルトは非表示
      hidePanel();
    })();
  </script> <!-- L121 -->
