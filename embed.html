  <!-- 新規：操作パネル／案内パネルのタブ切り替えロジック --> <!-- L114 -->
  <script> /* L115 */
    (function(){
      const tabButtons = document.querySelectorAll('[data-panel-tab]');
      const searchPanel = document.getElementById('searchPanel');
      const navPanel = document.getElementById('navPanel');
      const routePanel = document.getElementById('routePanel');

      function switchPanel(mode){
        if(!searchPanel || !navPanel || !routePanel) return;

        if(mode === 'nav'){
          // 案内タブ：案内パネル＋ルートパネルを表示、操作パネルを非表示
          searchPanel.style.display = 'none';
          navPanel.style.display = '';
          routePanel.style.display = '';
        }else{
          // 操作タブ：操作パネルのみ表示（従来どおり検索をメインに利用）
          searchPanel.style.display = '';
          navPanel.style.display = 'none';
          routePanel.style.display = 'none';
        }

        tabButtons.forEach(btn => {
          const active = btn.dataset.panelTab === mode;
          if(active){
            btn.classList.add('active');
          }else{
            btn.classList.remove('active');
          }
        });
      }

      tabButtons.forEach(btn => {
        btn.addEventListener('click', function(){
          const mode = this.dataset.panelTab || 'search';
          switchPanel(mode);
        });
      });

      // デフォルトは操作タブを有効化
      switchPanel('search');
    })();
  </script> <!-- L116 -->
