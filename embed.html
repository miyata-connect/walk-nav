  <script> /* L190 */
    (function(){ /* L191 */
      const tabButtons = document.querySelectorAll('[data-panel-tab]'); /* L192 */
      const paneSearch = document.getElementById('tabPaneSearch'); /* L193 */
      const paneNav = document.getElementById('tabPaneNav'); /* L194 */
      const paneSettings = document.getElementById('tabPaneSettings'); /* L195 */

      function setMode(mode){ /* L196 */
        const isNav = mode === 'nav'; /* L197 */
        const isSettings = mode === 'settings'; /* L198 */

        if(paneSearch && paneNav && paneSettings){ /* L199 */
          paneSearch.classList.toggle('active', !isNav && !isSettings); /* L200 */
          paneNav.classList.toggle('active', isNav); /* L201 */
          paneSettings.classList.toggle('active', isSettings); /* L202 */
        } /* L203 */

        tabButtons.forEach(function(btn){ /* L204 */
          const active = btn.dataset.panelTab === mode; /* L205 */
          btn.classList.toggle('active', active); /* L206 */
        }); /* L207 */
      } /* L208 */

      function handleTabClick(e, mode){ /* L209 */
        e.preventDefault(); /* L210 */
        e.stopPropagation(); /* L211 */
        setMode(mode); /* L212 */
      } /* L213 */

      tabButtons.forEach(function(btn){ /* L214 */
        btn.addEventListener('click', function(e){ /* L215 */
          const mode = this.dataset.panelTab; /* L216 */
          handleTabClick(e, mode); /* L217 */
        }); /* L218 */
        btn.addEventListener('keydown', function(e){ /* L219 */
          if(e.key === 'Enter' || e.key === ' '){ /* L220 */
            const mode = this.dataset.panelTab; /* L221 */
            handleTabClick(e, mode); /* L222 */
          } /* L223 */
        }); /* L224 */
      }); /* L225 */

      setMode('search'); /* L226 */

      /* �ݒ�^�u�F�^�u�ʒu�ύX */ /* L227 */
      const posButtons = document.querySelectorAll('[data-pos]'); /* L228 */
      posButtons.forEach(function(btn){ /* L229 */
        btn.addEventListener('click', function(){ /* L230 */
          const pos = this.dataset.pos; /* L231 */
          posButtons.forEach(function(b){ b.classList.remove('active'); }); /* L232 */
          this.classList.add('active'); /* L233 */
          if(window.parent !== window){ /* L234 */
            window.parent.postMessage({type:'WN_SET_TAB_POS', position:pos}, '*'); /* L235 */
          } /* L236 */
        }); /* L237 */
      }); /* L238 */

      /* �e�E�B���h�E���猻�݂̃^�u�ʒu����M */ /* L239 */
      window.addEventListener('message', function(e){ /* L240 */
        if(e.data && e.data.type === 'WN_CURRENT_TAB_POS'){ /* L241 */
          const pos = e.data.position || 'left'; /* L242 */
          posButtons.forEach(function(b){ /* L243 */
            b.classList.toggle('active', b.dataset.pos === pos); /* L244 */
          }); /* L245 */
        } /* L246 */
      }); /* L247 */

      /* ���������ɐe�E�B���h�E�֌��݈ʒu��₢���킹 */ /* L248 */

    })(); /* L252 */
