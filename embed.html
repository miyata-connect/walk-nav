              <div class="weather-item"> <!-- L096 -->

                <span id="weather6h">--</span> <!-- L098 -->

              <div class="weather-item"> <!-- L100 -->

              <div> <!-- L111 -->
                <span class="route-distance" id="routeDistance">--</span> <!-- L112 -->
                <span class="route-time" id="routeTime" style="margin-left:8px;font-size:14px;color:var(--muted);">徒歩 --分</span> <!-- L113 -->

            <button id="btnExportText" class="btn" style="width:100%;background:rgba(255,255,255,0.1);margin-bottom:8px;">📋 道順をコピー</button> <!-- L116 -->

          <!-- 道順（ナビ中のみ表示） --> <!-- L123 -->

          <!-- タブ位置設定 --> <!-- L132 -->
          <div style="margin-bottom:16px;"> <!-- L133 -->
            <div style="font-size:14px;color:var(--muted);margin-bottom:8px;">タブの位置</div> <!-- L134 -->
            <div class="row" style="justify-content:center;flex-wrap:wrap;gap:8px;"> <!-- L135 -->

              <button class="chip" data-pos="left">左</button> <!-- L138 -->

            </div> <!-- L140 -->

          <!-- ルート操作（ナビ中のみ表示） --> <!-- L142 -->
          <div id="routeControlSection" style="display:none;margin-bottom:16px;"> <!-- L143 -->

              <button id="btnPauseSettings" class="btn" style="width:100%;">⏸️ 一時停止</button> <!-- L146 -->

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk&v=weekly&libraries=marker,geometry&loading=async"
    async defer></script> <!-- L170 -->

  <!-- 操作／案内／設定タブ切り替え --> <!-- L171 -->
  <script> /* L172 */
    (function(){ /* L173 */
      const tabButtons = document.querySelectorAll('[data-panel-tab]'); /* L174 */
      const paneSearch = document.getElementById('tabPaneSearch'); /* L175 */
      const paneNav = document.getElementById('tabPaneNav'); /* L176 */
      const paneSettings = document.getElementById('tabPaneSettings'); /* L177 */

      function setMode(mode){ /* L178 */
        const isNav = mode === 'nav'; /* L179 */
        const isSettings = mode === 'settings'; /* L180 */

        if(paneSearch && paneNav && paneSettings){ /* L181 */
          paneSearch.classList.toggle('active', !isNav && !isSettings); /* L182 */
          paneNav.classList.toggle('active', isNav); /* L183 */
          paneSettings.classList.toggle('active', isSettings); /* L184 */
        } /* L185 */

        tabButtons.forEach(function(btn){ /* L186 */
          const active = btn.dataset.panelTab === mode; /* L187 */
          btn.classList.toggle('active', active); /* L188 */
        }); /* L189 */
      } /* L190 */

      function handleTabClick(e, mode){ /* L191 */
        e.preventDefault(); /* L192 */
        e.stopPropagation(); /* L193 */
        setMode(mode); /* L194 */
      } /* L195 */

      tabButtons.forEach(function(btn){ /* L196 */
        btn.addEventListener('click', function(e){ /* L197 */
          const mode = this.dataset.panelTab; /* L198 */
          handleTabClick(e, mode); /* L199 */
        }); /* L200 */
        btn.addEventListener('keydown', function(e){ /* L201 */
          if(e.key === 'Enter' || e.key === ' '){ /* L202 */
            const mode = this.dataset.panelTab; /* L203 */
            handleTabClick(e, mode); /* L204 */
          } /* L205 */
        }); /* L206 */
      }); /* L207 */

      setMode('search'); /* L208 */

      /* 設定タブ：タブ位置変更 */ /* L209 */
      const posButtons = document.querySelectorAll('[data-pos]'); /* L210 */
      posButtons.forEach(function(btn){ /* L211 */
        btn.addEventListener('click', function(){ /* L212 */
          const pos = this.dataset.pos; /* L213 */
          posButtons.forEach(function(b){ b.classList.remove('active'); }); /* L214 */
          this.classList.add('active'); /* L215 */
          if(window.parent !== window){ /* L216 */
            window.parent.postMessage({type:'WN_SET_TAB_POS', position:pos}, '*'); /* L217 */
          } /* L218 */
        }); /* L219 */
      }); /* L220 */

      /* 親ウィンドウから現在のタブ位置を受信 */ /* L221 */
      window.addEventListener('message', function(e){ /* L222 */
        if(e.data && e.data.type === 'WN_CURRENT_TAB_POS'){ /* L223 */
          const pos = e.data.position || 'left'; /* L224 */
          posButtons.forEach(function(b){ /* L225 */
            b.classList.toggle('active', b.dataset.pos === pos); /* L226 */
          }); /* L227 */
        } /* L228 */
      }); /* L229 */

      /* 初期化時に親ウィンドウへ現在位置を問い合わせ */ /* L230 */
      if(window.parent !== window){ /* L231 */
        window.parent.postMessage({type:'WN_REQUEST_TAB_POS'}, '*'); /* L232 */
      } /* L233 */
    })(); /* L234 */
  </script> <!-- L235 -->
</body> <!-- L236 -->
</html> <!-- L237 -->
