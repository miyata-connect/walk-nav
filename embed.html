<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>WalkNav</title>

  <meta name="x-issue" content="idx202511050540-split" />
  <meta name="description" content="WalkNav - 近くを検索 & ルート案内" />

  <link rel="stylesheet" href="app.css?v=3" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    /* 統合パネル用スタイル */
    .unified-panel {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 16px;
      top: auto;
      background: var(--glass-strong);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0;
      backdrop-filter: blur(10px);
      z-index: 2500;
      max-height: calc(100vh - 32px);
      overflow: hidden;
      display: none;
    }

    .panel-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--stroke);
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .panel-tab {
      flex: 1;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
      position: relative;
    }

    .panel-tab:first-child {
      border-radius: var(--radius) 0 0 0;
    }

    .panel-tab:last-child {
      border-radius: 0 var(--radius) 0 0;
    }

    .panel-tab.active {
      background: var(--glass-strong);
      color: var(--primary);
    }

    .panel-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    .tab-content {
      display: none;
      padding: 14px 14px 12px;
      max-height: calc(100vh - 32px - 48px);
      overflow-y: auto;
    }

    .tab-content.active {
      display: block;
    }

    .tab-content h2 {
      margin: 0 0 10px;
      font-size: 17px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
  </style>
</head>
<body id="appBody">
  <div class="app">
    <div id="map" aria-label="地図"></div>

    <!-- 統合パネル：タブ切り替え対応 -->
    <section class="unified-panel" id="unifiedPanel" aria-label="統合パネル">
      <!-- タブボタン -->
      <div class="panel-tabs">
        <button class="panel-tab active" data-tab="operation">操作</button>
        <button class="panel-tab" data-tab="navigation">案内</button>
      </div>

      <!-- 操作タブコンテンツ -->
      <div class="tab-content active" id="operationContent">
        <h2>近くを検索 (<span id="radiusLabel">10km</span> / 5件)</h2>
        
        <div class="row" style="margin-bottom:8px;justify-content:center;flex-wrap:wrap;">
          <button class="chip active" id="r10">10km</button>
          <button class="chip" id="r20">20km</button>
          <button class="chip" id="r30">30km</button>
          <button class="chip" id="btnPointSearch" style="flex-grow: 1; min-width: 120px;">📍 ポイント選択</button>
        </div>
        
        <div class="row" style="font-size:13px;color:var(--muted);margin-bottom:8px; display: none; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px;" id="pointAddressBlock">
          <div id="pointAddress" style="line-height:1.5; color: var(--warning);">ポイント：取得中...</div>
          <div id="pointCoords" style="line-height:1.5;"></div>
        </div>
        
        <div class="row" style="margin-bottom:8px">
          <button class="btn" id="btnSaveLocation" style="flex:1">現在地登録</button>
          <button class="btn" id="btnEditLocation" style="flex:1">登録地修正</button>
        </div>
        
        <div class="row" style="margin-bottom:8px">
          <div class="input-wrapper">
            <span class="icon icon-g">
              <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;">
                <path d="M21.35,11.1H12.18V13.83H18.69C18.36,17.64 15.19,19.27 12.19,19.27C8.36,19.27 5.03,16.21 5.03,12.39C5.03,8.57 8.36,5.5 12.19,5.5C14.73,5.5 16.29,6.5 17.2,7.38L19.31,5.26C17.38,3.53 15.05,2.5 12.19,2.5C6.92,2.5 2.73,6.63 2.73,12.39C2.73,18.15 6.92,22.28 12.19,22.28C17.63,22.28 21.64,18.5 21.64,12.61C21.64,12 21.52,11.55 21.35,11.1Z"></path>
              </svg>
            </span>
            <input id="q" class="input" placeholder="店舗名・電話番号・住所・座標など" style="flex:1" autocomplete="off" />
            <span class="icon icon-search" id="btnSearchIcon">
              <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor;">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
              </svg>
            </span>
            <span class="icon icon-mic" id="btnVoiceIcon">
              <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor;">
                <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c1.66 1.66 3 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"></path>
              </svg>
            </span>
          </div>
        </div>
        
        <div id="results" class="results" style="display:none"></div>
        
        <div class="row" style="margin-top:12px; gap: 8px;">
          <button id="btnReset" class="btn danger" style="flex:1">リセット</button>
          <button id="btnLocatePanel" class="btn" style="flex:1;background:rgba(98, 181, 255, 0.2); color: var(--primary);">現在地</button>
          <button id="btnClosePanel" class="btn" style="flex:1;background:rgba(255,255,255,0.1)">閉じる</button>
        </div>
      </div>

      <!-- 案内タブコンテンツ -->
      <div class="tab-content" id="navigationContent">
        <div class="nav-location">
          <div id="locCoords">現在地：取得中...</div>
          <div id="locAddress"></div>
        </div>
        <div class="nav-weather" id="navWeather">
          <div class="weather-item">
            <span>3H</span>
            <span id="weather3h">--</span>
          </div>
          <div class="weather-item">
            <span>6H</span>
            <span id="weather6h">--</span>
          </div>
          <div class="weather-item">
            <span>9H</span>
            <span id="weather9h">--</span>
          </div>
        </div>
        <div class="nav-instructions-list" id="navPanelInstructions"></div>
      </div>
    </section>
    
    <div class="incident-panel" id="incidentPanel"></div>

    <div class="route-panel" id="routePanel">
      <div class="route-info">
        <span id="destinationName">目的地</span>へのルート
      </div>
      <div>
        <span class="route-distance" id="routeDistance">--</span>
        <span class="route-time" id="routeTime">徒歩 --分</span>
      </div>
      <div class="route-actions">
        <button id="btnExportText" class="btn" style="width:100%;background:rgba(255,255,255,0.1)">道順をコピー</button>
        <button id="btnStopRoute" class="btn danger" style="width:100%">ルート終了</button>
      </div>
    </div>

    <div class="fab-stack" id="fabStack">
      <div class="fab" id="btnSearch">検索パネル</div>
      <div class="fab" id="btnLocate">現在地</div>
      <div class="fab" id="btnDestination" style="display:none">目的地</div>
      <div class="fab" id="btnPause">一時停止</div>
      <div class="fab" id="btnReroute">リルート</div>
    </div>

    <div class="loading" id="loading">
      <div style="text-align:center">
        <div style="font-size:24px;margin-bottom:16px">📍 現在地取得中</div>
        <div style="font-size:16px;opacity:0.8">しばらくお待ちください...</div>
      </div>
    </div>

  </div>

  <script src="app.js" defer></script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXC6CB2yaUkrJ5UYj3mymAsruQe4MzGPk&v=weekly&libraries=marker,geometry&loading=async"
    async defer></script>

  <!-- タブ切り替えロジック -->
  <script>
    (function(){
      const unifiedPanel = document.getElementById('unifiedPanel');
      const panelTabs = document.querySelectorAll('.panel-tab');
      const tabContents = document.querySelectorAll('.tab-content');
      const btnSearch = document.getElementById('btnSearch');
      const btnClosePanel = document.getElementById('btnClosePanel');

      function switchTab(tabName){
        panelTabs.forEach(tab => tab.classList.remove('active'));
        tabContents.forEach(content => content.classList.remove('active'));

        const activeTab = document.querySelector(`.panel-tab[data-tab="${tabName}"]`);
        const activeContent = document.getElementById(tabName + 'Content');
        
        if(activeTab) activeTab.classList.add('active');
        if(activeContent) activeContent.classList.add('active');
      }

      function showPanel(tabName = 'operation'){
        if(unifiedPanel){
          unifiedPanel.style.display = 'block';
          switchTab(tabName);
        }
      }

      function hidePanel(){
        if(unifiedPanel){
          unifiedPanel.style.display = 'none';
        }
      }

      panelTabs.forEach(tab => {
        tab.addEventListener('click', function(){
          const tabName = this.dataset.tab;
          switchTab(tabName);
        });
      });

      if(btnSearch){
        btnSearch.addEventListener('click', function(){
          showPanel('operation');
        });
      }

      if(btnClosePanel){
        btnClosePanel.addEventListener('click', function(){
          hidePanel();
        });
      }

      window.WalkNavPanel = {
        show: showPanel,
        hide: hidePanel,
        switchTab: switchTab
      };

      hidePanel();
    })();
  </script>
</body>
</html>
